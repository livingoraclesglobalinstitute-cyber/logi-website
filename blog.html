<head>

    <!-- FontAwesome Core for UI Icons -->

    <style>
        /* ========================================== */
        /*          GLOBAL THEME ROOT RESETS          */
        /* ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html,
        body {
            overflow-x: hidden !important;
            width: 100% !important;
        }

        body {
            background-color: #fafaf7;
            color: #1a1a2e;
            line-height: 1.6;
            padding-top: 80px;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* ========================================== */
        /*   UNIFIED GREEN GLOW BACKGROUND EFFECT     */
        /* ========================================== */
        body::before {
            content: "";
            position: fixed;
            width: 1000px;
            height: 1000px;
            bottom: -350px;
            right: -300px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(126, 222, 187, 0.55) 0%,
                rgba(126, 222, 187, 0.30) 25%,
                rgba(126, 222, 187, 0.12) 50%,
                transparent 75%
            );
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            width: 700px;
            height: 700px;
            top: -250px;
            left: -200px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(126, 222, 187, 0.25) 0%,
                rgba(126, 222, 187, 0.10) 30%,
                transparent 70%
            );
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
        }

        .container-wrapper {
            max-width: 100% !important;
            margin: 0 auto;
            padding: 0 !important;
            width: 100% !important;
            position: relative;
            z-index: 1;
        }

        /* ========================================== */
        /*   BLOG PAGE STYLES                         */
        /* ========================================== */
        .logi-posts-container {
            width: 100% !important;
            max-width: 1200px;
            margin: 0 auto !important;
            padding: 40px 30px !important;
            background: transparent !important;
            box-sizing: border-box !important;
            text-align: left !important;
            position: relative;
            z-index: 2;
        }

        .logi-posts-header {
            text-align: left !important;
            margin-bottom: 30px !important;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(139, 83, 83, 0.15);
        }

        .logi-split-header {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 15px !important;
            margin: 0 0 8px 0 !important;
            background: transparent !important;
            border: none !important;
        }

        .logi-posts-badge {
            display: inline-block !important;
            color: #8B5353 !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
        }

        .logi-posts-main-title {
            font-size: 28px !important;
            font-weight: 800 !important;
            color: #1a1a2e !important;
            margin: 0 !important;
            text-align: left !important;
            letter-spacing: -0.5px !important;
            text-transform: none !important;
        }

        .logi-posts-main-title span {
            color: #8B5353;
        }

        .logi-posts-subtitle {
            font-size: 15px;
            color: #666;
            margin-top: 6px;
        }

        .logi-posts-grid {
            display: flex !important;
            flex-direction: column !important;
            gap: 35px !important;
        }

        .logi-post-card {
            background: rgba(255, 255, 255, 0.92) !important;
            border: 1px solid rgba(139, 83, 83, 0.09) !important;
            border-radius: 16px !important;
            padding: 24px 28px !important;
            display: flex !important;
            flex-direction: row !important;
            gap: 25px !important;
            align-items: flex-start !important;
            box-sizing: border-box !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05) !important;
            text-align: left !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease !important;
        }

        .logi-post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.10) !important;
            border-color: rgba(139, 83, 83, 0.20);
        }

        .logi-post-thumb-wrapper {
            width: 180px !important;
            max-width: 180px !important;
            flex-shrink: 0 !important;
        }

        .logi-post-thumb {
            width: 100% !important;
            height: 130px !important;
            object-fit: cover !important;
            border-radius: 10px !important;
            border: 1px solid rgba(139, 83, 83, 0.08);
        }

        .logi-post-svg-wrapper {
            width: 180px !important;
            height: 130px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: rgba(139, 83, 83, 0.05) !important;
            border-radius: 10px !important;
            border: 1px solid rgba(139, 83, 83, 0.12) !important;
            overflow: hidden !important;
        }

        .logi-post-svg-wrapper svg {
            width: 60px !important;
            height: 60px !important;
            fill: #8B5353 !important;
            stroke: #8B5353 !important;
        }

        .logi-post-content-block {
            flex: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            text-align: left !important;
        }

        .logi-post-meta-strip {
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #8B5353 !important;
            margin-bottom: 6px !important;
            text-align: left !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .logi-post-title {
            font-size: 20px !important;
            font-weight: 700 !important;
            margin: 0 0 10px 0 !important;
            line-height: 1.3 !important;
            text-align: left !important;
        }

        .logi-post-title a {
            color: #1a1a2e !important;
            text-decoration: none !important;
            transition: color 0.25s ease;
        }

        .logi-post-title a:hover {
            color: #8B5353 !important;
        }

        .logi-post-summary {
            font-size: 14.5px !important;
            line-height: 1.7 !important;
            color: #555555 !important;
            margin: 0 0 14px 0 !important;
            text-align: left !important;
        }

        .logi-post-btn {
            display: inline-flex !important;
            align-items: center !important;
            gap: 8px;
            margin: 0 !important;
            background: #8B5353 !important;
            color: #fff !important;
            padding: 8px 20px !important;
            border-radius: 50px !important;
            text-decoration: none !important;
            font-weight: 700 !important;
            font-size: 12px !important;
            transition: all 0.3s ease !important;
            border: 2px solid #8B5353 !important;
        }

        .logi-post-btn:hover {
            background: #a66a6a !important;
            border-color: #a66a6a !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 83, 83, 0.3);
        }

        .logi-post-btn i {
            font-size: 10px;
            transition: transform 0.3s ease;
        }

        .logi-post-btn:hover i {
            transform: translateX(4px);
        }

        /* ========================================== */
        /*   LOADING STATE                            */
        /* ========================================== */
        .logi-loading-posts {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }

        .logi-loading-posts i {
            font-size: 28px;
            color: #8B5353;
            margin-bottom: 12px;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========================================== */
        /*   RESPONSIVE ADJUSTMENTS                   */
        /* ========================================== */
        @media (max-width: 820px) {
            .logi-posts-container {
                padding: 30px 20px !important;
            }
            .logi-post-card {
                padding: 20px 22px !important;
                gap: 18px !important;
            }
            .logi-post-thumb-wrapper {
                width: 150px !important;
                max-width: 150px !important;
            }
            .logi-post-thumb {
                height: 110px !important;
            }
            .logi-post-svg-wrapper {
                width: 150px !important;
                height: 110px !important;
            }
            .logi-post-title {
                font-size: 18px !important;
            }
        }

        @media (max-width: 640px) {
            .logi-posts-container {
                padding: 20px 14px !important;
            }
            .logi-post-card {
                flex-direction: column !important;
                gap: 14px !important;
                padding: 18px 16px !important;
            }
            .logi-post-thumb-wrapper,
            .logi-post-svg-wrapper {
                width: 100% !important;
                max-width: 100% !important;
            }
            .logi-post-thumb {
                height: 180px !important;
            }
            .logi-post-svg-wrapper {
                height: 160px !important;
            }
            .logi-posts-main-title {
                font-size: 22px !important;
                text-align: left !important;
            }
            .logi-post-title {
                font-size: 17px !important;
            }
            .logi-post-summary {
                font-size: 13.5px !important;
            }
            .logi-post-meta-strip {
                font-size: 11px !important;
            }
        }

        @media (max-width: 420px) {
            .logi-posts-container {
                padding: 16px 10px !important;
            }
            .logi-post-card {
                padding: 14px 12px !important;
                gap: 10px !important;
            }
            .logi-post-thumb {
                height: 140px !important;
            }
            .logi-post-svg-wrapper {
                height: 120px !important;
            }
            .logi-post-title {
                font-size: 15px !important;
            }
            .logi-post-summary {
                font-size: 12.5px !important;
            }
            .logi-post-btn {
                font-size: 11px !important;
                padding: 6px 16px !important;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!--          PAGE CONTENT - BLOG                -->
    <!-- ========================================== -->
    <main class="container-wrapper">

        <div class="logi-posts-container">
            <div class="logi-posts-header">
                <div class="logi-split-header">
                    <h1 class="logi-posts-main-title">📖 <span>Blog</span> &amp; Articles</h1>
                </div>
                <div class="logi-posts-badge">Recent Journal Updates</div>
                <p class="logi-posts-subtitle">Explore Christian articles, biblical insights, spiritual growth, leadership, faith, theology, and practical wisdom from LOGI.</p>
            </div>

            <div class="logi-posts-grid" id="logi-automatic-posts">
                <div class="logi-loading-posts">
                    <i class="fas fa-spinner"></i>
                    <span>Loading latest posts...</span>
                </div>
            </div>
        </div>

    </main>

    <!-- ========================================== -->
    <!--   BLOG POSTS - FETCH FROM FEED             -->
    <!-- ========================================== -->
    <script>
        // ==========================================
        //   BLOG POSTS - FETCH FROM FEED
        // ==========================================
        function showLogiPosts(json) {
            var container = document.getElementById('logi-automatic-posts');
            var html = '';
            var posts = json.feed.entry || [];

            if (posts.length === 0) {
                container.innerHTML = '<p style="text-align:center; font-size:16px; color:#888; padding:40px 0;">No posts found at this time. Check back soon!</p>';
                return;
            }

            for (var i = 0; i < posts.length; i++) {
                var entry = posts[i];
                var title = entry.title && entry.title.$t ? entry.title.$t : 'Untitled Post';

                var postUrl = '';
                if (entry.link) {
                    for (var k = 0; k < entry.link.length; k++) {
                        if (entry.link[k].rel == 'alternate') {
                            postUrl = entry.link[k].href;
                            break;
                        }
                    }
                }

                var contentText = '';
                if (entry.content && entry.content.$t) {
                    contentText = entry.content.$t;
                } else if (entry.summary && entry.summary.$t) {
                    contentText = entry.summary.$t;
                }

                var thumbUrl = '';
                var extractedSvg = '';

                if (entry.media$thumbnail && entry.media$thumbnail.url) {
                    thumbUrl = entry.media$thumbnail.url.replace('/s72-c/', '/s400/');
                } else {
                    var imgMatch = contentText.match(/<img[^>]+src="([^">]+)"/i);
                    if (imgMatch && imgMatch[1]) {
                        thumbUrl = imgMatch[1];
                    }
                }

                if (!thumbUrl) {
                    var svgMatch = contentText.match(/<svg[\s\S]*?<\/svg>/i);
                    if (svgMatch && svgMatch[0]) {
                        extractedSvg = svgMatch[0].replace(/width="[^"]*"/gi, '').replace(/height="[^"]*"/gi, '');
                    }
                }

                var summary = '';
                if (contentText) {
                    var cleanDoc = document.createElement('div');
                    cleanDoc.innerHTML = contentText;

                    var unwanted = cleanDoc.querySelectorAll('script, style, table, .print-preview, .post-header, .metadata, .date, img, svg');
                    for (var u = 0; u < unwanted.length; u++) {
                        unwanted[u].remove();
                    }

                    var paragraphs = cleanDoc.querySelectorAll('p');
                    var realText = '';

                    for (var p = 0; p < paragraphs.length; p++) {
                        var pText = paragraphs[p].textContent.trim();
                        if (
                            pText.length > 20 &&
                            pText.indexOf("function") === -1 &&
                            pText.indexOf("=>") === -1 &&
                            pText.indexOf("addEventListener") === -1 &&
                            pText.indexOf("Estimated reading time") === -1 &&
                            pText.indexOf("Published:") === -1 &&
                            pText.indexOf("Updated:") === -1 &&
                            pText.indexOf("Quote copied") === -1
                        ) {
                            realText = pText;
                            break;
                        }
                    }

                    if (!realText) {
                        realText = cleanDoc.textContent || cleanDoc.innerText || "";
                    }

                    summary = realText.replace(/\s+/g, ' ').trim();
                }

                if (summary.length > 280) {
                    summary = summary.substring(0, 280) + '...';
                }

                var postDate = '';
                if (entry.published && entry.published.$t) {
                    var rawDate = new Date(entry.published.$t);
                    if (!isNaN(rawDate)) {
                        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                        postDate = months[rawDate.getMonth()] + ' ' + rawDate.getFullYear();
                    }
                }

                html += '<div class="logi-post-card">';

                if (thumbUrl !== '') {
                    html += '  <div class="logi-post-thumb-wrapper">';
                    html += '    <a href="' + postUrl + '"><img src="' + thumbUrl + '" alt="' + title + '" class="logi-post-thumb" loading="lazy"/></a>';
                    html += '  </div>';
                } else if (extractedSvg !== '') {
                    html += '  <div class="logi-post-thumb-wrapper logi-post-svg-wrapper">';
                    html += '    <a href="' + postUrl + '">' + extractedSvg + '</a>';
                    html += '  </div>';
                }

                html += '  <div class="logi-post-content-block">';
                if (postDate) {
                    html += '    <div class="logi-post-meta-strip">';
                    html += '      <span class="logi-post-date">📅 ' + postDate + '</span>';
                    html += '    </div>';
                }
                html += '    <h3 class="logi-post-title"><a href="' + postUrl + '">' + title + '</a></h3>';
                if (summary) {
                    html += '    <p class="logi-post-summary">' + summary + '</p>';
                }

                html += '    <a href="' + postUrl + '" class="logi-post-btn">';
                html += '      Read More <i class="fas fa-arrow-right"></i>';
                html += '    </a>';

                html += '  </div>';
                html += '</div>';
            }

            container.innerHTML = html;
        }
    </script>

    <!-- Requests Blogger API default feed data -->
    <script src="https://blog.logi.education/feeds/posts/default?alt=json-in-script&amp;callback=showLogiPosts&amp;max-results=6"></script>

</body>
</html>
