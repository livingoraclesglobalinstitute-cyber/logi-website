    <style>
        /* ========================================== */
        /*   TOP BAR - FIXED - KENTE COLOR ACCENTS   */
        /* ========================================== */
        .top-bar {
            background: #1a1a2e;
            color: #ffffff;
            padding: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .top-bar::before,
        .top-bar::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50px;
            background: linear-gradient(180deg, 
                #c9a86c 0%, #c9a86c 20%,
                #8B5353 20%, #8B5353 40%,
                #1a7a3a 40%, #1a7a3a 60%,
                #c9a86c 60%, #c9a86c 80%,
                #8B5353 80%, #8B5353 100%
            );
            opacity: 0.5;
        }

        .top-bar::before {
            left: 0;
            border-radius: 0 4px 4px 0;
        }

        .top-bar::after {
            right: 0;
            border-radius: 4px 0 0 4px;
        }

        .top-bar .contact-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            padding: 0 60px;
            position: relative;
            z-index: 1;
        }

        .top-bar .contact-info a,
        .top-bar .contact-info span {
            color: #d4d0c8;
            text-decoration: none;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .top-bar .contact-info a:hover {
            color: #c9a86c;
        }

        .top-bar .contact-info i {
            font-size: 0.65rem;
            color: #c9a86c;
        }

        .top-bar .social-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 60px;
            position: relative;
            z-index: 1;
        }

        .top-bar .social-icons a {
            color: #8a8680;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .top-bar .social-icons a:hover {
            color: #c9a86c;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 4px 0;
            }
            .top-bar::before,
            .top-bar::after {
                width: 25px;
            }
            .top-bar .contact-info {
                padding: 0 35px;
                gap: 8px;
            }
            .top-bar .social-icons {
                padding: 0 35px;
            }
            .top-bar .contact-info a,
            .top-bar .contact-info span {
                font-size: 0.6rem;
            }
        }

        @media (max-width: 480px) {

            .top-bar::after {

            }

                padding: 0 25px;

                font-size: 0.55rem;
            }
            .top-bar .social-icons {
                padding: 0 25px;
                gap: 8px;
            }
            .top-bar .social-icons a {
                font-size: 0.65rem;
            }
        }

        /* ========================================== */

            width: 100% !important;
            margin: 0 auto !important;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
            padding: 40px 20px !important;
            background: transparent !important;
            box-sizing: border-box !important;
            text-align: left !important;
        }

        .logi-posts-header {
            text-align: left !important;
            margin-bottom: 30px !important;
        }

        .logi-split-header {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 15px !important;
            margin: 0 0 8px 0 !important;
            background: transparent !important;
            border: none !important;
        }

        .logi-posts-badge {
            display: inline-block !important;
            color: #8B5353 !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
        }

        .logi-posts-main-title {
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #8B5353 !important;
            margin: 0 !important;
            text-align: left !important;
            letter-spacing: -0.3px !important;
            text-transform: none !important;
        }

        .logi-posts-grid {
            display: flex !important;
            flex-direction: column !important;
            gap: 30px !important;
        }

        .logi-post-card {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: row !important;
            gap: 20px !important;
            align-items: flex-start !important;
            box-sizing: border-box !important;
            box-shadow: none !important;
            text-align: left !important;
        }

        .logi-post-thumb-wrapper {
            width: 140px !important;
            max-width: 140px !important;
            flex-shrink: 0 !important;
        }

        .logi-post-thumb {
            width: 100% !important;
            height: 100px !important;
            object-fit: cover !important;
            border-radius: 4px !important;
        }

        .logi-post-svg-wrapper {
            width: 140px !important;
            height: 100px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: rgba(139, 83, 83, 0.05) !important;
            border-radius: 4px !important;
            border: 1px solid rgba(139, 83, 83, 0.15) !important;
            overflow: hidden !important;
        }

        .logi-post-svg-wrapper svg {
            width: 60px !important;
            height: 60px !important;
            fill: #8B5353 !important;
            stroke: #8B5353 !important;
        }

        .logi-post-content-block {
            flex: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            text-align: left !important;
        }

        .logi-post-meta-strip {
            font-size: 11px !important;
            font-weight: 700 !important;
            color: #999999 !important;
            margin-bottom: 6px !important;
            text-align: left !important;
        }

        .logi-post-title {
            font-size: 17px !important;
            font-weight: 700 !important;
            margin: 0 0 8px 0 !important;
            line-height: 1.3 !important;
            text-align: left !important;
        }

        .logi-post-title a {
            color: #333333 !important;
            text-decoration: none !important;
        }

        .logi-post-title a:hover {
            color: #8B5353 !important;
        }

        .logi-post-summary {
            font-size: 14px !important;
            line-height: 1.6 !important;
            color: #555555 !important;
            margin: 0 0 12px 0 !important;
            text-align: left !important;
        }

        .logi-post-btn {
            display: inline-flex !important;
            align-items: center !important;
            margin: 0 !important;
            background: #8B5353 !important;
            color: #fff !important;
            padding: 8px 14px !important;
            border-radius: 20px !important;
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 12px !important;
            transition: background 0.15s ease !important;
        }

        .logi-post-btn:hover {
            background: #6d3d3d !important;
        }

        @media (max-width: 580px) {
            .logi-posts-container {
                padding: 20px 10px !important;
            }
            .logi-post-card {
                flex-direction: column !important;
                gap: 12px !important;
            }
            .logi-post-thumb-wrapper,
            .logi-post-svg-wrapper {
                width: 100% !important;
                max-width: 100% !important;
            }
            .logi-post-thumb {
                height: 140px !important;
            }
            .logi-posts-main-title {
                font-size: 20px !important;
                text-align: left !important;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!--   HEADER PLACEHOLDER                       -->
    <!-- ========================================== -->
    <div id="header-placeholder"></div>

    <!-- ========================================== -->
    <!--          PAGE CONTENT - BLOG                -->
    <!-- ========================================== -->
    <main class="container-wrapper">

        <div class="logi-posts-container">
            <div class="logi-posts-header">
                <div class="logi-split-header">
                    <h2 class="logi-posts-main-title">All Posts &amp; Summaries</h2>
                </div>
                <div class="logi-posts-badge">Recent Journal Updates</div>
            </div>

            <div class="logi-posts-grid" id="logi-automatic-posts">
                <p style="color: #888888; font-size: 14px; text-align: left;">Loading latest journal posts...</p>
            </div>
        </div>

    </main>

    <!-- ========================================== -->
    <!--   FOOTER PLACEHOLDER                       -->
    <!-- ========================================== -->
    <div id="footer-placeholder"></div>

    <!-- ========================================== -->
    <!--   JAVASCRIPT - LOAD HEADER & FOOTER       -->
    <!-- ========================================== -->
    <script src="load.js"></script>

    <!-- ========================================== -->
    <!--   BLOG POSTS - FETCH FROM FEED             -->
    <!-- ========================================== -->
    <script>
        // ==========================================
        //   BLOG POSTS - FETCH FROM FEED
        // ==========================================
        function showLogiPosts(json) {
            var container = document.getElementById('logi-automatic-posts');
            var html = '';
            var posts = json.feed.entry || [];

            if (posts.length === 0) {
                container.innerHTML = '<p style="text-align:left; font-size:14px;">No posts found.</p>';
                return;
            }

            for (var i = 0; i < posts.length; i++) {
                var entry = posts[i];
                var title = entry.title && entry.title.$t ? entry.title.$t : 'Untitled Post';

                var postUrl = '';
                if (entry.link) {
                    for (var k = 0; k < entry.link.length; k++) {
                        if (entry.link[k].rel == 'alternate') {
                            postUrl = entry.link[k].href;
                            break;
                        }
                    }
                }

                var contentText = '';
                if (entry.content && entry.content.$t) {
                    contentText = entry.content.$t;
                } else if (entry.summary && entry.summary.$t) {
                    contentText = entry.summary.$t;
                }

                var thumbUrl = '';
                var extractedSvg = '';

                if (entry.media$thumbnail && entry.media$thumbnail.url) {
                    thumbUrl = entry.media$thumbnail.url.replace('/s72-c/', '/s400/');
                } else {
                    var imgMatch = contentText.match(/<img[^>]+src="([^">]+)"/i);
                    if (imgMatch && imgMatch[1]) {
                        thumbUrl = imgMatch[1];
                    }
                }

                if (!thumbUrl) {
                    var svgMatch = contentText.match(/<svg[\s\S]*?<\/svg>/i);
                    if (svgMatch && svgMatch[0]) {
                        extractedSvg = svgMatch[0].replace(/width="[^"]*"/gi, '').replace(/height="[^"]*"/gi, '');
                    }
                }

                var summary = '';
                if (contentText) {
                    var cleanDoc = document.createElement('div');
                    cleanDoc.innerHTML = contentText;

                    var unwanted = cleanDoc.querySelectorAll('script, style, table, .print-preview, .post-header, .metadata, .date, img, svg');
                    for (var u = 0; u < unwanted.length; u++) {
                        unwanted[u].remove();
                    }

                    var paragraphs = cleanDoc.querySelectorAll('p');
                    var realText = '';

                    for (var p = 0; p < paragraphs.length; p++) {
                        var pText = paragraphs[p].textContent.trim();
                        if (
                            pText.length > 20 &&
                            pText.indexOf("function") === -1 &&
                            pText.indexOf("=>") === -1 &&
                            pText.indexOf("addEventListener") === -1 &&
                            pText.indexOf("Estimated reading time") === -1 &&
                            pText.indexOf("Published:") === -1 &&
                            pText.indexOf("Updated:") === -1 &&
                            pText.indexOf("Quote copied") === -1
                        ) {
                            realText = pText;
                            break;
                        }
                    }

                    if (!realText) {
                        realText = cleanDoc.textContent || cleanDoc.innerText || "";
                    }

                    summary = realText.replace(/\s+/g, ' ').trim();
                }

                if (summary.length > 280) {
                    summary = summary.substring(0, 280) + '...';
                }

                var postDate = '';
                if (entry.published && entry.published.$t) {
                    var rawDate = new Date(entry.published.$t);
                    if (!isNaN(rawDate)) {
                        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                        postDate = months[rawDate.getMonth()] + ' ' + rawDate.getFullYear();
                    }
                }

                html += '<div class="logi-post-card">';

                if (thumbUrl !== '') {
                    html += '  <div class="logi-post-thumb-wrapper">';
                    html += '    <a href="' + postUrl + '"><img src="' + thumbUrl + '" alt="' + title + '" class="logi-post-thumb"/></a>';
                    html += '  </div>';
                } else if (extractedSvg !== '') {
                    html += '  <div class="logi-post-thumb-wrapper logi-post-svg-wrapper">';
                    html += '    <a href="' + postUrl + '">' + extractedSvg + '</a>';
                    html += '  </div>';
                }

                html += '  <div class="logi-post-content-block">';
                if (postDate) {
                    html += '    <div class="logi-post-meta-strip">';
                    html += '      <span class="logi-post-date">' + postDate + '</span>';
                    html += '    </div>';
                }
                html += '    <h3 class="logi-post-title"><a href="' + postUrl + '">' + title + '</a></h3>';
                if (summary) {
                    html += '    <p class="logi-post-summary">' + summary + '</p>';
                }

                html += '    <a href="' + postUrl + '" class="logi-post-btn">';
                html += '      read more.....';
                html += '    </a>';

                html += '  </div>';
                html += '</div>';
            }

            container.innerHTML = html;
        }
    </script>

    <!-- Requests Blogger API default feed data -->
    <script src="https://blog.logi.education/feeds/posts/default?alt=json-in-script&amp;callback=showLogiPosts&amp;max-results=6"></script>

</body>
</html>
