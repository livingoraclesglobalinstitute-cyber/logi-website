    <style>
        /* ========================================== */
        /*   TOP BAR - FIXED - KENTE COLOR ACCENTS   */
        /* ========================================== */
        .top-bar {
            background: #1a1a2e;
            color: #ffffff;
            padding: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .top-bar::before,
        .top-bar::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50px;
            background: linear-gradient(180deg, 
                #c9a86c 0%, #c9a86c 20%,
                #8B5353 20%, #8B5353 40%,
                #1a7a3a 40%, #1a7a3a 60%,
                #c9a86c 60%, #c9a86c 80%,
                #8B5353 80%, #8B5353 100%
            );
            opacity: 0.5;
        }

        .top-bar::before {
            left: 0;
            border-radius: 0 4px 4px 0;
        }

        .top-bar::after {
            right: 0;
            border-radius: 4px 0 0 4px;
        }

        .top-bar .contact-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            padding: 0 60px;
            position: relative;
            z-index: 1;
        }

        .top-bar .contact-info a,
        .top-bar .contact-info span {
            color: #d4d0c8;
            text-decoration: none;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .top-bar .contact-info a:hover {
            color: #c9a86c;
        }

        .top-bar .contact-info i {
            font-size: 0.65rem;
            color: #c9a86c;
        }

        .top-bar .social-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 60px;
            position: relative;
            z-index: 1;
        }

        .top-bar .social-icons a {
            color: #8a8680;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .top-bar .social-icons a:hover {
            color: #c9a86c;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 4px 0;
            }
            .top-bar::before,
            .top-bar::after {
                width: 25px;
            }
            .top-bar .contact-info {
                padding: 0 35px;
                gap: 8px;
            }
            .top-bar .social-icons {
                padding: 0 35px;

        /* ========================================== */
        /*          GLOBAL RESETS                     */
        /* ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html,
        body {
            overflow-x: hidden !important;
            width: 100% !important;
        }

        body {
            background-color: #ffffff;
            color: #1a1a2e;
            line-height: 1.6;
            padding-top: 80px;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* ========================================== */
        /*   FULL-WIDTH SECTION WITH BACKGROUND IMAGE */
        /* ========================================== */
        .section-bg {
            position: relative;
            width: 100%;
            padding: 80px 30px 100px;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            z-index: 1;
            overflow: hidden;
            min-height: 100vh;
        }

        .section-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(26, 26, 46, 0.80);
            z-index: 0;
        }

        .section-bg .container {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 10px;
        }

        @media (max-width: 768px) {
            .section-bg {
                padding: 50px 20px 70px;
                background-attachment: scroll !important;
            }
        }

        @media (max-width: 480px) {
            .section-bg {
                padding: 35px 16px 50px;
            }
        }

        .logi-posts-header {
            text-align: left !important;
            margin-bottom: 35px !important;
            padding-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .logi-split-header {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 15px !important;
            margin: 0 0 8px 0 !important;
            background: transparent !important;
            border: none !important;
        }

        .logi-posts-badge {
            display: inline-block !important;
            color: #c9a86c !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
        }

        .logi-posts-main-title {
            font-size: 32px !important;
            font-weight: 800 !important;
            color: #ffffff !important;
            margin: 0 !important;
            text-align: left !important;
            letter-spacing: -0.5px !important;
            text-transform: none !important;
        }

        .logi-posts-main-title span {
            color: #c9a86c;
        }

        .logi-posts-subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 8px;
        }

        .logi-posts-grid {
            display: flex !important;
            flex-direction: column !important;
            gap: 25px !important;
        }

        .logi-post-card {
            background: rgba(255, 255, 255, 0.06) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 20px !important;
            padding: 24px 28px !important;
            display: flex !important;
            flex-direction: row !important;
            gap: 25px !important;
            align-items: flex-start !important;
            box-sizing: border-box !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08) !important;
            text-align: left !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease !important;
        }

        .logi-post-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15) !important;
            border-color: #c9a86c !important;
        }

        .logi-post-thumb-wrapper {
            width: 180px !important;
            max-width: 180px !important;
            flex-shrink: 0 !important;
        }

        .logi-post-thumb {
            width: 100% !important;
            height: 130px !important;
            object-fit: cover !important;
            border-radius: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .logi-post-svg-wrapper {
            width: 180px !important;
            height: 130px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: rgba(201, 168, 108, 0.10) !important;
            border-radius: 12px !important;
            border: 1px solid rgba(201, 168, 108, 0.25) !important;
            overflow: hidden !important;
        }

        .logi-post-svg-wrapper svg {
            width: 60px !important;
            height: 60px !important;
            fill: #c9a86c !important;
            stroke: #c9a86c !important;
        }

        .logi-post-content-block {
            flex: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            text-align: left !important;
        }

        .logi-post-meta-strip {
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #c9a86c !important;
            margin-bottom: 8px !important;
            text-align: left !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .logi-post-title {
            font-size: 20px !important;
            font-weight: 700 !important;
            margin: 0 0 12px 0 !important;
            line-height: 1.3 !important;
            text-align: left !important;
        }

        .logi-post-title a {
            color: #ffffff !important;
            text-decoration: none !important;
            transition: color 0.25s ease;
        }

        .logi-post-title a:hover {
            color: #c9a86c !important;
        }

        .logi-post-summary {
            font-size: 14.5px !important;
            line-height: 1.7 !important;
            color: rgba(255, 255, 255, 0.8) !important;
            margin: 0 0 16px 0 !important;
            text-align: left !important;
        }

        .logi-post-btn {
            display: inline-flex !important;
            align-items: center !important;
            gap: 8px;
            margin: 0 !important;
            background: #8B5353 !important;
            color: #fff !important;
            padding: 10px 22px !important;
            border-radius: 50px !important;
            text-decoration: none !important;
            font-weight: 700 !important;
            font-size: 12.5px !important;
            transition: all 0.3s ease !important;
            border: 2px solid #8B5353 !important;
        }

        .logi-post-btn:hover {
            background: #a66a6a !important;
            border-color: #a66a6a !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 83, 83, 0.35);
        }

        .logi-post-btn i {
            font-size: 10px;
            transition: transform 0.3s ease;
        }

        .logi-post-btn:hover i {
            transform: translateX(4px);
        }

        /* ========================================== */
        /*   LOADING STATE                            */
        /* ========================================== */
        .logi-loading-posts {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
        }

        .logi-loading-posts i {
            font-size: 32px;
            color: #c9a86c;
            margin-bottom: 14px;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========================================== */
        /*   EMPTY / ERROR STATE                      */
        /* ========================================== */
        .logi-empty-message {
            text-align: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            padding: 60px 20px;
        }

        .logi-error-message {
            text-align: center;
            font-size: 15px;
            color: #ff8a8a;
            padding: 60px 20px;
        }

        /* ========================================== */
        /*   FLOATING CHAT                            */
        /* ========================================== */
        .floating-chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }

        .floating-chat-link {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #25d366;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .floating-chat-link:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            background: #20ba5a;
        }

        .floating-chat-link i {
            font-size: 1.1rem;
        }

        @media (max-width: 480px) {
            .floating-chat-link {
                padding: 8px 12px;
                font-size: 0.7rem;
            }
            .floating-chat-link span {
                display: none;
            }
            .floating-chat-link i {
                font-size: 1.3rem;
            }
        }

        /* ========================================== */
        /*   PLACEHOLDERS                             */
        /* ========================================== */
        #header-placeholder,
        #footer-placeholder {
            width: 100%;
        }

        /* ========================================== */
        /*   RESPONSIVE ADJUSTMENTS                   */
        /* ========================================== */
        @media (max-width: 820px) {
            .logi-post-card {
                padding: 20px 22px !important;
                gap: 18px !important;
            }
            .logi-post-thumb-wrapper {
                width: 150px !important;
                max-width: 150px !important;
            }
            .logi-post-thumb {
                height: 110px !important;
            }
            .logi-post-svg-wrapper {
                width: 150px !important;
                height: 110px !important;
            }
            .logi-post-title {
                font-size: 18px !important;
            }
        }

        @media (max-width: 640px) {
            .logi-post-card {
                flex-direction: column !important;
                gap: 14px !important;
                padding: 18px 16px !important;
            }
            .logi-post-thumb-wrapper,
            .logi-post-svg-wrapper {
                width: 100% !important;
                max-width: 100% !important;
            }
            .logi-post-thumb {
                height: 180px !important;
            }
            .logi-post-svg-wrapper {
                height: 160px !important;
            }
            .logi-posts-main-title {
                font-size: 24px !important;
                text-align: left !important;
            }
            .logi-post-title {
                font-size: 17px !important;
            }
            .logi-post-summary {
                font-size: 13.5px !important;
            }
            .logi-post-meta-strip {
                font-size: 11px !important;
            }
        }

        @media (max-width: 420px) {
            .logi-post-card {
                padding: 14px 12px !important;
                gap: 10px !important;
            }
            .logi-post-thumb {
                height: 140px !important;
            }
            .logi-post-svg-wrapper {
                height: 120px !important;
            }
            .logi-post-title {
                font-size: 15px !important;
            }
            .logi-post-summary {
                font-size: 12.5px !important;
            }
            .logi-post-btn {
                font-size: 11px !important;
                padding: 8px 18px !important;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!--   HEADER PLACEHOLDER                       -->
    <!-- ========================================== -->
    <div id="header-placeholder"></div>

    <!-- ========================================== -->
    <!--   FULL-WIDTH BACKGROUND SECTION           -->
    <!-- ========================================== -->
    <section class="section-bg" style="background-image: url('https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=1600&q=80');">
        <div class="container">

            <div class="logi-posts-container">
                <div class="logi-posts-header">
                    <div class="logi-split-header">
                        <h1 class="logi-posts-main-title">📖 <span>Blog</span> &amp; Articles</h1>
                    </div>
                    <div class="logi-posts-badge">Recent Journal Updates</div>
                    <p class="logi-posts-subtitle">Explore Christian articles, biblical insights, spiritual growth, leadership, faith, theology, and practical wisdom from LOGI.</p>
                </div>

                <div class="logi-posts-grid" id="logi-automatic-posts">
                    <div class="logi-loading-posts">
                        <i class="fas fa-spinner"></i>
                        <span>Loading latest posts...</span>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- ========================================== -->
    <!--   FOOTER PLACEHOLDER                       -->
    <!-- ========================================== -->
    <div id="footer-placeholder"></div>

    <!-- ========================================== -->
    <!--   JAVASCRIPT - LOAD HEADER & FOOTER       -->
    <!-- ========================================== -->
    <script src="/load.js"></script>

    <!-- ========================================== -->
    <!--   FLOATING CHAT                           -->
    <!-- ========================================== -->
    <div class="floating-chat-container">
        <a class="floating-chat-link" href="https://wa.me/233241456581" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i>
            <span>Chat with us on WhatsApp</span>
        </a>
    </div>

    <!-- ========================================== -->
    <!--   JAVASCRIPT                              -->
    <!-- ========================================== -->
    <script>
        // ==========================================
        //   BLOG POSTS - FETCH FROM GITHUB JSON
        // ==========================================
        function displayBlogPosts(posts) {
            var container = document.getElementById('logi-automatic-posts');
            
            if (!posts || posts.length === 0) {
                container.innerHTML = '<p class="logi-empty-message">No posts found at this time. Check back soon!</p>';
                return;
            }

            var html = '';

            for (var i = 0; i < posts.length; i++) {
                var post = posts[i];
                var title = post.title || 'Untitled Post';
                var postUrl = post.url || '#';
                var excerpt = post.excerpt || '';
                var postDate = post.date || '';
                var image = post.image || '';

                if (excerpt.length > 280) {
                    excerpt = excerpt.substring(0, 280) + '...';
                }

                html += '<div class="logi-post-card">';

                if (image) {
                    html += '  <div class="logi-post-thumb-wrapper">';
                    html += '    <a href="' + postUrl + '"><img src="' + image + '" alt="' + title + '" class="logi-post-thumb" loading="lazy"/></a>';
                    html += '  </div>';
                } else {
                    html += '  <div class="logi-post-thumb-wrapper logi-post-svg-wrapper">';
                    html += '    <a href="' + postUrl + '">';
                    html += '      <svg viewBox="0 0 24 24" width="60" height="60" fill="#c9a86c" stroke="#c9a86c">';
                    html += '        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>';
                    html += '      </svg>';
                    html += '    </a>';
                    html += '  </div>';
                }

                html += '  <div class="logi-post-content-block">';
                
                if (postDate) {
                    html += '    <div class="logi-post-meta-strip">';
                    html += '      <span class="logi-post-date">📅 ' + postDate + '</span>';
                    html += '    </div>';
                }
                
                html += '    <h3 class="logi-post-title"><a href="' + postUrl + '">' + title + '</a></h3>';
                
                if (excerpt) {
                    html += '    <p class="logi-post-summary">' + excerpt + '</p>';
                }

                html += '    <a href="' + postUrl + '" class="logi-post-btn">';
                html += '      Read More <i class="fas fa-arrow-right"></i>';
                html += '    </a>';

                html += '  </div>';
                html += '</div>';
            }

            container.innerHTML = html;
        }

        // ==========================================
        //   FETCH POSTS FROM GITHUB JSON
        // ==========================================
        const postsUrl = 'https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/data/posts.json';

        fetch(postsUrl)
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Failed to fetch posts');
                }
                return response.json();
            })
            .then(function(posts) {
                displayBlogPosts(posts);
            })
            .catch(function(error) {
                console.error('Error loading posts:', error);
                document.getElementById('logi-automatic-posts').innerHTML = 
                    '<p class="logi-error-message">⚠️ Error loading posts. Please try again later.</p>';
            });
    </script>

</body>
</html>
