<h3>2. The six-step design workflow</h3>
<ol>
  <li><b>Load assessment</b> — build an appliance inventory; calculate daily energy (kWh) and peak demand (kW), including motor surge.</li>
  <li><b>Site and resource assessment</b> — orientation, tilt, shading, structural capacity, and location-specific solar resource (peak sun hours).</li>
  <li><b>Array sizing</b> — kWp required = daily energy ÷ (PSH × system efficiency); then select module count and string configuration.</li>
  <li><b>Battery sizing</b> — kWh capacity = (daily energy × autonomy days) ÷ (DoD × inverter efficiency).</li>
  <li><b>Inverter and component selection</b> — continuous AC rating ≥ peak demand; surge rating ≥ largest motor start; DC input voltage window compatible with the cold Voc and hot Vmp of the strings; battery charge current within the battery's C-rate.</li>
  <li><b>Electrical checks and documentation</b> — string voltage at record low temperature, MPPT window at record high temperature, cable ampacity and voltage drop, protection coordination, earthing, and a single-line diagram.</li>
</ol>

<div class="callout"><b>Why the order matters:</b> You cannot size the array before you know the load. You cannot select the inverter before you know the peak demand <i>and</i> the string voltage. You cannot finalise cables before you know the currents and the run lengths. Each step depends on the one before it — skipping ahead produces a design that fails on paper or on site.</div>

<h3>3. The design brief and assumptions register</h3>
<p>A defensible design is accompanied by two documents:</p>
<ul>
  <li><b>Design brief</b> — what the client needs, the site constraints, the budget, the expected autonomy, and any utility or regulatory requirements (net-metering approval, grid-tie permission, structural sign-off).</li>
  <li><b>Assumptions register</b> — every number assumed but not measured: peak sun hours source and month, system efficiency, record low and record high ambient temperatures, roof pitch, cable run lengths, and future load growth allowance.</li>
</ul>
<p>Documented assumptions make the design traceable. Six months later, when a client asks "why did you pick an 8 kW array?", the answer is in the register, not in someone's memory.</p>

<h3>4. Worked example — choosing the topology</h3>
<p>A client has a remote cabin with no utility connection. Essential loads: a 150 W refrigerator (duty 50%), ten 10 W LED lamps for 5 h, and a 60 W laptop charger for 4 h.</p>
<ul>
  <li>Daily energy = (150 × 0.5 × 24) + (10 × 10 × 5) + (60 × 4) = 1,800 + 500 + 240 = <b>2,540 Wh = 2.54 kWh</b>.</li>
  <li>Peak demand is dominated by the refrigerator compressor surge: 150 W × 3 ≈ 450 W, plus concurrent lighting ≈ 550 W.</li>
  <li>No grid available ⇒ <b>off-grid</b> topology, mandatory battery, and the inverter must handle the 450 W compressor surge.</li>
</ul>
<p>Contrast this with a suburban home on a reliable grid with no backup requirement: grid-tied, no battery, and the inverter sizing driven by peak demand rather than autonomy.</p>

<div class="callout"><b>Safety note:</b> Hybrid and grid-tied inverters can back-feed into the utility network. Anti-islanding protection must be active and the interconnection must be approved by the local utility. Never energise a grid-tie inverter without documented permission to connect.</div>

<h3>Summary</h3>
<ul>
  <li>Three topologies: grid-tied, off-grid, hybrid — the choice is dictated by grid availability and backup need.</li>
  <li>The six-step workflow runs load → site → array → battery → components → electrical checks.</li>
  <li>Every design needs a brief and an assumptions register to be traceable and reviewable.</li>
</ul>`,

<div class="callout"><b>Core principle:</b> Daily energy (kWh) sizes the array and battery. Peak demand (kW) sizes the inverter. Surge (kVA) sizes the inverter's short-term capability. Three different numbers, three different purposes.</div>

<h3>Learning outcomes</h3>
<p>By the end of this lesson you should be able to: build a load schedule; distinguish energy from power and demand; apply the duty-cycle concept to cyclic loads; calculate motor starting surge; and recognise why a low-energy home can still need a large inverter.</p>

<h3>1. Energy versus power — the distinction that drives everything</h3>
<table class="compare">
<tr><th>Quantity</th><th>Symbol / unit</th><th>Meaning</th><th>Sizes</th></tr>
<tr><td>Power</td><td>P (W or kW)</td><td>Rate of energy use at an instant</td><td>Inverter continuous rating (with diversity)</td></tr>

<tr><td>Surge</td><td>kVA</td><td>Short-duration starting power</td><td>Inverter surge rating</td></tr>
</table>

<h3>2. The load schedule</h3>
<p>For every appliance record: quantity, rated power (W), daily operating hours, and any duty cycle. Multiply across and sum.</p>
<table class="compare">
<tr><th>Appliance</th><th>Power (W)</th><th>Qty</th><th>Hours/day</th><th>Duty</th><th>Daily energy (Wh)</th></tr>
<tr><td>LED lamps</td><td>10</td><td>10</td><td>5</td><td>100%</td><td>500</td></tr>
<tr><td>Refrigerator</td><td>150</td><td>1</td><td>24</td><td>50%</td><td>1,800</td></tr>
<tr><td>Television</td><td>100</td><td>1</td><td>4</td><td>100%</td><td>400</td></tr>
<tr><td>Ceiling fans</td><td>60</td><td>2</td><td>8</td><td>100%</td><td>960</td></tr>
<tr><td>Laptop charger</td><td>65</td><td>1</td><td>4</td><td>100%</td><td>260</td></tr>
<tr><th colspan="5">Total daily energy</th><th>3,920 Wh = 3.92 kWh</th></tr>
</table>

<p>The <b>duty cycle</b> is essential for thermostatically controlled loads. A refrigerator's compressor does not run 24 hours — it cycles on and off, typically 40–60% of the time depending on ambient temperature and insulation. Recording "24 h at 50% duty" is more honest than "12 h", because it captures the overnight operation that drives autonomy sizing.</p>

<h3>3. Peak demand and diversity</h3>
<p>Peak demand is <i>not</i> the sum of every appliance's rated power. It is the maximum that will run <b>simultaneously</b>. Apply a <b>diversity factor</b>:</p>
<ul>
  <li>Lighting and small electronics: high diversity (rarely all on at once).</li>
  <li>Kitchen appliances (kettle, microwave, toaster): low diversity — a client may well run two at once.</li>
  <li>HVAC and water heating: often the dominant continuous load.</li>
</ul>
<p><b>Worked example:</b> A home has a 3 kW kettle, a 2 kW microwave, a 1.5 kW water heater, and 0.5 kW of lighting and electronics. If the kettle and microwave run together while the water heater is on, peak demand = 3 + 2 + 1.5 + 0.5 = <b>7 kW</b>. The inverter must be rated for at least 7 kW continuous, even though the daily energy might only be 12 kWh.</p>

<h3>4. Motor starting surge</h3>
<p>Induction motors — refrigerator and freezer compressors, water pumps, air-conditioning compressors, washing machines — draw a <b>starting current</b> of roughly 3–7 times their running current for a fraction of a second to a few seconds. This is a power surge, not an energy event, but it can trip an undersized inverter.</p>
<div class="callout"><b>Rule of thumb:</b> Size the inverter's surge rating to at least the largest motor's starting wattage plus the running wattage of everything else that is on at the same time. If the inverter's datasheet quotes "2× continuous for 5 s", a 5 kW inverter can deliver 10 kVA briefly.</div>

<h3>5. Worked example — a small off-grid home</h3>
<p>Loads: 12 × 9 W LED (5 h), 1 × 180 W fridge (24 h at 45% duty, 4× surge), 1 × 1,200 W pump (2 h, 3× surge), 1 × 80 W TV (4 h).</p>

<h3>6. Future load growth</h3>
<p>A design that exactly matches today's load will be undersized in two years. Add a <b>growth allowance</b> — typically 10–20% — to the daily energy before sizing the array and battery. Document the allowance in the assumptions register so the client understands the headroom they are paying for.</p>

  <li>Motor surge = 3–7× running current; it sizes the inverter's surge rating.</li>
  <li>Duty cycle and diversity factors keep the schedule honest.</li>
</ul>`,

<div class="callout"><b>Core principle:</b> PSH is the daily irradiation expressed as the equivalent number of hours at 1,000 W/m². It is the bridge between a site's solar resource and a module's nameplate rating.</div>

<h3>Learning outcomes</h3>
<p>By the end of this lesson you should be able to: define PSH and convert irradiation to PSH; evaluate orientation and tilt; conduct a shading survey; use a location-specific solar dataset; and recognise why the worst month — not the annual average — governs an off-grid design.</p>

<h3>1. Irradiance, irradiation and PSH</h3>
<table class="compare">
<tr><th>Term</th><th>Unit</th><th>Meaning</th></tr>
<tr><td>Irradiance</td><td>W/m²</td><td>Instantaneous power density of sunlight</td></tr>
<tr><td>Irradiation</td><td>kWh/m²/day (or Wh/m²)</td><td>Energy received over a period — the area under the irradiance curve</td></tr>
<tr><td>Peak Sun Hours (PSH)</td><td>hours</td><td>Daily irradiation ÷ 1,000 W/m² — numerically equal to kWh/m²/day</td></tr>
</table>

<p>Because 1 PSH = 1 kWh/m² received, a site with 5 kWh/m²/day has 5 PSH. The daily energy yield of an array is then:</p>
<p style="text-align:center;font-weight:bold;font-size:16px;">Daily energy (kWh) = Array size (kWp) × PSH × System efficiency</p>

<p><b>Worked example:</b> a 5 kWp array at a site with 4.5 PSH and 80% system efficiency yields 5 × 4.5 × 0.80 = <b>18 kWh/day</b>. The 20% loss accounts for inverter conversion, cabling, soiling, temperature derating and mismatch.</p>

<h3>2. Orientation and tilt</h3>
<p>In the northern hemisphere, the array faces <b>true south</b>; in the southern hemisphere, <b>true north</b>. A compass reads magnetic north, so apply the local <b>magnetic declination</b> to find true south/north.</p>
<ul>
  <li><b>Azimuth deviation</b> of up to ±30° from due south typically costs only a few percent of annual yield; beyond that the loss grows steeply.</li>
  <li><b>Tilt</b> near the latitude generally maximises annual yield. Steeper tilts favour winter production; shallower tilts favour summer.</li>
  <li>For an <b>off-grid</b> system, tilt is often optimised for the <b>worst month</b> (winter), not the annual average, because that is when autonomy is hardest to achieve.</li>
</ul>

<h3>3. Shading analysis</h3>
<p>Shading is disproportionately damaging. A single shaded cell in a series string can reduce that string's current to the shaded cell's current — the classic <b>bottleneck</b> effect. Bypass diodes mitigate but do not eliminate the loss, and partial shading can also create hot spots that degrade modules.</p>
<p>What to survey:</p>
<ul>
  <li><b>Obstructions</b> — trees (including growth over 25 years), buildings, chimneys, vents, parapets, and the array itself on multi-row roofs.</li>
  <li><b>Timing</b> — record shadows across the critical window, typically 09:00–15:00 solar time, when most energy is collected.</li>
  <li><b>Tools</b> — a Solar Pathfinder, a smartphone sun-path app (e.g. Sun Surveyor), or a fisheye horizon photo with an overlay.</li>
</ul>
<div class="callout"><b>Mitigation options:</b> relocate the array; reduce string length in the shaded zone; use module-level power electronics (optimisers or microinverters) to decouple shaded modules; or remove/trim the obstruction. For heavily shaded sites, optimisers are often the only practical solution.</div>

<h3>4. Roof and structural checks</h3>
<ul>
  <li><b>Usable area</b> — subtract skylights, vents, chimneys and required fire setbacks (often 0.5 m).</li>
  <li><b>Structural capacity</b> — a PV array adds roughly 15–25 kg/m² including mounting; the roof structure must be checked by a competent person.</li>
  <li><b>Roof condition</b> — replacing a roof under an array is far more expensive than replacing it first.</li>
  <li><b>Access and cable routes</b> — plan the DC run length; long runs increase voltage drop and cable cost.</li>
</ul>

<h3>5. Using a location-specific dataset</h3>
<p>Never guess the solar resource. Use a credible dataset — a national meteorological service, a satellite-derived irradiance database, or a recognised solar atlas — and record in the assumptions register:</p>
<ul>
  <li>The dataset name and version.</li>
  <li>The coordinates used.</li>
  <li>The period of record.</li>
  <li>The month or season used for sizing (worst month for off-grid; annual average for grid-tied yield estimates).</li>
</ul>

<h3>6. Why the worst month governs off-grid sizing</h3>
<p>An off-grid system sized on the annual average will fail in the worst month. If December delivers 2.5 PSH while the annual average is 5 PSH, an array sized on 5 PSH will produce half the required energy in December. Off-grid designs therefore size the array on the <b>worst-month PSH</b>, accepting that the array is oversized for the rest of the year — the price of reliability without a grid.</p>

  <li>Shading is disproportionately damaging — survey it, don't assume it away.</li>
  <li>Off-grid designs size on the worst month; grid-tied on the annual average.</li>

<h3>1. The array sizing formula</h3>
<p style="text-align:center;font-weight:bold;font-size:16px;">Array size (kWp) = Daily energy (kWh) ÷ (PSH × System efficiency)</p>
<p><b>Worked example:</b> daily energy 15 kWh, worst-month PSH 4.5, system efficiency 0.80.</p>

<h3>2. The datasheet parameters that matter</h3>
<table class="compare">
<tr><th>Parameter</th><th>Meaning</th><th>Why it matters</th></tr>
<tr><td>Pmax (W)</td><td>Maximum power at STC</td><td>Array sizing; number of modules</td></tr>
<tr><td>Voc (V)</td><td>Open-circuit voltage at STC</td><td>Determines maximum string voltage at record cold</td></tr>

<tr><td>NOCT / NMOT (°C)</td><td>Nominal operating cell temperature</td><td>Estimates real-world cell temperature</td></tr>

<h3>3. Why temperature coefficients matter</h3>
<p>Solar cells are semiconductors: as cell temperature falls, open-circuit voltage rises. A module rated Voc 45 V at 25 °C may reach 49–50 V at −10 °C. Multiply by the number of modules in series and you may exceed the inverter's maximum DC input — a destructive failure.</p>
<p>Conversely, as cell temperature rises (a dark roof in summer can push cell temperature to 60–70 °C), Vmp falls. If the string's hot-weather Vmp drops below the inverter's MPPT minimum, the inverter stops producing.</p>
<div class="callout"><b>Design rule:</b> Check the string at <b>record low temperature</b> against the inverter's maximum DC input voltage, and at <b>record high cell temperature</b> against the MPPT minimum. Both checks must pass.</div>

<h3>4. Rounding and physical feasibility</h3>
<p>Rounding up to 8 modules satisfies the energy requirement, but the count must also be feasible:</p>

  <li><b>String configuration</b> — 8 modules could be one string of 8, two strings of 4, or four strings of 2. The choice depends on the inverter's voltage window and MPPT count.</li>
  <li><b>Module availability</b> — module wattages change; design should not depend on a single discontinued model.</li>
</ul>

<p>Check roof area: 10 × 2.3 = 23 m² clear. Check string possibility: 10 modules in series at cold Voc 50 V = 500 V — likely at or above many inverter limits, so plan two strings of 5 (250 V cold) instead.</p>

<h3>Summary</h3>

</ul>`,

<h3>2. Cold-weather voltage — the formula</h3>
<p style="text-align:center;font-weight:bold;font-size:16px;">Voc(cold) = Voc(STC) × [1 + (TempCoeff × (T_min − 25))]</p>
<p><b>Worked example:</b> Voc(STC) = 45 V, TempCoeff = −0.30 %/°C (−0.003), record low T_min = −5 °C.</p>
<p>Voc(cold) = 45 × [1 + (−0.003 × (−5 − 25))]<br>
= 45 × [1 + (−0.003 × −30)]<br>
= 45 × [1 + 0.09]<br>
= 45 × 1.09 = <b>49.05 V</b></p>
<p>For a string of 10 modules: 10 × 49.05 = <b>490.5 V</b>. If the inverter's maximum DC input is 500 V, the design is safe — but only just. One more module would exceed it.</p>

<div class="callout"><b>Safety factor:</b> Use the <b>record low ambient temperature</b> for the site, not the average winter minimum. Cell temperature can be at or below ambient at dawn, so ambient is the correct conservative input. Where the site record is unknown, obtain it from the national meteorological service.</div>

<h3>3. Hot-weather Vmp — checking the MPPT window</h3>
<p style="text-align:center;font-weight:bold;font-size:16px;">Vmp(hot) = Vmp(STC) × [1 + (TempCoeff_Vmp × (T_cell_max − 25))]</p>

<p>For a string of 8 modules: 8 × 31.8 = <b>254 V</b>. This must be <b>above</b> the inverter's MPPT minimum. If the MPPT range is 120–500 V, the design passes.</p>

<h3>4. Current limits per MPPT</h3>
<p>The inverter specifies a maximum input current per MPPT. For <b>m</b> parallel strings on one MPPT:</p>

<h3>4. C-rate — the hidden constraint</h3>

<div class="callout"><b>Check:</b> Max inverter charge current (A) ≤ number of parallel batteries × battery C-rate × battery Ah. If violated, the BMS will throttle or disconnect, causing nuisance faults.</div>

<h3>1. Cable sizing — ampacity and voltage drop</h3>
<p>Two independent checks apply:</p>
<ul>
  <li><b>Ampacity</b> — the cable's current-carrying capacity after derating for installation method and ambient temperature must exceed the design current.</li>
  <li><b>Voltage drop</b> — the loss along the run must stay within limits: typically <b>≤ 2% on DC</b> and <b>≤ 3% on AC</b>.</li>
</ul>
<p style="text-align:center;font-weight:bold;font-size:16px;">V_drop = (2 × L × I × ρ) ÷ A</p>
<p>where L = one-way length (m), I = current (A), ρ = copper resistivity ≈ 0.0175 Ω·mm²/m, A = cross-sectional area (mm²). The factor 2 accounts for the return path.</p>

<p><b>Worked example:</b> 10 m one-way run, 6 mm² copper, 20 A, 48 V system.</p>
<p>V_drop = (2 × 10 × 20 × 0.0175) ÷ 6 = 7.0 ÷ 6 = <b>1.17 V</b>.</p>
<p>Percentage = 1.17 ÷ 48 × 100 = <b>2.4%</b> — above the 2% DC limit. Increase to 10 mm²: V_drop = 7.0 ÷ 10 = 0.70 V = 1.46% ✓.</p>

<h3>2. Protection coordination</h3>
<table class="compare">
<tr><th>Device</th><th>Purpose</th><th>Sizing basis</th></tr>

<tr><td>DC isolator</td><td>Safe isolation of the array for maintenance</td><td>DC-rated for full string Voc and Isc</td></tr>
<tr><td>AC breaker</td><td>Protect AC circuit; isolate inverter</td><td>≥ inverter output current; AC-rated</td></tr>
<tr><td>RCD / RCBO</td><td>Earth-leakage protection on AC side</td><td>Type and rating per local code</td></tr>
<tr><td>SPD (DC and AC)</td><td>Surge protection, especially lightning-prone sites</td><td>Voltage rating ≥ system voltage; Type 2 typical</td></tr>
<tr><td>Earthing / bonding</td><td>Module frames, inverter chassis, battery rack</td><td>Per local code; tested resistance</td></tr>

<div class="callout"><b>DC-rated devices only:</b> A PV DC circuit can sustain an arc when interrupted. AC breakers and switches must never be used on the DC side. DC isolators and fuses must be rated for the full DC voltage (often 600 V or 1,000 V DC) and the prospective current.</div>

<h3>4. Commissioning checks</h3>
<ul>
  <li>Visual inspection — mounting, torque, cable routing, labelling.</li>
  <li>Polarity of every string before connection.</li>
  <li>Open-circuit voltage and short-circuit current per string, compared with expected values.</li>
  <li>Insulation resistance test on DC and AC circuits.</li>
  <li>Earth continuity and earth resistance test.</li>
  <li>Inverter firmware, grid code and battery settings; functional test of anti-islanding.</li>
  <li>Documentation — as-built SLD, test records, datasheets, settings, warranty.</li>
</ul>
<p>Electrical installation and testing must be carried out by <b>competent, appropriately qualified personnel</b>. A design document is not a construction approval; installation requires the relevant permits and sign-offs.</p>

<h3>5. Lifecycle economics</h3>
<p style="text-align:center;font-weight:bold;font-size:15px;">Payback (years) = Total system cost ÷ Annual savings</p>
<p><b>Worked example:</b> system cost $8,000, annual yield 6,000 kWh, grid tariff $0.20/kWh.</p>
<p>Annual savings = 6,000 × 0.20 = $1,200. Payback = 8,000 ÷ 1,200 = <b>6.7 years</b>.</p>

<p style="text-align:center;font-weight:bold;font-size:15px;">LCOE = (Total lifecycle cost) ÷ (Total lifetime energy)</p>
<p>Lifecycle cost includes capital, maintenance, inverter replacement (typically at year 10–15) and battery replacement (off-grid/hybrid, every 8–15 years depending on chemistry). Lifetime energy must account for <b>module degradation</b> — typically 0.5% per year, so year-25 output is ~88% of year-1.</p>

<p><b>Performance Ratio (PR)</b> = actual energy ÷ theoretical energy. A well-designed system achieves 75–85%. A PR below 70% suggests shading, soiling, mismatch or inverter issues.</p>

const PROGRESS_KEY = 'logi_progress_cache';
function getProgressCache() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch { return {}; }
}
function setProgressCache(cache) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(cache)); }

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  try {
    const res = await fetch(`${API_BASE}/my-progress`, {
      headers: { 'Authorization': `Bearer ${getAuth().token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    const cache = getProgressCache();
    Object.keys(cache).forEach(k => {
       if (k.startsWith(COURSE.id)) delete cache[k];
    });
    if (data.progress) {
      data.progress.forEach(row => {
        const key = `${COURSE.id}_${row.module_id}_${row.lesson_id}`;
        cache[key] = { completed: row.completed, score: row.quiz_score, total: row.quiz_total };
      });
      setProgressCache(cache);
    }
  } catch (e) { console.error('Could not load progress', e); }
}

function isLessonDone(username, mi, li) {
  const cache = getProgressCache();
  return !!cache[`${COURSE.id}_solar_${mi+1}_lesson_${li+1}`]?.completed;
}
function getQuizResult(username, mi) {
  const cache = getProgressCache();
  return cache[`${COURSE.id}_solar_${mi+1}_quiz_1`] || null;
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.completed;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.completed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.completed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

    const u = state.user;

    return `

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
    if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`);
    if (lbl) {
      lbl.classList.add('selected');
      const radio = lbl.querySelector('input');
      if (radio) radio.checked = true;
    }
  }

  async function submitQuiz(mi) {
    const u = await currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    let score = 0;
    let answeredAll = true;

    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (!sel) {
        answeredAll = false;
        if (fb) { fb.textContent = 'Please select an answer.'; fb.style.color = 'var(--error)'; }
        return;
      }
      if (parseInt(sel.value) === q.answer) {
        score++;
        if (fb) { fb.textContent = 'Correct!'; fb.style.color = 'var(--success)'; }
      } else {
        if (fb) { fb.textContent = 'Incorrect.'; fb.style.color = 'var(--error)'; }
      }
    });

    const resultEl = document.getElementById('quizResult_' + mi);
    if (!answeredAll) {
      if (resultEl) {
        resultEl.textContent = 'Please answer all questions before submitting.';
        resultEl.style.color = 'var(--error)';
      }
      return;
    }

    const passed = (score / quiz.length * 100) >= COURSE.passMark;

    try {
      await fetch(`${API_BASE}/progress`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAuth().token}` },
        body: JSON.stringify({
          moduleId: `solar_${mi+1}`,
          lessonId: `quiz_1`,
          completed: passed ? 1 : 0,
          quizScore: score,
          quizTotal: quiz.length
        })
      });
      await loadStudentData(u, true);
    } catch (e) { console.error(e); }

    if (passed) {
      if (resultEl) {
        resultEl.textContent = `Scored ${score}/${quiz.length}. Passed! ✅`;
        resultEl.style.color = 'var(--success)';
      }

      const nextBtn = document.getElementById('nextBtn_' + mi);
      if (nextBtn) {
        nextBtn.disabled = false;
        nextBtn.classList.remove('btn-secondary');
        nextBtn.classList.add('btn');
        nextBtn.style.opacity = '1';
        const isLast = (mi + 1 >= COURSE.modules.length);
        nextBtn.textContent = isLast
          ? (courseCompleted(u.username) ? 'View Certificate →' : 'Finish →')
          : 'Next Module →';
      }
    } else {
      if (resultEl) {
        resultEl.textContent = `Scored ${score}/${quiz.length}. Try again.`;
        resultEl.style.color = 'var(--error)';
      }
    }
  }

  function scaleCertificate() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const container = scaler.parentElement;
    const containerWidth = container.clientWidth;
    const certWidth = 1000;
    if (containerWidth < certWidth) {
      const scale = containerWidth / certWidth;
      scaler.style.transform = `scale(${scale})`;
      scaler.style.marginBottom = `-${(707 * (1 - scale))}px`;
    } else {
      scaler.style.transform = 'none';
      scaler.style.marginBottom = '0';
    }
  }

  function downloadCertificateImage() {
    const cert = document.getElementById('printableCert');
    const scaler = document.getElementById('certScaler');
    if (!cert || !scaler) return;
    const btn = document.querySelector('button[onclick="App.downloadCertificateImage()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ Generating...';
    btn.disabled = true;
    const originalTransform = scaler.style.transform;
    const originalMargin = scaler.style.marginBottom;
    scaler.style.transform = 'none';
    scaler.style.marginBottom = '0';
    html2canvas(cert, {
      scale: 2, useCORS: true, backgroundColor: '#fafafa',
      width: 1000, height: 707, windowWidth: 1000, windowHeight: 707,
      onclone: (clonedDoc) => {
        const desc = clonedDoc.querySelector('.cert-description');
        if (desc) { desc.style.wordSpacing = 'normal'; desc.style.letterSpacing = 'normal'; }
      }
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate_Solar_PV_Design.png';
      link.href = imgData;
      link.click();
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error('Error generating image:', err);
      alert('Failed to generate image. Please ensure you are connected to the internet so the external signature and QR code can load.');
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }
