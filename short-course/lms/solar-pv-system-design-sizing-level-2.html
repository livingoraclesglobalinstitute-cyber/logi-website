    .dash-layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 66px); position: relative; }
    .sidebar { background: white; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; z-index: 40; transition: transform 0.25s ease-in-out; }

    .sidebar .user-badge span { color: var(--muted); font-size: 12px; word-break: break-all; }
    .sidebar a, .sidebar button.nav-link { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 6px; background: transparent; border: 0; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: background 0.1s; }

    .main-panel { padding: 28px 32px 48px; overflow-y: auto; max-height: calc(100vh - 66px); background: #fbfafc; }

    .actions { display: flex; justify-content: space-between; gap: 9px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 24px; }

    .mobile-module-toggle:hover { background: #fff0f6; }

    @media (max-width: 900px) {
      .mobile-nav-toggle { display: inline-flex; }
      .dash-layout { grid-template-columns: 1fr; }
      .sidebar { position: fixed; top: 66px; left: 0; bottom: 0; width: 260px; background: white; box-shadow: 4px 0 16px rgba(0,0,0,0.1); transform: translateX(-100%); overflow-y: auto; }
      .sidebar.open { transform: translateX(0); }
      .sidebar .user-badge { display: block; }
      .main-panel { max-height: none; padding: 20px 16px 40px; }
      .course-layout { grid-template-columns: 1fr; gap: 16px; }
      .mobile-module-toggle { display: inline-flex; }
      .module-side { position: fixed; top: 66px; right: 0; bottom: 0; width: 300px; max-width: 85vw; background: white; border: 0; border-left: 1px solid var(--line); border-radius: 0; box-shadow: -4px 0 16px rgba(0,0,0,0.15); z-index: 50; transform: translateX(100%); transition: transform 0.25s ease-in-out; }

    @media (max-width: 500px) {
      .auth-card { padding: 24px 18px; }
      .main-panel h1 { font-size: 22px; }
      .brand { font-size: 18px; }
      .nav-actions { gap: 6px; }
      .btn, .btn-outline, .btn-secondary { font-size: 12px; padding: 7px 12px; }

const API_BASE = 'https://logi-lms-api.livingoraclesglobalinstitute.workers.dev';

const COURSE = {
  "id": "solar-pv-design-201",
  "title": "Solar PV System Design and Sizing",
  "desc": "A professional-level course in solar photovoltaic system assessment, sizing, component selection, electrical design checks, and preliminary residential PV design.",
  "passMark": 50,
  "modules": [
    {
      "title": "Module 1: System Types & Load Analysis",
      "lessons": [
        {
          "title": "System Architecture & Design Workflow",
          "duration": "25 minutes",
          "html": "<div class=\"callout\"><b>Design Basis:</b> Every design starts with the system topology. Grid-tied systems export surplus power; off-grid systems rely entirely on battery storage; hybrid systems do both.</div>\n<p>Before selecting a single solar panel, you must define the system architecture. The architecture dictates the inverter type, battery requirements, and safety disconnects.</p>\n<div class=\"diagram\"><svg viewBox=\"0 0 900 400\" role=\"img\" aria-label=\"Solar PV system architecture\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8Z\" fill=\"#555\"/></marker><linearGradient id=\"sky\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#fff4d6\"/><stop offset=\"100%\" stop-color=\"#ffffff\"/></linearGradient></defs><rect width=\"900\" height=\"400\" fill=\"url(#sky)\" rx=\"8\"/><g transform=\"translate(780,40)\"><circle cx=\"0\" cy=\"0\" r=\"30\" fill=\"#ffd54f\"/><g stroke=\"#ffb300\" stroke-width=\"4\"><line x1=\"0\" y1=\"-45\" x2=\"0\" y2=\"-60\"/><line x1=\"0\" y1=\"45\" x2=\"0\" y2=\"60\"/><line x1=\"-45\" y1=\"0\" x2=\"-60\" y2=\"0\"/><line x1=\"45\" y1=\"0\" x2=\"60\" y2=\"0\"/><line x1=\"-30\" y1=\"-30\" x2=\"-42\" y2=\"-42\"/><line x1=\"30\" y1=\"30\" x2=\"42\" y2=\"42\"/><line x1=\"-30\" y1=\"30\" x2=\"-42\" y2=\"42\"/><line x1=\"30\" y1=\"-30\" x2=\"42\" y2=\"-42\"/></g></g><g stroke=\"#ffb300\" stroke-width=\"3\" stroke-dasharray=\"6 4\"><line x1=\"740\" y1=\"80\" x2=\"400\" y2=\"160\"/><line x1=\"750\" y1=\"90\" x2=\"420\" y2=\"170\"/><line x1=\"760\" y1=\"100\" x2=\"440\" y2=\"180\"/></g><path d=\"M100 120 L380 120 L440 180 L160 180 Z\" fill=\"#2b4c7e\" stroke=\"#1a365d\" stroke-width=\"2\"/><g stroke=\"#8db5d9\" stroke-width=\"1\"><line x1=\"135\" y1=\"120\" x2=\"185\" y2=\"180\"/><line x1=\"170\" y1=\"120\" x2=\"220\" y2=\"180\"/><line x1=\"205\" y1=\"120\" x2=\"255\" y2=\"180\"/><line x1=\"240\" y1=\"120\" x2=\"290\" y2=\"180\"/><line x1=\"275\" y1=\"120\" x2=\"325\" y2=\"180\"/><line x1=\"310\" y1=\"120\" x2=\"360\" y2=\"180\"/><line x1=\"345\" y1=\"120\" x2=\"395\" y2=\"180\"/></g><text x=\"270\" y=\"105\" font-family=\"Arial\" font-size=\"12\" font-weight=\"bold\" fill=\"#1a365d\" text-anchor=\"middle\">PV ARRAY (DC)</text><path d=\"M240 180 L440 180 L440 280 L240 280 Z\" fill=\"#f4eafa\" stroke=\"#9862b5\" stroke-width=\"2\"/><text x=\"340\" y=\"235\" font-family=\"Arial\" font-size=\"14\" font-weight=\"bold\" fill=\"#70418b\" text-anchor=\"middle\">HYBRID INVERTER</text><text x=\"340\" y=\"255\" font-family=\"Arial\" font-size=\"11\" fill=\"#70418b\" text-anchor=\"middle\">11.0kW / 48V</text><rect x=\"240\" y=\"320\" width=\"200\" height=\"60\" rx=\"6\" fill=\"#e8f5e9\" stroke=\"#388e3c\" stroke-width=\"2\"/><text x=\"340\" y=\"345\" font-family=\"Arial\" font-size=\"13\" font-weight=\"bold\" fill=\"#256b2a\" text-anchor=\"middle\">BATTERY BANK</text><text x=\"340\" y=\"365\" font-family=\"Arial\" font-size=\"11\" fill=\"#256b2a\" text-anchor=\"middle\">51.2V / 200Ah / 15kWh</text><path d=\"M440 230 H560\" stroke=\"#e53e3e\" stroke-width=\"3\" marker-end=\"url(#arr)\"/><path d=\"M560 230 H580 V130 H600\" stroke=\"#e53e3e\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#arr)\"/><path d=\"M560 230 H580 V330 H600\" stroke=\"#e53e3e\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#arr)\"/><rect x=\"600\" y=\"100\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#fff4d6\" stroke=\"#d69a25\" stroke-width=\"2\"/><text x=\"690\" y=\"125\" font-family=\"Arial\" font-size=\"13\" font-weight=\"bold\" fill=\"#76500b\" text-anchor=\"middle\">AC LOADS</text><text x=\"690\" y=\"145\" font-family=\"Arial\" font-size=\"11\" fill=\"#76500b\" text-anchor=\"middle\">Lighting, Fridge, TV</text><rect x=\"600\" y=\"300\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#e8efff\" stroke=\"#4777c8\" stroke-width=\"2\"/><text x=\"690\" y=\"325\" font-family=\"Arial\" font-size=\"13\" font-weight=\"bold\" fill=\"#244d91\" text-anchor=\"middle\">UTILITY GRID</text><text x=\"690\" y=\"345\" font-family=\"Arial\" font-size=\"11\" fill=\"#244d91\" text-anchor=\"middle\">230V AC / 50Hz</text><g stroke=\"#777\" stroke-width=\"2\" fill=\"none\"><path d=\"M340 180 V280\" marker-end=\"url(#arr)\"/><path d=\"M340 280 V320\" marker-end=\"url(#arr)\"/></g></svg><div class=\"diagram-cap\">Figure 1: A typical Hybrid System Architecture. Note the dual-direction flow between the inverter and the grid.</div></div>\n<h3>The Design Workflow</h3><p>1. <b>Load Assessment:</b> Calculate daily energy (kWh) and peak demand (kW).</p><p>2. <b>Array Sizing:</b> Determine kWp based on irradiance and system losses.</p><p>3. <b>Battery Sizing:</b> Calculate Ah capacity based on autonomy and Depth of Discharge (DoD).</p><p>4. <b>Inverter Selection:</b> Match continuous AC output and DC input limits.</p><p>5. <b>Electrical Checks:</b> Verify string voltages, currents, and cable voltage drop.</p>\n<h3>Activity: Architecture Selection</h3><p>A client wants a system for a remote cabin with no utility connection. They need to run a refrigerator, lights, and a laptop. Based on this, which topology is required? Document your reasoning.</p><div class=\"callout\"><b>Safety note:</b> Hybrid inverters can back-feed into the grid. Ensure anti-islanding protection is active and approved by the local utility.</div>",
          "quiz": [
            {"q":"Which system normally exports surplus power to the utility grid?","opts":["Grid-connected","Standalone off-grid","Portable lantern","DC-only system"],"answer":0,"explanation":"Grid-connected systems operate in parallel with the utility subject to approved interconnection requirements."},
            {"q":"What is a design brief?","opts":["A record of client needs and constraints","A list of advertisements","A module quiz","A panel warranty only"],"answer":0,"explanation":"The brief captures objectives, loads, autonomy, budget and site constraints."},
            {"q":"Why document assumptions?","opts":["To make calculations traceable","To avoid checking datasheets","To guarantee output","To replace site surveys"],"answer":0,"explanation":"Documented assumptions make preliminary calculations reviewable and reproducible."},
            {"q":"Which is a key design objective?","opts":["Safe, reliable service for defined loads","Maximum panel count regardless of limits","Ignoring seasonal conditions","Using identical equipment in every project"],"answer":0,"explanation":"A sound design balances safety, reliability, performance and cost."},
            {"q":"Which item should be established before selecting PV equipment?","opts":["The design load and site conditions","The panel brand only","The certificate template","The roof paint colour"],"answer":0,"explanation":"A design basis starts with load requirements, site conditions and constraints."}
          ]
        },
        {
          "title": "Appliance Inventory & Load Schedule",
          "duration": "25 minutes",
          "html": "<p>Accurate load assessment is the foundation of system sizing. If you underestimate the load, the battery will deplete prematurely; if you overestimate, the client wastes money.</p>\n<div class=\"compare\"><tr><th>Appliance</th><th>Power (W)</th><th>Qty</th><th>Hours/Day</th><th>Daily Energy (Wh)</th></tr><tr><td>LED Lights</td><td>10</td><td>10</td><td>5</td><td>500</td></tr><tr><td>Refrigerator</td><td>150</td><td>1</td><td>24 (Duty 50%)</td><td>1800</td></tr><tr><td>Television</td><td>100</td><td>1</td><td>4</td><td>400</td></tr><tr><td>Ceiling Fan</td><td>60</td><td>2</td><td>8</td><td>960</td></tr><tr><th colspan=\"4\">Total Daily Energy</th><th>3,660 Wh (3.66 kWh)</th></tr></table>\n<h3>Peak Demand vs. Daily Energy</h3><p>Daily energy (kWh) tells you how big the solar array and battery need to be. Peak demand (kW) tells you how big the <b>inverter</b> needs to be. If a client runs a 3kW kettle and a 2kW microwave at the same time, your inverter must handle at least 5kW, even if their daily energy is low.</p>\n<div class=\"callout\"><b>Surge Loads:</b> Motors (fridges, pumps, AC units) draw 3–5 times their running current during startup. Always check the inverter's surge rating against the largest motor's starting wattage.</div>\n<h3>Activity</h3><p>Create a load schedule for your own home. Note the power rating of 5 essential appliances and estimate their daily operating hours.</p>",
          "quiz": [
            {"q":"Daily energy is commonly calculated as:","opts":["Power × operating time","Voltage ÷ current","Current × resistance only","Panel area × roof height"],"answer":0,"explanation":"Energy in Wh is power in W multiplied by operating hours."},
            {"q":"A 100 W appliance used for 4 hours consumes:","opts":["400 Wh","25 Wh","100 kWh","4 W"],"answer":0,"explanation":"100 W × 4 h = 400 Wh."},
            {"q":"Peak demand differs from daily energy because it represents:","opts":["Power required at a particular time","Total energy over a month","Battery nominal voltage","Solar irradiation"],"answer":0,"explanation":"Peak demand is an instantaneous or short-interval power requirement."},
            {"q":"Why identify motor starting loads?","opts":["Starting current may exceed running current","Motors use no energy","It sets panel tilt","It eliminates surge ratings"],"answer":0,"explanation":"Motor starting can impose a surge that affects inverter selection."},
            {"q":"Which load schedule field is useful?","opts":["Quantity and daily operating hours","Learner password","Website theme","Certificate serial"],"answer":0,"explanation":"A useful schedule records appliance quantity, power, use hours and criticality."}
          ]
        }
      ]
    },
    {
      "title": "Module 2: Site Assessment & Solar Resource",
      "lessons": [
        {
          "title": "Solar Irradiance & Peak Sun Hours",
          "duration": "25 minutes",
          "html": "<p>Solar panels are rated at Standard Test Conditions (STC): 1,000 W/m² irradiance and 25°C cell temperature. However, the sun does not shine at 1,000 W/m² all day. We use <b>Peak Sun Hours (PSH)</b> to calculate daily energy yield.</p>\n<h3>What are Peak Sun Hours?</h3><p>1 PSH = 1 kWh/m² of solar energy received. If a location receives 5 kWh/m²/day, it has 5 Peak Sun Hours. To find your daily energy production: <b>Array Size (kW) × Peak Sun Hours × System Efficiency = Daily kWh</b>.</p>\n<div class=\"diagram\"><svg viewBox=\"0 0 800 200\" role=\"img\" aria-label=\"Peak sun hours vs actual irradiance\"><defs><marker id=\"arr2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8Z\" fill=\"#333\"/></marker></defs><g font-family=\"Arial\" font-size=\"11\"><line x1=\"50\" y1=\"150\" x2=\"750\" y2=\"150\" stroke=\"#333\" stroke-width=\"2\" marker-end=\"url(#arr2)\"/><line x1=\"50\" y1=\"150\" x2=\"50\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\" marker-end=\"url(#arr2)\"/><text x=\"400\" y=\"180\" text-anchor=\"middle\">Time of Day (6am to 6pm)</text><text x=\"20\" y=\"100\" transform=\"rotate(-90 20,100)\" text-anchor=\"middle\">Irradiance (W/m²)</text><path d=\"M50 150 Q200 150 400 50 Q600 150 750 150\" fill=\"none\" stroke=\"#ffb300\" stroke-width=\"3\"/><rect x=\"50\" y=\"50\" width=\"700\" height=\"100\" fill=\"#ffb300\" opacity=\"0.1\"/><line x1=\"50\" y1=\"50\" x2=\"750\" y2=\"50\" stroke=\"#ffb300\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/><text x=\"400\" y=\"40\" text-anchor=\"middle\" fill=\"#d69a25\" font-weight=\"bold\">1,000 W/m² (STC)</text><circle cx=\"400\" cy=\"50\" r=\"5\" fill=\"#e53e3e\"/><text x=\"410\" y=\"45\" fill=\"#e53e3e\">Peak Sun Hour (1,000 W/m²)</text></g></svg><div class=\"diagram-cap\">Figure 2: The area under the curve represents total daily irradiation. Peak Sun Hours are the equivalent number of hours at 1,000 W/m².</div></div>\n<p>If your 5kW array receives 4.5 PSH, the theoretical yield is 22.5 kWh. After accounting for temperature and wiring losses (approx. 15%), the actual yield is ~19.1 kWh.</p>\n<h3>Activity</h3><p>Look up the average Peak Sun Hours for your city in December and June. Why is there a difference?</p>",

            {"q":"What should be used for a site-specific resource estimate?","opts":["A credible location-based solar dataset","A guess from a nearby country","The module nameplate alone","The inverter display colour"],"answer":0,"explanation":"Use reliable location-specific resource data and document its source and period."}

        {
          "title": "Site Survey & Shading Analysis",
          "duration": "25 minutes",
          "html": "<p>A solar array is a 25-year investment. If a tree grows and shades one panel, the entire string can be crippled due to mismatch. A site survey is non-negotiable.</p>\n<h3>What to Check on Site:</h3><ul><li><b>Roof Area:</b> Are there skylights, vents, or chimneys? (Keep a 0.5m fire setback).</li><li><b>Orientation:</b> True North/South. Use a compass (remember magnetic declination).</li><li><b>Tilt:</b> Is the roof pitched? What is the angle in degrees?</li><li><b>Shading:</b> Use a Solar Pathfinder or a phone app (like Sun Surveyor) to track the sun's path across the horizon.</li><li><b>Structural Integrity:</b> Can the roof support the extra 15–20 kg/m² of the array?</li></ul>\n<div class=\"callout\"><b>Mismatch Loss:</b> If one panel in a series string is shaded, its current drops, which acts like a bottleneck for the entire string. Bypass diodes mitigate this, but strategic string design (e.g., using microinverters or optimizers) is required for heavily shaded sites.</div>\n<h3>Activity</h3><p>Walk around your property. Identify the best roof plane for solar. Note any obstructions (trees, buildings) that might cast shadows between 9am and 3pm.</p>",

        {
          "title": "Array Sizing & Module Selection",
          "duration": "25 minutes",
          "html": "<p>To size the solar array, you start with the Daily Energy Requirement (kWh) and the Peak Sun Hours (PSH).</p>\n<h3>The Array Sizing Formula:</h3><p><b>Array Size (kW) = Daily Energy (kWh) / (PSH × System Efficiency)</b></p><p>If your daily energy is 15 kWh, your site gets 4.5 PSH, and the system efficiency is 0.80 (accounting for inverter and wiring losses):</p><p><i>Array Size = 15 / (4.5 × 0.80) = 15 / 3.6 = 4.16 kW</i>.</p><p>You then select commercially available panels. If you use 550W panels: 4160 W / 550 W = 7.56. You must round up to <b>8 panels</b>.</p>\n<div class=\"diagram\"><svg viewBox=\"0 0 800 250\" role=\"img\" aria-label=\"Array sizing calculator\"><g font-family=\"Arial\" font-size=\"14\"><rect x=\"50\" y=\"50\" width=\"200\" height=\"60\" rx=\"8\" fill=\"#e8f5e9\" stroke=\"#388e3c\" stroke-width=\"2\"/><text x=\"150\" y=\"75\" text-anchor=\"middle\" fill=\"#256b2a\" font-weight=\"bold\">Daily Energy</text><text x=\"150\" y=\"95\" text-anchor=\"middle\" fill=\"#256b2a\">15 kWh</text><rect x=\"300\" y=\"50\" width=\"200\" height=\"60\" rx=\"8\" fill=\"#fff4d6\" stroke=\"#d69a25\" stroke-width=\"2\"/><text x=\"400\" y=\"75\" text-anchor=\"middle\" fill=\"#76500b\" font-weight=\"bold\">Peak Sun Hours</text><text x=\"400\" y=\"95\" text-anchor=\"middle\" fill=\"#76500b\">4.5 Hours</text><rect x=\"550\" y=\"50\" width=\"200\" height=\"60\" rx=\"8\" fill=\"#e8efff\" stroke=\"#4777c8\" stroke-width=\"2\"/><text x=\"650\" y=\"75\" text-anchor=\"middle\" fill=\"#244d91\" font-weight=\"bold\">Efficiency</text><text x=\"650\" y=\"95\" text-anchor=\"middle\" fill=\"#244d91\">80% (0.8)</text><g stroke=\"#333\" stroke-width=\"2\" marker-end=\"url(#arr)\"><line x1=\"250\" y1=\"80\" x2=\"290\" y2=\"80\"/><line x1=\"500\" y1=\"80\" x2=\"540\" y2=\"80\"/></g><rect x=\"300\" y=\"160\" width=\"200\" height=\"60\" rx=\"8\" fill=\"#f4eafa\" stroke=\"#9862b5\" stroke-width=\"2\"/><text x=\"400\" y=\"185\" text-anchor=\"middle\" fill=\"#70418b\" font-weight=\"bold\">Array Size Required</text><text x=\"400\" y=\"205\" text-anchor=\"middle\" fill=\"#70418b\">4.16 kW</text><path d=\"M400 110 V150\" stroke=\"#333\" stroke-width=\"2\" marker-end=\"url(#arr)\"/></g></svg><div class=\"diagram-cap\">Figure 3: Calculating the required array size based on energy demand and solar resource.</div></div>\n<h3>Activity</h3><p>If a client needs 20 kWh/day, the site gets 5 PSH, and efficiency is 75%, what is the required array size in kW?</p>",
          "quiz": [

        {
          "title": "Understanding the Module Datasheet",
          "duration": "25 minutes",
          "html": "<p>You cannot design a system based on the nameplate wattage alone. You must read the datasheet.</p>\n<div class=\"compare\"><tr><th>Parameter</th><th>Meaning</th><th>Why it Matters</th></tr><tr><td>Pmax (W)</td><td>Maximum Power at STC</td><td>Used for array sizing</td></tr><tr><td>Voc (V)</td><td>Open Circuit Voltage</td><td>Determines maximum string voltage (cold)</td></tr><tr><td>Vmp (V)</td><td>Voltage at Maximum Power</td><td>Used for MPPT window calculations</td></tr><tr><td>Isc (A)</td><td>Short Circuit Current</td><td>Determines cable and fuse sizing</td></tr><tr><td>Imp (A)</td><td>Current at Maximum Power</td><td>Operating current</td></tr><tr><td>Temp Coeff Voc</td><td>Voltage change per °C</td><td>Critical for cold weather safety</td></tr></table>\n<h3>Temperature Matters</h3><p>As temperature drops, voltage rises. A module with a Voc of 45V at 25°C might hit 50V at -10°C. If you connect too many in series, the cold-weather voltage can exceed the inverter's maximum DC input and destroy it.</p>\n<h3>Activity</h3><p>Look at a real solar panel datasheet online. Find the Temperature Coefficient of Voc (usually written as %/°C or mV/°C). Why is this a negative number?</p>",
          "quiz": [

            {"q":"Why round module count upward?","opts":["Modules are discrete units and capacity must meet the design estimate","To ignore voltage limits","To increase shading","To avoid checking strings"],"answer":0,"explanation":"The selected quantity must meet the calculated capacity and pass electrical checks."}

    {
      "title": "Module 4: String Design & Electrical Limits",
      "lessons": [
        {
          "title": "Series & Parallel Configuration",
          "duration": "25 minutes",
          "html": "<p>Modules are wired in <b>series</b> to increase voltage, and in <b>parallel</b> to increase current.</p>\n<div class=\"diagram\"><svg viewBox=\"0 0 800 300\" role=\"img\" aria-label=\"Solar PV string and array configuration\"><g font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\"><rect x=\"50\" y=\"50\" width=\"70\" height=\"50\" rx=\"4\" fill=\"#1a365d\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><text x=\"85\" y=\"75\" fill=\"#fff\" font-weight=\"bold\">Module</text><text x=\"85\" y=\"90\" fill=\"#cbd5e0\">Voc 45V</text><rect x=\"150\" y=\"50\" width=\"70\" height=\"50\" rx=\"4\" fill=\"#1a365d\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><text x=\"185\" y=\"75\" fill=\"#fff\" font-weight=\"bold\">Module</text><text x=\"185\" y=\"90\" fill=\"#cbd5e0\">Voc 45V</text><rect x=\"250\" y=\"50\" width=\"70\" height=\"50\" rx=\"4\" fill=\"#1a365d\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><text x=\"285\" y=\"75\" fill=\"#fff\" font-weight=\"bold\">Module</text><text x=\"285\" y=\"90\" fill=\"#cbd5e0\">Voc 45V</text><g stroke=\"#e53e3e\" stroke-width=\"2\"><line x1=\"120\" y1=\"75\" x2=\"150\" y2=\"75\"/><line x1=\"220\" y1=\"75\" x2=\"250\" y2=\"75\"/></g><text x=\"185\" y=\"125\" font-size=\"11\" fill=\"#e53e3e\" font-weight=\"bold\">String Voltage = 45 + 45 + 45 = 135V</text><rect x=\"50\" y=\"180\" width=\"70\" height=\"50\" rx=\"4\" fill=\"#1a365d\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><text x=\"85\" y=\"205\" fill=\"#fff\" font-weight=\"bold\">Module</text><text x=\"85\" y=\"220\" fill=\"#cbd5e0\">Voc 45V</text><rect x=\"150\" y=\"180\" width=\"70\" height=\"50\" rx=\"4\" fill=\"#1a365d\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><text x=\"185\" y=\"205\" fill=\"#fff\" font-weight=\"bold\">Module</text><text x=\"185\" y=\"220\" fill=\"#cbd5e0\">Voc 45V</text><rect x=\"250\" y=\"180\" width=\"70\" height=\"50\" rx=\"4\" fill=\"#1a365d\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><text x=\"285\" y=\"205\" fill=\"#fff\" font-weight=\"bold\">Module</text><text x=\"285\" y=\"220\" fill=\"#cbd5e0\">Voc 45V</text><g stroke=\"#e53e3e\" stroke-width=\"2\"><line x1=\"120\" y1=\"205\" x2=\"150\" y2=\"205\"/><line x1=\"220\" y1=\"205\" x2=\"250\" y2=\"205\"/></g><g stroke=\"#3182ce\" stroke-width=\"2\"><line x1=\"85\" y1=\"100\" x2=\"85\" y2=\"180\"/><line x1=\"285\" y1=\"100\" x2=\"285\" y2=\"180\"/></g><text x=\"185\" y=\"255\" font-size=\"11\" fill=\"#3182ce\" font-weight=\"bold\">Parallel Array Current = 2 × Imp</text><rect x=\"400\" y=\"100\" width=\"120\" height=\"80\" rx=\"8\" fill=\"#f4eafa\" stroke=\"#9862b5\" stroke-width=\"2\"/><text x=\"460\" y=\"135\" fill=\"#70418b\" font-weight=\"bold\">Inverter</text><text x=\"460\" y=\"155\" fill=\"#70418b\">MPPT 150V</text><g stroke=\"#777\" stroke-width=\"2\" marker-end=\"url(#arr)\"><path d=\"M320 75 H400 V140\"/><path d=\"M320 205 H400 V140\"/></g></g></svg><div class=\"diagram-cap\">Figure 4: Series wiring adds voltage; parallel branches add current.</div></div>\n<h3>String Sizing Rules</h3><ul><li><b>Maximum String Voltage:</b> The cold-weather Voc of the string must NEVER exceed the inverter's Max DC Input Voltage.</li><li><b>MPPT Window:</b> The hot-weather Vmp of the string must fall within the inverter's MPPT tracking range. If it falls below, the inverter stops producing.</li><li><b>Maximum Current:</b> The parallel Isc of all strings must not exceed the inverter's Max Input Current per MPPT.</li></ul>\n<h3>Activity</h3><p>If an inverter has a Max DC voltage of 500V, and your panels have a cold-weather Voc of 48V, what is the maximum number of panels you can put in a single string? (500 / 48 = 10.4, so max 10 panels).</p>",
          "quiz": [
            {"q":"Series-connected module voltages:","opts":["Add while current is common","Add currents only","Always cancel","Become zero"],"answer":0,"explanation":"In series, voltages add and the string current is limited by the string configuration."},
            {"q":"Parallel strings primarily increase:","opts":["Array current","String voltage","Module temperature coefficient","Battery autonomy"],"answer":0,"explanation":"Parallel branches add current while maintaining branch voltage."},
            {"q":"Cold conditions generally cause module Voc to:","opts":["Increase","Decrease to zero","Remain exactly constant","Become AC"],"answer":0,"explanation":"PV open-circuit voltage generally rises as cell temperature falls."},
            {"q":"Why check inverter MPPT range?","opts":["The operating string voltage must fit its tracking window","It determines roof load","It sets battery chemistry","It replaces fuses"],"answer":0,"explanation":"The array's operating voltage must remain within the inverter's MPPT limits."},
            {"q":"What must never be exceeded?","opts":["Maximum DC input voltage and current ratings","The course duration","The roof's paint colour","The learner count"],"answer":0,"explanation":"Equipment absolute maximum voltage and current limits are safety-critical."}
          ]
        },
        {
          "title": "Temperature-Corrected Voltage Calculations",
          "duration": "25 minutes",
          "html": "<p>Solar panels produce higher voltage on cold, sunny days. You must calculate the extreme cold temperature Voc to ensure you don't fry the inverter.</p>\n<h3>The Formula:</h3><p><b>Voc(cold) = Voc(STC) × [1 + (Temp_Coeff × (T_min - 25))]</b></p>\n<p><i>Example:</i></p><ul><li>Voc(STC) = 45V</li><li>Temp Coeff = -0.30%/°C (or -0.003)</li><li>Record low temp = -5°C</li></ul>\n<p>Voc(cold) = 45 × [1 + (-0.003 × (-5 - 25))]<br>Voc(cold) = 45 × [1 + (-0.003 × -30)]<br>Voc(cold) = 45 × [1 + 0.09]<br>Voc(cold) = 45 × 1.09 = <b>49.05V</b></p>\n<p>If you have 10 panels in series, the string voltage is 490.5V. If your inverter max is 500V, you are safe, but barely.</p>\n<div class=\"callout\"><b>Safety Factor:</b> Always use the record low temperature for your specific location. Do not use the average winter temperature.</div>\n<h3>Activity</h3><p>Calculate the cold Voc for a panel with Voc(STC) = 41.5V, Temp Coeff = -0.29%/°C, at a record low of -10°C.</p>",
          "quiz": [
            {"q":"Cold conditions generally cause module Voc to:","opts":["Increase","Decrease to zero","Remain exactly constant","Become AC"],"answer":0,"explanation":"PV open-circuit voltage generally rises as cell temperature falls."},
            {"q":"Series-connected module voltages:","opts":["Add while current is common","Add currents only","Always cancel","Become zero"],"answer":0,"explanation":"In series, voltages add and the string current is limited by the string configuration."},
            {"q":"What must never be exceeded?","opts":["Maximum DC input voltage and current ratings","The course duration","The roof's paint colour","The learner count"],"answer":0,"explanation":"Equipment absolute maximum voltage and current limits are safety-critical."},
            {"q":"Why check inverter MPPT range?","opts":["The operating string voltage must fit its tracking window","It determines roof load","It sets battery chemistry","It replaces fuses"],"answer":0,"explanation":"The array's operating voltage must remain within the inverter's MPPT limits."},
            {"q":"Parallel strings primarily increase:","opts":["Array current","String voltage","Module temperature coefficient","Battery autonomy"],"answer":0,"explanation":"Parallel branches add current while maintaining branch voltage."}
          ]
        }
      ]
    },
    {
      "title": "Module 5: Battery Storage & Inverters",
      "lessons": [
        {
          "title": "Battery Sizing & Depth of Discharge",
          "duration": "25 minutes",
          "html": "<p>If you are designing an off-grid or hybrid system, the battery bank is the most expensive component. Sizing it correctly is critical.</p>\n<h3>The Battery Sizing Formula:</h3><p><b>Battery Capacity (kWh) = (Daily Energy × Days of Autonomy) / (DoD × Inverter Efficiency)</b></p>\n<ul><li><b>Autonomy:</b> How many days the battery must last without sun.</li><li><b>DoD (Depth of Discharge):</b> How much of the battery you can safely use. Lithium (LiFePO4) can usually handle 80-90%. Lead-Acid should not go below 50%.</li></ul>\n<p><i>Example: 10 kWh/day load, 2 days autonomy, 90% DoD, 95% efficiency.</i><br>Capacity = (10 × 2) / (0.90 × 0.95) = 20 / 0.855 = <b>23.4 kWh</b>.</p>\n<div class=\"diagram\"><svg viewBox=\"0 0 800 200\" role=\"img\" aria-label=\"Battery sizing factors\"><g font-family=\"Arial\" font-size=\"13\"><rect x=\"50\" y=\"50\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#e8f5e9\" stroke=\"#388e3c\" stroke-width=\"2\"/><text x=\"130\" y=\"75\" text-anchor=\"middle\" fill=\"#256b2a\" font-weight=\"bold\">Daily Load</text><text x=\"130\" y=\"95\" text-anchor=\"middle\" fill=\"#256b2a\">10 kWh</text><rect x=\"250\" y=\"50\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#fff4d6\" stroke=\"#d69a25\" stroke-width=\"2\"/><text x=\"330\" y=\"75\" text-anchor=\"middle\" fill=\"#76500b\" font-weight=\"bold\">Days Autonomy</text><text x=\"330\" y=\"95\" text-anchor=\"middle\" fill=\"#76500b\">2 Days</text><rect x=\"450\" y=\"50\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#e8efff\" stroke=\"#4777c8\" stroke-width=\"2\"/><text x=\"530\" y=\"75\" text-anchor=\"middle\" fill=\"#244d91\" font-weight=\"bold\">Depth of Discharge</text><text x=\"530\" y=\"95\" text-anchor=\"middle\" fill=\"#244d91\">90%</text><rect x=\"650\" y=\"50\" width=\"120\" height=\"60\" rx=\"8\" fill=\"#f4eafa\" stroke=\"#9862b5\" stroke-width=\"2\"/><text x=\"710\" y=\"75\" text-anchor=\"middle\" fill=\"#70418b\" font-weight=\"bold\">Capacity</text><text x=\"710\" y=\"95\" text-anchor=\"middle\" fill=\"#70418b\">23.4 kWh</text></g></svg><div class=\"diagram-cap\">Figure 5: Factors influencing battery bank capacity.</div></div>\n<h3>Activity</h3><p>Calculate the required battery capacity for a 5 kWh daily load, 3 days autonomy, 50% DoD (lead-acid), and 90% inverter efficiency.</p>",
          "quiz": [
            {"q":"Battery DoD describes:","opts":["Fraction of nominal capacity discharged","Solar panel efficiency","Inverter surge time","Cable resistance"],"answer":0,"explanation":"Depth of discharge is the proportion of nominal battery capacity used."},
            {"q":"Autonomy means:","opts":["How long storage supports loads without expected charging input","Panel warranty period","Cable route length","Time to complete a quiz"],"answer":0,"explanation":"Autonomy is the required period of supply from stored energy."},
            {"q":"Why account for battery efficiency?","opts":["Not all stored energy is returned to loads","It increases panel voltage","It removes the need for protection","It sets AC frequency"],"answer":0,"explanation":"Charging and discharging incur losses that affect required nominal capacity."},
            {"q":"Which battery data must be checked?","opts":["Permitted current, voltage, temperature and BMS limits","Only the case colour","Only its price","The course title"],"answer":0,"explanation":"Battery manufacturers specify operating and safety limits that must be respected."},
            {"q":"Two identical batteries in parallel generally:","opts":["Increase Ah capacity while nominal voltage stays the same","Double nominal voltage","Remove the BMS","Convert DC to AC"],"answer":0,"explanation":"Parallel connection increases capacity/current capability, subject to manufacturer approval."}
          ]
        },
        {
          "title": "Inverter Selection & Compatibility",
          "duration": "25 minutes",
          "html": "<p>The inverter is the brain of the system. It converts DC to AC and manages the battery charging. It must be sized correctly for both the load and the PV array.</p>\n<h3>Key Inverter Specifications:</h3><ul><li><b>Continuous AC Output (kW):</b> Must exceed your peak simultaneous load.</li><li><b>Surge Rating (kVA):</b> Must handle the startup of motors (usually 2x continuous for 5 seconds).</li><li><b>Max DC Input (V):</b> Must be higher than your coldest string Voc.</li><li><b>MPPT Range (V):</b> Must overlap with your hottest string Vmp.</li><li><b>Max Charge Current (A):</b> Must not exceed the battery's recommended charge rate.</li></ul>\n<div class=\"callout\"><b>Battery Compatibility:</b> If using Lithium batteries, ensure the inverter supports the specific BMS communication protocol (e.g., CAN bus, RS485) for that battery brand. Closed-loop communication is highly recommended for safety and longevity.</div>\n<h3>Activity</h3><p>Find a hybrid inverter datasheet online. List its continuous power, max PV input voltage, and MPPT voltage range.</p>",
          "quiz": [
            {"q":"Inverter continuous rating should be based on:","opts":["Expected simultaneous AC load","Total roof area","Battery colour","Course pass mark"],"answer":0,"explanation":"The continuous rating must support the expected simultaneous load."},
            {"q":"Surge rating matters for:","opts":["Loads with high starting demand","LED colour temperature only","Solar irradiance","Module frame thickness"],"answer":0,"explanation":"Motors and compressors can require short-duration starting power."},
            {"q":"Power factor affects:","opts":["Apparent and real power relationship","Solar panel tilt","Battery autonomy days only","Module serial number"],"answer":0,"explanation":"Power factor influences current and inverter apparent-power requirements."},
            {"q":"A hybrid inverter may coordinate:","opts":["PV, battery and grid inputs/outputs","Only a paper drawing","Only DC fuses","Only roof structure"],"answer":0,"explanation":"Hybrid equipment can manage multiple energy sources and storage, depending on model."},
            {"q":"What confirms inverter compatibility?","opts":["Manufacturer voltage/current and battery interface specifications","Product photo alone","A generic online review","Course brochure"],"answer":0,"explanation":"Compatibility must be checked against documented equipment limits and protocols."}

    {
      "title": "Module 6: Cables, Protection & Integration",

          "html": "<p>Undersized cables cause voltage drop, which wastes energy and can cause overheating. Cable sizing is a balance between current-carrying capacity (ampacity) and voltage drop.</p>\n<h3>Voltage Drop Formula (DC):</h3><p><b>V_drop = (2 × L × I × ρ) / A</b></p><ul><li>L = one-way cable length (m)</li><li>I = current (A)</li><li>ρ = resistivity of copper (~0.0175 Ω·mm²/m)</li><li>A = cross-sectional area (mm²)</li></ul>\n<p>For a 48V DC system, voltage drop should be kept below <b>2%</b>. For AC circuits, keep it below <b>3%</b>.</p>\n<h3>Protection Devices</h3><ul><li><b>DC Isolator:</b> Required between PV array and inverter for safe maintenance.</li><li><b>Fuses/MCBs:</b> Sized to protect the cable (e.g., 1.25x the Isc of the string).</li><li><b>Surge Protection (SPD):</b> Essential for both DC and AC sides to protect against lightning surges.</li><li><b>Earthing:</b> Module frames, inverter chassis, and battery racks must be bonded to earth.</li></ul>\n<h3>Activity</h3><p>Calculate the voltage drop for a 10m run of 6mm² cable carrying 20A in a 48V system. Is it below 2%?</p>",

function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }); }
function esc(s) { return typeof s !== 'string' ? s : s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let currentSessionUser = null;

function getAuth() {
  const raw = localStorage.getItem('logi_user');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

async function currentUser() {
  if (currentSessionUser) return currentSessionUser;
  const user = getAuth();
  if (user) {
    currentSessionUser = {
      id: user.id,
      username: user.email,
      email: user.email,
      fullName: user.fullName || user.email,
      role: 'student'
    };
    return currentSessionUser;
  }
  return null;
}

// Progress tracking helpers (stored in memory/localStorage for instant UI, synced to DB)
const PROGRESS_KEY = 'logi_progress_cache';
function getProgressCache() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch { return {}; }
}
function setProgressCache(cache) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(cache)); }

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  try {
    const res = await fetch(`${API_BASE}/my-progress`, {
      headers: { 'Authorization': `Bearer ${getAuth().token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    const cache = getProgressCache();
    
    // Reset cache for this course before loading fresh data
    Object.keys(cache).forEach(k => {
       if (k.startsWith(COURSE.id)) delete cache[k];
    });

    // Map DB rows into the cache format used by the UI
    if (data.progress) {
      data.progress.forEach(row => {
        const key = `${COURSE.id}_${row.module_id}_${row.lesson_id}`;
        cache[key] = { completed: row.completed, score: row.quiz_score, total: row.quiz_total };
      });
      setProgressCache(cache);
    }
  } catch (e) { console.error('Could not load progress', e); }
}

function isLessonDone(username, mi, li) {
  const cache = getProgressCache();
  return !!cache[`${COURSE.id}_solar_${mi+1}_lesson_${li+1}`]?.completed;
}
function getQuizResult(username, mi) {
  const cache = getProgressCache();
  return cache[`${COURSE.id}_solar_${mi+1}_quiz_1`] || null;
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.completed;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.completed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.completed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

            <div class="progress-bar" style="margin:14px 0 8px;"><span style="width:${pct}%;"></span></div>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px;">
              <p style="margin:0;color:var(--muted);font-size:13px;">Next up: Module ${next.mi+1} · Lesson ${next.li+1}</p>
              <button class="btn" onclick="App.openCourse(${next.mi}, ${next.li})">Continue learning →</button>
            </div>
          </div>
        </main>
      </div>
    `;
    renderNav();
  }

  async function openCourse(mi = 0, li = 0) {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'course';
    state.activeCourseModule = mi;
    state.activeCourseLesson = li;
    state.activeAssessment = false;

    const lesson = COURSE.modules[mi].lessons[li];
    const pct = courseProgressPct(u.username);

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('course')}
        <main class="main-panel">
          <button class="mobile-module-toggle" onclick="App.toggleModuleMenu()">☰ Course outline</button>
          
          <div class="course-layout">
            <div class="module-side">
              <div class="sidehead">
                <h2>${esc(COURSE.title)}</h2>
                <div class="progress-bar"><span style="width:${pct}%;"></span></div>
                <div style="font-size:12px;color:var(--muted);margin-top:6px;">${pct}% complete</div>
              </div>
              <div class="modules">
                ${COURSE.modules.map((m, mIdx) => {
                  const locked = isModuleLocked(u.username, mIdx);
                  const isOpen = mIdx === mi;
                  return `
                    <div class="mod-section ${isOpen ? 'open' : ''}">
                      <button class="mod-header ${locked ? 'locked' : ''}" onclick="App.toggleModuleSection(this, ${mIdx}, ${locked})">
                        <span>${esc(m.title)}</span>
                        <span>${locked ? '🔒' : (isOpen ? '▼' : '▶')}</span>
                      </button>
                      <div class="mod-lessons-list">
                        ${m.lessons.map((l, lIdx) => {
                          const done = isLessonDone(u.username, mIdx, lIdx);
                          const active = mIdx === mi && lIdx === li;
                          return `
                            <button class="lesson-item-btn ${active ? 'active' : ''} ${done ? 'done' : ''}" onclick="App.openCourse(${mIdx}, ${lIdx})">
                              <span>${done ? '✅' : '○'}</span>
                              <span>${esc(l.title)}</span>
                            </button>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="lesson-card card">
              <div class="crumb" style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;font-weight:bold;letter-spacing:0.5px;">Module ${mi+1} · Lesson ${li+1}</div>
              <h1>${esc(lesson.title)}</h1>
              <div style="margin-top:20px;">
                ${lesson.html}
              </div>
              <div class="actions">
                <div>
                  ${mi > 0 || li > 0 ? `<button class="btn-outline" onclick="App.goPrev(${mi}, ${li})">← Previous</button>` : ''}
                </div>
                <div>
                  <button class="btn" onclick="App.startAssessment(${mi}, ${li})">Go to Assessment →</button>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    `;
    renderNav();
  }

  function toggleModuleSection(btn, mIdx, locked) {
    if (locked) return;
    const section = btn.parentElement;
    section.classList.toggle('open');
    const icon = btn.querySelector('span:last-child');
    if (icon) icon.textContent = section.classList.contains('open') ? '▼' : '▶';
  }

  function goPrev(mi, li) {
    if (li > 0) openCourse(mi, li - 1);
    else if (mi > 0) openCourse(mi - 1, COURSE.modules[mi - 1].lessons.length - 1);
  }

  async function startAssessment(mi, li) {
    const u = await currentUser();
    if (!u) return;
    state.activeAssessment = true;

    const lesson = COURSE.modules[mi].lessons[li];
    const quiz = lesson.quiz || [];
    const cache = getProgressCache();
    const key = `${COURSE.id}_solar_${mi+1}_lesson_${li+1}`;
    const existing = cache[key];

    const el = document.querySelector('.lesson-card');
    if (!el) return;

    el.innerHTML = `
      <div class="crumb" style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;font-weight:bold;letter-spacing:0.5px;">Assessment</div>
      <h1>${esc(lesson.title)} Quiz</h1>
      <p style="color:var(--muted);margin-bottom:20px;">Answer all questions to complete this lesson.</p>
      
      <div id="quizContainer">
        ${quiz.map((q, i) => `
          <div class="q" id="q${i}">
            <div style="font-weight:600;font-size:15px;margin-bottom:10px;">${i+1}. ${esc(q.q)}</div>
            <div class="opts">
              ${q.opts.map((opt, j) => `
                <label id="opt${i}_${j}" onclick="App.selectOpt(${i}, ${j})">
                  <input type="radio" name="q${i}" value="${j}" style="margin-right:8px;" onclick="event.stopPropagation(); App.selectOpt(${i}, ${j});">
                  ${esc(opt)}
                </label>
              `).join('')}
            </div>
            <div class="feedback" id="fb${i}"></div>
          </div>
        `).join('')}
      </div>

      <div class="actions">
        <button class="btn-outline" onclick="App.openCourse(${mi}, ${li})">← Back to Lesson</button>
        <button class="btn" id="submitBtn" onclick="App.submitQuiz(${mi}, ${li})">Submit Answers</button>
      </div>
    `;

    if (existing && existing.completed) {
       const fb = document.createElement('div');
       fb.className = 'callout';
       fb.style.background = '#e8f5e9';
       fb.style.borderColor = '#388e3c';
       fb.innerHTML = `<b>Already Completed:</b> You scored ${existing.score}/${existing.total} on this assessment. You can retake it below to improve your score.`;
       el.querySelector('#quizContainer').prepend(fb);
    }
  }

  function selectOpt(qIdx, oIdx) {
    const labels = document.querySelectorAll(`#q${qIdx} .opts label`);
    labels.forEach((l, i) => {
      if (i === oIdx) l.classList.add('selected');
      else l.classList.remove('selected');
    });
    const radio = document.querySelector(`input[name="q${qIdx}"][value="${oIdx}"]`);
    if (radio) radio.checked = true;
  }

  async function submitQuiz(mi, li) {
    const u = await currentUser();
    if (!u) return;

    const lesson = COURSE.modules[mi].lessons[li];
    const quiz = lesson.quiz || [];
    let score = 0;
    let allAnswered = true;

    quiz.forEach((q, i) => {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      const fb = document.getElementById(`fb${i}`);
      
      if (!selected) { allAnswered = false; return; }

      const ans = parseInt(selected.value);
      if (ans === q.answer) {
        score++;
        fb.innerHTML = `<span style="color:var(--success);font-weight:bold;">✓ Correct.</span> ${esc(q.explanation)}`;
      } else {
        fb.innerHTML = `<span style="color:var(--error);font-weight:bold;">✗ Incorrect.</span> The correct answer is <b>${esc(q.opts[q.answer])}</b>. ${esc(q.explanation)}`;
      }
    });

    if (!allAnswered) {
      alert("Please answer all questions before submitting.");
      return;
    }

    const total = quiz.length;
    const pass = (score / total) >= 0.5;

    const cache = getProgressCache();
    const key = `${COURSE.id}_solar_${mi+1}_lesson_${li+1}`;
    cache[key] = { completed: pass, score: score, total: total };
    setProgressCache(cache);

    if (pass) {
      try {
        await fetch(`${API_BASE}/progress`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getAuth().token}`
          },
          body: JSON.stringify({
            courseId: COURSE.id,
            moduleId: `solar_${mi+1}`,
            lessonId: `lesson_${li+1}`,
            completed: true,
            score: score,
            total: total
          })
        });
      } catch(e) { console.error(e); }
    }

    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      submitBtn.textContent = pass ? `Passed! (${score}/${total})` : `Failed (${score}/${total}). Retry?`;
      submitBtn.style.background = pass ? 'var(--success)' : 'var(--error)';
      submitBtn.onclick = () => {
        if (pass) {
          let nextMi = mi, nextLi = li + 1;
          if (nextLi >= COURSE.modules[mi].lessons.length) {
            nextMi++;
            nextLi = 0;
          }
          if (nextMi < COURSE.modules.length) {
            openCourse(nextMi, nextLi);
          } else {
            showDashboard();
          }
        } else {
          startAssessment(mi, li);
        }
      };
      submitBtn.textContent = pass ? `Next Lesson →` : `Retry Quiz`;
    }
  }

  return {
    toggleMobileMenu,
    closeMobileMenu,
    toggleModuleMenu,
    closeModuleMenu,
    navigate,
    showLanding,
    showLogin,
    doLogin,
    showRegister,
    doRegister,
    logout,
    showDashboard,
    openCourse,
    toggleModuleSection,
    goPrev,
    startAssessment,
    selectOpt,
    submitQuiz,
    goHome: showLanding
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.showLanding();
});
</script>

</body>
</html>
