<script>
/* ============================================================
   LOGI LMS — Cloud-Synced with Supabase (UUID Auth)
   ============================================================ */

const SUPABASE_URL = 'https://dnmkflwwanltkdnnycml.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cSrAH2lTK6jfP9BdHPNZng_AJqpsjvt';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentSessionUser = null;

function uid() {
  return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
}
function esc(s) {
  if (typeof s !== 'string') return s;
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function currentUser() {
  if (currentSessionUser) return currentSessionUser;
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && session.user) {
    currentSessionUser = {
      id: session.user.id,
      username: session.user.email, 
      fullName: session.user.user_metadata.full_name || session.user.email
    };
    return currentSessionUser;
  }
  return null;
}

const COURSE = {
  id: 'eng-mgmt-101',
  title: 'Basics of Engineering Management',
  desc: 'A practical, beginner-friendly short course on planning engineering work, managing resources and costs, maintaining quality and safety, leading teams and improving performance.',
  passMark: 50,
  modules: [
    {
      title: "Introduction to Engineering Management",
      lessons: [{
        title: "Understanding Engineering Management",
        duration: "35 minutes",
        html: `<p>Engineering management applies management principles, technical knowledge and structured problem-solving to deliver engineering work.</p>
<div class="callout"><b>Core principle:</b> A technically sound solution can still fail if the work is poorly planned, resources are unavailable, responsibilities are unclear or risks are ignored.</div>
<h3>Course learning outcomes</h3><ul><li>Explain the role and functions of engineering management.</li><li>Plan activities, deliverables, dependencies and milestones.</li><li>Estimate and monitor resource and cost requirements.</li><li>Apply basic quality, safety and risk-management principles.</li></ul>`,
        quiz: [
            { q: "A design is technically correct, but the project misses its deadline because materials and labour were not coordinated. Which gap is most evident?", opts: ["Technical design", "Engineering management", "Product testing", "Scientific research"], answer: 1, explanation: "The failure concerns coordination of resources and work." }
        ]
      }]
    }
  ]
};

/* ---------- Cloud Data Cache ---------- */
let cachedProgress = { lessons: {}, quizzes: {} };
let cachedEnrolments = [];
let cachedCerts = [];

async function loadUserData() {
  const user = await currentUser();
  if (!user) return;

  // Load Enrolments using user_id
  const { data: enrData } = await supabaseClient.from('enrolments').select('course_id').eq('user_id', user.id);
  if (enrData) cachedEnrolments = enrData.map(e => e.course_id);

  // Load Progress using user_id
  const { data: progData } = await supabaseClient.from('progress').select('*').eq('user_id', user.id);
  cachedProgress = { lessons: {}, quizzes: {} };
  if (progData) {
    progData.forEach(p => {
      const key = `${p.course_id}-${p.module_index}-${p.lesson_index}`;
      if (p.passed) cachedProgress.lessons[key] = true;
      if (p.quiz_score !== null) cachedProgress.quizzes[`${p.course_id}-${p.module_index}`] = { score: p.quiz_score, total: p.quiz_total, passed: p.passed };
    });
  }

  // Load Certificates using user_id
  const { data: certData } = await supabaseClient.from('certificates').select('*').eq('user_id', user.id);
  if (certData) {
    cachedCerts = certData.map(c => ({
      id: c.certificate_id,
      courseId: c.course_id,
      courseTitle: COURSE.title,
      studentName: c.student_name,
      date: c.issue_date,
      hash: 'BLOCKCHAIN-HASH-PLACEHOLDER'
    }));
  }
}

function getEnrolments(username) { return cachedEnrolments; }
function getProgress(username) { return cachedProgress; }
function getCerts(username) { return cachedCerts; }

async function enrol(username, courseId) {
  if (cachedEnrolments.includes(courseId)) return;
  const user = await currentUser();
  if (!user) return;
  
  await supabaseClient.from('enrolments').insert({ user_id: user.id, course_id: courseId });
  cachedEnrolments.push(courseId);
}

async function markLessonDone(username, courseId, mi, li) {
  const user = await currentUser();
  if (!user) return;

  const key = `${courseId}-${mi}-${li}`;
  cachedProgress.lessons[key] = true;
  
  await supabaseClient.from('progress').upsert({
    user_id: user.id,
    course_id: courseId,
    module_index: mi,
    lesson_index: li,
    passed: true,
    updated_at: new Date().toISOString()
  }, { onConflict: 'user_id, course_id, module_index, lesson_index' });
}

async function saveQuizResult(username, courseId, mi, score, total, passMark) {
  const user = await currentUser();
  if (!user) return;

  const passed = score / total * 100 >= passMark;
  const key = `${courseId}-${mi}`;
  cachedProgress.quizzes[key] = { score, total, passed };

  await supabaseClient.from('progress').upsert({
    user_id: user.id,
    course_id: courseId,
    module_index: mi,
    lesson_index: -1, // -1 represents the module quiz
    quiz_score: score,
    quiz_total: total,
    passed: passed,
    updated_at: new Date().toISOString()
  }, { onConflict: 'user_id, course_id, module_index, lesson_index' });
}

// Note: Certificate creation is blocked by RLS (security policy). 
// This function is left here as a placeholder, but won't insert unless RLS is changed.

/* ---------- Logic & Calculations ---------- */

function isLessonDone(username, courseId, mi, li) {
  return !!cachedProgress.lessons[`${courseId}-${mi}-${li}`];
}
function getQuizResult(username, courseId, mi) {
  return cachedProgress.quizzes[`${courseId}-${mi}`] || null;
}
function isModuleLocked(username, courseId, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, courseId, mi - 1);
  return !prev || !prev.passed;
}
function courseProgressPct(username, courseId) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, courseId, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username, courseId) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, courseId, mi)?.passed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, courseId, mi, li)) return false;
    }
  }
  return true;
}

/* ============================================================
   APP ROUTER
   ============================================================ */
const App = (() => {
  let state = { screen: 'landing', user: null, activeCourseModule: 0, activeCourseLesson: 0, activeAssessment: false };

  async function renderNav() {

    const u = await currentUser();

      el.innerHTML = `
        <span style="font-size:13px;color:var(--muted);margin-right:8px;">Signed in as <b style="color:var(--pd)">${esc(u.fullName)}</b></span>
        <button class="btn-outline btn-sm" onclick="App.showDashboard()">Dashboard</button>
        <button class="btn-secondary btn-sm" onclick="App.logout()">Log out</button>
      `;
    } else {
      el.innerHTML = `
        <button class="btn-outline btn-sm" onclick="App.showLogin()">Log in</button>
        <button class="btn btn-sm" onclick="App.showRegister()">Register</button>
      `;
    }
  }

  async function showLanding() {
    const u = await currentUser();
    if (u) { showDashboard(); return; }
    const el = document.getElementById('app');
    el.innerHTML = `
      <section style="padding:52px 0;background:linear-gradient(120deg,#fff2f7,#f3f0fa);">
        <div class="inner">
          <h1 style="font-size:clamp(30px,4vw,44px);margin:8px 0;">Basics of <span style="color:var(--pd)">Engineering Management</span></h1>
          <p style="max-width:720px;color:#666;">Develop practical skills in engineering planning, resource and cost control, quality, safety, teamwork and performance improvement.</p>
          <div style="margin-top:26px;">
            <button class="btn" onclick="App.showRegister()" style="margin-right:10px;">Get started — Register free</button>
            <button class="btn-outline" onclick="App.showLogin()">I already have an account</button>
          </div>
        </div>
      </section>
    `;
  }

  function showLogin() {
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h2>Welcome back</h2>
          <div class="field"><label for="loginUser">Email address</label><input id="loginUser" type="email" placeholder="Enter your email"></div>
          <div class="field"><label for="loginPass">Password</label><input id="loginPass" type="password" placeholder="Your password"></div>
          <div class="error-msg" id="loginError"></div>
          <button class="btn" style="width:100%;margin-top:8px;" onclick="App.doLogin()">Log in</button>
          <div class="auth-switch">Don't have an account? <a onclick="App.showRegister()">Register free</a></div>
        </div>
      </div>
    `;
  }

  async function doLogin() {
    const email = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    if (!email || !password) { err.textContent = 'Please enter email and password.'; return; }
    err.textContent = 'Logging in...';
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = error.message; } else { currentSessionUser = null; await loadUserData(); showDashboard(); }
  }

  function showRegister() {
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h2>Create account</h2>
          <div class="field"><label for="regName">Full name</label><input id="regName" placeholder="Jane Smith"></div>
          <div class="field"><label for="regEmail">Email address</label><input id="regEmail" type="email" placeholder="Enter your email"></div>
          <div class="field"><label for="regPass">Password</label><input id="regPass" type="password" placeholder="Min 6 characters"></div>
          <div class="error-msg" id="regError"></div>
          <button class="btn" style="width:100%;margin-top:8px;" onclick="App.doRegister()">Create account</button>
        </div>
      </div>
    `;
  }

  async function doRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value;
    const err = document.getElementById('regError');
    if (!name || !email || !password) { err.textContent = 'All fields are required.'; return; }
    if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
    
    err.textContent = 'Creating account...';
    const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
    
    if (error) { err.textContent = error.message; } 
    else { 
      currentSessionUser = null; 
      await enrol(email, COURSE.id); 
      await loadUserData();
      showDashboard(); 
    }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    currentSessionUser = null;
    cachedProgress = { lessons: {}, quizzes: {} };
    cachedEnrolments = [];
    cachedCerts = [];
    showLanding();
  }

  async function showDashboard() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    
    const username = u.username;
    const pct = courseProgressPct(username, COURSE.id);
    const quizzes = COURSE.modules.map((_, mi) => getQuizResult(username, COURSE.id, mi));
    const passedModules = quizzes.filter(q => q?.passed).length;
    const completed = courseCompleted(username, COURSE.id);
    const cert = getCerts(username).find(c => c.courseId === COURSE.id);

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        <aside class="sidebar">
          <div class="user-badge"><strong>${esc(u.fullName)}</strong><span>@${esc(u.username)}</span></div>
          <button class="nav-link active" onclick="App.showDashboard()">📊 Dashboard</button>
          <button class="nav-link" onclick="App.openCourse(0,0)">📘 Current course</button>
          <button class="nav-link" onclick="App.showCertificate()">🏅 My certificate</button>
          <div class="spacer"></div>
          <button class="nav-link" onclick="App.logout()" style="color:var(--muted);">↪ Log out</button>
        </aside>
        <main class="main-panel">
          <h1>Welcome back, ${esc(u.fullName.split(' ')[0])} 👋</h1>
          <div class="stat-grid">
            <div class="stat-box"><div class="num">${pct}%</div><div class="lbl">Course progress</div></div>
            <div class="stat-box"><div class="num">${passedModules} / ${COURSE.modules.length}</div><div class="lbl">Modules passed</div></div>
            <div class="stat-box"><div class="num">${completed ? '✅' : '—'}</div><div class="lbl">Course complete</div></div>
            <div class="stat-box"><div class="num">${cert ? '🏅' : '—'}</div><div class="lbl">Certificate issued</div></div>
          </div>
          <div class="card">
            <h2>${esc(COURSE.title)}</h2>
            <div class="progress-bar"><span style="width:${pct}%;"></span></div>
            <button class="btn" style="margin-top:16px;" onclick="App.openCourse(0,0)">${pct===0?'Start course':'Continue learning'}</button>
          </div>
        </main>
      </div>
    `;
    renderNav();
  }

  async function openCourse(mi, li) {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.activeCourseModule = mi;
    state.activeCourseLesson = li;
    state.activeAssessment = false;
    renderCourse();
  }

  async function renderCourse() {
    const u = await currentUser();
    if (!u) return;
    const mi = state.activeCourseModule;
    const li = state.activeCourseLesson;
    const mod = COURSE.modules[mi];
    const lesson = mod.lessons[li];
    if (state.activeAssessment) { renderAssessmentScreen(); return; }

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="inner" style="padding:24px 0;">
        <h1>${esc(mod.title)}</h1>
        <div class="course-layout">
          <aside class="module-side">
            <div class="modules">
              ${COURSE.modules.map((m, i) => {
                const locked = isModuleLocked(u.username, COURSE.id, i);
                return `<button class="mod-btn ${i===mi?'active':''} ${locked?'locked':''}" onclick="${locked?`App.alertLocked(${i})`:`App.openCourse(${i},0)`}">${i+1}. ${esc(m.title)} ${locked?'🔒':''}</button>`;
              }).join('')}
            </div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <h1>${esc(lesson.title)}</h1>
              <div>${lesson.html}</div>
              <div class="actions">
                <button class="btn" onclick="App.markCurrentLesson()">Mark Complete</button>
                <button class="btn-secondary" onclick="App.nextLesson()">Next →</button>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  async function renderAssessmentScreen() {
    const u = await currentUser();
    if (!u) return;
    const mi = state.activeCourseModule;
    const mod = COURSE.modules[mi];
    const quiz = mod.lessons[0].quiz || [];
    const result = getQuizResult(u.username, COURSE.id, mi);
    const passed = result?.passed;

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="inner" style="padding:24px 0;">
        <div class="card">
          <h1>${esc(mod.title)} — Assessment</h1>
          ${renderQuizUI(mi, quiz)}
          <div class="actions">
            <button class="btn ${passed?'':'btn-secondary'}" ${passed?'':'disabled'} onclick="App.continueAfterAssessment()">Next Module →</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderQuizUI(mi, quiz) {
    return `
      <div id="quizWrap">
        ${quiz.map((q, qi) => `
          <div class="q" data-qindex="${qi}">
            <b>${qi+1}. ${esc(q.q)}</b>
            ${q.opts.map((opt, oi) => `
              <label onclick="App.selectOption(${qi},${oi})"><input type="radio" name="q${mi}_${qi}" value="${oi}"> ${esc(opt)}</label>
            `).join('')}
          </div>
        `).join('')}
        <button class="btn" style="margin-top:16px;" onclick="App.submitQuiz(${mi})">Submit answers</button>
        <p id="quizResult_${mi}"></p>
      </div>
    `;
  }

  async function submitQuiz(mi) {
    const u = await currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    let score = 0;
    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      if (sel && parseInt(sel.value) === q.answer) score++;
    });
    
    await saveQuizResult(u.username, COURSE.id, mi, score, quiz.length, COURSE.passMark);
    const passed = (score / quiz.length * 100) >= COURSE.passMark;
    
    document.getElementById('quizResult_' + mi).innerHTML = passed ? '<b style="color:green;">Passed!</b>' : '<b style="color:red;">Failed. Try again.</b>';
    
    if (passed && courseCompleted(u.username, COURSE.id)) {
      // Note: RLS blocks this insert. The certificate must be issued by an admin/backend.
    }
  }

  async function markCurrentLesson() {
    const u = await currentUser();
    if (!u) return;
    await markLessonDone(u.username, COURSE.id, state.activeCourseModule, state.activeCourseLesson);
    renderCourse();
  }

  function nextLesson() {
    state.activeAssessment = true;
    renderCourse();
  }

  async function continueAfterAssessment() {
    state.activeCourseModule++;
    state.activeAssessment = false;
    if (state.activeCourseModule >= COURSE.modules.length) {
      showDashboard();
    } else {
      openCourse(state.activeCourseModule, 0);
    }
  }

  function alertLocked() { alert("Pass the previous assessment first."); }
  function selectOption(qi, oi) { document.querySelector(`.q[data-qindex="${qi}"] input[value="${oi}"]`).checked = true; }

  async function showCertificate() {
    const u = await currentUser();
    if (!u) return;
    const cert = getCerts(u.username).find(c => c.courseId === COURSE.id);
    const el = document.getElementById('app');
    
    el.innerHTML = `
      <div class="dash-layout">
        <aside class="sidebar">
           <button class="nav-link" onclick="App.showDashboard()">← Dashboard</button>
        </aside>
        <main class="main-panel">
          <h1>My Certificate</h1>
          ${cert ? `
            <div class="cert-wrapper">
               <div class="cert-main">
                 <h1>${esc(cert.courseTitle)}</h1>
                 <p>Issued to: ${esc(cert.studentName)}</p>
                 <p>Date: ${fmtDate(cert.date)}</p>
               </div>
            </div>
          ` : `<p>Certificate locked. Complete the course and wait for admin approval.</p>`}
        </main>
      </div>
    `;
    renderNav();
  }

  async function goHome() {
    if (await currentUser()) showDashboard();
    else showLanding();
  }

  async function init() {
    await renderNav();
    if (await currentUser()) {
       await loadUserData();
       showDashboard();
    } else {
       showLanding();
    }
  }

  return { init, showLanding, showLogin, showRegister, doLogin, doRegister, logout, showDashboard, openCourse, markCurrentLesson, nextLesson, submitQuiz, selectOption, continueAfterAssessment, alertLocked, showCertificate, goHome };
})();

document.addEventListener('DOMContentLoaded', () => { App.init(); });
</script>
</body>
</html>
