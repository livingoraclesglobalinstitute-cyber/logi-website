       RESPONSIVE BREAKPOINTS (Mobile & Tablet)

  id: 'eng-mgmt-101',
  title: 'Basics of Engineering Management',
  desc: 'A practical, beginner-friendly short course on planning engineering work, managing resources and costs, maintaining quality and safety, leading teams and improving performance.',
  passMark: 50,

    {
      title: "Introduction to Engineering Management",
      lessons: [{
        title: "Understanding Engineering Management",
        duration: "35 minutes",
        html: `<p>Engineering management applies management principles, technical knowledge and structured problem-solving to deliver engineering work. It connects technical decisions with people, materials, equipment, time, cost, quality and safety.</p>
<div class="callout"><b>Core principle:</b> A technically sound solution can still fail if the work is poorly planned, resources are unavailable, responsibilities are unclear or risks are ignored.</div>
<h3>Course learning outcomes</h3><p>By completing this course, you should be able to:</p><ul><li>Explain the role and functions of engineering management.</li><li>Plan activities, deliverables, dependencies and milestones.</li><li>Estimate and monitor resource and cost requirements.</li><li>Apply basic quality, safety and risk-management principles.</li><li>Coordinate engineering teams and stakeholders.</li><li>Use performance measures and root-cause thinking to improve work.</li></ul><h3>Lesson learning outcomes</h3><p>By the end of this lesson, you should be able to explain engineering management, distinguish it from engineering practice, identify its main responsibilities and recognise where it is used.</p>
<h3>1. The management function</h3><ul><li><b>Planning:</b> defining objectives, activities, sequence, time and resources.</li><li><b>Organising:</b> assigning responsibilities and arranging people, equipment and materials.</li><li><b>Leading:</b> guiding teams, communicating expectations and resolving obstacles.</li><li><b>Controlling:</b> comparing actual performance with the plan and taking corrective action.</li></ul>
<h3>2. Engineering and engineering management</h3><table class="compare"><tr><th>Engineering practice</th><th>Engineering management</th></tr><tr><td>Develops, tests and applies technical solutions.</td><td>Coordinates the work needed to deliver those solutions.</td></tr><tr><td>May focus on calculations, design, testing and operation.</td><td>May focus on scope, schedules, budgets, teams, quality and risk.</td></tr><tr><td>Asks: Does the technical solution work?</td><td>Asks: Can it be delivered safely, reliably, on time and within budget?</td></tr></table>
<h3>3. The engineering management system</h3><p>Successful delivery depends on connected constraints. A change in one area can affect others: accelerating a schedule may increase labour costs; reducing material cost may affect quality; using unfamiliar equipment may introduce safety and training needs. Managers should assess the whole system rather than optimise one measure in isolation.</p>
<h3>4. Where it is applied</h3><p>Construction, manufacturing, energy, mining, water and sanitation, transport, maintenance, telecommunications and technology projects all require coordination of technical work and resources.</p>
`,

    {

        title: "Planning Engineering Work and Controlling Project Delivery",
        duration: "45 minutes",
        html: `<p>Engineering planning converts an objective into a coordinated set of activities, deliverables, responsibilities, resources and time targets. Project management then coordinates execution and responds to changes while protecting agreed requirements.</p>
<div class="callout"><b>Planning question:</b> What must be delivered, what work is required, in what order, by whom, with which resources and by when?</div>
<h3>Learning outcomes</h3><p>You should be able to define scope and deliverables, break work into activities, identify dependencies, develop milestones and use progress information to manage a project.</p>
<h3>1. Define scope and deliverables</h3><p><b>Scope</b> describes the work included and excluded. A <b>deliverable</b> is a verifiable output, such as an installed pump, tested control panel, completed inspection report or commissioned production line. Clear acceptance criteria help prevent disagreement about completion.</p>
<h3>2. Break the work into manageable activities</h3><p>A work breakdown structure (WBS) divides a project into smaller components. For a pump installation, work packages might include site preparation, foundation work, procurement, mechanical installation, electrical connection, testing and handover.</p>
<table class="compare"><tr><th>Activity</th><th>Dependency / evidence of completion</th></tr><tr><td>Prepare foundation</td><td>Approved site and foundation inspection</td></tr><tr><td>Install pump</td><td>Foundation ready; equipment delivered</td></tr><tr><td>Connect power</td><td>Installation complete; electrical isolation controls applied</td></tr><tr><td>Test and commission</td><td>Mechanical and electrical checks complete</td></tr></table>
<h3>3. Sequence and schedule activities</h3><p>Some tasks can run in parallel; others depend on earlier work. A schedule assigns start and finish dates, durations and responsible persons. A milestone is a significant checkpoint, such as equipment delivery or successful commissioning. Identify the critical sequence of dependent tasks because delays there can delay the overall completion date.</p>
<h3>4. Coordinate stakeholders and change</h3><p>Stakeholders may include the client, engineers, technicians, suppliers, contractors, regulators, operators and nearby communities. Record decisions, communicate changes and assess their effects on scope, time, cost, quality and risk before approving them.</p>
<h3>5. Monitor and control progress</h3><p>Compare actual progress with planned progress. Use site reports, inspection records, milestone status and issue logs. When a variance appears, identify its cause, agree an action, assign an owner and due date, then check whether the action worked.</p>

    {
      title: "Resource, Cost and Budget Management",
      lessons: [{
        title: "Planning Resources and Controlling Engineering Costs",
        duration: "40 minutes",
        html: `<p>Engineering activities depend on people, materials, equipment, technology, time and money. Resource management identifies, acquires, allocates and controls these inputs. Cost management estimates, budgets, monitors and controls expenditure so work can be completed efficiently without unnecessary waste.</p>
<div class="callout"><b>Management principle:</b> Resources must be available in the right quantity, at the right time, in the right place and at an acceptable cost.</div>
<h3>Learning objectives</h3><ul><li>Identify major categories of engineering resources.</li><li>Explain resource allocation and utilisation.</li><li>Differentiate direct, indirect, fixed and variable costs.</li><li>Prepare and interpret a basic engineering budget.</li><li>Calculate cost variance and explain cost-control methods.</li></ul>
<h3>1. Categories of engineering resources</h3><p><b>Human resources:</b> engineers, technicians, operators, electricians, welders, supervisors and safety personnel. Assign work according to competence, authorisation and experience.</p><p><b>Materials:</b> steel, cement, pipes, cables, bearings, lubricants, valves and consumables. Check specifications, quantities, storage conditions and delivery dates.</p><p><b>Equipment:</b> pumps, compressors, welding machines, generators, lifting equipment, measuring instruments and production machinery. Plan availability, inspection and maintenance.</p><p><b>Financial resources:</b> funds for purchasing, labour, transport, operation and maintenance. <b>Information and technology:</b> drawings, specifications, work orders, software, maintenance records and monitoring data.</p>
<h3>2. Resource planning and allocation</h3><p>Resource planning determines what is needed, how much is needed, when it is needed and how it will be obtained. Allocation assigns resources to particular activities. Check project requirements, availability, skills, equipment capacity, delivery lead times and budget limits.</p><table class="compare"><tr><th>Resource</th><th>Requirement</th><th>Purpose</th></tr><tr><td>Mechanical engineers</td><td>2</td><td>Installation supervision</td></tr><tr><td>Technicians</td><td>4</td><td>Mechanical assembly</td></tr><tr><td>Electricians</td><td>2</td><td>Electrical connections</td></tr><tr><td>Lifting equipment</td><td>1 unit</td><td>Positioning the pump</td></tr><tr><td>Steel pipes</td><td>30 metres</td><td>Pipe connections</td></tr></table><p>Coordinate resource timing with the project schedule. Arranging a crane before the foundation is ready may create avoidable hire charges.</p>
<h3>3. Resource utilisation and productivity</h3><p><b>Equipment utilisation (%) = (Actual operating time ÷ Available operating time) × 100.</b> If a machine operates for 8 hours out of 10 available hours, utilisation is (8 ÷ 10) × 100 = <b>80%</b>. Investigate the remaining time: it may involve breakdowns, setup, waiting for materials or planned maintenance.</p><p><b>Labour productivity = Output ÷ Labour hours.</b> If a team produces 40 components in 20 labour hours, productivity is 2 components per labour hour. Interpret this alongside quality and safety; higher output is not an improvement if defects or unsafe practices increase.</p>
<h3>4. Understanding engineering costs</h3><p><b>Direct costs</b> can be attributed to a particular project or product, such as project materials, project labour and equipment rented specifically for the work. <b>Indirect costs</b> support wider operations, such as general security, administration and shared facility services.</p><p><b>Fixed costs</b> generally remain unchanged within a relevant period and operating range, such as rent or certain lease payments. <b>Variable costs</b> change with activity or output, such as raw materials and production consumables. A cost may be both direct and variable; raw material used in a product is a common example.</p><table class="compare"><tr><th>Classification</th><th>Meaning</th><th>Example</th></tr><tr><td>Direct</td><td>Traceable to a job or product</td><td>Steel for a fabricated frame</td></tr><tr><td>Indirect</td><td>Supports general operations</td><td>Factory security</td></tr><tr><td>Fixed</td><td>Generally stable within a period</td><td>Building rent</td></tr><tr><td>Variable</td><td>Changes with output/activity</td><td>Production materials</td></tr></table>
<h3>5. Cost estimation and budgeting</h3><p>Cost estimation predicts the resources and money needed. Methods include using historical information from comparable work, applying unit rates to quantities, and preparing detailed estimates from labour, materials, equipment and other cost items. A budget is the approved financial plan used to allocate and control funds.</p><table class="compare"><tr><th>Ventilation installation item</th><th>Estimated cost</th></tr><tr><td>Ventilation equipment</td><td>GH¢8,000</td></tr><tr><td>Ducting materials</td><td>GH¢4,000</td></tr><tr><td>Labour</td><td>GH¢2,500</td></tr><tr><td>Electrical installation</td><td>GH¢1,500</td></tr><tr><td>Transportation</td><td>GH¢1,000</td></tr><tr><th>Total</th><th>GH¢17,000</th></tr></table><p>A project budget may include materials, labour, equipment, transport, operating expenses and an evidence-based contingency allowance for uncertainty. Monitor cash requirements and supplier commitments as well as money already paid.</p>
<h3>6. Cost monitoring and control</h3><p><b>Cost variance = Budgeted cost − Actual cost.</b> A positive result means spending is below budget; a negative result means spending is above budget. If the materials budget is GH¢12,000 and actual expenditure is GH¢13,500, variance = 12,000 − 13,500 = <b>−GH¢1,500</b>, meaning the budget is exceeded by GH¢1,500.</p><p>Investigate price increases, wastage, inaccurate estimates, unauthorised purchases or scope changes. Do not simply cut expenditure if doing so would compromise specification, quality or safety.</p><p>For earned-value control, <b>Cost Variance (CV) = Earned Value − Actual Cost</b> and <b>Cost Performance Index (CPI) = Earned Value ÷ Actual Cost</b>. If earned value is GH¢20,000 and actual cost is GH¢25,000, CPI = 0.80. A CPI below 1 indicates cost performance is unfavourable against the value of work completed.</p>
<h3>7. Improving cost efficiency</h3><ul><li>Buy to approved specifications and compare supplier value, not price alone.</li><li>Reduce material waste and unnecessary inventory.</li><li>Schedule labour and equipment to avoid idle time.</li><li>Use preventive maintenance to reduce emergency repairs.</li><li>Monitor energy use, overtime and transport costs.</li><li>Review expenditure regularly and document approvals.</li></ul>`,
        quiz: [
            { q: "A project has a GH¢20,000 budget and has spent GH¢22,500. What is the cost variance using budget minus actual cost?", opts: ["GH¢2,500 favourable", "GH¢42,500", "GH¢2,500 unfavourable", "GH¢20,000 favourable"], answer: 2, explanation: "20,000 − 22,500 = −GH¢2,500, indicating an overrun of GH¢2,500." },
            { q: "A critical spare part has a long supplier lead time. Which action best reduces the risk of a future shortage?", opts: ["Identify the lead time and plan procurement before the part is needed", "Wait until the machine stops", "Order an unapproved substitute", "Remove the part from the maintenance plan"], answer: 0, explanation: "Early procurement planning accounts for lead time and reduces avoidable downtime." },
            { q: "Actual material cost is higher than estimated. What should the manager do before changing the budget?", opts: ["Assume theft occurred", "Ignore the difference", "Reduce inspection requirements", "Review quantities, prices, wastage and any scope changes"], answer: 3, explanation: "A variance investigation should establish the cause using records and evidence." },
            { q: "Which cost is most likely to be a direct project cost?", opts: ["General corporate advertising", "Materials purchased specifically for the project", "Unrelated office decoration", "A different department's training"], answer: 1, explanation: "Project-specific materials are directly attributable to the project." },
            { q: "A cheaper replacement component is proposed, but its rating is below the equipment specification. What is the appropriate decision?", opts: ["Accept it because it saves money", "Use it temporarily without approval", "Do not substitute unless technical and safety requirements are verified and approval is obtained", "Ask the storekeeper to make the final engineering decision"], answer: 2, explanation: "Cost savings cannot justify a component that fails technical or safety requirements." }
        ]
      }]

    {
      title: "Quality, Safety and Risk Management",
      lessons: [{
        title: "Maintaining Quality and Managing Operational Risk",
        duration: "50 minutes",
        html: `<p>Engineering outputs must meet defined requirements while protecting workers, customers, the public and the environment. Quality management checks that products and processes meet requirements. Safety management prevents injury and ill health. Risk management identifies uncertainty and selects controls to reduce its effects.</p><div class="callout"><b>Core principle:</b> Quality, safety and risk controls must be built into planning and execution, not added only after a problem occurs.</div>
<h3>Learning objectives</h3><ul><li>Explain engineering quality and the difference between QA and QC.</li><li>Describe inspection, testing and quality systems.</li><li>Identify common engineering hazards.</li><li>Conduct a basic risk assessment.</li><li>Apply the hierarchy of controls.</li><li>Explain risk registers and improvement cycles.</li></ul>
<h3>1. Understanding engineering quality</h3><p>Quality is the degree to which a product, service or process meets requirements and is fit for its intended purpose. Engineering quality includes performance, reliability, durability, accuracy, conformity, safety and maintainability. A pump may look sound but fail its quality requirements if it cannot deliver the specified flow or pressure.</p><table class="compare"><tr><th>Characteristic</th><th>Meaning</th></tr><tr><td>Reliability</td><td>Performs consistently without failure</td></tr><tr><td>Durability</td><td>Withstands use over time</td></tr><tr><td>Accuracy</td><td>Closeness to a required measurement or value</td></tr><tr><td>Conformity</td><td>Meets specified requirements</td></tr><tr><td>Maintainability</td><td>Can be inspected, repaired or serviced effectively</td></tr></table>
<h3>2. Quality assurance and quality control</h3><p><b>Quality Assurance (QA)</b> is process-oriented and aims to prevent defects through procedures, training, supplier controls, audits and defined responsibilities. <b>Quality Control (QC)</b> checks materials, products or work outputs through inspection, measurement and testing to identify nonconformities.</p><table class="compare"><tr><th>Quality assurance</th><th>Quality control</th></tr><tr><td>Prevents defects through planned processes</td><td>Detects defects through checks and tests</td></tr><tr><td>Focuses on how work is performed</td><td>Focuses on whether outputs meet requirements</td></tr><tr><td>Procedures, training, audits</td><td>Inspection, measurement, testing</td></tr></table>
<h3>3. Inspection, testing and quality systems</h3><p>Dimensional inspection measures length, diameter or thickness. Pressure testing evaluates a system under an approved test procedure. Electrical testing may check continuity and insulation resistance. Material testing evaluates properties such as tensile strength or hardness. Functional testing confirms that equipment performs its intended function.</p><p>A quality management system (QMS) defines policies, processes, responsibilities and records for consistent quality. ISO 9001 is a widely recognised quality management system standard. Organisations use a QMS to manage requirements, records, nonconformities, corrective action and improvement. A nonconformity is a failure to meet a specified requirement; it should be identified, controlled and appropriately resolved.</p>
<h3>4. Understanding engineering hazards</h3><p>A <b>hazard</b> is something with the potential to cause harm. <b>Risk</b> considers the likelihood of harm and the severity of its consequences. Engineering hazards include exposed electrical conductors, rotating machinery, welding sparks and fumes, excessive noise, chemicals, work at height, manual handling and pressurised systems.</p><table class="compare"><tr><th>Hazard</th><th>Possible consequence</th></tr><tr><td>Exposed electrical conductors</td><td>Electric shock or electrocution</td></tr><tr><td>Unguarded moving machinery</td><td>Entanglement or crushing</td></tr><tr><td>Welding sparks and fumes</td><td>Burns, fire or respiratory harm</td></tr><tr><td>Excessive noise</td><td>Hearing damage</td></tr><tr><td>Working at height</td><td>Falls and serious injury</td></tr><tr><td>Heavy manual handling</td><td>Musculoskeletal injury</td></tr></table>
<h3>5. Personal protective equipment</h3><p>Personal protective equipment (PPE) may include helmets, safety boots, gloves, goggles, face shields, hearing protection, respirators and protective clothing. Select PPE for the actual hazard, ensure correct fit and condition, and train workers in its use. PPE is not a substitute for eliminating hazards or applying stronger controls where practicable.</p>
<h3>6. Basic risk assessment</h3><ol><li>Identify hazards in the task or workplace.</li><li>Identify who may be harmed and how.</li><li>Evaluate likelihood and severity using the organisation's approved method.</li><li>Select controls to eliminate or reduce the risk.</li><li>Record, communicate and review the assessment when conditions change.</li></ol><p>A simple illustrative method is <b>Risk Score = Likelihood × Severity</b>, using ratings from 1 to 5. A likelihood of 4 and severity of 5 gives a score of 20. The organisation must define its own rating bands and response requirements; this numerical example is not a universal regulatory scale.</p>
<h3>7. Hierarchy of risk controls</h3><ol><li><b>Elimination:</b> remove the hazard completely.</li><li><b>Substitution:</b> replace it with a safer material or process.</li><li><b>Engineering controls:</b> isolate people from the hazard using guards, barriers, ventilation or interlocks.</li><li><b>Administrative controls:</b> use procedures, training, permits, signs and access restrictions.</li><li><b>PPE:</b> protect the worker with suitable equipment.</li></ol><p>Higher-level controls are generally more reliable because they depend less on individual behaviour.</p>
<h3>8. Risk registers and risk response</h3><p>Engineering risks may be technical, financial, schedule-related, operational, environmental, supply-chain or safety-related. A risk register records the risk, possible effect, likelihood or priority, response, owner and review status.</p><table class="compare"><tr><th>Risk</th><th>Possible effect</th><th>Response / owner</th></tr><tr><td>Late material delivery</td><td>Project delay</td><td>Confirm delivery and identify approved alternatives / Procurement</td></tr><tr><td>Equipment failure</td><td>Production interruption</td><td>Preventive maintenance / Maintenance Engineer</td></tr><tr><td>Price increase</td><td>Budget overrun</td><td>Monitor quotations and commitments / Project Manager</td></tr><tr><td>Electrical fault</td><td>Injury or equipment damage</td><td>Inspection and authorised isolation / Electrical Supervisor</td></tr></table>
<h3>9. Continuous quality and safety improvement</h3><p>The Plan–Do–Check–Act (PDCA) cycle supports improvement. <b>Plan:</b> define the issue and intended change. <b>Do:</b> implement the change. <b>Check:</b> measure results. <b>Act:</b> standardise an effective change or revise the approach. For example, if weld defects increase, review the process, revise the approved procedure where justified, train personnel, inspect results and update the standard method if performance improves.</p>`,
        quiz: [
            { q: "A company introduces a documented welding procedure and trains all welders before production. This is primarily:", opts: ["Quality control", "A final product inspection", "Quality assurance", "A cost variance"], answer: 2, explanation: "A controlled procedure and training are preventive process measures, which are QA." },
            { q: "A worker notices an exposed live electrical conductor. What is the priority?", opts: ["Keep people away and follow the site's electrical isolation and reporting procedure", "Cover it with ordinary tape and continue", "Wait until the next inspection", "Ask an untrained worker to move it"], answer: 0, explanation: "The immediate priority is to prevent exposure and use authorised electrical safety procedures." },
            { q: "Which option follows the hierarchy of controls more effectively than relying only on PPE?", opts: ["Give workers another warning poster", "Tell workers to be more careful", "Issue additional gloves without changing the task", "Eliminate or engineer out the hazard where reasonably practicable"], answer: 3, explanation: "Elimination and engineering controls are higher in the hierarchy than PPE." },
            { q: "A product fails its dimensional inspection. What should happen next?", opts: ["Ship it and wait for a complaint", "Record the non-conformity, assess it and determine corrective action", "Delete the inspection result", "Change the specification without approval"], answer: 1, explanation: "The failure should be documented and assessed against the approved requirements." },
            { q: "Why should a risk register be reviewed after a major equipment change?", opts: ["Risk levels and required controls may have changed", "A risk register is only used at project start", "Equipment changes never affect safety", "It automatically cancels previous incidents"], answer: 0, explanation: "Changes to equipment can introduce new hazards or alter existing risks and controls." }
        ]
      }]

    {
      title: "Engineering Teams, Communication and Leadership",
      lessons: [{
        title: "Leading Engineering Teams and Coordinating Communication",
        duration: "40 minutes",
        html: `<p>Engineering work is delivered by people with different technical skills and responsibilities. Engineering managers coordinate these people, communicate requirements, resolve problems and align activities with project and operational objectives. Technical knowledge must be supported by leadership, teamwork and clear communication.</p><div class="callout"><b>Teamwork principle:</b> People need clear responsibilities, reliable information and a shared understanding of the technical and safety requirements.</div>
<h3>Learning objectives</h3><ul><li>Explain the importance of engineering teamwork.</li><li>Identify common team roles and responsibilities.</li><li>Describe leadership styles and when they may be useful.</li><li>Use effective technical communication.</li><li>Resolve workplace disagreements professionally.</li><li>Apply a structured decision-making process.</li></ul>
<h3>1. Engineering teams and coordination</h3><p>An engineering team brings together people with different expertise to achieve a shared objective. Team members may include project managers, mechanical, electrical, civil or chemical engineers, technicians, operators, safety officers, quality inspectors and procurement personnel. Teamwork combines skills, supports problem-solving, improves coordination and helps reduce errors.</p><p>Engineering activities are often interdependent. For example, electrical installation may depend on mechanical equipment being positioned and inspected first. Managers should identify these dependencies and coordinate handovers.</p>
<h3>2. Roles and responsibilities</h3><table class="compare"><tr><th>Role</th><th>Typical responsibility</th></tr><tr><td>Engineering Manager</td><td>Oversees engineering activities and technical coordination</td></tr><tr><td>Project Manager</td><td>Coordinates scope, schedule, resources and delivery</td></tr><tr><td>Design Engineer</td><td>Develops designs and technical specifications</td></tr><tr><td>Technician</td><td>Supports installation, inspection and maintenance</td></tr><tr><td>Safety Officer</td><td>Monitors safety requirements and risk controls</td></tr><tr><td>Quality Inspector</td><td>Checks compliance with quality requirements</td></tr><tr><td>Procurement Officer</td><td>Coordinates purchasing of materials and services</td></tr></table><p>In small organisations, one person may perform several roles, but accountability and authority should remain clear.</p>
<h3>3. Leadership styles</h3><p><b>Autocratic leadership:</b> the leader makes decisions and gives direction. It may be useful in urgent situations requiring immediate control, but overuse can reduce participation.</p><p><b>Democratic leadership:</b> the leader consults team members and encourages input. This can improve cooperation and use the team's technical knowledge.</p><p><b>Transformational leadership:</b> the leader motivates people through a shared vision, innovation and development.</p><p><b>Situational leadership:</b> the leader adjusts guidance and delegation according to the task, urgency and competence of team members. No single style suits every situation.</p>
<h3>4. Engineering communication</h3><p>Communication exchanges instructions, technical information, decisions and feedback. Verbal communication includes briefings and meetings. Written communication includes reports, emails, work orders and specifications. Visual communication includes drawings, diagrams, process flow diagrams and safety signs. Digital communication includes shared documents, project systems and maintenance databases.</p><p>Important controlled records include technical specifications, drawings, standard operating procedures, inspection reports, maintenance records, risk assessments, permits and project progress reports. Use current approved versions and ensure information reaches the authorised people.</p>
<h3>5. Effective coordination meetings</h3><p>A useful meeting has a clear purpose, agenda, relevant participants, accurate information, recorded decisions, assigned owners and due dates. A weekly project meeting may review progress, materials, equipment readiness, safety issues, budget status, schedule risks and actions. Meeting notes should record what was decided, who is responsible and when the action is due.</p>
<h3>6. Conflict resolution</h3><p>Conflict may arise from competing priorities, unclear responsibilities, limited resources, technical disagreements or deadline pressure. Listen to the people involved, clarify facts and requirements, identify options, agree an action and document the decision. Use mediation or management escalation when necessary. Safety and technical requirements must not be bypassed to settle a disagreement quickly.</p>
<h3>7. Engineering decision-making</h3><ol><li>Define the problem and decision required.</li><li>Gather relevant technical and operational information.</li><li>Develop realistic alternatives.</li><li>Evaluate performance, safety, quality, cost and lifecycle implications.</li><li>Select an option within the appropriate authority.</li><li>Implement, communicate and review the decision.</li></ol><p>When selecting an industrial pump, compare required flow and head, energy consumption, material compatibility, reliability, purchase price, maintenance needs and spare-parts availability. The lowest purchase price may not produce the lowest whole-life cost.</p>
<h3>8. Professional ethics and responsibility</h3><p>Engineering leaders should protect health and safety, communicate technical information honestly, avoid falsifying records, work within their competence, disclose conflicts of interest, protect confidential information and follow applicable laws, standards and procedures. Do not approve work that fails critical safety or technical requirements simply to meet a deadline.</p>`,
        quiz: [
            { q: "Two supervisors give conflicting instructions about isolated equipment. What should the technician do?", opts: ["Follow the most recent instruction automatically", "Restart the equipment to avoid delay", "Pause the work and verify the authorised release through the isolation procedure", "Ask another technician to guess"], answer: 2, explanation: "Safety-critical status must be verified through the authorised isolation process." },
            { q: "Which information is most important in a shift handover for maintenance work?", opts: ["Outstanding tasks, equipment condition, hazards and isolation status", "Personal opinions about colleagues", "Only the names of workers on leave", "Unrelated purchasing plans"], answer: 0, explanation: "A handover must communicate operational status and safety-critical information." },
            { q: "A team member identifies a design concern that may affect safety. What leadership response is best?", opts: ["Dismiss the concern because the schedule is tight", "Tell the worker not to raise it again", "Wait until the project is complete", "Listen, verify the technical issue and use the appropriate review and escalation process"], answer: 3, explanation: "Concerns should be examined and escalated through suitable technical and safety processes." },
            { q: "What is the main benefit of assigning clear responsibility for an action?", opts: ["It removes the need for follow-up", "It establishes ownership and makes follow-up possible", "It guarantees the action is already complete", "It prevents stakeholders from asking questions"], answer: 1, explanation: "Named ownership supports accountability, deadlines and status tracking." },
            { q: "A disagreement arises between procurement and engineering about a substitute component. What is the best way forward?", opts: ["Choose the lowest-priced option immediately", "Allow the disagreement to continue without a decision", "Compare the proposal against technical specifications, risk and approved authority", "Let the supplier approve its own substitution"], answer: 2, explanation: "The decision should be evidence-based and comply with technical requirements and approval controls." }
        ]
      }]

    {
      title: "Performance Monitoring and Continuous Improvement",
      lessons: [{
        title: "Measuring Performance and Improving Engineering Processes",
        duration: "40 minutes",
        html: `<p>Performance monitoring measures whether engineering activities achieve their objectives. Continuous improvement uses evidence to improve processes, systems and working methods. Managers may monitor production output, equipment downtime, energy use, defects, maintenance costs, safety performance and project progress.</p><div class="callout"><b>Improvement principle:</b> Measure performance, investigate gaps, act on verified causes and check whether the action produces a sustained improvement.</div>
<h3>Learning objectives</h3><ul><li>Explain engineering performance monitoring.</li><li>Identify useful key performance indicators.</li><li>Calculate basic production and maintenance measures.</li><li>Interpret project performance information.</li><li>Explain engineering reports and root-cause analysis.</li><li>Apply continuous improvement and lean principles.</li></ul>
<h3>1. Performance monitoring and KPIs</h3><p>Performance monitoring compares actual results with targets or baselines. A Key Performance Indicator (KPI) is a measurable value used to assess progress towards an objective. Define each KPI clearly, including its calculation, data source, reporting frequency and responsible person.</p><table class="compare"><tr><th>Area</th><th>Example KPI</th><th>Purpose</th></tr><tr><td>Production</td><td>Output per shift</td><td>Measures production quantity</td></tr><tr><td>Equipment</td><td>Downtime</td><td>Measures time unavailable</td></tr><tr><td>Maintenance</td><td>MTBF / MTTR</td><td>Measures reliability and repair time</td></tr><tr><td>Quality</td><td>Defect rate</td><td>Measures defective output</td></tr><tr><td>Cost</td><td>Cost variance</td><td>Compares budget and expenditure</td></tr><tr><td>Project</td><td>Schedule variance</td><td>Compares earned and planned progress</td></tr><tr><td>Energy</td><td>Energy per unit</td><td>Tracks energy intensity</td></tr></table>
<h3>2. Production performance</h3><p><b>Production efficiency (%) = (Actual output ÷ Planned output) × 100.</b> If the target is 500 units and actual output is 450, efficiency = (450 ÷ 500) × 100 = <b>90%</b>. Investigate the shortfall: machine failure, material shortages, power interruptions, setup delays or staffing constraints may contribute. This simple target comparison is not the same as Overall Equipment Effectiveness (OEE).</p>
<h3>3. Equipment reliability: MTBF and MTTR</h3><p><b>Mean Time Between Failures (MTBF) = Total operating time ÷ Number of failures.</b> If a machine operates for 200 hours and has 4 failures, MTBF = <b>50 operating hours</b>.</p><p><b>Mean Time To Repair (MTTR) = Total repair time ÷ Number of repairs.</b> If 4 repairs take 12 hours in total, MTTR = <b>3 hours</b>. A higher MTBF generally indicates longer operating periods between failures; a lower MTTR generally indicates faster restoration. Interpret both using consistent failure and operating-time definitions.</p>
<h3>4. Overall Equipment Effectiveness (OEE)</h3><p>OEE combines availability, performance and quality: <b>OEE = Availability × Performance × Quality</b>. Express each factor as a decimal before multiplying.</p><p>Example: planned production time = 8 hours; operating time = 7 hours; actual output = 630 units; expected output during operating time = 700 units; good units = 600.</p><ul><li>Availability = 7 ÷ 8 = 87.5%.</li><li>Performance = 630 ÷ 700 = 90%.</li><li>Quality = 600 ÷ 630 = approximately 95.24%.</li></ul><p>OEE = 0.875 × 0.90 × 0.9524 = approximately <b>75%</b>. The factors help identify losses from downtime, reduced speed and defective output.</p>
<h3>5. Project performance monitoring</h3><p>In earned value management, <b>Schedule Variance (SV) = Earned Value (EV) − Planned Value (PV)</b>. Earned Value is the budgeted value of work completed; Planned Value is the budgeted value of work scheduled. If EV is GH¢35,000 and PV is GH¢40,000, SV = <b>−GH¢5,000</b>. The negative result indicates less work has been completed than planned, measured in budgeted value; it is not a direct number of days delayed.</p>
<h3>6. Engineering reports and records</h3><p>Production reports record output and downtime. Maintenance reports record equipment condition, failures and repairs. Quality reports record inspection results and defects. Safety reports record hazards, incidents and actions. Project reports record completed work, outstanding activities, schedule and cost status. A useful report states the period, planned result, actual result, variance, evidence, causes, corrective action, owner and deadline.</p>
<h3>7. Root-cause analysis: Five Whys</h3><p>The Five Whys technique asks why a problem occurred repeatedly to move beyond symptoms. Example: a drive belt fails; it is excessively worn; it is misaligned; alignment checks are inconsistent; the maintenance procedure does not assign responsibility. A possible action is to revise the procedure, assign ownership and verify alignment. Use measurements and further engineering analysis where the problem is complex; the Five Whys alone does not prove causation.</p>
<h3>8. Continuous improvement: PDCA</h3><p><b>Plan:</b> define the problem, evidence and intended change. <b>Do:</b> implement the change, preferably on a controlled scale where suitable. <b>Check:</b> compare measured results with the baseline. <b>Act:</b> standardise an effective change or revise the plan. For example, test a revised metal-cutting layout, measure material waste and standardise it if the results are consistently better.</p>
<h3>9. Lean engineering and waste reduction</h3><p>Lean focuses on delivering value while reducing waste. Common waste includes overproduction, waiting, unnecessary transportation, excess inventory, unnecessary motion, overprocessing, defects and underused employee skills. Improvements may include better workflow, material handling, production planning, maintenance and employee involvement.</p><p>Performance data should lead to action. Confirm data quality, investigate causes, assess operational impact, assign corrective actions and monitor results. Digital tools such as spreadsheets, Computerised Maintenance Management Systems (CMMS), Enterprise Resource Planning (ERP) systems, project software, sensors and dashboards can support this work when their data is accurate and controlled.</p>`,
        quiz: [
            { q: "A factory reports 18 defective units out of 600 inspected. What is the defect rate?", opts: ["3%", "18%", "6%", "30%"], answer: 0, explanation: "18 ÷ 600 × 100 = 3%." },
            { q: "A KPI shows that equipment availability has fallen. What does this result tell the manager?", opts: ["It proves the operator is responsible", "It means production targets should be deleted", "It identifies a performance gap that requires investigation", "It automatically identifies the root cause"], answer: 2, explanation: "A KPI indicates a gap; further evidence is needed to establish the cause." },
            { q: "A team repeatedly restarts an overheating machine without investigating why it overheats. This response mainly addresses:", opts: ["The root cause", "The underlying design", "The maintenance system", "The immediate symptom"], answer: 3, explanation: "Restarting may temporarily restore operation but does not establish or remove the cause." },
            { q: "After a process change, defect rates fall and remain lower over several review periods. What should the team do?", opts: ["Stop measuring performance permanently", "Document the effective method, update procedures and train relevant staff", "Remove all inspection records", "Assume the result will continue without controls"], answer: 1, explanation: "Successful changes should be standardised and monitored to sustain the improvement." },
            { q: "Which feature makes a KPI useful?", opts: ["It has a clear definition, data source, calculation and reporting frequency", "It changes meaning every month", "It cannot be measured", "It is selected only because the number looks impressive"], answer: 0, explanation: "A consistent definition and reliable data make comparison and action possible." }
        ]
      }]
    }
  ]
};

function uid() { return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }); }
function nowISO() { return new Date().toISOString(); }
function esc(s) { return typeof s !== 'string' ? s : s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let currentSessionUser = null;

function syncLocalUser(authUser) {
  if (!authUser) { currentSessionUser = null; return null; }
  const email = (authUser.email || '').toLowerCase();
  currentSessionUser = {
    id: authUser.id,
    username: email,
    email,
    fullName: authUser.user_metadata?.full_name || email,
    role: 'student'
  };
  return currentSessionUser;
}

async function currentUser() {
  if (currentSessionUser) return currentSessionUser;
  const { data, error } = await supabaseClient.auth.getSession();
  if (error) return null;
  return data.session?.user ? syncLocalUser(data.session.user) : null;
}

let studentDataLoadedFor = null;
let studentDataSyncWarning = '';

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  if (!force && studentDataLoadedFor === user.id) return;

  const email = (user.email || user.username || '').toLowerCase();
  const localProgress = getProgress(email);

  const [progressResult, enrolmentResult] = await Promise.all([
    supabaseClient.from('progress').select('module_index,lesson_index,quiz_score,quiz_total,passed,completed').eq('user_id', user.id).eq('course_id', COURSE.id),
    supabaseClient.from('enrolments').select('course_id').eq('user_id', user.id)
  ]);

  if (!progressResult.error && Array.isArray(progressResult.data)) {
    const merged = getProgress(email);
    progressResult.data.forEach(row => {
      const key = row.module_index + '-' + row.lesson_index;
      if (row.completed) merged.lessons[key] = true;
      if (row.quiz_score !== null && row.quiz_score !== undefined) {
        merged.quizzes[row.module_index] = { score: row.quiz_score, total: row.quiz_total, passed: !!row.passed };
      }
    });
    saveProgress(email, merged);
  }

  studentDataLoadedFor = user.id;
}

async function saveProgressToSupabase(username, moduleIndex, lessonIndex) {
  const user = currentSessionUser;
  if (!user?.id) return;
  const p = getProgress(username);
  const quiz = p.quizzes[moduleIndex];
  const row = {
    user_id: user.id, course_id: COURSE.id, module_index: moduleIndex, lesson_index: lessonIndex,
    completed: !!p.lessons[moduleIndex + '-' + lessonIndex],
    quiz_score: quiz ? quiz.score : null, quiz_total: quiz ? quiz.total : null, passed: quiz ? !!quiz.passed : false
  };
  await supabaseClient.from('progress').upsert(row, { onConflict: 'user_id,course_id,module_index,lesson_index' });
}

function getProgress(username) {
  const all = load(STORE.progress, {});
  if (!all[username] || typeof all[username] !== 'object') all[username] = {};
  return all[username][COURSE.id] || { lessons: {}, quizzes: {} };
}
function saveProgress(username, p) {
  const all = load(STORE.progress, {});
  if (!all[username] || typeof all[username] !== 'object') all[username] = {};
  all[username][COURSE.id] = p;
  save(STORE.progress, all);
}
function getEnrolments(username) { return load(STORE.enrolments, {})[username] || []; }
function enrol(username, courseId) {
  const e = load(STORE.enrolments, {});
  if (!e[username]) e[username] = [];
  if (!e[username].includes(courseId)) e[username].push(courseId);
  save(STORE.enrolments, e);
}
function getCerts(username) { return load(STORE.certificates, {})[username] || []; }
function addCert(username, cert) {
  const c = load(STORE.certificates, {});
  if (!c[username]) c[username] = [];
  c[username].push(cert);
  save(STORE.certificates, c);
}

function isLessonDone(username, mi, li) { return !!getProgress(username).lessons[mi + '-' + li]; }
function markLessonDone(username, mi, li) {
  const p = getProgress(username);
  p.lessons[mi + '-' + li] = true;
  saveProgress(username, p);
  saveProgressToSupabase(username, mi, li);
}
function getQuizResult(username, mi) { return getProgress(username).quizzes[mi] || null; }
function saveQuizResult(username, mi, score, total) {
  const p = getProgress(username);
  p.quizzes[mi] = { score, total, passed: score / total * 100 >= COURSE.passMark };
  saveProgress(username, p);
  saveProgressToSupabase(username, mi, 0);
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.passed;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.passed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.passed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

function generateCertificate(username) {
  if (!username) return null;
  const certs = getCerts(username);
  let cert = certs.find(c => c.courseId === COURSE.id);
  if (cert) return cert;
  
  const hash = Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('');
  let studentName = currentSessionUser?.fullName || username;

  cert = {
    id: 'LOGI-' + COURSE.id.toUpperCase() + '-' + Date.now().toString(36).toUpperCase(),
    hash: hash,
    courseId: COURSE.id,
    courseTitle: COURSE.title,
    studentName: studentName,
    date: nowISO(),
    issuedBy: 'Living Oracles Global Institute'
  };
  addCert(username, cert);
  return cert;
}

    const mod = COURSE.modules[mi];
    if (!mod) { showDashboard(); return; }
    
    if (isModuleLocked(username, mi)) {
      alert('This module is locked. Pass the previous module assessment to unlock it.');
      openCourse(Math.max(0, mi-1), 0);
      return;
    }
    const lesson = mod.lessons[li];
    if (state.activeAssessment) { renderAssessmentScreen(); return; }

    const pct = courseProgressPct(username);
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="inner" style="padding:16px 0 48px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <button class="mobile-module-toggle" onclick="App.toggleModuleMenu()">
            📚 Course Content (${pct}%)
          </button>
        </div>
        <div class="course-layout">
          <aside class="module-side">
            <div class="sidehead" style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <h2>Course content</h2>
                <div style="font-size:12px;color:var(--muted);">${pct}% completed</div>
                <div class="progress-bar"><span style="width:${pct}%;"></span></div>
              </div>
              <button onclick="App.closeModuleMenu()" class="mobile-module-toggle" style="display:none;padding:2px 8px;font-size:14px;border:0;" id="closeModBtn">✕</button>
            </div>
            <div class="modules">
              ${COURSE.modules.map((m, i) => {
                const locked = isModuleLocked(username, i);
                const isOpen = (i === mi);
                const modPassed = getQuizResult(username, i)?.passed;
                return `
                  <div class="mod-section ${isOpen ? 'open' : ''}">
                    <button class="mod-header ${locked ? 'locked' : ''}"
                      onclick="${locked ? `App.alertLocked(${i})` : `App.toggleAccordion(${i})`}">
                      <span>Module ${i+1}: ${esc(m.title)}</span>
                      <span>${locked ? '🔒' : (isOpen ? '▲' : '▼')}</span>
                    </button>
                    <div class="mod-lessons-list">
                      ${m.lessons.map((l, j) => {
                        const done = isLessonDone(username, i, j);
                        const isCurrent = (i === mi && j === li && !state.activeAssessment);
                        return `
                          <button class="lesson-item-btn ${isCurrent ? 'active' : ''} ${done ? 'done' : ''}"
                            onclick="App.openCourse(${i}, ${j})">
                            <span>${done ? '✓' : '📖'}</span>
                            <span style="flex:1;">${esc(l.title)}</span>
                          </button>
                        `;
                      }).join('')}
                      <button class="lesson-item-btn ${i === mi && state.activeAssessment ? 'active' : ''}"
                        onclick="${locked ? `App.alertLocked(${i})` : `App.openAssessment(${i})`}">
                        <span>${modPassed ? '✅' : '📝'}</span>
                        <span style="flex:1;">Module ${i+1} Assessment</span>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <div style="font-size:12px;color:var(--muted);text-transform:uppercase;">Module ${mi+1} · ${esc(lesson.duration)}</div>
              <h1 style="font-size:24px;line-height:1.2;margin:6px 0 18px;">${esc(lesson.title)}</h1>
              <div>${lesson.html}</div>
              <div class="actions">
                <button class="btn-secondary" onclick="App.prevLesson()">← Previous</button>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn" onclick="App.markCurrentLesson()">${isLessonDone(username, mi, li) ? 'Completed ✓' : 'Mark complete'}</button>
                  <button class="btn-secondary" onclick="App.nextLesson()">Next →</button>
                </div>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  function toggleAccordion(i) {
    if (state.activeCourseModule === i && !state.activeAssessment) {
      const modSections = document.querySelectorAll('.mod-section');
      if (modSections[i]) {
        modSections[i].classList.toggle('open');
      }
      return;
    }
    state.activeCourseModule = i;
    state.activeCourseLesson = 0;
    state.activeAssessment = false;
    renderCourse();
  }

  function openAssessment(i) {
    state.activeCourseModule = i;
    state.activeAssessment = true;
    closeModuleMenu();
    renderAssessmentScreen();
  }

  async function renderAssessmentScreen() {
    const u = await currentUser();
    if (!u) return;
    const mi = state.activeCourseModule;
    const mod = COURSE.modules[mi];
    const quiz = mod.lessons[0].quiz || [];
    const username = u.username;
    const result = getQuizResult(username, mi);
    const passed = !!result?.passed;
    const pct = courseProgressPct(username);

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="inner" style="padding:16px 0 48px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <button class="mobile-module-toggle" onclick="App.toggleModuleMenu()">
            📚 Course Content (${pct}%)
          </button>
        </div>
        <div class="course-layout">
          <aside class="module-side">
            <div class="sidehead" style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <h2>Course content</h2>
                <div class="progress-bar"><span style="width:${pct}%;"></span></div>
              </div>
              <button onclick="App.closeModuleMenu()" style="background:none;border:0;font-size:18px;cursor:pointer;">✕</button>
            </div>
            <div class="modules">
              ${COURSE.modules.map((m,i)=>{
                const locked=isModuleLocked(username,i);
                const isOpen = (i === mi);
                return `
                  <div class="mod-section ${isOpen ? 'open' : ''}">
                    <button class="mod-header ${locked?'locked':''}" onclick="${locked?`App.alertLocked(${i})`:`App.toggleAccordion(${i})`}">
                      <span>Module ${i+1}: ${esc(m.title)}</span>
                      <span>${locked ? '🔒' : (isOpen ? '▲' : '▼')}</span>
                    </button>
                    <div class="mod-lessons-list">
                      ${m.lessons.map((l,j)=>`
                        <button class="lesson-item-btn" onclick="App.openCourse(${i},${j})">
                          <span>📖</span><span style="flex:1;">${esc(l.title)}</span>
                        </button>
                      `).join('')}
                      <button class="lesson-item-btn active" onclick="App.openAssessment(${i})">
                        <span>📝</span><span style="flex:1;">Module ${i+1} Assessment</span>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <h2>Module ${mi+1} Assessment</h2>
              ${renderQuizUI(mi, quiz)}
              <div class="actions">
                <button class="btn-secondary" onclick="App.previousFromAssessment()">← Back to lesson</button>
                <button class="btn ${passed?'':'btn-secondary'}" ${passed?'':'disabled style="opacity:.5;"'} onclick="App.continueAfterAssessment()">Next Module →</button>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  function renderQuizUI(mi, quiz) {
    const u = state.user;
    const result = getQuizResult(u.username, mi);
    return `
      <div style="margin-top:16px;">
        ${result ? `<div class="callout">Previous attempt score: ${result.score}/${result.total}</div>` : ''}
        ${quiz.map((q, qi) => `
          <div class="q" data-qindex="${qi}">
            <b>${qi+1}. ${esc(q.q)}</b>
            ${q.opts.map((opt, oi) => `
              <label data-opt="${oi}" onclick="App.selectOption(${qi},${oi})">
                <input type="radio" name="q${mi}_${qi}" value="${oi}"> ${esc(opt)}
              </label>
            `).join('')}
            <div class="feedback" id="fb_${mi}_${qi}"></div>
          </div>
        `).join('')}
        <button class="btn" style="margin-top:14px;" onclick="App.submitQuiz(${mi})">Submit Answers</button>
        <p id="quizResult_${mi}" style="font-weight:700;margin-top:8px;"></p>
      </div>
    `;
  }

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
    if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`);
    if (lbl) {
      lbl.classList.add('selected');
      const radio = lbl.querySelector('input');
      if (radio) radio.checked = true;
    }
  }

  async function submitQuiz(mi) {
    const u = await currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    let score = 0;
    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (sel && parseInt(sel.value) === q.answer) {
        score++;
        if(fb) { fb.textContent = 'Correct!'; fb.style.color = 'var(--success)'; }
      } else if (fb) {
        fb.textContent = 'Incorrect.'; fb.style.color = 'var(--error)';
      }
    });
    saveQuizResult(u.username, mi, score, quiz.length);
    const passed = (score / quiz.length * 100) >= COURSE.passMark;
    if (passed) {
      markLessonDone(u.username, mi, 0);
      if (courseCompleted(u.username)) generateCertificate(u.username);
    }
    document.getElementById('quizResult_' + mi).textContent = `Scored ${score}/${quiz.length}. ${passed ? 'Passed!' : 'Try again.'}`;
  }

  function alertLocked(i) { alert('Module ' + (i+1) + ' is locked until you pass the previous assessment.'); }
  function previousFromAssessment() { state.activeAssessment = false; renderCourse(); }
  function continueAfterAssessment() {
    const mi = state.activeCourseModule;
    if (mi + 1 < COURSE.modules.length) {
      openCourse(mi + 1, 0);
    } else {
      showDashboard();
    }
  }

  async function markCurrentLesson() {
    const u = await currentUser();
    if (!u) return;
    markLessonDone(u.username, state.activeCourseModule, state.activeCourseLesson);
    renderCourse();
  }

  async function prevLesson() {
    let mi = state.activeCourseModule, li = state.activeCourseLesson - 1;
    if (li < 0) { mi--; li = 0; }
    if (mi >= 0) openCourse(mi, li);
  }

  async function nextLesson() {
    const mi = state.activeCourseModule, li = state.activeCourseLesson + 1;
    if (li < COURSE.modules[mi].lessons.length) openCourse(mi, li);
    else { state.activeAssessment = true; renderCourse(); }
  }

  async function showCertificate() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'certificate';
    const completed = courseCompleted(u.username);
    let cert = getCerts(u.username).find(c => c.courseId === COURSE.id);
    if (completed && !cert) cert = generateCertificate(u.username);

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('certificate')}
        <main class="main-panel" style="background: #fbfafc;">
          <h1>My certificate</h1>
          <p class="subtitle">Your certificate becomes available once you complete all lessons and pass all module assessments.</p>

          ${cert ? `
            <div class="cert-controls">
              <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
              <button class="btn" onclick="App.downloadCertificateImage()">📥 Download as PNG</button>
            </div>
            <div class="cert-display-area">
              <div class="cert-scaler" id="certScaler">
                <div class="cert-wrapper" id="printableCert">
                  <img class="cert-watermark" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png" alt="Watermark" crossorigin="anonymous">
                  <div class="cert-main">
                    <div class="cert-header">
                      <img class="cert-header-logo" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png" alt="LOGI Logo" crossorigin="anonymous" onerror="this.style.display='none'">
                      <div class="cert-logo-sub">Living Oracles<br>Global Institute</div>
                    </div>
                    <div class="cert-date">${fmtDate(cert.date)}</div>
                    <div class="cert-name">${esc(cert.studentName)}</div>
                    <div class="cert-completion">has successfully completed</div>
                    <div class="cert-course-title">${esc(cert.courseTitle)}</div>
                    <div class="cert-description">
                      This course has been developed and delivered by Living Oracles Global Institute, covering the foundational principles of engineering management, planning, and resource control.
                    </div>
                    <div class="cert-signature-area">
                      <img class="cert-signature-img" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/president-signature.svg" alt="Prophet Ing Stephen Adusei Signature" crossorigin="anonymous">
                      <div class="cert-signer-name">Prophet Ing Stephen Adusei</div>
                      <div class="cert-signer-title">Program Director | Living Oracles Global Institute</div>
                    </div>
                    <div class="cert-footer-info">
                      <div class="cert-footer-box">
                        <div class="cert-footer-logo">LOGI</div>
                        <div>Living Oracles Global Institute is committed to delivering excellence in education and professional development.</div>
                      </div>
                      <div class="cert-footer-box" style="border-left: 1px solid #ccc; padding-left: 15px;">
                        <div>This is a digitally generated certificate. Authenticity can be verified by scanning the QR code.</div>
                      </div>
                    </div>
                  </div>
                  <div class="cert-sidebar">
                    <div class="cert-partner-box">LOGI</div>
                    <div class="cert-sidebar-pattern"></div>
                    <div class="cert-verify-area">
                      <div class="cert-verify-text">Scan to verify<br>this certificate</div>
                      <img class="cert-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(cert.id)}" alt="QR Code" crossorigin="anonymous">
                      <div class="cert-blockchain">Blockchain ID:<br>${esc(cert.hash)}</div>
                    </div>
                    <div class="cert-bottom-block"></div>
                  </div>
                </div>
              </div>
            </div>
          ` : `
            <div class="card" style="text-align:center;padding:40px 20px; background:white;">
              <div style="font-size:48px;margin-bottom:12px;">🔒</div>
              <h2>Certificate not yet available</h2>
              <p>You need to complete all lessons and pass every module assessment to unlock your certificate.</p>
              <button class="btn" onclick="App.openCourse(0,0)">Continue learning</button>
            </div>
          `}
        </main>
      </div>
    `;
    renderNav();
    if (cert) {
      scaleCertificate();
      window.addEventListener('resize', scaleCertificate);
    }
  }

  function scaleCertificate() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const container = scaler.parentElement;
    const containerWidth = container.clientWidth;
    const certWidth = 1000;
    if (containerWidth < certWidth) {
      const scale = containerWidth / certWidth;
      scaler.style.transform = `scale(${scale})`;
      scaler.style.marginBottom = `-${(707 * (1 - scale))}px`;
    } else {
      scaler.style.transform = 'none';
      scaler.style.marginBottom = '0';
    }
  }

  function downloadCertificateImage() {
    const cert = document.getElementById('printableCert');
    const scaler = document.getElementById('certScaler');
    if (!cert || !scaler) return;
    const btn = document.querySelector('button[onclick="App.downloadCertificateImage()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ Generating...';
    btn.disabled = true;
    const originalTransform = scaler.style.transform;
    const originalMargin = scaler.style.marginBottom;
    scaler.style.transform = 'none';
    scaler.style.marginBottom = '0';
    html2canvas(cert, {
      scale: 2, useCORS: true, backgroundColor: '#fafafa',
      width: 1000, height: 707, windowWidth: 1000, windowHeight: 707,
      onclone: (clonedDoc) => {
        const desc = clonedDoc.querySelector('.cert-description');
        if (desc) { desc.style.wordSpacing = 'normal'; desc.style.letterSpacing = 'normal'; }
      }
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate_Engineering_Management.png';
      link.href = imgData;
      link.click();
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error('Error generating image:', err);
      alert('Failed to generate image. Please ensure you are connected to the internet so the external signature and QR code can load.');
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }

  async function showDiscussion() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'discussion';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('discussion')}
        <main class="main-panel">
          <h1>Discussion Forum</h1>
          <p class="subtitle">Ask questions and share ideas.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  async function showAnnouncements() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'announcements';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('announcements')}
        <main class="main-panel">
          <h1>Announcements</h1>
          <p class="subtitle">Important updates from your instructor.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  function goHome() {
    closeMobileMenu();
    if (currentSessionUser) showDashboard();
    else showLanding();
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (data?.session?.user) {
      syncLocalUser(data.session.user);
      await loadStudentData(currentSessionUser, true);
      await showDashboard();
    } else {
      showLanding();
    }
  }

  return {
    init, showLanding, showLogin, showRegister, doLogin, doRegister, logout,
    showDashboard, showCatalogue, showCertificate, showDiscussion, showAnnouncements,
    openCourse, prevLesson, nextLesson, markCurrentLesson, submitQuiz, selectOption,
    alertLocked, previousFromAssessment, continueAfterAssessment, goHome,
    toggleAccordion, openAssessment, toggleMobileMenu, closeMobileMenu,
    toggleModuleMenu, closeModuleMenu, navigate
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
</body>
</html>
