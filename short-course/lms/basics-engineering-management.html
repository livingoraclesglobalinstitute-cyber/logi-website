<script>
/* ============================================================

const API_BASE = 'https://logi-lms-api.livingoraclesglobalinstitute.workers.dev';

const COURSE = {
  id: 'eng-mgmt-101',
  title: 'Basics of Engineering Management',
  desc: 'A practical, beginner-friendly short course on planning engineering work, managing resources and costs, maintaining quality and safety, leading teams and improving performance.',
  passMark: 50,
  modules: [
    {
      title: "Introduction to Engineering Management",
      lessons: [{
        title: "Understanding Engineering Management",
        duration: "35 minutes",
        html: `
<p>Engineering management applies management principles, technical knowledge and structured problem-solving to deliver engineering work. It connects technical decisions with people, materials, equipment, time, cost, quality and safety.</p>
<div class="callout"><b>Core principle:</b> A technically sound solution can still fail if the work is poorly planned, resources are unavailable, responsibilities are unclear or risks are ignored.</div>
<h3>Course learning outcomes</h3><p>By completing this course, you should be able to:</p><ul><li>Explain the role and functions of engineering management.</li><li>Plan activities, deliverables, dependencies and milestones.</li><li>Estimate and monitor resource and cost requirements.</li><li>Apply basic quality, safety and risk-management principles.</li><li>Coordinate engineering teams and stakeholders.</li><li>Use performance measures and root-cause thinking to improve work.</li></ul><h3>Lesson learning outcomes</h3><p>By the end of this lesson, you should be able to explain engineering management, distinguish it from engineering practice, identify its main responsibilities and recognise where it is used.</p>
<h3>1. The management function</h3><ul><li><b>Planning:</b> defining objectives, activities, sequence, time and resources.</li><li><b>Organising:</b> assigning responsibilities and arranging people, equipment and materials.</li><li><b>Leading:</b> guiding teams, communicating expectations and resolving obstacles.</li><li><b>Controlling:</b> comparing actual performance with the plan and taking corrective action.</li></ul>
<h3>2. Engineering and engineering management</h3><table class="compare"><tr><th>Engineering practice</th><th>Engineering management</th></tr><tr><td>Develops, tests and applies technical solutions.</td><td>Coordinates the work needed to deliver those solutions.</td></tr><tr><td>May focus on calculations, design, testing and operation.</td><td>May focus on scope, schedules, budgets, teams, quality and risk.</td></tr><tr><td>Asks: Does the technical solution work?</td><td>Asks: Can it be delivered safely, reliably, on time and within budget?</td></tr></table>
<h3>3. The engineering management system</h3><p>Successful delivery depends on connected constraints. A change in one area can affect others: accelerating a schedule may increase labour costs; reducing material cost may affect quality; using unfamiliar equipment may introduce safety and training needs. Managers should assess the whole system rather than optimise one measure in isolation.</p>
<h3>4. Where it is applied</h3><p>Construction, manufacturing, energy, mining, water and sanitation, transport, maintenance, telecommunications and technology projects all require coordination of technical work and resources.</p>
`,
        quiz: [
            { q: "A design is technically correct, but the project misses its deadline because materials and labour were not coordinated. Which gap is most evident?", opts: ["Technical design", "Engineering management", "Product testing", "Scientific research"], answer: 1, explanation: "The failure concerns coordination of resources and work, a central engineering management responsibility." },
            { q: "A manager proposes reducing inspection time to recover a delayed schedule. What should be checked first?", opts: ["Whether quality and safety requirements would be compromised", "Whether the report can be shortened", "Whether workers can skip the briefing", "Whether the project name can be changed"], answer: 0, explanation: "Schedule recovery must not bypass required quality or safety controls." },
            { q: "Which sequence best represents the basic management functions?", opts: ["Control, ignore, purchase, close", "Design, advertise, sell, deliver", "Plan, organise, lead, control", "Inspect, dismiss, replace, restart"], answer: 2, explanation: "Planning, organising, leading and controlling are complementary management functions." },
            { q: "A project team is choosing between a cheaper material and one with a longer service life. What is the best management approach?", opts: ["Choose the cheapest option automatically", "Ignore maintenance costs", "Allow each worker to choose separately", "Compare whole-life cost, performance and specification requirements"], answer: 3, explanation: "A sound decision considers lifecycle implications and compliance, not purchase price alone." },
            { q: "Which statement best captures the purpose of engineering management?", opts: ["To replace technical expertise with paperwork", "To coordinate technical work and resources to achieve project objectives", "To focus only on construction projects", "To eliminate all uncertainty"], answer: 1, explanation: "Engineering management coordinates people, processes and resources to support successful technical delivery." }
        ]
      }]
    },
    {
      title: "Engineering Planning and Project Management",
      lessons: [{
        title: "Planning Engineering Work and Controlling Project Delivery",
        duration: "45 minutes",
        html: `
<p>Engineering planning converts an objective into a coordinated set of activities, deliverables, responsibilities, resources and time targets. Project management then coordinates execution and responds to changes while protecting agreed requirements.</p>
<div class="callout"><b>Planning question:</b> What must be delivered, what work is required, in what order, by whom, with which resources and by when?</div>
<h3>Learning outcomes</h3><p>You should be able to define scope and deliverables, break work into activities, identify dependencies, develop milestones and use progress information to manage a project.</p>
<h3>1. Define scope and deliverables</h3><p><b>Scope</b> describes the work included and excluded. A <b>deliverable</b> is a verifiable output, such as an installed pump, tested control panel, completed inspection report or commissioned production line. Clear acceptance criteria help prevent disagreement about completion.</p>
<h3>2. Break the work into manageable activities</h3><p>A work breakdown structure (WBS) divides a project into smaller components. For a pump installation, work packages might include site preparation, foundation work, procurement, mechanical installation, electrical connection, testing and handover.</p>
<table class="compare"><tr><th>Activity</th><th>Dependency / evidence of completion</th></tr><tr><td>Prepare foundation</td><td>Approved site and foundation inspection</td></tr><tr><td>Install pump</td><td>Foundation ready; equipment delivered</td></tr><tr><td>Connect power</td><td>Installation complete; electrical isolation controls applied</td></tr><tr><td>Test and commission</td><td>Mechanical and electrical checks complete</td></tr></table>
<h3>3. Sequence and schedule activities</h3><p>Some tasks can run in parallel; others depend on earlier work. A schedule assigns start and finish dates, durations and responsible persons. A milestone is a significant checkpoint, such as equipment delivery or successful commissioning. Identify the critical sequence of dependent tasks because delays there can delay the overall completion date.</p>
<h3>4. Coordinate stakeholders and change</h3><p>Stakeholders may include the client, engineers, technicians, suppliers, contractors, regulators, operators and nearby communities. Record decisions, communicate changes and assess their effects on scope, time, cost, quality and risk before approving them.</p>
<h3>5. Monitor and control progress</h3><p>Compare actual progress with planned progress. Use site reports, inspection records, milestone status and issue logs. When a variance appears, identify its cause, agree an action, assign an owner and due date, then check whether the action worked.</p>
`,
        quiz: [
            { q: "A client requests an additional control panel after the project scope has been approved. What should the project manager do first?", opts: ["Install it immediately", "Reject every change", "Assess the effect on scope, cost, schedule and risk through change control", "Ask the supplier to decide"], answer: 2, explanation: "A change should be assessed and authorised before the baseline plan is altered." },
            { q: "Which item is the clearest project deliverable?", opts: ["A commissioned pump that passes the agreed tests", "A discussion about the pump", "A general intention to improve water supply", "An unassigned list of tasks"], answer: 0, explanation: "A deliverable is a tangible or verifiable output with acceptance criteria." },
            { q: "The electrical connection cannot begin until the pump is mechanically installed. This is an example of:", opts: ["A budget variance", "A stakeholder register", "A quality policy", "A task dependency"], answer: 3, explanation: "The electrical task depends on completion of mechanical installation." },
            { q: "A weekly report shows that a milestone is two weeks late. What is the most useful next step?", opts: ["Change the reported date to hide the delay", "Identify the cause, assess downstream effects and assign a recovery action", "Stop collecting progress data", "Blame the supplier without checking evidence"], answer: 1, explanation: "Good control uses evidence to diagnose the variance and manage its consequences." },

<h3>2. Quality assurance and quality control</h3><p><b>Quality Assurance (QA)</b> is process-oriented and aims to prevent defects through procedures, training, supplier controls, audits and defined responsibilities. <b>Quality Control (QC)</b> checks materials, products or work outputs through inspection, measurement and testing to identify nonconformities.</p>

<h3>2. Leadership styles</h3><p><b>Autocratic leadership:</b> the leader makes decisions and gives direction. It may be useful in urgent situations requiring immediate control, but overuse can reduce participation.</p><p><b>Democratic leadership:</b> the leader consults team members and encourages input. This can improve cooperation and use the team's technical knowledge.</p><p><b>Transformational leadership:</b> the leader motivates people through a shared vision, innovation and development.</p><p><b>Situational leadership:</b> the leader adjusts guidance and delegation according to the task, urgency and competence of team members. No single style suits every situation.</p>

<h3>Learning objectives</h3><ul><li>Explain engineering performance monitoring.</li><li>Identify useful key performance indicators.</li><li>Calculate basic production and maintenance measures.</li><li>Interpret project performance information.</li><li>Explain engineering reports and root-cause analysis.</li><li>Apply continuous improvement and lean principles.</li></ul>
<h3>1. Performance monitoring and KPIs</h3><p>Performance monitoring compares actual results with targets or baselines. A Key Performance Indicator (KPI) is a measurable value used to assess progress towards an objective. Define each KPI clearly, including its calculation, data source, reporting frequency and responsible person.</p>
<h3>2. Equipment reliability: MTBF and MTTR</h3><p><b>Mean Time Between Failures (MTBF) = Total operating time ÷ Number of failures.</b> If a machine operates for 200 hours and has 4 failures, MTBF = <b>50 operating hours</b>.</p><p><b>Mean Time To Repair (MTTR) = Total repair time ÷ Number of repairs.</b> If 4 repairs take 12 hours in total, MTTR = <b>3 hours</b>. A higher MTBF generally indicates longer operating periods between failures; a lower MTTR generally indicates faster restoration.</p>

function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }); }
function nowISO() { return new Date().toISOString(); }
function esc(s) { return typeof s !== 'string' ? s : s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let currentSessionUser = null;

function getAuth() {
  const raw = localStorage.getItem('logi_user');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

async function currentUser() {
  if (currentSessionUser) return currentSessionUser;
  const user = getAuth();
  if (user) {
    currentSessionUser = {
      id: user.id,
      username: user.email,
      email: user.email,
      fullName: user.fullName || user.email,
      role: 'student'
    };
    return currentSessionUser;
  }
  return null;
}

// Progress tracking helpers (stored in memory/localStorage for instant UI, synced to DB)
const PROGRESS_KEY = 'logi_progress_cache';
function getProgressCache() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch { return {}; }
}
function setProgressCache(cache) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(cache)); }

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  try {
    const res = await fetch(`${API_BASE}/my-progress`, {
      headers: { 'Authorization': `Bearer ${getAuth().token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    const cache = getProgressCache();
    
    // Reset cache for this course before loading fresh data
    Object.keys(cache).forEach(k => {
       if (k.startsWith(COURSE.id)) delete cache[k];
    });

    // Map DB rows into the cache format used by the UI
    if (data.progress) {
      data.progress.forEach(row => {
        const key = `${COURSE.id}_${row.module_id}_${row.lesson_id}`;
        cache[key] = { completed: row.completed, score: row.quiz_score, total: row.quiz_total };
      });
      setProgressCache(cache);
    }
  } catch (e) { console.error('Could not load progress', e); }
}

function isLessonDone(username, mi, li) {
  const cache = getProgressCache();
  return !!cache[`${COURSE.id}_eng-mgmt_${mi+1}_lesson_${li+1}`]?.completed;
}
function getQuizResult(username, mi) {
  const cache = getProgressCache();
  return cache[`${COURSE.id}_eng-mgmt_${mi+1}_quiz_1`] || null;
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.completed;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.completed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.completed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

  async function doRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const password = document.getElementById('regPass').value;
    const password2 = document.getElementById('regPass2').value;
    const err = document.getElementById('regError');

    if (!name || !email || !password || !password2) { err.textContent = 'All fields are required.'; return; }
    if (password !== password2) { err.textContent = 'Passwords do not match.'; return; }

    err.textContent = 'Creating account...';
    
    try {
      const res = await fetch(`${API_BASE}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName: name, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      localStorage.setItem('logi_user', JSON.stringify(data));
      currentSessionUser = null;
      await showDashboard();
    } catch (e) {
      err.textContent = e.message;

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
    if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`);
    if (lbl) {
      lbl.classList.add('selected');
      const radio = lbl.querySelector('input');
      if (radio) radio.checked = true;
    }
  }

  async function submitQuiz(mi) {
    const u = await currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    let score = 0;
    let answeredAll = true;

    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (!sel) {
        answeredAll = false;
        if (fb) { fb.textContent = 'Please select an answer.'; fb.style.color = 'var(--error)'; }
        return;
      }
      if (parseInt(sel.value) === q.answer) {
        score++;
        if (fb) { fb.textContent = 'Correct!'; fb.style.color = 'var(--success)'; }
      } else {
        if (fb) { fb.textContent = 'Incorrect.'; fb.style.color = 'var(--error)'; }
      }
    });

    const resultEl = document.getElementById('quizResult_' + mi);
    if (!answeredAll) {
      if (resultEl) {
        resultEl.textContent = 'Please answer all questions before submitting.';
        resultEl.style.color = 'var(--error)';
      }
      return;
    }

    const passed = (score / quiz.length * 100) >= COURSE.passMark;

    // Save to Cloudflare D1
    try {
      await fetch(`${API_BASE}/progress`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAuth().token}` },
        body: JSON.stringify({
          moduleId: `eng-mgmt_${mi+1}`,
          lessonId: `quiz_1`,
          completed: passed ? 1 : 0,
          quizScore: score,
          quizTotal: quiz.length
        })
      });
      await loadStudentData(u, true); // Reload cache
    } catch (e) { console.error(e); }

    if (passed) {
      if (resultEl) {
        resultEl.textContent = `Scored ${score}/${quiz.length}. Passed! ✅`;
        resultEl.style.color = 'var(--success)';
      }

      const nextBtn = document.getElementById('nextBtn_' + mi);
      if (nextBtn) {
        nextBtn.disabled = false;
        nextBtn.classList.remove('btn-secondary');
        nextBtn.classList.add('btn');
        nextBtn.style.opacity = '1';
        const isLast = (mi + 1 >= COURSE.modules.length);
        nextBtn.textContent = isLast
          ? (courseCompleted(u.username) ? 'View Certificate →' : 'Finish →')
          : 'Next Module →';
      }
    } else {
      if (resultEl) {
        resultEl.textContent = `Scored ${score}/${quiz.length}. Try again.`;
        resultEl.style.color = 'var(--error)';
      }
    }
  }

  function scaleCertificate() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const container = scaler.parentElement;
    const containerWidth = container.clientWidth;
    const certWidth = 1000;
    if (containerWidth < certWidth) {
      const scale = containerWidth / certWidth;
      scaler.style.transform = `scale(${scale})`;
      scaler.style.marginBottom = `-${(707 * (1 - scale))}px`;
    } else {
      scaler.style.transform = 'none';
      scaler.style.marginBottom = '0';
    }
  }

    const scaler = document.getElementById('certScaler');
    if (!cert || !scaler) return;
    const btn = document.querySelector('button[onclick="App.downloadCertificateImage()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ Generating...';
    btn.disabled = true;
    const originalTransform = scaler.style.transform;
    const originalMargin = scaler.style.marginBottom;
    scaler.style.transform = 'none';
    scaler.style.marginBottom = '0';
    html2canvas(cert, {
      scale: 2, useCORS: true, backgroundColor: '#fafafa',
      width: 1000, height: 707, windowWidth: 1000, windowHeight: 707,
      onclone: (clonedDoc) => {
        const desc = clonedDoc.querySelector('.cert-description');
        if (desc) { desc.style.wordSpacing = 'normal'; desc.style.letterSpacing = 'normal'; }
      }
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate_Engineering_Management.png';
      link.href = imgData;
      link.click();
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error('Error generating image:', err);
      alert('Failed to generate image. Please ensure you are connected to the internet so the external signature and QR code can load.');
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }

  async function showDiscussion() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'discussion';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('discussion')}
        <main class="main-panel">
          <h1>Discussion Forum</h1>
          <p class="subtitle">Ask questions and share ideas.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  async function showAnnouncements() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'announcements';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('announcements')}
        <main class="main-panel">
          <h1>Announcements</h1>
          <p class="subtitle">Important updates from your instructor.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  function goHome() {
    closeMobileMenu();
    if (currentSessionUser) showDashboard();
    else showLanding();
  }

  async function init() {
    const u = await currentUser();
    if (u) {
      await loadStudentData(u, true);
      await showDashboard();
    } else {
      showLanding();
    }
  }

  return {
    init, showLanding, showLogin, showRegister, doLogin, doRegister, logout,
    showDashboard, showCatalogue, showCertificate, showDiscussion, showAnnouncements,
    openCourse, prevLesson, nextLesson, markCurrentLesson, submitQuiz, selectOption,
    alertLocked, previousFromAssessment, continueAfterAssessment, goHome,
    toggleAccordion, openAssessment, toggleMobileMenu, closeMobileMenu,
    toggleModuleMenu, closeModuleMenu, navigate, downloadCertificateImage
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
</body>
