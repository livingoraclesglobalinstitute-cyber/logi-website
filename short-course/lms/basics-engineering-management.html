<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LOGI LMS Demonstration – Multiple Short Courses">
  <title>LOGI LMS · Short Courses</title>
  
  <!-- Include html2canvas for certificate image download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --p: #ff4b93;
      --pd: #e93680;
      --purple: #7b218b;
      --ink: #34343b;
      --muted: #777780;
      --line: #ececf1;
      --soft: #f1f0fb;
      --bg: #ffffff;
      --success: #2e7d32;
      --error: #b33;
      --warn: #f0f7ff;
      --radius: 10px;
      --shadow: 0 3px 14px rgba(30,30,50,.09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.65 Arial, sans-serif;
      color: var(--ink);
      background: #fff;
    }
    a { text-decoration: none; color: inherit; }
    .inner { width: min(1160px, 92%); margin: auto; }
    
    /* Header */
    .top {
      height: 66px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }
    .nav { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .brand { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; }
    .brand span { color: var(--p); }
    .nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    /* Buttons */
    .btn {
      background: var(--p);
      color: white;
      border: 0;
      border-radius: 24px;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--pd); }
    .btn-purple { background: var(--purple); }
    .btn-purple:hover { background: #641b70; }
    .btn-outline {
      background: transparent;
      color: var(--pd);
      border: 1.5px solid var(--p);
      border-radius: 24px;
      padding: 9px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .btn-outline:hover { background: #fff0f6; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-secondary {
      background: #f0edf3;
      color: var(--ink);
      border: 0;
      border-radius: 24px;
      padding: 9px 15px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-secondary:hover { background: #e5e1ea; }

    /* Auth screens */
    .auth-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 66px);
      padding: 40px 16px;
      background: linear-gradient(110deg,#f5f2fc 0%,#fff 58%,#ffeaf2 100%);
    }
    .auth-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
    }
    .auth-card h2 { margin: 0 0 6px; font-size: 24px; }
    .auth-card p.muted { margin: 0 0 22px; font-size: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      background: white;
    }
    .field input:focus { outline: 2px solid var(--p); outline-offset: 1px; border-color: transparent; }
    .auth-switch { text-align: center; margin-top: 16px; font-size: 14px; }
    .auth-switch a { color: var(--pd); font-weight: 600; cursor: pointer; }
    .error-msg { color: var(--error); font-size: 13px; margin-top: 8px; min-height: 18px; }

    /* Dashboard Layout */
    .dash-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 66px);
    }
    
    /* Sidebar */
    .sidebar {
      background: white;
      border-right: 1px solid var(--line);
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar .user-badge {
      background: var(--soft);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .sidebar .user-badge strong { display: block; font-size: 14px; }
    .sidebar .user-badge span { color: var(--muted); font-size: 12px; }
    .sidebar a, .sidebar button.nav-link {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 6px;
      background: transparent;
      border: 0;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.1s;
    }
    .sidebar a:hover, .sidebar button.nav-link:hover { background: #fff3f8; color: var(--pd); }
    .sidebar .nav-link.active { background: #fff0f6; color: var(--pd); }
    .sidebar .spacer { flex: 1; }

    /* Main Panel */
    .main-panel {
      padding: 40px max(5vw, 22px);
      overflow-y: auto;
      max-height: calc(100vh - 66px);
      background: linear-gradient(110deg,#f5f2fc 0%,#fff 58%,#ffeaf2 100%);
    }
    .main-panel h1 { font-size: clamp(28px, 4vw, 38px); margin: 0 0 6px; color: #222; }
    .main-panel .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 30px; }

    /* Cards */
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .card h2 { font-size: 20px; margin: 0 0 10px; font-weight: 800; }
    .card h3 { font-size: 17px; margin: 18px 0 8px; }
    .card p, .card li { color: #555; line-height: 1.75; }
    
    /* Stats */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: white;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 17px;
      box-shadow: var(--shadow);
    }
    .stat-box .num { font-size: 28px; font-weight: 800; color: var(--purple); }
    .stat-box .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

    /* Course Catalogue */
    .catalogue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
    .course-tile {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }
    .course-tile h3 { margin: 0; font-size: 17px; }
    .course-tile .meta { font-size: 12px; color: var(--muted); }
    .course-tile .desc { font-size: 13px; color: #666; flex: 1; margin-bottom: 12px; }

    /* Lesson content */
    .lesson-card { max-width: 900px; background: white; }
    .callout {
      background: var(--warn);
      border-left: 4px solid #438bd5;
      padding: 14px 17px;
      margin: 18px 0;
      border-radius: 0 6px 6px 0;
    }
    .case {
      background: #fff8fb;
      border: 1px solid #f4dce7;
      padding: 16px;
      border-radius: 6px;
      margin: 18px 0;
    }
    .compare { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .compare td, .compare th { border: 1px solid var(--line); padding: 10px; text-align: left; font-size: 14px; }
    .compare th { background: #fff3f8; }

    .q { border-top: 1px solid var(--line); padding: 14px 0; }
    .q label {
      display: block;
      border: 1px solid var(--line);
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.1s;
    }
    .q label:hover { background: #fafafa; }
    .q label.selected { background: #fff0f6; border-color: var(--p); }
    .feedback { font-size: 13px; margin-top: 6px; }
    .actions {
      display: flex;
      justify-content: space-between;
      gap: 9px;
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin-top: 24px;
    }
    .notice { font-size: 12px; color: var(--muted); margin-top: 14px; }

    /* Module sidebar inside course view */
    .course-layout { display: grid; grid-template-columns: 260px 1fr; gap: 22px; align-items: start; }
    .module-side {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      position: sticky;
      top: 22px;
      box-shadow: var(--shadow);
    }
    .module-side .sidehead { padding: 16px; border-bottom: 1px solid var(--line); }
    .module-side .sidehead h2 { font-size: 16px; margin: 0; }
    .progress-bar { height: 7px; background: #f0edf3; border-radius: 9px; margin-top: 8px; overflow: hidden; }
    .progress-bar span { display: block; height: 100%; width: 0; background: var(--p); transition: width 0.3s; }
    .module-side .modules { padding: 8px; }
    .mod-btn {
      width: 100%;
      text-align: left;
      background: white;
      border: 0;
      padding: 11px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: var(--ink);
      font-size: 13px;
      transition: background 0.1s;
    }
    .mod-btn:hover { background: #fff3f8; color: var(--pd); }
    .mod-btn.active { background: #fff0f6; color: var(--pd); }
    .mod-btn.locked { color: #aaa; cursor: not-allowed; }
    .lesson-link {
      display: block;
      width: 100%;
      text-align: left;
      background: white;
      border: 0;
      border-left: 2px solid transparent;
      padding: 7px 12px 7px 22px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      transition: background 0.1s;
    }
    .lesson-link:hover { background: #fafafa; }
    .lesson-link.active { color: var(--pd); border-color: var(--p); background: #fff8fb; }
    .lesson-link.done:after { content: " ✓"; color: var(--success); }
    .lesson-link.locked { color: #bbb; cursor: not-allowed; }

    /* =========================================
       CERTIFICATE STYLES
       ========================================= */
    .cert-display-area {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
      padding: 10px 0;
    }
    .cert-scaler {
      transform-origin: top center;
      width: 1000px;
      height: 707px;
    }
    .cert-wrapper {
      background: #fafafa;
      width: 1000px;
      height: 707px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: grid;
      grid-template-columns: 1fr 220px;
      position: relative;
      overflow: hidden;
      color: var(--ink);
    }
    .cert-watermark {
      position: absolute;
      top: 50%;
      left: 45%;
      transform: translate(-50%, -50%);
      width: 550px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }
    .cert-main {
      padding: 40px 60px 30px 60px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }
    .cert-header { display: flex; align-items: center; gap: 15px; margin-bottom: 35px; }
    .cert-header-logo { height: 45px; width: auto; object-fit: contain; }
    .cert-logo-sub { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; line-height: 1.2; font-weight: 600; }
    .cert-date { font-size: 15px; color: var(--muted); margin-bottom: 25px; font-weight: 500; }
    .cert-name { font-size: 36px; font-weight: 700; color: #222; margin-bottom: 12px; }
    .cert-completion { font-size: 16px; color: #555; margin-bottom: 20px; }
    .cert-course-title { font-size: 32px; font-weight: 800; color: #333; margin-bottom: 25px; line-height: 1.2; }
    .cert-description { font-size: 14px; color: #666; line-height: 1.7; max-width: 560px; margin-bottom: 40px; letter-spacing: 0.2px; word-spacing: 1px; }
    .cert-signature-area { display: flex; flex-direction: column; max-width: 300px; margin-top: auto; }
    .cert-signature-img { height: 55px; width: auto; object-fit: contain; align-self: flex-start; margin-bottom: 15px; }
    .cert-signer-name { font-size: 16px; font-weight: 700; color: #333; text-decoration: underline; text-underline-offset: 3px; margin-bottom: 6px; }
    .cert-signer-title { font-size: 12px; color: var(--muted); }
    .cert-footer-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 15px; font-size: 10px; color: #777; line-height: 1.5; }
    .cert-footer-box { display: flex; align-items: center; gap: 10px; max-width: 48%; }
    .cert-footer-logo { font-weight: 800; font-size: 16px; color: var(--p); }
    .cert-sidebar { background-color: var(--pd); position: relative; display: flex; flex-direction: column; }
    .cert-partner-box { background: white; padding: 25px 15px; text-align: center; font-size: 42px; font-weight: 900; color: #000; letter-spacing: 3px; border-bottom: 1px solid #eee; }
    .cert-sidebar-pattern { flex: 1; position: relative; background-image: linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.05) 75%, transparent 75%, transparent), linear-gradient(45deg, rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 20px 20px, 100% 100%; background-position: 0 0, 10px 10px; }
    .cert-sidebar-pattern::before { content: ''; position: absolute; top: 15%; left: 10%; width: 40px; height: 80px; border-left: 2px solid rgba(255,255,255,0.2); border-bottom: 2px solid rgba(255,255,255,0.2); }
    .cert-sidebar-pattern::after { content: ''; position: absolute; bottom: 20%; right: 15%; width: 60px; height: 40px; border-right: 2px solid rgba(255,255,255,0.2); border-top: 2px solid rgba(255,255,255,0.2); }
    .cert-verify-area { padding: 25px 20px; text-align: center; background: white; }
    .cert-verify-text { font-size: 9px; color: #555; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.4; }
    .cert-qr { width: 100px; height: 100px; margin: 0 auto 15px; display: block; }
    .cert-blockchain { font-size: 9px; color: #888; font-family: monospace; word-break: break-all; line-height: 1.4; }
    .cert-bottom-block { height: 40px; background: #c2185b; }
    .cert-controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }

    /* Responsive */
    @media (max-width: 900px) {
      .dash-layout { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; gap: 4px; }
      .sidebar .user-badge { display: none; }
      .sidebar .spacer { display: none; }
      .main-panel { max-height: none; padding: 20px 16px 40px; }
      .course-layout { grid-template-columns: 1fr; }
      .module-side { position: static; }
    }

    @media (max-width: 500px) {
      .auth-card { padding: 24px 18px; }
      .main-panel h1 { font-size: 22px; }
    }

    /* Print specific styles */
    @media print {
      @page { size: landscape; margin: 0; }
      body { background: white; padding: 0; margin: 0; display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .top, .sidebar, .main-panel h1, .subtitle, .cert-controls, footer, .notice { display: none !important; }
      .dash-layout { display: block; }
      .main-panel { padding: 0; margin: 0; max-height: none; background: white; }
      .cert-display-area { padding: 0; overflow: visible; }
      .cert-scaler { transform: none !important; width: 1000px !important; height: 707px !important; margin-bottom: 0 !important; }
      .cert-wrapper { box-shadow: none; width: 1000px !important; height: 707px !important; border: none; margin: 0 auto; background: #fafafa !important; }
    }
  </style>
</head>
<body>

<header class="top">
  <div class="inner nav">
    <a class="brand" href="#" onclick="App.goHome();return false;">LOGI<span>.</span></a>
    <div class="nav-actions" id="navActions"></div>
  </div>
</header>

<div id="app"></div>

<footer class="foot" style="background: #292832; color: white; text-align: center; padding: 22px; font-size: 13px;">
  <strong style="color: #ff8cba;">Living Oracles Global Institute</strong><br>
  Faith. Excellence. Impact.
</footer>

<script>
/* ============================================================
   LOGI LMS DEMO — Single File Multi-Course Prototype
   ============================================================ */

const STORE = {
  users: 'logi_users',
  session: 'logi_session',
  progress: 'logi_progress',       
  certificates: 'logi_certificates', 
  posts: 'logi_posts',             
  announcements: 'logi_announcements', 
  enrolments: 'logi_enrolments'     
};

function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function save(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

/* ---------- COURSES DATA ---------- */
const COURSES = [
  {
    id: 'eng-mgmt-101',
    title: 'Basics of Engineering Management',
    school: 'School of Engineering & Technology',
    desc: 'Understand how engineering work is planned, coordinated and improved through structured lessons, practical examples and knowledge checks.',
    passMark: 80,
    modules: [
      {
        title: 'Introduction to Engineering Management',
        lessons: [
          {
            title: 'Understanding Engineering Management',
            duration: '35 minutes',
            html: `
              <h2>Understanding Engineering Management</h2>
              <p>Engineering management is the application of management principles, technical knowledge and problem-solving methods to plan, organise, coordinate and control engineering activities. It connects engineering expertise with the people, resources, time, cost and quality requirements needed to complete work successfully.</p>
              <div class="callout"><b>Key idea:</b> Engineering focuses on designing and solving technical problems. Engineering management organises the people, processes and resources required to deliver engineering work effectively.</div>
              <h3>1. What does an engineering manager do?</h3>
              <ul>
                <li>Plans engineering activities and sets priorities.</li>
                <li>Coordinates engineers, technicians, contractors and stakeholders.</li>
                <li>Manages equipment, materials, time and budgets.</li>
                <li>Monitors quality, safety, cost and project performance.</li>
                <li>Identifies problems and supports practical solutions.</li>
              </ul>
              <h3>2. Engineering and engineering management</h3>
              <table class="compare">
                <tr><th>Engineering</th><th>Engineering management</th></tr>
                <tr><td>Focuses on technical design, analysis and solutions.</td><td>Coordinates technical work, people and resources.</td></tr>
                <tr><td>May involve calculations, testing and system development.</td><td>May involve planning, budgeting, scheduling and team coordination.</td></tr>
                <tr><td>Asks: How can this technical problem be solved?</td><td>Asks: How can the work be delivered safely, on time and within budget?</td></tr>
              </table>
            `,
            quiz: [
              { q: 'Which statement best describes engineering management?', opts: ['Designing technical systems only', 'Coordinating technical work, people and resources to achieve objectives', 'Replacing engineering with administration'], answer: 1, explanation: 'It coordinates technical work, people and resources to achieve objectives.' },
              { q: 'Which is an engineering management activity?', opts: ['Ignoring delivery schedules', 'Working without defined responsibilities', 'Coordinating equipment, materials and labour'], answer: 2, explanation: 'Coordinating equipment, materials and labour is a management responsibility.' }
            ]
          }
        ]
      }
    ]
  },
  {
    id: 'agile-project-101',
    title: 'Introduction to Agile Project Management',
    school: 'School of Engineering & Technology',
    desc: 'This course introduces Agile values and ways of organising work in short, feedback-driven cycles. Learners explore iterative delivery, collaboration, prioritisation and common Scrum concepts.',
    passMark: 80,
    modules: [
      {
        title: 'Agile Mindset and Principles',
        lessons: [
          {
            title: 'Agile Principles',
            duration: '30 minutes',
            html: `
              <h2>Agile Mindset and Principles</h2>
              <p>Agile is an iterative approach to project management and software development that helps teams deliver value to their customers faster and with fewer headaches. Instead of betting everything on a "big bang" launch, an agile team delivers work in small, but consumable, increments.</p>
              <div class="callout"><b>Key idea:</b> Requirements, plans, and results are evaluated continuously so teams have a natural mechanism for responding to change quickly.</div>
            `,
            quiz: [
              { q: 'What is Agile?', opts: ['A waterfall method', 'An iterative approach', 'A type of software'], answer: 1, explanation: 'Agile is an iterative approach.' },
              { q: 'How does Agile handle change?', opts: ['It ignores change', 'It plans for all change upfront', 'It evaluates continuously and responds quickly'], answer: 2, explanation: 'Agile evaluates requirements and plans continuously.' }
            ]
          }
        ]
      }
    ]
  },
  {
    id: 'cybersecurity-101',
    title: 'Cybersecurity Fundamentals',
    school: 'School of Engineering & Technology',
    desc: 'This course introduces the principles of protecting devices, accounts, networks and information. Learners explore common threats and practical habits for safer digital work.',
    passMark: 80,
    modules: [
      {
        title: 'Common Threats and Protection',
        lessons: [
          {
            title: 'Phishing and Malware',
            duration: '40 minutes',
            html: `
              <h2>Phishing and Malware Awareness</h2>
              <p>Phishing is a type of social engineering where attackers deceive people into revealing sensitive information or installing malware such as ransomware.</p>
              <div class="callout"><b>Key idea:</b> Always verify the sender's email address and never click on suspicious links.</div>
            `,
            quiz: [
              { q: 'What is phishing?', opts: ['A type of fishing', 'A social engineering attack to steal data', 'A software update'], answer: 1, explanation: 'Phishing is a social engineering attack.' }
            ]
          }
        ]
      }
    ]
  }
];


/* ---------- Helpers ---------- */
function uid() {
  return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
}
function nowISO() { return new Date().toISOString(); }
function esc(s) {
  if (typeof s !== 'string') return s;
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- Session / user ---------- */
function getUsers() { return load(STORE.users, {}); }
function getSession() { return load(STORE.session, null); }
function setSession(u) { save(STORE.session, u); }
function clearSession() { localStorage.removeItem(STORE.session); }
function currentUser() {
  const s = getSession();
  if (!s) return null;
  return getUsers()[s.username] || null;
}

/* ---------- Progress ---------- */
function getProgress(username) {
  const p = load(STORE.progress, {});
  if (!p[username]) p[username] = { lessons: {}, quizzes: {} };
  return p[username];
}
function saveProgress(username, p) {
  const all = load(STORE.progress, {});
  all[username] = p;
  save(STORE.progress, all);
}
function isLessonDone(username, courseId, mi, li) {
  const p = getProgress(username);
  return !!p.lessons[courseId + '-' + mi + '-' + li];
}
function markLessonDone(username, courseId, mi, li) {
  const p = getProgress(username);
  p.lessons[courseId + '-' + mi + '-' + li] = true;
  saveProgress(username, p);
}
function getQuizResult(username, courseId, mi) {
  const p = getProgress(username);
  return p.quizzes[courseId + '-' + mi] || null;
}
function saveQuizResult(username, courseId, mi, score, total, passMark) {
  const p = getProgress(username);
  p.quizzes[courseId + '-' + mi] = { score, total, passed: score / total * 100 >= passMark };
  saveProgress(username, p);
}
function isModuleLocked(username, courseId, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, courseId, mi - 1);
  return !prev || !prev.passed;
}
function moduleLessonsDone(username, courseId, mi) {
  const course = COURSES.find(c => c.id === courseId);
  const mod = course.modules[mi];
  if (!mod) return 0;
  let n = 0;
  mod.lessons.forEach((_, li) => { if (isLessonDone(username, courseId, mi, li)) n++; });
  return n;
}
function courseProgressPct(username, courseId) {
  const course = COURSES.find(c => c.id === courseId);
  if (!course) return 0;
  let total = 0, done = 0;
  course.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, courseId, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username, courseId) {
  const course = COURSES.find(c => c.id === courseId);
  if (!course) return false;
  for (let mi = 0; mi < course.modules.length; mi++) {
    if (!getQuizResult(username, courseId, mi)?.passed) return false;
    for (let li = 0; li < course.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, courseId, mi, li)) return false;
    }
  }
  return true;
}

/* ---------- Enrolments ---------- */
function getEnrolments(username) {
  const e = load(STORE.enrolments, {});
  return e[username] || [];
}
function enrol(username, courseId) {
  const e = load(STORE.enrolments, {});
  if (!e[username]) e[username] = [];
  if (!e[username].includes(courseId)) e[username].push(courseId);
  save(STORE.enrolments, e);
}

/* ---------- Certificates ---------- */
function getCerts(username) {
  const c = load(STORE.certificates, {});
  return c[username] || [];
}
function addCert(username, cert) {
  const c = load(STORE.certificates, {});
  if (!c[username]) c[username] = [];
  c[username].push(cert);
  save(STORE.certificates, c);
}
function generateCertificate(username, courseId) {
  const user = getUsers()[username];
  if (!user) return null;
  const certs = getCerts(username);
  let cert = certs.find(c => c.courseId === courseId);
  if (cert) return cert;
  
  const course = COURSES.find(c => c.id === courseId);
  const hash = Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('');
  
  cert = {
    id: 'LOGI-' + courseId.toUpperCase() + '-' + Date.now().toString(36).toUpperCase(),
    hash: hash,
    courseId: courseId,
    courseTitle: course.title,
    studentName: user.fullName || user.username,
    date: nowISO(),
    issuedBy: 'Living Oracles Global Institute'
  };
  addCert(username, cert);
  return cert;
}

    state.activeCourseModule = mi;

  function alertLocked(i) {
    alert('Module ' + (i+1) + ' is locked until you pass the previous module assessment.');

  function renderQuizUI(course, mi, quiz) {
    const u = currentUser();
    const username = u.username;
    const result = getQuizResult(username, course.id, mi);
    const passed = result?.passed;
    return `
      <div id="quizWrap" style="margin-top:32px;border-top:2px solid var(--line);padding-top:24px;">
        <h2 style="font-size:22px;">Module ${mi+1} assessment</h2>
        <p style="font-size:14px;color:var(--muted);">Answer all questions. Pass mark: ${course.passMark}%. Unlimited retakes allowed.</p>
        ${result ? `<div class="callout" style="background:${passed?'#e8f5e9':'#fdecea'};border-left-color:${passed?'#2e7d32':'#c62828'};">
          <b>Previous attempt:</b> ${result.score} / ${result.total} (${Math.round(result.score/result.total*100)}%) — ${passed?'Passed ✅':'Not passed — try again'}</div>` : ''}
        <div id="quizQuestions">
          ${quiz.map((q, qi) => `
            <div class="q" data-qindex="${qi}">
              <b>${qi+1}. ${esc(q.q)}</b>
              ${q.opts.map((opt, oi) => `
                <label data-opt="${oi}" onclick="App.selectOption(${qi},${oi})">
                  <input type="radio" name="q${mi}_${qi}" value="${oi}" style="margin-right:6px;">
                  ${esc(opt)}
                </label>
              `).join('')}
              <div class="feedback" id="fb_${mi}_${qi}"></div>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;">
          <button class="btn" onclick="App.submitQuiz('${course.id}', ${mi})">Submit answers</button>
          ${result && !passed ? '<span style="font-size:13px;color:var(--error);">You can retake this assessment.</span>' : ''}
        </div>
        <p id="quizResult_${mi}" style="font-weight:700;margin-top:12px;"></p>
      </div>
    `;
  }

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
    if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`);
    if (lbl) {
      lbl.classList.add('selected');
      const radio = lbl.querySelector('input');
      if (radio) radio.checked = true;
    }
  }

  function submitQuiz(courseId, mi) {
    const u = currentUser();
    if (!u) return;
    const course = COURSES.find(c => c.id === courseId);
    const quiz = course.modules[mi].lessons[0].quiz;
    if (!quiz) return;
    let score = 0;
    let answeredAll = true;
    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (!sel) {
        answeredAll = false;
        if (fb) { fb.textContent = 'Please select an answer.'; fb.style.color = 'var(--error)'; }
        return;
      }
      const val = parseInt(sel.value, 10);
      const ok = val === q.answer;
      if (ok) score++;
      if (fb) {
        fb.textContent = (ok ? '✅ Correct. ' : '❌ Review: ') + q.explanation;
        fb.style.color = ok ? 'var(--success)' : 'var(--error)';
      }
    });
    if (!answeredAll) {
      document.getElementById('quizResult_' + mi).textContent = 'Please answer all questions before submitting.';
      return;
    }
    saveQuizResult(u.username, courseId, mi, score, quiz.length, course.passMark);
    const pct = Math.round(score / quiz.length * 100);
    const passed = pct >= course.passMark;
    const resEl = document.getElementById('quizResult_' + mi);
    if (resEl) {
      resEl.textContent = `You scored ${score} / ${quiz.length} (${pct}%). ${passed ? 'Passed ✅ — next module unlocked.' : 'Not passed. Review the explanations and retake when ready.'}`;
      resEl.style.color = passed ? 'var(--success)' : 'var(--error)';
    }
    
    if (passed) {
      markLessonDone(u.username, courseId, mi, 0);
      if (courseCompleted(u.username, courseId)) {
        generateCertificate(u.username, courseId);
      }
      setTimeout(() => {
        renderCourse();
      }, 1200);
    }
  }

  function markCurrentLesson() {
    const u = currentUser();
    if (!u) return;
    const mi = state.activeCourseModule, li = state.activeCourseLesson, cid = state.activeCourseId;
    markLessonDone(u.username, cid, mi, li);
    if (courseCompleted(u.username, cid)) generateCertificate(u.username, cid);
    renderCourse();
  }

  function prevLesson() {
    let mi = state.activeCourseModule, li = state.activeCourseLesson - 1, cid = state.activeCourseId;
    const course = COURSES.find(c => c.id === cid);
    if (li < 0) {
      mi--;
      if (mi < 0) { showDashboard(); return; }
      if (isModuleLocked(currentUser().username, cid, mi)) { alertLocked(mi); return; }
      li = course.modules[mi].lessons.length - 1;
    }
    openCourse(cid, mi, li);
  }

  function nextLesson() {
    let mi = state.activeCourseModule, li = state.activeCourseLesson + 1, cid = state.activeCourseId;
    const course = COURSES.find(c => c.id === cid);
    if (li >= course.modules[mi].lessons.length) {
      mi++; li = 0;
      if (mi >= course.modules.length) {
        alert('You have reached the end of the course content. Check the dashboard for your certificate status.');
        showDashboard(); return;
      }
      if (isModuleLocked(currentUser().username, cid, mi)) {
        alert('Complete and pass the current module assessment before moving to the next module.');
        return;
      }
    }
    openCourse(cid, mi, li);
  }

  function scaleCertificate() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const container = scaler.parentElement;
    const containerWidth = container.clientWidth;
    const certWidth = 1000;

    if (containerWidth < certWidth) {
      const scale = containerWidth / certWidth;
      scaler.style.transform = `scale(${scale})`;
      scaler.style.marginBottom = `-${(707 * (1 - scale))}px`;
    } else {
      scaler.style.transform = 'none';
      scaler.style.marginBottom = '0';
    }
  }

  function downloadCertificateImage() {
    const cert = document.getElementById('printableCert');
    const scaler = document.getElementById('certScaler');
    if (!cert || !scaler) return;
    
    const btn = document.querySelector('button[onclick="App.downloadCertificateImage()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ Generating...';
    btn.disabled = true;

    const originalTransform = scaler.style.transform;
    const originalMargin = scaler.style.marginBottom;
    scaler.style.transform = 'none';
    scaler.style.marginBottom = '0';

    html2canvas(cert, {
      scale: 2, 
      useCORS: true, 
      backgroundColor: '#fafafa',
      width: 1000,
      height: 707,
      windowWidth: 1000,
      windowHeight: 707,
      onclone: (clonedDoc) => {
        const desc = clonedDoc.querySelector('.cert-description');
        if (desc) {
          desc.style.wordSpacing = 'normal';
          desc.style.letterSpacing = 'normal';
        }
        const watermark = clonedDoc.querySelector('.cert-watermark');
        if (watermark) {
          watermark.style.display = 'block';
        }
      }
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate.png';
      link.href = imgData;
      link.click();
      
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error('Error generating image:', err);
      alert('Failed to generate image.');
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }
