<script>
/* ============================================================
   LOGI LMS — Basics of Construction Cost Estimation
   ============================================================ */

const API_BASE = 'https://logi-lms-api.livingoraclesglobalinstitute.workers.dev';

const COURSE = {
  id: 'cost-estimation-101',
  title: 'Basics of Construction Cost Estimation',
  desc: 'Learn the basic process of estimating construction costs from project information. The course introduces quantities, rates, labour, materials, equipment, overheads and the importance of clear assumptions.',
  passMark: 50,
  modules: [
    {
      title: "Introduction to Cost Estimation",
      lessons: [{
        title: "Purpose, Types and Principles of Estimating",
        duration: "45 minutes",
        html: `<p>Construction <b>cost estimation</b> is the process of predicting the likely cost of a project based on available information. It turns drawings, specifications and assumptions into a monetary figure that supports decisions throughout the project.</p>
<div class="callout"><b>Core principle:</b> Every estimate is a prediction, not a certainty. Its value comes from being traceable, clear about assumptions and appropriate to its purpose.</div>
<h3>Learning outcomes</h3><p>By the end of this lesson, you should be able to describe the purposes of estimating, distinguish estimate types, and recognise the principles that make an estimate reliable.</p>
<h3>1. Why estimates matter</h3>
<ul>
  <li>Support feasibility decisions before committing.</li>
  <li>Provide a budget for the project.</li>
  <li>Enable tender pricing and comparison.</li>
  <li>Track cost against baseline.</li>
  <li>Inform change control decisions.</li>
  <li>Support financial planning and cash flow.</li>
</ul>
<h3>2. Types of estimate by stage</h3>
<table class="compare"><tr><th>Stage</th><th>Estimate type</th><th>Accuracy</th></tr><tr><td>Concept</td><td>Order-of-magnitude</td><td>±30–50%</td></tr><tr><td>Feasibility</td><td>Budget estimate</td><td>±20–30%</td></tr><tr><td>Design</td><td>Detailed estimate</td><td>±10–15%</td></tr><tr><td>Tender</td><td>Bid estimate</td><td>±5–10%</td></tr><tr><td>Construction</td><td>Cost control</td><td>Actual + forecast</td></tr></table>
<h3>3. The estimation process</h3>
<div class="diagram">
  <svg viewBox="0 0 640 220" role="img" aria-label="Six-step cost estimation process">
    <defs>
      <marker id="est" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <polygon points="0,0 9,4.5 0,9" fill="#e93680"/>
      </marker>
    </defs>
    <g font-family="Arial" font-size="11">
      <text x="320" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">The estimation process</text>
      <g>
        <rect x="10" y="60" width="100" height="120" rx="6" fill="#ffe0ee" stroke="#e93680"/>
        <text x="60" y="85" text-anchor="middle" font-weight="bold" fill="#e93680">1. Scope</text>
        <text x="20" y="110" font-size="10" fill="#555">• Drawings</text>
        <text x="20" y="130" font-size="10" fill="#555">• Specs</text>
        <text x="20" y="150" font-size="10" fill="#555">• Assumptions</text>
      </g>
      <g>
        <rect x="120" y="60" width="100" height="120" rx="6" fill="#fff2f7" stroke="#e93680"/>
        <text x="170" y="85" text-anchor="middle" font-weight="bold" fill="#e93680">2. Quantities</text>
        <text x="130" y="110" font-size="10" fill="#555">• Take-off</text>
        <text x="130" y="130" font-size="10" fill="#555">• Measure</text>
        <text x="130" y="150" font-size="10" fill="#555">• Check</text>
      </g>
      <g>
        <rect x="230" y="60" width="100" height="120" rx="6" fill="#fff2f7" stroke="#e93680"/>
        <text x="280" y="85" text-anchor="middle" font-weight="bold" fill="#e93680">3. Rates</text>
        <text x="240" y="110" font-size="10" fill="#555">• Labour</text>
        <text x="240" y="130" font-size="10" fill="#555">• Material</text>
        <text x="240" y="150" font-size="10" fill="#555">• Equipment</text>
      </g>
      <g>
        <rect x="340" y="60" width="100" height="120" rx="6" fill="#fff2f7" stroke="#e93680"/>
        <text x="390" y="85" text-anchor="middle" font-weight="bold" fill="#e93680">4. Extend</text>
        <text x="350" y="110" font-size="10" fill="#555">• Multiply</text>
        <text x="350" y="130" font-size="10" fill="#555">• Summarise</text>
      </g>
      <g>
        <rect x="450" y="60" width="100" height="120" rx="6" fill="#dcecff" stroke="#438bd5"/>
        <text x="500" y="85" text-anchor="middle" font-weight="bold" fill="#2b6cb0">5. Add-ons</text>
        <text x="460" y="110" font-size="10" fill="#555">• Overheads</text>
        <text x="460" y="130" font-size="10" fill="#555">• Risk</text>
        <text x="460" y="150" font-size="10" fill="#555">• Profit</text>
      </g>
      <g>
        <rect x="560" y="60" width="70" height="120" rx="6" fill="#dcecff" stroke="#438bd5"/>
        <text x="595" y="85" text-anchor="middle" font-weight="bold" fill="#2b6cb0">6. Review</text>
        <text x="570" y="110" font-size="10" fill="#555">• Check</text>
        <text x="570" y="130" font-size="10" fill="#555">• Sign-off</text>
      </g>
    </g>
  </svg>
  <div class="diagram-cap">Estimation moves from scope through quantities and rates to a reviewed, signed-off figure.</div>
</div>
<h3>4. Principles of reliable estimating</h3>
<ul>
  <li><b>Clear scope</b> — know what you are pricing.</li>
  <li><b>Traceable quantities</b> — measure from drawings and specs.</li>
  <li><b>Current rates</b> — use up-to-date labour and material prices.</li>
  <li><b>Stated assumptions</b> — record every assumption.</li>
  <li><b>Appropriate accuracy</b> — match estimate detail to stage.</li>
  <li><b>Independent check</b> — have another estimator review.</li>
</ul>
<h3>5. Common estimation errors</h3>
<ul>
  <li>Missing items from the scope.</li>
  <li>Double counting quantities.</li>
  <li>Outdated or unrealistic rates.</li>
  <li>Ignoring waste, wastage and bulking.</li>

}

// Progress tracking helpers (stored in memory/localStorage for instant UI, synced to DB)
const PROGRESS_KEY = 'logi_progress_cache';
function getProgressCache() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch { return {}; }
}
function setProgressCache(cache) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(cache)); }

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  try {
    const res = await fetch(`${API_BASE}/my-progress`, {
      headers: { 'Authorization': `Bearer ${getAuth().token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    const cache = getProgressCache();
    
    // Reset cache for this course before loading fresh data
    Object.keys(cache).forEach(k => {
       if (k.startsWith(COURSE.id)) delete cache[k];
    });

    // Map DB rows into the cache format used by the UI
    if (data.progress) {
      data.progress.forEach(row => {
        const key = `${COURSE.id}_${row.module_id}_${row.lesson_id}`;
        cache[key] = { completed: row.completed, score: row.quiz_score, total: row.quiz_total };
      });
      setProgressCache(cache);
    }
  } catch (e) { console.error('Could not load progress', e); }
}

function isLessonDone(username, mi, li) {
  const cache = getProgressCache();
  return !!cache[`${COURSE.id}_cost_${mi+1}_lesson_${li+1}`]?.completed;
}
function getQuizResult(username, mi) {
  const cache = getProgressCache();
  return cache[`${COURSE.id}_cost_${mi+1}_quiz_1`] || null;
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.completed;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.completed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.completed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

    const u = state.user;
    const result = u ? getQuizResult(u.username, mi) : null;
    return `

        ${result ? `<div class="callout">Previous attempt score: ${result.score}/${result.total}</div>` : ''}

            <b>${qi+1}. ${esc(q.q)}</b>
            ${q.opts.map((opt, oi) => `
              <label data-opt="${oi}" onclick="App.selectOption(${qi},${oi})">
                <input type="radio" name="q${mi}_${qi}" value="${oi}"> ${esc(opt)}
              </label>
            `).join('')}
            <div class="feedback" id="fb_${mi}_${qi}"></div>
          </div>
        `).join('')}
        <button class="btn" style="margin-top:14px;" onclick="App.submitQuiz(${mi})">Submit Answers</button>
        <p id="quizResult_${mi}" style="font-weight:700;margin-top:8px;"></p>
      </div>
    `;

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
    if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`);
    if (lbl) {
      lbl.classList.add('selected');
      const radio = lbl.querySelector('input');
      if (radio) radio.checked = true;
    }
  }

  async function submitQuiz(mi) {
    const u = await currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    let score = 0;
    let answeredAll = true;

    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (!sel) {
        answeredAll = false;
        if (fb) { fb.textContent = 'Please select an answer.'; fb.style.color = 'var(--error)'; }
        return;
      }
      if (parseInt(sel.value) === q.answer) {
        score++;
        if (fb) { fb.textContent = 'Correct!'; fb.style.color = 'var(--success)'; }
      } else {
        if (fb) { fb.textContent = 'Incorrect.'; fb.style.color = 'var(--error)'; }
      }
    });

    const resultEl = document.getElementById('quizResult_' + mi);
    if (!answeredAll) {
      if (resultEl) {
        resultEl.textContent = 'Please answer all questions before submitting.';
        resultEl.style.color = 'var(--error)';
      }
      return;
    }

    const passed = (score / quiz.length * 100) >= COURSE.passMark;

    // Save to Cloudflare D1
    try {
      await fetch(`${API_BASE}/progress`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAuth().token}` },
        body: JSON.stringify({
          moduleId: `cost_${mi+1}`,
          lessonId: `quiz_1`,
          completed: passed ? 1 : 0,
          quizScore: score,
          quizTotal: quiz.length
        })
      });
      await loadStudentData(u, true); // Reload cache
    } catch (e) { console.error(e); }

    if (passed) {
      if (resultEl) {
        resultEl.textContent = `Scored ${score}/${quiz.length}. Passed! ✅`;
        resultEl.style.color = 'var(--success)';
      }

      const nextBtn = document.getElementById('nextBtn_' + mi);
      if (nextBtn) {
        nextBtn.disabled = false;
        nextBtn.classList.remove('btn-secondary');
        nextBtn.classList.add('btn');
        nextBtn.style.opacity = '1';
        const isLast = (mi + 1 >= COURSE.modules.length);
        nextBtn.textContent = isLast
          ? (courseCompleted(u.username) ? 'View Certificate →' : 'Finish →')
          : 'Next Module →';
      }
    } else {
      if (resultEl) {
        resultEl.textContent = `Scored ${score}/${quiz.length}. Try again.`;
        resultEl.style.color = 'var(--error)';
      }
    }
  }

        const res = await fetch(`${API_BASE}/certificates`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAuth().token}` },
          body: JSON.stringify({
            courseId: COURSE.id,
            courseTitle: COURSE.title,
            studentName: u.fullName || u.email
          })
        });
        const data = await res.json();
        if (data.success) cert = data.certificate;
      } catch (e) { console.error(e); }
    }

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('certificate')}
        <main class="main-panel" style="background: #fbfafc;">
          <h1>My certificate</h1>
          <p class="subtitle">Your certificate becomes available once you complete all lessons and pass all module assessments.</p>

          ${cert ? `
            <div class="cert-controls">
              <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
              <button class="btn" onclick="App.downloadCertificateImage()">📥 Download as PNG</button>
            </div>
            <div class="cert-display-area">
              <div class="cert-scaler" id="certScaler">
                <div class="cert-wrapper" id="printableCert">
                  <img class="cert-watermark" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png" alt="Watermark" crossorigin="anonymous">
                  <div class="cert-main">
                    <div class="cert-header">
                      <img class="cert-header-logo" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png" alt="LOGI Logo" crossorigin="anonymous" onerror="this.style.display='none'">
                      <div class="cert-logo-sub">Living Oracles<br>Global Institute</div>
                    </div>
                    <div class="cert-date">${fmtDate(cert.date)}</div>
                    <div class="cert-name">${esc(cert.studentName)}</div>
                    <div class="cert-completion">has successfully completed</div>
                    <div class="cert-course-title">${esc(cert.courseTitle)}</div>
                    <div class="cert-description">
                      This course has been developed and delivered by Living Oracles Global Institute, covering the purposes and types of estimating, quantity take-off, rate build-up from labour, materials and equipment, overheads, profit, contingency, and cost control.
                    </div>
                    <div class="cert-signature-area">
                      <img class="cert-signature-img" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/president-signature.svg" alt="Prophet Ing Stephen Adusei Signature" crossorigin="anonymous">
                      <div class="cert-signer-name">Prophet Ing Stephen Adusei</div>
                      <div class="cert-signer-title">Program Director | Living Oracles Global Institute</div>
                    </div>
                    <div class="cert-footer-info">
                      <div class="cert-footer-box">
                        <div class="cert-footer-logo">LOGI</div>
                        <div>Living Oracles Global Institute is committed to delivering excellence in education and professional development.</div>
                      </div>
                      <div class="cert-footer-box" style="border-left: 1px solid #ccc; padding-left: 15px;">
                        <div>This is a digitally generated certificate. Authenticity can be verified by scanning the QR code.</div>
                      </div>
                    </div>
                  </div>
                  <div class="cert-sidebar">
                    <div class="cert-partner-box">LOGI</div>
                    <div class="cert-sidebar-pattern"></div>
                    <div class="cert-verify-area">
                      <div class="cert-verify-text">Scan to verify<br>this certificate</div>
                      <img class="cert-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(cert.id)}" alt="QR Code" crossorigin="anonymous">
                      <div class="cert-blockchain">Blockchain ID:<br>${esc(cert.hash)}</div>
                    </div>
                    <div class="cert-bottom-block"></div>
                  </div>
                </div>
              </div>
            </div>
          ` : `
            <div class="card" style="text-align:center;padding:40px 20px; background:white;">
              <div style="font-size:48px;margin-bottom:12px;">🔒</div>
              <h2>Certificate not yet available</h2>
              <p>You need to complete all lessons and pass every module assessment to unlock your certificate.</p>
              <button class="btn" onclick="App.openCourse(0,0)">Continue learning</button>
            </div>
          `}
        </main>
      </div>
    `;
    renderNav();
    if (cert) {
      scaleCertificate();
      window.addEventListener('resize', scaleCertificate);
    }
  }

  function scaleCertificate() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const container = scaler.parentElement;
    const containerWidth = container.clientWidth;
    const certWidth = 1000;
    if (containerWidth < certWidth) {
      const scale = containerWidth / certWidth;
      scaler.style.transform = `scale(${scale})`;
      scaler.style.marginBottom = `-${(707 * (1 - scale))}px`;
    } else {
      scaler.style.transform = 'none';
      scaler.style.marginBottom = '0';
    }
  }

  function downloadCertificateImage() {
    const cert = document.getElementById('printableCert');
    const scaler = document.getElementById('certScaler');
    if (!cert || !scaler) return;
    const btn = document.querySelector('button[onclick="App.downloadCertificateImage()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ Generating...';
    btn.disabled = true;
    const originalTransform = scaler.style.transform;
    const originalMargin = scaler.style.marginBottom;
    scaler.style.transform = 'none';
    scaler.style.marginBottom = '0';
    html2canvas(cert, {
      scale: 2, useCORS: true, backgroundColor: '#fafafa',
      width: 1000, height: 707, windowWidth: 1000, windowHeight: 707,
      onclone: (clonedDoc) => {
        const desc = clonedDoc.querySelector('.cert-description');
        if (desc) { desc.style.wordSpacing = 'normal'; desc.style.letterSpacing = 'normal'; }
      }
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate_Construction_Cost_Estimation.png';
      link.href = imgData;
      link.click();
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error('Error generating image:', err);
      alert('Failed to generate image. Please ensure you are connected to the internet so the external signature and QR code can load.');
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }

  async function showDiscussion() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'discussion';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('discussion')}
        <main class="main-panel">
          <h1>Discussion Forum</h1>
          <p class="subtitle">Ask questions and share ideas.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  async function showAnnouncements() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'announcements';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('announcements')}
        <main class="main-panel">
          <h1>Announcements</h1>
          <p class="subtitle">Important updates from your instructor.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  function goHome() {
    closeMobileMenu();
    if (currentSessionUser) showDashboard();
    else showLanding();
  }

  async function init() {
    const u = await currentUser();
    if (u) {
      await loadStudentData(u, true);
      await showDashboard();
    } else {
      showLanding();
    }
  }

  return {
    init, showLanding, showLogin, showRegister, doLogin, doRegister, logout,
    showDashboard, showCatalogue, showCertificate, showDiscussion, showAnnouncements,
    openCourse, prevLesson, nextLesson, markCurrentLesson, submitQuiz, selectOption,
    alertLocked, previousFromAssessment, continueAfterAssessment, goHome,
    toggleAccordion, openAssessment, toggleMobileMenu, closeMobileMenu,
    toggleModuleMenu, closeModuleMenu, navigate, downloadCertificateImage
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
</body>
</html>
