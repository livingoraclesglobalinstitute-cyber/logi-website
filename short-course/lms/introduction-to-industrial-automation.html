  <style>

      --pd: #e93680;
      --ink: #34343b;
      --muted: #777780;
      --line: #e9e8ef;
      --soft: #f5f5f8;

      position: sticky;
      top: 0;

    .btn {

      border: 0;
      border-radius: 24px;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;

      display: inline-flex;
      align-items: center;
      gap: 6px;

    .btn-outline {

      cursor: pointer;
      font-size: 14px;

    .auth-card {

      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 36px 32px;

    .auth-card h2 { margin: 0 0 6px; font-size: 24px; }
    .auth-card p.muted { margin: 0 0 22px; font-size: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }

      font-size: 14px;

    .error-msg { color: var(--error); font-size: 13px; margin-top: 8px; min-height: 18px; }

      padding-top: 18px;
      margin-top: 24px;

      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      position: sticky;
      top: 80px;

    .module-side .sidehead { padding: 16px; border-bottom: 1px solid var(--line); }
    .module-side .sidehead h2 { font-size: 16px; margin: 0; }
    .progress-bar { height: 7px; background: #f0edf3; border-radius: 9px; margin-top: 8px; overflow: hidden; }
    .progress-bar span { display: block; height: 100%; width: 0; background: var(--p); transition: width 0.3s; }
    .module-side .modules { padding: 8px; max-height: calc(100vh - 200px); overflow-y: auto; }

    .mod-section { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    .mod-section:last-child { border-bottom: none; }
    .mod-header {
      width: 100%;
      text-align: left;
      background: white;
      border: 0;
      padding: 12px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      color: var(--ink);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.1s;
    }
    .mod-header:hover { background: #fff3f8; color: var(--pd); }
    .mod-header.locked { color: #aaa; cursor: not-allowed; }
    
    .mod-lessons-list {
      padding: 4px 0 8px 10px;
      display: none;
    }
    .mod-section.open .mod-lessons-list { display: block; }

    .lesson-item-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: white;
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #555;
      cursor: pointer;
      transition: background 0.1s;
    }
    .lesson-item-btn:hover { background: #fafafa; color: var(--pd); }
    .lesson-item-btn.active { color: var(--pd); background: #fff0f6; font-weight: 700; }
    .lesson-item-btn.done { color: var(--success); }

    /* Overlay for Mobile Sidebar Drawer */
    .drawer-overlay {
      display: none;
      position: fixed;
      top: 66px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 35;
    }
    .drawer-overlay.open { display: block; }

    /* Module Drawer Overlay for Course Content on Mobile */
    .module-overlay {
      display: none;
      position: fixed;
      top: 66px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 45;
    }
    .module-overlay.open { display: block; }

    /* Floating / Header button for Course Modules on Mobile */
    .mobile-module-toggle {
      display: none;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1.5px solid var(--p);
      color: var(--pd);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .mobile-module-toggle:hover { background: #fff0f6; }

    /* =========================================
       CERTIFICATE STYLES (Landscape, 1000x707)
       ========================================= */
    .cert-display-area {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
      padding: 10px 0;
    }
    .cert-scaler {
      transform-origin: top center;
      width: 1000px;
      height: 707px;
    }
    .cert-wrapper {
      background: #fafafa;
      width: 1000px;
      height: 707px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: grid;
      grid-template-columns: 1fr 220px;
      position: relative;
      overflow: hidden;
      color: var(--ink);
    }
    .cert-watermark {
      position: absolute;
      top: 50%;
      left: 45%;
      transform: translate(-50%, -50%);
      width: 550px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;

    .cert-main {
      padding: 40px 60px 30px 60px;
      display: flex;
      flex-direction: column;

    .cert-header-logo { height: 45px; width: auto; object-fit: contain; }
    .cert-logo-sub { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; line-height: 1.2; font-weight: 600; }

    .cert-signature-img { height: 55px; width: auto; object-fit: contain; align-self: flex-start; margin-bottom: 15px; }

    .cert-footer-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 15px; font-size: 10px; color: #777; line-height: 1.5; }

    .cert-sidebar-pattern { flex: 1; position: relative; background-image: linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.05) 75%, transparent 75%, transparent), linear-gradient(45deg, rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 20px 20px, 100% 100%; background-position: 0 0, 10px 10px; }
    .cert-verify-area { padding: 25px 20px; text-align: center; background: white; }

    .cert-qr { width: 100px; height: 100px; margin: 0 auto 15px; display: block; }
    .cert-blockchain { font-size: 9px; color: #888; font-family: monospace; word-break: break-all; line-height: 1.4; }
    .cert-bottom-block { height: 40px; background: #c2185b; }
    .cert-controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }

    /* =========================================
       RESPONSIVE BREAKPOINTS (Mobile & Tablet)
       ========================================= */
    @media (max-width: 900px) {
      .mobile-nav-toggle { display: inline-flex; }
      
      .dash-layout { grid-template-columns: 1fr; }
      
      .sidebar {
        position: fixed;

      }
      .module-side.open {
        transform: translateX(0);
      }
      .module-side .modules { max-height: calc(100vh - 140px); }
    }

    @media (max-width: 500px) {
      .auth-card { padding: 24px 18px; }
      .main-panel h1 { font-size: 22px; }
      .brand { font-size: 18px; }
      .nav-actions { gap: 6px; }
      .btn, .btn-outline, .btn-secondary { font-size: 12px; padding: 7px 12px; }

    @media print {
      @page { size: landscape; margin: 0; }

      .top, .sidebar, .mobile-nav-toggle, .drawer-overlay, .main-panel h1, .subtitle, .cert-controls, footer, .notice { display: none !important; }

      .cert-wrapper { box-shadow: none; width: 1000px !important; height: 707px !important; border: none; margin: 0 auto; background: #fafafa !important; }
    }

  title: 'Introduction to Industrial Automation',
  desc: 'This introductory course explores the principles and practical applications of Industrial Automation. Learners discover how sensors, actuators, programmable logic controllers (PLCs), industrial robots and monitoring systems work together to control and improve industrial processes.',

  modules: [
    {

        title: "Understanding Industrial Automation",
        duration: "45 minutes",
        html: `<p>Industrial automation uses control systems and technology to operate industrial processes with minimal direct human intervention. It combines sensors, actuators, controllers, communication networks and software to improve consistency, safety, productivity and quality.</p>
<div class="callout"><b>Core principle:</b> Automation should improve reliability, safety and efficiency — not simply replace people. Well-designed systems keep humans in control of decisions, safety and exceptions.</div>
<h3>Learning outcomes</h3><p>By the end of this lesson, you should be able to define industrial automation, identify its benefits, recognise the main system components and explain where automation is applied.</p>
<h3>1. What is industrial automation?</h3><p>Industrial automation applies control technology to monitor and regulate machines and processes. A system may measure temperature, pressure or position, decide whether action is needed and then operate a valve, motor or robot.</p>
<h3>2. Benefits of automation</h3><ul><li><b>Consistency:</b> repeated tasks are performed with less variation.</li><li><b>Productivity:</b> faster cycle times and continuous operation.</li><li><b>Safety:</b> people are removed from dangerous tasks.</li><li><b>Quality:</b> precise control reduces defects.</li><li><b>Data:</b> systems record performance for analysis and improvement.</li></ul>

function uid() { return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }); }
function nowISO() { return new Date().toISOString(); }
function esc(s) { return typeof s !== 'string' ? s : s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let currentSessionUser = null;

function syncLocalUser(authUser) {
  if (!authUser) { currentSessionUser = null; return null; }
  const email = (authUser.email || '').toLowerCase();
  currentSessionUser = {
    id: authUser.id,
    username: email,
    email,
    fullName: authUser.user_metadata?.full_name || email,
    role: 'student'
  };
  return currentSessionUser;
}

async function currentUser() {
  if (currentSessionUser) return currentSessionUser;
  const { data, error } = await supabaseClient.auth.getSession();
  if (error) return null;
  return data.session?.user ? syncLocalUser(data.session.user) : null;
}

let studentDataLoadedFor = null;
let studentDataSyncWarning = '';

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  if (!force && studentDataLoadedFor === user.id) return;

  const email = (user.email || user.username || '').toLowerCase();
  const localProgress = getProgress(email);

  const [progressResult, enrolmentResult] = await Promise.all([
    supabaseClient.from('progress').select('module_index,lesson_index,quiz_score,quiz_total,passed,completed').eq('user_id', user.id).eq('course_id', COURSE.id),
    supabaseClient.from('enrolments').select('course_id').eq('user_id', user.id)
  ]);

  if (!progressResult.error && Array.isArray(progressResult.data)) {
    const merged = getProgress(email);
    progressResult.data.forEach(row => {
      const key = row.module_index + '-' + row.lesson_index;
      if (row.completed) merged.lessons[key] = true;
      if (row.quiz_score !== null && row.quiz_score !== undefined) {
        merged.quizzes[row.module_index] = { score: row.quiz_score, total: row.quiz_total, passed: !!row.passed };
      }
    });
    saveProgress(email, merged);
  }

  studentDataLoadedFor = user.id;
}

async function saveProgressToSupabase(username, moduleIndex, lessonIndex) {
  const user = currentSessionUser;
  if (!user?.id) return;
  const p = getProgress(username);
  const quiz = p.quizzes[moduleIndex];
  const row = {
    user_id: user.id, course_id: COURSE.id, module_index: moduleIndex, lesson_index: lessonIndex,
    completed: !!p.lessons[moduleIndex + '-' + lessonIndex],
    quiz_score: quiz ? quiz.score : null, quiz_total: quiz ? quiz.total : null, passed: quiz ? !!quiz.passed : false
  };
  await supabaseClient.from('progress').upsert(row, { onConflict: 'user_id,course_id,module_index,lesson_index' });
}

function getProgress(username) {
  const all = load(STORE.progress, {});
  if (!all[username] || typeof all[username] !== 'object') all[username] = {};
  return all[username][COURSE.id] || { lessons: {}, quizzes: {} };
}
function saveProgress(username, p) {
  const all = load(STORE.progress, {});
  if (!all[username] || typeof all[username] !== 'object') all[username] = {};
  all[username][COURSE.id] = p;
  save(STORE.progress, all);
}
function getEnrolments(username) { return load(STORE.enrolments, {})[username] || []; }
function enrol(username, courseId) {
  const e = load(STORE.enrolments, {});
  if (!e[username]) e[username] = [];
  if (!e[username].includes(courseId)) e[username].push(courseId);
  save(STORE.enrolments, e);
}
function getCerts(username) { return load(STORE.certificates, {})[username] || []; }
function addCert(username, cert) {
  const c = load(STORE.certificates, {});
  if (!c[username]) c[username] = [];
  c[username].push(cert);
  save(STORE.certificates, c);
}

function isLessonDone(username, mi, li) { return !!getProgress(username).lessons[mi + '-' + li]; }
function markLessonDone(username, mi, li) {
  const p = getProgress(username);
  p.lessons[mi + '-' + li] = true;
  saveProgress(username, p);
  saveProgressToSupabase(username, mi, li);
}
function getQuizResult(username, mi) { return getProgress(username).quizzes[mi] || null; }
function saveQuizResult(username, mi, score, total) {
  const p = getProgress(username);
  p.quizzes[mi] = { score, total, passed: score / total * 100 >= COURSE.passMark };
  saveProgress(username, p);
  saveProgressToSupabase(username, mi, 0);
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.passed;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.passed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.passed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

function generateCertificate(username) {
  if (!username) return null;
  const certs = getCerts(username);
  let cert = certs.find(c => c.courseId === COURSE.id);
  if (cert) return cert;
  
  const hash = Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('');
  let studentName = currentSessionUser?.fullName || username;

  cert = {
    id: 'LOGI-' + COURSE.id.toUpperCase() + '-' + Date.now().toString(36).toUpperCase(),
    hash: hash,
    courseId: COURSE.id,
    courseTitle: COURSE.title,
    studentName: studentName,
    date: nowISO(),
    issuedBy: 'Living Oracles Global Institute'
  };
  addCert(username, cert);
  return cert;
}

          <div class="card">
            <h2>Introduction to Industrial Automation</h2>
            <div class="progress-bar" style="margin:14px 0 8px;"><span style="width:${pct}%;"></span></div>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px;">
              <span style="font-size:13px;color:var(--muted);">${pct}% complete</span>
              <button class="btn" onclick="App.openCourse(${next.mi},${next.li})">${pct===0?'Start course':'Continue learning'}</button>
            </div>
          </div>
        </main>
      </div>
    `;
    renderNav();
  }

  async function showCatalogue() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'catalogue';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('catalogue')}
        <main class="main-panel">
          <h1>Course catalogue</h1>
          <div class="catalogue-grid" style="margin-top:16px;">
            <div class="course-tile">
              <h3>${esc(COURSE.title)}</h3>
              <p class="desc">${esc(COURSE.desc)}</p>
              <button class="btn" onclick="App.openCourse(0,0)">Open course</button>
            </div>
          </div>
        </main>
      </div>
    `;
    renderNav();
  }

  async function openCourse(mi, li) {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'course';
    state.activeCourseModule = mi;
    state.activeCourseLesson = li;
    state.activeAssessment = false;
    closeModuleMenu();
    renderCourse();
  }

  async function renderCourse() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    
    const username = u.username;
    const mi = state.activeCourseModule;
    const li = state.activeCourseLesson;
    const mod = COURSE.modules[mi];
    if (!mod) { showDashboard(); return; }
    
    if (isModuleLocked(username, mi)) {
      alert('This module is locked. Pass the previous module assessment to unlock it.');
      openCourse(Math.max(0, mi-1), 0);
      return;
    }
    const lesson = mod.lessons[li];
    if (state.activeAssessment) { renderAssessmentScreen(); return; }

    const pct = courseProgressPct(username);
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="inner" style="padding:16px 0 48px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <button class="mobile-module-toggle" onclick="App.toggleModuleMenu()">
            📚 Course Content (${pct}%)
          </button>
        </div>
        <div class="course-layout">
          <aside class="module-side">
            <div class="sidehead" style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <h2>Course content</h2>
                <div style="font-size:12px;color:var(--muted);">${pct}% completed</div>
                <div class="progress-bar"><span style="width:${pct}%;"></span></div>
              </div>
              <button onclick="App.closeModuleMenu()" class="mobile-module-toggle" style="display:none;padding:2px 8px;font-size:14px;border:0;" id="closeModBtn">✕</button>
            </div>
            <div class="modules">
              ${COURSE.modules.map((m, i) => {
                const locked = isModuleLocked(username, i);
                const isOpen = (i === mi);
                const modPassed = getQuizResult(username, i)?.passed;
                return `
                  <div class="mod-section ${isOpen ? 'open' : ''}">
                    <button class="mod-header ${locked ? 'locked' : ''}"
                      onclick="${locked ? `App.alertLocked(${i})` : `App.toggleAccordion(${i})`}">
                      <span>Module ${i+1}: ${esc(m.title)}</span>
                      <span>${locked ? '🔒' : (isOpen ? '▲' : '▼')}</span>
                    </button>
                    <div class="mod-lessons-list">
                      ${m.lessons.map((l, j) => {
                        const done = isLessonDone(username, i, j);
                        const isCurrent = (i === mi && j === li && !state.activeAssessment);
                        return `
                          <button class="lesson-item-btn ${isCurrent ? 'active' : ''} ${done ? 'done' : ''}"
                            onclick="App.openCourse(${i}, ${j})">
                            <span>${done ? '✓' : '📖'}</span>
                            <span style="flex:1;">${esc(l.title)}</span>
                          </button>
                        `;
                      }).join('')}
                      <button class="lesson-item-btn ${i === mi && state.activeAssessment ? 'active' : ''}"
                        onclick="${locked ? `App.alertLocked(${i})` : `App.openAssessment(${i})`}">
                        <span>${modPassed ? '✅' : '📝'}</span>
                        <span style="flex:1;">Module ${i+1} Assessment</span>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <div style="font-size:12px;color:var(--muted);text-transform:uppercase;">Module ${mi+1} · ${esc(lesson.duration)}</div>
              <h1 style="font-size:24px;line-height:1.2;margin:6px 0 18px;">${esc(lesson.title)}</h1>
              <div>${lesson.html}</div>
              <div class="actions">
                <button class="btn-secondary" onclick="App.prevLesson()">← Previous</button>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn" onclick="App.markCurrentLesson()">${isLessonDone(username, mi, li) ? 'Completed ✓' : 'Mark complete'}</button>
                  <button class="btn-secondary" onclick="App.nextLesson()">Next →</button>
                </div>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  function toggleAccordion(i) {
    if (state.activeCourseModule === i && !state.activeAssessment) {
      const modSections = document.querySelectorAll('.mod-section');
      if (modSections[i]) {
        modSections[i].classList.toggle('open');
      }
      return;
    }
    state.activeCourseModule = i;
    state.activeCourseLesson = 0;
    state.activeAssessment = false;
    renderCourse();
  }

  function openAssessment(i) {
    state.activeCourseModule = i;
    state.activeAssessment = true;
    closeModuleMenu();
    renderAssessmentScreen();
  }

  async function renderAssessmentScreen() {
    const u = await currentUser();
    if (!u) return;
    const mi = state.activeCourseModule;
    const mod = COURSE.modules[mi];
    const quiz = mod.lessons[0].quiz || [];
    const username = u.username;
    const result = getQuizResult(username, mi);
    const passed = !!result?.passed;
    const pct = courseProgressPct(username);

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="inner" style="padding:16px 0 48px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <button class="mobile-module-toggle" onclick="App.toggleModuleMenu()">
            📚 Course Content (${pct}%)
          </button>
        </div>
        <div class="course-layout">
          <aside class="module-side">
            <div class="sidehead" style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <h2>Course content</h2>
                <div class="progress-bar"><span style="width:${pct}%;"></span></div>
              </div>
              <button onclick="App.closeModuleMenu()" style="background:none;border:0;font-size:18px;cursor:pointer;">✕</button>
            </div>
            <div class="modules">
              ${COURSE.modules.map((m,i)=>{
                const locked=isModuleLocked(username,i);
                const isOpen = (i === mi);
                return `
                  <div class="mod-section ${isOpen ? 'open' : ''}">
                    <button class="mod-header ${locked?'locked':''}" onclick="${locked?`App.alertLocked(${i})`:`App.toggleAccordion(${i})`}">
                      <span>Module ${i+1}: ${esc(m.title)}</span>
                      <span>${locked ? '🔒' : (isOpen ? '▲' : '▼')}</span>
                    </button>
                    <div class="mod-lessons-list">
                      ${m.lessons.map((l,j)=>`
                        <button class="lesson-item-btn" onclick="App.openCourse(${i},${j})">
                          <span>📖</span><span style="flex:1;">${esc(l.title)}</span>
                        </button>
                      `).join('')}
                      <button class="lesson-item-btn active" onclick="App.openAssessment(${i})">
                        <span>📝</span><span style="flex:1;">Module ${i+1} Assessment</span>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <h2>Module ${mi+1} Assessment</h2>
              ${renderQuizUI(mi, quiz)}
              <div class="actions">
                <button class="btn-secondary" onclick="App.previousFromAssessment()">← Back to lesson</button>
                <button class="btn ${passed?'':'btn-secondary'}" ${passed?'':'disabled style="opacity:.5;"'} onclick="App.continueAfterAssessment()">Next Module →</button>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  function renderQuizUI(mi, quiz) {
    const u = state.user;
    const result = getQuizResult(u.username, mi);
    return `
      <div style="margin-top:16px;">
        ${result ? `<div class="callout">Previous attempt score: ${result.score}/${result.total}</div>` : ''}
        ${quiz.map((q, qi) => `
          <div class="q" data-qindex="${qi}">
            <b>${qi+1}. ${esc(q.q)}</b>
            ${q.opts.map((opt, oi) => `
              <label data-opt="${oi}" onclick="App.selectOption(${qi},${oi})">
                <input type="radio" name="q${mi}_${qi}" value="${oi}"> ${esc(opt)}
              </label>
            `).join('')}
            <div class="feedback" id="fb_${mi}_${qi}"></div>
          </div>
        `).join('')}
        <button class="btn" style="margin-top:14px;" onclick="App.submitQuiz(${mi})">Submit Answers</button>
        <p id="quizResult_${mi}" style="font-weight:700;margin-top:8px;"></p>
      </div>
    `;
  }

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
    if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`);
    if (lbl) {
      lbl.classList.add('selected');
      const radio = lbl.querySelector('input');
      if (radio) radio.checked = true;
    }
  }

  async function submitQuiz(mi) {
    const u = await currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    let score = 0;
    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (sel && parseInt(sel.value) === q.answer) {
        score++;
        if(fb) { fb.textContent = 'Correct!'; fb.style.color = 'var(--success)'; }
      } else if (fb) {
        fb.textContent = 'Incorrect.'; fb.style.color = 'var(--error)';
      }
    });
    saveQuizResult(u.username, mi, score, quiz.length);
    const passed = (score / quiz.length * 100) >= COURSE.passMark;
    if (passed) {
      markLessonDone(u.username, mi, 0);
      if (courseCompleted(u.username)) generateCertificate(u.username);
    }
    document.getElementById('quizResult_' + mi).textContent = `Scored ${score}/${quiz.length}. ${passed ? 'Passed!' : 'Try again.'}`;
  }

  function alertLocked(i) { alert('Module ' + (i+1) + ' is locked until you pass the previous assessment.'); }
  function previousFromAssessment() { state.activeAssessment = false; renderCourse(); }
  function continueAfterAssessment() {
    const mi = state.activeCourseModule;
    if (mi + 1 < COURSE.modules.length) {
      openCourse(mi + 1, 0);
    } else {
      showDashboard();
    }
  }

  async function markCurrentLesson() {
    const u = await currentUser();
    if (!u) return;
    markLessonDone(u.username, state.activeCourseModule, state.activeCourseLesson);
    renderCourse();
  }

  async function prevLesson() {
    let mi = state.activeCourseModule, li = state.activeCourseLesson - 1;
    if (li < 0) { mi--; li = 0; }
    if (mi >= 0) openCourse(mi, li);
  }

  async function nextLesson() {
    const mi = state.activeCourseModule, li = state.activeCourseLesson + 1;
    if (li < COURSE.modules[mi].lessons.length) openCourse(mi, li);
    else { state.activeAssessment = true; renderCourse(); }
  }

  async function showCertificate() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'certificate';
    const cert = generateCertificate(u.username);
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('certificate')}
        <main class="main-panel">
          <h1>My Certificate</h1>
          ${cert ? `<p>Certificate issued: <b>${cert.id}</b></p>` : `<p>Complete all modules to unlock your certificate.</p>`}
        </main>
      </div>
    `;
    renderNav();
  }

  async function showDiscussion() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'discussion';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('discussion')}
        <main class="main-panel">
          <h1>Discussion Forum</h1>
          <p class="subtitle">Ask questions and share ideas.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  async function showAnnouncements() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'announcements';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('announcements')}
        <main class="main-panel">
          <h1>Announcements</h1>
          <p class="subtitle">Important updates from your instructor.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  function goHome() {
    closeMobileMenu();
    if (currentSessionUser) showDashboard();
    else showLanding();
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (data?.session?.user) {
      syncLocalUser(data.session.user);
      await loadStudentData(currentSessionUser, true);
      await showDashboard();
    } else {
      showLanding();
    }
  }

  return {
    init, showLanding, showLogin, showRegister, doLogin, doRegister, logout,
    showDashboard, showCatalogue, showCertificate, showDiscussion, showAnnouncements,
    openCourse, prevLesson, nextLesson, markCurrentLesson, submitQuiz, selectOption,
    alertLocked, previousFromAssessment, continueAfterAssessment, goHome,
    toggleAccordion, openAssessment, toggleMobileMenu, closeMobileMenu,
    toggleModuleMenu, closeModuleMenu, navigate
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
</body>
</html>
