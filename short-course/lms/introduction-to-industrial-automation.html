        html: `<p>Industrial automation uses control systems and technology to operate industrial processes with minimal direct human intervention. It combines sensors, actuators, controllers, communication networks and software to improve consistency, safety, productivity and quality.</p>
<div class="callout"><b>Core principle:</b> Automation should improve reliability, safety and efficiency — not simply replace people. Well-designed systems keep humans in control of decisions, safety and exceptions.</div>
<h3>Learning outcomes</h3><p>By the end of this lesson, you should be able to define industrial automation, identify its benefits, recognise the main system components and explain where automation is applied.</p>
<h3>1. What is industrial automation?</h3><p>Industrial automation applies control technology to monitor and regulate machines and processes. A system may measure temperature, pressure or position, decide whether action is needed and then operate a valve, motor or robot. Automation can be fixed (dedicated to one task), programmable (reconfigurable) or flexible (adaptable to changing products).</p>
<h3>2. Benefits of automation</h3><ul><li><b>Consistency:</b> repeated tasks are performed with less variation.</li><li><b>Productivity:</b> faster cycle times and continuous operation.</li><li><b>Safety:</b> people are removed from dangerous tasks.</li><li><b>Quality:</b> precise control reduces defects.</li><li><b>Data:</b> systems record performance for analysis and improvement.</li></ul>
<h3>3. Main components</h3><table class="compare"><tr><th>Component</th><th>Role</th></tr><tr><td>Sensors</td><td>Measure physical conditions such as temperature, pressure, flow and position.</td></tr><tr><td>Actuators</td><td>Carry out actions — motors, valves, cylinders, relays.</td></tr><tr><td>Controllers</td><td>Process information and decide actions — PLCs, DCS, microcontrollers.</td></tr><tr><td>Communication</td><td>Exchange data between devices over industrial networks.</td></tr><tr><td>HMI</td><td>Interface for operators to view and control the process.</td></tr></table>
<h3>4. Where automation is used</h3><p>Automation is used in manufacturing assembly, food processing, water treatment, power generation, mining, pharmaceutical production, packaging, warehousing and building services.</p>

        html: `<p>Automation depends on reliable sensing, accurate actuation and effective drives. Sensors detect conditions, actuators convert signals into physical action, and drives control motors and movement.</p>
<h3>1. Sensor types</h3><table class="compare"><tr><th>Sensor</th><th>What it detects</th><th>Example use</th></tr><tr><td>Inductive proximity</td><td>Metal objects</td><td>Detecting a metal part on a conveyor</td></tr><tr><td>Capacitive proximity</td><td>Many materials, including liquids</td><td>Level detection</td></tr><tr><td>Photoelectric</td><td>Presence or absence via light</td><td>Counting products</td></tr><tr><td>Temperature (RTD/thermocouple)</td><td>Temperature</td><td>Process control</td></tr><tr><td>Pressure transducer</td><td>Pressure</td><td>Pump monitoring</td></tr><tr><td>Flow sensor</td><td>Flow rate</td><td>Piping systems</td></tr><tr><td>Limit switch</td><td>Mechanical position</td><td>End-of-travel detection</td></tr></table>
<h3>2. Signal types</h3><p><b>Digital (discrete)</b> signals are ON/OFF — e.g., a switch closed or open. <b>Analog</b> signals vary continuously — e.g., 4–20 mA or 0–10 V representing pressure or temperature.</p>
<h3>3. Actuators</h3><ul><li><b>Electric motors:</b> AC induction motors, DC motors, servo and stepper motors.</li><li><b>Pneumatic actuators:</b> cylinders and rotary actuators driven by compressed air.</li><li><b>Hydraulic actuators:</b> used where high force is needed.</li><li><b>Solenoid valves:</b> control flow direction in fluid systems.</li><li><b>Relays and contactors:</b> switch electrical loads.</li></ul>
<h3>4. Motor drives</h3><p>Variable frequency drives (VFDs) control AC motor speed by adjusting frequency and voltage. Servo drives provide precise position and speed control for robotics and CNC applications. Stepper drives provide discrete movement with good positioning for lighter loads.</p>

/* ---------- Helpers ---------- */
function uid() {
  return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
}
function nowISO() { return new Date().toISOString(); }
function esc(s) {
  if (typeof s !== 'string') return s;
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- Supabase Session / user ---------- */
let currentSessionUser = null;

function syncLocalUser(authUser) {
  if (!authUser) {
    currentSessionUser = null;
    return null;
  }

  const email = (authUser.email || '').toLowerCase();

  currentSessionUser = {
    id: authUser.id,
    username: email,
    email,
    fullName: authUser.user_metadata?.full_name || email,
    role: 'student'
  };

  return currentSessionUser;
}

async function currentUser() {
  if (currentSessionUser) return currentSessionUser;

  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    console.error('Unable to read Supabase session:', error.message);
    return null;
  }

  return data.session?.user ? syncLocalUser(data.session.user) : null;
}

/* ---------- Cross-device learning data ---------- */
let studentDataLoadedFor = null;
let studentDataSyncWarning = '';

function isPermissionError(error) {
  const message = String(error?.message || '').toLowerCase();
  return error?.code === '42501' || message.includes('permission denied') ||
    message.includes('row-level security') || message.includes('not allowed');
}

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  if (!force && studentDataLoadedFor === user.id) return;

  const email = (user.email || user.username || '').toLowerCase();
  const localProgress = getProgress(email);
  const localEnrolments = getEnrolments(email);

  const [progressResult, enrolmentResult] = await Promise.all([
    supabaseClient.from('progress')
      .select('module_index,lesson_index,quiz_score,quiz_total,passed,completed')
      .eq('user_id', user.id).eq('course_id', COURSE.id),
    supabaseClient.from('enrolments')
      .select('course_id').eq('user_id', user.id)
  ]);

  const denied = [];
  if (progressResult.error) {
    console.warn('LOGI progress could not be loaded:', progressResult.error.message);
    if (isPermissionError(progressResult.error)) denied.push('progress');
  }
  if (enrolmentResult.error) {
    console.warn('LOGI enrolments could not be loaded:', enrolmentResult.error.message);
    if (isPermissionError(enrolmentResult.error)) denied.push('enrolments');
  }

  // Merge cloud progress into the existing local cache.
  if (!progressResult.error && Array.isArray(progressResult.data)) {
    const merged = getProgress(email);
    progressResult.data.forEach(row => {
      const key = row.module_index + '-' + row.lesson_index;
      if (row.completed) merged.lessons[key] = true;
      if (row.quiz_score !== null && row.quiz_score !== undefined) {
        merged.quizzes[row.module_index] = {
          score: row.quiz_score,
          total: row.quiz_total,
          passed: !!row.passed
        };
      }
    });
    saveProgress(email, merged);

    // If the cloud has no progress yet, migrate this browser's existing records.
    if (progressResult.data.length === 0) {
      const rows = [];
      Object.entries(localProgress.lessons || {}).forEach(([key, completed]) => {
        if (!completed) return;
        const [mi, li] = key.split('-').map(Number);
        if (Number.isInteger(mi) && Number.isInteger(li)) {
          rows.push({
            user_id: user.id, course_id: COURSE.id,
            module_index: mi, lesson_index: li, completed: true
          });
        }
      });
      Object.entries(localProgress.quizzes || {}).forEach(([moduleKey, quiz]) => {
        const mi = Number(moduleKey);
        if (!Number.isInteger(mi) || !quiz) return;
        const existing = rows.find(row => row.module_index === mi && row.lesson_index === 0);
        const row = existing || {
          user_id: user.id, course_id: COURSE.id,
          module_index: mi, lesson_index: 0, completed: !!localProgress.lessons?.[mi + '-0']
        };
        row.quiz_score = Number(quiz.score);
        row.quiz_total = Number(quiz.total);
        row.passed = !!quiz.passed;
        if (!existing) rows.push(row);
      });
      if (rows.length) {
        const { error } = await supabaseClient.from('progress')
          .upsert(rows, { onConflict: 'user_id,course_id,module_index,lesson_index' });
        if (error) console.warn('LOGI legacy progress migration failed:', error.message);
      }
    }
  }

  // Cloud enrolments are merged with local enrolments.
  if (!enrolmentResult.error && Array.isArray(enrolmentResult.data)) {
    const all = new Set([...localEnrolments, ...getEnrolments(email),
      ...enrolmentResult.data.map(r => r.course_id), COURSE.id]);
    const store = load(STORE.enrolments, {});
    store[email] = [...all];
    save(STORE.enrolments, store);

    const cloudIds = new Set(enrolmentResult.data.map(r => r.course_id));
    const missingIds = [...all].filter(Boolean).filter(id => !cloudIds.has(id));
    if (missingIds.length) {
      const payload = missingIds.map(course_id => ({ user_id: user.id, course_id }));
      const { error } = await supabaseClient.from('enrolments')
        .upsert(payload, { onConflict: 'user_id,course_id', ignoreDuplicates: true });
      if (error) {
        console.warn('LOGI enrolment recovery failed:', error.message);
        if (isPermissionError(error) && !denied.includes('enrolments')) denied.push('enrolments');
      }
    }
  }

  studentDataSyncWarning = denied.length
    ? 'Some learning records could not be synchronised with your LOGI account because Supabase denied access to: ' + denied.join(', ') + '. Your current-device records remain available.'
    : '';
  studentDataLoadedFor = user.id;
}

async function saveProgressToSupabase(username, moduleIndex, lessonIndex) {
  const user = currentSessionUser;
  if (!user?.id) return;
  const p = getProgress(username);
  const quiz = p.quizzes[moduleIndex];
  const row = {
    user_id: user.id,
    course_id: COURSE.id,
    module_index: moduleIndex,
    lesson_index: lessonIndex,
    completed: !!p.lessons[moduleIndex + '-' + lessonIndex],
    quiz_score: quiz ? quiz.score : null,
    quiz_total: quiz ? quiz.total : null,
    passed: quiz ? !!quiz.passed : false
  };
  const { error } = await supabaseClient.from('progress')
    .upsert(row, { onConflict: 'user_id,course_id,module_index,lesson_index' });
  if (error) {
    console.warn('LOGI progress sync failed:', error.message);
    if (isPermissionError(error)) {
      studentDataSyncWarning = 'Your learning progress is saved on this device, but Supabase has denied cloud synchronisation for this course.';
    }
  }
}

async function saveEnrolmentToSupabase(courseId) {
  const user = currentSessionUser;
  if (!user?.id) return;
  const { error } = await supabaseClient.from('enrolments').insert({
    user_id: user.id, course_id: courseId
  });
  if (error && error.code !== '23505') {
    console.warn('LOGI enrolment sync failed:', error.message);
    if (isPermissionError(error)) {
      studentDataSyncWarning = 'Your enrolment is available on this device, but Supabase has denied cloud synchronisation.';
    }
  }
}

/* ---------- Progress / enrolment / certificates ---------- */
// Progress is isolated by BOTH student and course. Older versions stored
// one progress object per student, which caused different courses to share
// completion percentages. Legacy unscoped progress is deliberately not
// imported into this course.
function getProgress(username) {
  const all = load(STORE.progress, {});
  if (!all[username] || typeof all[username] !== 'object') all[username] = {};
  const courseProgress = all[username][COURSE.id];
  if (!courseProgress || !courseProgress.lessons || !courseProgress.quizzes) {
    return { lessons: {}, quizzes: {} };
  }
  return courseProgress;
}
function saveProgress(username, p) {
  const all = load(STORE.progress, {});
  if (!all[username] || typeof all[username] !== 'object') all[username] = {};
  all[username][COURSE.id] = p;
  save(STORE.progress, all);
}
function getEnrolments(username) {
  const e = load(STORE.enrolments, {});
  return e[username] || [];
}
function enrol(username, courseId) {
  const e = load(STORE.enrolments, {});
  if (!e[username]) e[username] = [];
  const isNew = !e[username].includes(courseId);
  if (isNew) e[username].push(courseId);
  save(STORE.enrolments, e);
  if (currentSessionUser?.id) saveEnrolmentToSupabase(courseId);
}
function getCerts(username) {
  const c = load(STORE.certificates, {});
  return c[username] || [];
}
function addCert(username, cert) {
  const c = load(STORE.certificates, {});
  if (!c[username]) c[username] = [];
  c[username].push(cert);
  save(STORE.certificates, c);
}

function isLessonDone(username, mi, li) {
  const p = getProgress(username);
  return !!p.lessons[mi + '-' + li];
}
function markLessonDone(username, mi, li) {
  const p = getProgress(username);
  p.lessons[mi + '-' + li] = true;
  saveProgress(username, p);
  saveProgressToSupabase(username, mi, li);
}
function getQuizResult(username, mi) {
  const p = getProgress(username);
  return p.quizzes[mi] || null;
}
function saveQuizResult(username, mi, score, total) {
  const p = getProgress(username);
  p.quizzes[mi] = { score, total, passed: score / total * 100 >= COURSE.passMark };
  saveProgress(username, p);
  saveProgressToSupabase(username, mi, 0);
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.passed;
}
function moduleLessonsDone(username, mi) {
  const mod = COURSE.modules[mi];
  if (!mod) return 0;
  let n = 0;
  mod.lessons.forEach((_, li) => { if (isLessonDone(username, mi, li)) n++; });
  return n;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.passed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}

/* Next incomplete lesson helper for the dashboard "Continue" button */
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.passed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

/* ---------- Certificate generation ---------- */
function generateCertificate(username) {
  if (!username) return null;
  const certs = getCerts(username);
  let cert = certs.find(c => c.courseId === COURSE.id);
  if (cert) return cert;
  
  const hash = Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('');
  
  // Find user's full name from session data
  let studentName = username;
  if(currentSessionUser && currentSessionUser.fullName) {
    studentName = currentSessionUser.fullName;
  }

  cert = {
    id: 'LOGI-' + COURSE.id.toUpperCase() + '-' + Date.now().toString(36).toUpperCase(),
    hash: hash,
    courseId: COURSE.id,
    courseTitle: COURSE.title,
    studentName: studentName,
    date: nowISO(),
    issuedBy: 'Living Oracles Global Institute'
  };
  addCert(username, cert);
  return cert;
}

  async function doRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const password = document.getElementById('regPass').value;
    const password2 = document.getElementById('regPass2').value;
    const err = document.getElementById('regError');

    if (!name || !email || !password || !password2) {
      err.textContent = 'All fields are required.';
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      err.textContent = 'Please enter a valid email address.';
      return;
    }

    if (password.length < 8) {
      err.textContent = 'Password must be at least 8 characters.';
      return;
    }

    if (password !== password2) {
      err.textContent = 'Passwords do not match.';
      return;
    }

    err.textContent = 'Creating your account...';

    // 1. Try to sign up
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: name
        }
      }
    });

    // 2. If the email already exists → try signing in with the password they just typed.
    //    A returning learner from another LOGI course lands straight on this course.
    if (error && /already registered|already exists|user already/i.test(error.message)) {
      err.textContent = 'This email already has a LOGI account — signing you in...';

      const { data: signInData, error: signInError } =
        await supabaseClient.auth.signInWithPassword({ email, password });

      if (signInError) {
        err.innerHTML =
          'This email is already registered on LOGI. ' +
          '<a onclick="App.showLogin()" style="color:var(--pd);font-weight:600;cursor:pointer;">Click here to log in</a> ' +
          'with your existing password.';
        return;
      }

      // Successfully signed in → enrol in THIS course and go to dashboard
      syncLocalUser(signInData.user);
      studentDataLoadedFor = null;
      enrol(email, COURSE.id);
      await loadStudentData(currentSessionUser, true);
      await showDashboard();
      return;
    }

    if (error) {
      err.textContent = error.message;
      return;
    }

    // 3. Fresh signup — normal path
    if (data.session && data.user) {
      syncLocalUser(data.user);
      studentDataLoadedFor = null;
      enrol(email, COURSE.id);
      await loadStudentData(currentSessionUser, true);
      await showDashboard();
    } else {
      err.textContent =
        'Registration successful! Please check your email and confirm your account before logging in.';
    }
  }

            <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Module ${mi+1} · Assessment</div>
            <h1 style="font-size:28px;line-height:1.2;margin:6px 0 8px;">${esc(mod.title)} — Assessment</h1>
            <p style="color:var(--muted);">Answer all questions. Pass mark: <b>${COURSE.passMark}%</b>. You may retake the assessment if you do not pass.</p>
            ${renderQuizUI(mi, quiz)}
            <div class="actions"><button class="secondary btn-secondary" onclick="App.previousFromAssessment()">← Back to lesson</button><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn ${passed?'':'btn-secondary'}" ${passed?'':'disabled style="opacity:.55;cursor:not-allowed;"'} onclick="App.continueAfterAssessment()">${mi===COURSE.modules.length-1?'Finish course':'Next module →'}</button></div></div>

        </div>
      </div>`;

  }

  function previousFromAssessment() {
    state.activeAssessment = false;
    renderCourse();
  }

  async function continueAfterAssessment() {
    const u = await currentUser();
    if (!u) return;
    const mi = state.activeCourseModule;
    const result = getQuizResult(u.username, mi);
    if (!result || !result.passed) { alert('Pass this assessment with at least ' + COURSE.passMark + '% before continuing.'); return; }
    if (mi + 1 >= COURSE.modules.length) { showDashboard(); return; }
    state.activeCourseModule = mi + 1;
    state.activeCourseLesson = 0;
    state.activeAssessment = false;
    renderCourse();
  }

  function alertLocked(i) {
    alert('Module ' + (i+1) + ' is locked until you pass the previous module assessment.');
  }

  function renderQuizUI(mi, quiz) {
    const u = state.user;
    const username = u.username;
    const result = getQuizResult(username, mi);
    const passed = result?.passed;
    return `
      <div id="quizWrap" style="margin-top:32px;border-top:2px solid var(--line);padding-top:24px;">
        <h2 style="font-size:22px;">Module ${mi+1} assessment</h2>
        <p style="font-size:14px;color:var(--muted);">Answer all questions. Pass mark: ${COURSE.passMark}%. Unlimited retakes allowed.</p>
        ${result ? `<div class="callout" style="background:${passed?'#e8f5e9':'#fdecea'};border-left-color:${passed?'#2e7d32':'#c62828'};">
          <b>Previous attempt:</b> ${result.score} / ${result.total} (${Math.round(result.score/result.total*100)}%) — ${passed?'Passed ✅':'Not passed — try again'}</div>` : ''}
        <div id="quizQuestions">
          ${quiz.map((q, qi) => `
            <div class="q" data-qindex="${qi}">
              <b>${qi+1}. ${esc(q.q)}</b>
              ${q.opts.map((opt, oi) => `
                <label data-opt="${oi}" onclick="App.selectOption(${qi},${oi})">
                  <input type="radio" name="q${mi}_${qi}" value="${oi}" style="margin-right:6px;">
                  ${esc(opt)}
                </label>
              `).join('')}
              <div class="feedback" id="fb_${mi}_${qi}"></div>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;">
          <button class="btn" onclick="App.submitQuiz(${mi})">Submit answers</button>
          ${result && !passed ? '<span style="font-size:13px;color:var(--error);">You can retake this assessment.</span>' : ''}
        </div>
        <p id="quizResult_${mi}" style="font-weight:700;margin-top:12px;"></p>
      </div>
    `;
  }

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
    if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`);
    if (lbl) {
      lbl.classList.add('selected');
      const radio = lbl.querySelector('input');
      if (radio) radio.checked = true;
    }
  }

  async function submitQuiz(mi) {
    const u = await currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    if (!quiz) return;
    let score = 0;
    let answeredAll = true;
    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (!sel) {
        answeredAll = false;
        if (fb) { fb.textContent = 'Please select an answer.'; fb.style.color = 'var(--error)'; }
        return;
      }
      const val = parseInt(sel.value, 10);
      const ok = val === q.answer;
      if (ok) score++;
      if (fb) {
        fb.textContent = (ok ? '✅ Correct. ' : '❌ Review: ') + q.explanation;
        fb.style.color = ok ? 'var(--success)' : 'var(--error)';
      }
    });
    if (!answeredAll) {
      document.getElementById('quizResult_' + mi).textContent = 'Please answer all questions before submitting.';
      return;
    }
    saveQuizResult(u.username, mi, score, quiz.length);
    const pct = Math.round(score / quiz.length * 100);
    const passed = pct >= COURSE.passMark;
    const resEl = document.getElementById('quizResult_' + mi);
    if (resEl) {
      resEl.textContent = `You scored ${score} / ${quiz.length} (${pct}%). ${passed ? 'Passed ✅ — you may continue to the next module.' : 'Not passed. Review the explanations and retake when ready.'}`;
      resEl.style.color = passed ? 'var(--success)' : 'var(--error)';
    }
    
    if (passed) {
      markLessonDone(u.username, mi, 0);
      if (courseCompleted(u.username)) {
        generateCertificate(u.username);
      }
      setTimeout(() => { renderCourse(); }, 900);
    }
  }

  async function markCurrentLesson() {
    const u = await currentUser();
    if (!u) return;
    const mi = state.activeCourseModule, li = state.activeCourseLesson;
    markLessonDone(u.username, mi, li);
    if (courseCompleted(u.username)) generateCertificate(u.username);
    renderCourse();
  }

  async function prevLesson() {
    let mi = state.activeCourseModule, li = state.activeCourseLesson - 1;
    if (li < 0) {
      mi--;
      if (mi < 0) { showDashboard(); return; }
      if (isModuleLocked(state.user.username, mi)) { alertLocked(mi); return; }
      li = COURSE.modules[mi].lessons.length - 1;
    }
    openCourse(mi, li);
  }

  async function nextLesson() {
    const mi = state.activeCourseModule;
    const li = state.activeCourseLesson + 1;
    if (li < COURSE.modules[mi].lessons.length) { openCourse(mi, li); return; }
    // The assessment is a separate learning step after the module lesson.
    state.activeAssessment = true;
    renderCourse();
  }

  function scaleCertificate() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const container = scaler.parentElement;
    const containerWidth = container.clientWidth;
    const certWidth = 1000;

    if (containerWidth < certWidth) {
      const scale = containerWidth / certWidth;
      scaler.style.transform = `scale(${scale})`;
      scaler.style.marginBottom = `-${(707 * (1 - scale))}px`;
    } else {
      scaler.style.transform = 'none';
      scaler.style.marginBottom = '0';
    }
  }

  function downloadCertificateImage() {
    const cert = document.getElementById('printableCert');
    const scaler = document.getElementById('certScaler');
    if (!cert || !scaler) return;
    
    const btn = document.querySelector('button[onclick="App.downloadCertificateImage()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ Generating...';
    btn.disabled = true;

    const originalTransform = scaler.style.transform;
    const originalMargin = scaler.style.marginBottom;
    scaler.style.transform = 'none';
    scaler.style.marginBottom = '0';

    html2canvas(cert, {
      scale: 2, 
      useCORS: true, 
      backgroundColor: '#fafafa',
      width: 1000,
      height: 707,
      windowWidth: 1000,
      windowHeight: 707,
      onclone: (clonedDoc) => {
        const desc = clonedDoc.querySelector('.cert-description');
        if (desc) {
          desc.style.wordSpacing = 'normal';
          desc.style.letterSpacing = 'normal';
        }
        const watermark = clonedDoc.querySelector('.cert-watermark');
        if (watermark) {
          watermark.style.display = 'block';
        }
      }
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate_Industrial_Automation.png';
      link.href = imgData;
      link.click();
      
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error('Error generating image:', err);
      alert('Failed to generate image. Please ensure you are connected to the internet so the external signature and QR code can load.');
      
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }

  /* ---------- Discussion ---------- */

  async function submitPost() {
    const u = await currentUser();

    const text = document.getElementById('postText').value.trim();
    if (!text) return;
    const posts = load(STORE.posts, []);
    posts.push({ id: uid(), user: u.fullName || u.username, text, ts: nowISO() });
    save(STORE.posts, posts);
    showDiscussion();
  }

  async function goHome() {
    const u = await currentUser();
    if (u) showDashboard();
    else showLanding();
  }

  async function init() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
      console.error('Session error:', error.message);
      currentSessionUser = null;
      await renderNav();
      showLanding();
      return;
    }

    if (data.session?.user) {
      syncLocalUser(data.session.user);
      studentDataLoadedFor = null;
      await loadStudentData(currentSessionUser, true);
      await renderNav();
      await showDashboard();
    } else {
      currentSessionUser = null;
      await renderNav();
      showLanding();
    }
  }

  return {
    init, showLanding, showLogin, showRegister, doLogin, doRegister, logout,
    showDashboard, showCatalogue, showCertificate, showDiscussion, showAnnouncements,
    openCourse, prevLesson, nextLesson, markCurrentLesson, enrolAndOpen,
    submitQuiz, selectOption, alertLocked, previousFromAssessment, continueAfterAssessment, submitPost, downloadCertificateImage,
    goHome
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
