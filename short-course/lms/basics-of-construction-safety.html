<h3>3. Safety principles</h3>

  <li>Damaged cables and tools.</li>

<h3>3. Lifting operations</h3>

function uid() { return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }); }
function nowISO() { return new Date().toISOString(); }
function esc(s) { return typeof s !== 'string' ? s : s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let currentSessionUser = null;

function syncLocalUser(authUser) {
  if (!authUser) { currentSessionUser = null; return null; }
  const email = (authUser.email || '').toLowerCase();
  currentSessionUser = {
    id: authUser.id,
    username: email,
    email,
    fullName: authUser.user_metadata?.full_name || email,
    role: 'student'
  };
  return currentSessionUser;
}

async function currentUser() {
  if (currentSessionUser) return currentSessionUser;
  const { data, error } = await supabaseClient.auth.getSession();
  if (error) return null;
  return data.session?.user ? syncLocalUser(data.session.user) : null;
}

let studentDataLoadedFor = null;

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  if (!force && studentDataLoadedFor === user.id) return;

  const email = (user.email || user.username || '').toLowerCase();

  const [progressResult, enrolmentResult] = await Promise.all([
    supabaseClient.from('progress').select('module_index,lesson_index,quiz_score,quiz_total,passed,completed').eq('user_id', user.id).eq('course_id', COURSE.id),
    supabaseClient.from('enrolments').select('course_id').eq('user_id', user.id)
  ]);

  if (!progressResult.error && Array.isArray(progressResult.data)) {
    const merged = getProgress(email);
    progressResult.data.forEach(row => {
      const key = row.module_index + '-' + row.lesson_index;
      if (row.completed) merged.lessons[key] = true;
      if (row.quiz_score !== null && row.quiz_score !== undefined) {
        merged.quizzes[row.module_index] = { score: row.quiz_score, total: row.quiz_total, passed: !!row.passed };
      }
    });
    saveProgress(email, merged);
  }

  studentDataLoadedFor = user.id;
}

async function saveProgressToSupabase(username, moduleIndex, lessonIndex) {
  const user = currentSessionUser;
  if (!user?.id) return;
  const p = getProgress(username);
  const quiz = p.quizzes[moduleIndex];
  const row = {
    user_id: user.id, course_id: COURSE.id, module_index: moduleIndex, lesson_index: lessonIndex,
    completed: !!p.lessons[moduleIndex + '-' + lessonIndex],
    quiz_score: quiz ? quiz.score : null, quiz_total: quiz ? quiz.total : null, passed: quiz ? !!quiz.passed : false
  };
  await supabaseClient.from('progress').upsert(row, { onConflict: 'user_id,course_id,module_index,lesson_index' });
}

function getProgress(username) {
  const all = load(STORE.progress, {});
  if (!all[username] || typeof all[username] !== 'object') all[username] = {};
  return all[username][COURSE.id] || { lessons: {}, quizzes: {} };
}
function saveProgress(username, p) {
  const all = load(STORE.progress, {});
  if (!all[username] || typeof all[username] !== 'object') all[username] = {};
  all[username][COURSE.id] = p;
  save(STORE.progress, all);
}
function getEnrolments(username) { return load(STORE.enrolments, {})[username] || []; }
function enrol(username, courseId) {
  const e = load(STORE.enrolments, {});
  if (!e[username]) e[username] = [];
  if (!e[username].includes(courseId)) e[username].push(courseId);
  save(STORE.enrolments, e);
}
function getCerts(username) { return load(STORE.certificates, {})[username] || []; }
function addCert(username, cert) {
  const c = load(STORE.certificates, {});
  if (!c[username]) c[username] = [];
  c[username].push(cert);
  save(STORE.certificates, c);
}

function isLessonDone(username, mi, li) { return !!getProgress(username).lessons[mi + '-' + li]; }
function markLessonDone(username, mi, li) {
  const p = getProgress(username);
  p.lessons[mi + '-' + li] = true;
  saveProgress(username, p);
  saveProgressToSupabase(username, mi, li);
}
function getQuizResult(username, mi) { return getProgress(username).quizzes[mi] || null; }
function saveQuizResult(username, mi, score, total) {
  const p = getProgress(username);
  p.quizzes[mi] = { score, total, passed: score / total * 100 >= COURSE.passMark };
  saveProgress(username, p);
  saveProgressToSupabase(username, mi, 0);
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.passed;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.passed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.passed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

function generateCertificate(username) {
  if (!username) return null;
  const certs = getCerts(username);
  let cert = certs.find(c => c.courseId === COURSE.id);
  if (cert) return cert;

  const hash = Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('');
  let studentName = currentSessionUser?.fullName || username;

  cert = {
    id: 'LOGI-' + COURSE.id.toUpperCase() + '-' + Date.now().toString(36).toUpperCase(),
    hash: hash,
    courseId: COURSE.id,
    courseTitle: COURSE.title,
    studentName: studentName,
    date: nowISO(),
    issuedBy: 'Living Oracles Global Institute'
  };
  addCert(username, cert);
  return cert;
}

                      <span>${locked ? '🔒' : (isOpen ? '▲' : '▼')}</span>
                    </button>
                    <div class="mod-lessons-list">
                      ${m.lessons.map((l, j) => {
                        const done = isLessonDone(username, i, j);
                        const isCurrent = (i === mi && j === li && !state.activeAssessment);
                        return `
                          <button class="lesson-item-btn ${isCurrent ? 'active' : ''} ${done ? 'done' : ''}"
                            onclick="App.openCourse(${i}, ${j})">
                            <span>${done ? '✓' : '📖'}</span>
                            <span style="flex:1;">${esc(l.title)}</span>
                          </button>
                        `;
                      }).join('')}
                      <button class="lesson-item-btn ${i === mi && state.activeAssessment ? 'active' : ''}"
                        onclick="${locked ? `App.alertLocked(${i})` : `App.openAssessment(${i})`}">
                        <span>${modPassed ? '✅' : '📝'}</span>
                        <span style="flex:1;">Module ${i+1} Assessment</span>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <div style="font-size:12px;color:var(--muted);text-transform:uppercase;">Module ${mi+1} · ${esc(lesson.duration)}</div>
              <h1 style="font-size:24px;line-height:1.2;margin:6px 0 18px;">${esc(lesson.title)}</h1>
              <div>${lesson.html}</div>
              <div class="actions">
                <button class="btn-secondary" onclick="App.prevLesson()">← Previous</button>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn" onclick="App.markCurrentLesson()">${isLessonDone(username, mi, li) ? 'Completed ✓' : 'Mark complete'}</button>
                  <button class="btn-secondary" onclick="App.nextLesson()">Next →</button>
                </div>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  function toggleAccordion(i) {
    if (state.activeCourseModule === i && !state.activeAssessment) {
      const modSections = document.querySelectorAll('.mod-section');
      if (modSections[i]) modSections[i].classList.toggle('open');
      return;
    }
    state.activeCourseModule = i;
    state.activeCourseLesson = 0;
    state.activeAssessment = false;
    renderCourse();
  }

  function openAssessment(i) {
    state.activeCourseModule = i;
    state.activeAssessment = true;
    closeModuleMenu();
    renderAssessmentScreen();
  }

  async function renderAssessmentScreen() {
    const u = await currentUser();
    if (!u) return;
    state.user = u;

    const mi = state.activeCourseModule;
    const mod = COURSE.modules[mi];
    const quiz = mod.lessons[0].quiz || [];
    const username = u.username;
    const result = getQuizResult(username, mi);
    const passed = !!result?.passed;
    const pct = courseProgressPct(username);
    const isLastModule = (mi + 1 >= COURSE.modules.length);
    const allDone = courseCompleted(username);

    let nextLabel = 'Next Module →';
    if (isLastModule) nextLabel = allDone ? 'View Certificate →' : 'Finish →';

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="inner" style="padding:16px 0 48px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <button class="mobile-module-toggle" onclick="App.toggleModuleMenu()">
            📚 Course Content (${pct}%)
          </button>
        </div>
        <div class="course-layout">
          <aside class="module-side">
            <div class="sidehead" style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <h2>Course content</h2>
                <div class="progress-bar"><span style="width:${pct}%;"></span></div>
              </div>
              <button onclick="App.closeModuleMenu()" style="background:none;border:0;font-size:18px;cursor:pointer;">✕</button>
            </div>
            <div class="modules">
              ${COURSE.modules.map((m,i)=>{
                const locked=isModuleLocked(username,i);
                const isOpen = (i === mi);
                return `
                  <div class="mod-section ${isOpen ? 'open' : ''}">
                    <button class="mod-header ${locked?'locked':''}" onclick="${locked?`App.alertLocked(${i})`:`App.toggleAccordion(${i})`}">
                      <span>Module ${i+1}: ${esc(m.title)}</span>
                      <span>${locked ? '🔒' : (isOpen ? '▲' : '▼')}</span>
                    </button>
                    <div class="mod-lessons-list">
                      ${m.lessons.map((l,j)=>`
                        <button class="lesson-item-btn" onclick="App.openCourse(${i},${j})">
                          <span>📖</span><span style="flex:1;">${esc(l.title)}</span>
                        </button>
                      `).join('')}
                      <button class="lesson-item-btn active" onclick="App.openAssessment(${i})">
                        <span>📝</span><span style="flex:1;">Module ${i+1} Assessment</span>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <h2>Module ${mi+1} Assessment</h2>
              ${renderQuizUI(mi, quiz)}
              <div class="actions">
                <button class="btn-secondary" onclick="App.previousFromAssessment()">← Back to lesson</button>
                <button id="nextBtn_${mi}" class="btn ${passed ? '' : 'btn-secondary'}"
                  ${passed ? '' : 'disabled'} style="${passed ? '' : 'opacity:.5;'}"
                  onclick="App.continueAfterAssessment()">${nextLabel}</button>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  function renderQuizUI(mi, quiz) {
    const u = state.user;
    const result = u ? getQuizResult(u.username, mi) : null;
    return `
      <div style="margin-top:16px;">
        ${result ? `<div class="callout">Previous attempt score: ${result.score}/${result.total}</div>` : ''}
        ${quiz.map((q, qi) => `
          <div class="q" data-qindex="${qi}">
            <b>${qi+1}. ${esc(q.q)}</b>
            ${q.opts.map((opt, oi) => `
              <label data-opt="${oi}" onclick="App.selectOption(${qi},${oi})">
                <input type="radio" name="q${mi}_${qi}" value="${oi}"> ${esc(opt)}
              </label>
            `).join('')}
            <div class="feedback" id="fb_${mi}_${qi}"></div>
          </div>
        `).join('')}
        <button class="btn" style="margin-top:14px;" onclick="App.submitQuiz(${mi})">Submit Answers</button>
        <p id="quizResult_${mi}" style="font-weight:700;margin-top:8px;"></p>
      </div>
    `;
  }

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
    if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`);
    if (lbl) {
      lbl.classList.add('selected');
      const radio = lbl.querySelector('input');
      if (radio) radio.checked = true;
    }
  }

  async function submitQuiz(mi) {
    const u = await currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    let score = 0;
    let answeredAll = true;

    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (!sel) {
        answeredAll = false;
        if (fb) { fb.textContent = 'Please select an answer.'; fb.style.color = 'var(--error)'; }
        return;
      }
      if (parseInt(sel.value) === q.answer) {
        score++;
        if (fb) { fb.textContent = 'Correct!'; fb.style.color = 'var(--success)'; }
      } else {
        if (fb) { fb.textContent = 'Incorrect.'; fb.style.color = 'var(--error)'; }
      }
    });

    const resultEl = document.getElementById('quizResult_' + mi);
    if (!answeredAll) {
      if (resultEl) {
        resultEl.textContent = 'Please answer all questions before submitting.';
        resultEl.style.color = 'var(--error)';
      }
      return;
    }

    saveQuizResult(u.username, mi, score, quiz.length);
    const passed = (score / quiz.length * 100) >= COURSE.passMark;

    if (passed) {
      markLessonDone(u.username, mi, 0);
      if (courseCompleted(u.username)) generateCertificate(u.username);

      if (resultEl) {
        resultEl.textContent = `Scored ${score}/${quiz.length}. Passed! ✅`;
        resultEl.style.color = 'var(--success)';
      }

      const nextBtn = document.getElementById('nextBtn_' + mi);
      if (nextBtn) {
        nextBtn.disabled = false;
        nextBtn.classList.remove('btn-secondary');
        nextBtn.classList.add('btn');
        nextBtn.style.opacity = '1';
        const isLast = (mi + 1 >= COURSE.modules.length);
        nextBtn.textContent = isLast
          ? (courseCompleted(u.username) ? 'View Certificate →' : 'Finish →')
          : 'Next Module →';
      }
    } else {
      if (resultEl) {
        resultEl.textContent = `Scored ${score}/${quiz.length}. Try again.`;
        resultEl.style.color = 'var(--error)';
      }
    }
  }

  function alertLocked(i) { alert('Module ' + (i+1) + ' is locked until you pass the previous assessment.'); }
  function previousFromAssessment() { state.activeAssessment = false; renderCourse(); }

  function continueAfterAssessment() {
    const mi = state.activeCourseModule;
    const username = state.user?.username;
    if (!username) return;

    if (mi + 1 < COURSE.modules.length) {
      openCourse(mi + 1, 0);
    } else if (courseCompleted(username)) {
      showCertificate();
    } else {
      showDashboard();
    }
  }

  async function markCurrentLesson() {
    const u = await currentUser();
    if (!u) return;
    markLessonDone(u.username, state.activeCourseModule, state.activeCourseLesson);
    renderCourse();
  }

  async function prevLesson() {
    let mi = state.activeCourseModule, li = state.activeCourseLesson - 1;
    if (li < 0) { mi--; li = 0; }
    if (mi >= 0) openCourse(mi, li);
  }

  async function nextLesson() {
    const mi = state.activeCourseModule, li = state.activeCourseLesson + 1;
    if (li < COURSE.modules[mi].lessons.length) openCourse(mi, li);
    else { state.activeAssessment = true; renderCourse(); }
  }

  async function showCertificate() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'certificate';
    const completed = courseCompleted(u.username);
    let cert = getCerts(u.username).find(c => c.courseId === COURSE.id);
    if (completed && !cert) cert = generateCertificate(u.username);

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('certificate')}
        <main class="main-panel" style="background: #fbfafc;">
          <h1>My certificate</h1>
          <p class="subtitle">Your certificate becomes available once you complete all lessons and pass all module assessments.</p>

          ${cert ? `
            <div class="cert-controls">
              <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
              <button class="btn" onclick="App.downloadCertificateImage()">📥 Download as PNG</button>
            </div>
            <div class="cert-display-area">
              <div class="cert-scaler" id="certScaler">
                <div class="cert-wrapper" id="printableCert">
                  <img class="cert-watermark" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png" alt="Watermark" crossorigin="anonymous">
                  <div class="cert-main">
                    <div class="cert-header">
                      <img class="cert-header-logo" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png" alt="LOGI Logo" crossorigin="anonymous" onerror="this.style.display='none'">
                      <div class="cert-logo-sub">Living Oracles<br>Global Institute</div>
                    </div>
                    <div class="cert-date">${fmtDate(cert.date)}</div>
                    <div class="cert-name">${esc(cert.studentName)}</div>
                    <div class="cert-completion">has successfully completed</div>
                    <div class="cert-course-title">${esc(cert.courseTitle)}</div>
                    <div class="cert-description">
                      This course has been developed and delivered by Living Oracles Global Institute, covering construction safety fundamentals, site induction and PPE, working at height and excavations, electrical, lifting and equipment hazards, and emergency preparedness and reporting.
                    </div>
                    <div class="cert-signature-area">
                      <img class="cert-signature-img" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/president-signature.svg" alt="Prophet Ing Stephen Adusei Signature" crossorigin="anonymous">
                      <div class="cert-signer-name">Prophet Ing Stephen Adusei</div>
                      <div class="cert-signer-title">Program Director | Living Oracles Global Institute</div>
                    </div>
                    <div class="cert-footer-info">
                      <div class="cert-footer-box">
                        <div class="cert-footer-logo">LOGI</div>
                        <div>Living Oracles Global Institute is committed to delivering excellence in education and professional development.</div>
                      </div>
                      <div class="cert-footer-box" style="border-left: 1px solid #ccc; padding-left: 15px;">
                        <div>This is a digitally generated certificate. Authenticity can be verified by scanning the QR code.</div>
                      </div>
                    </div>
                  </div>
                  <div class="cert-sidebar">
                    <div class="cert-partner-box">LOGI</div>
                    <div class="cert-sidebar-pattern"></div>
                    <div class="cert-verify-area">
                      <div class="cert-verify-text">Scan to verify<br>this certificate</div>
                      <img class="cert-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(cert.id)}" alt="QR Code" crossorigin="anonymous">
                      <div class="cert-blockchain">Blockchain ID:<br>${esc(cert.hash)}</div>
                    </div>
                    <div class="cert-bottom-block"></div>
                  </div>
                </div>
              </div>
            </div>
          ` : `
            <div class="card" style="text-align:center;padding:40px 20px; background:white;">
              <div style="font-size:48px;margin-bottom:12px;">🔒</div>
              <h2>Certificate not yet available</h2>
              <p>You need to complete all lessons and pass every module assessment to unlock your certificate.</p>
              <button class="btn" onclick="App.openCourse(0,0)">Continue learning</button>
            </div>
          `}
        </main>
      </div>
    `;
    renderNav();
    if (cert) {
      scaleCertificate();
      window.addEventListener('resize', scaleCertificate);
    }
  }

  function scaleCertificate() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const container = scaler.parentElement;
    const containerWidth = container.clientWidth;
    const certWidth = 1000;
    if (containerWidth < certWidth) {
      const scale = containerWidth / certWidth;
      scaler.style.transform = `scale(${scale})`;
      scaler.style.marginBottom = `-${(707 * (1 - scale))}px`;
    } else {
      scaler.style.transform = 'none';
      scaler.style.marginBottom = '0';
    }
  }

  function downloadCertificateImage() {
    const cert = document.getElementById('printableCert');
    const scaler = document.getElementById('certScaler');
    if (!cert || !scaler) return;
    const btn = document.querySelector('button[onclick="App.downloadCertificateImage()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ Generating...';
    btn.disabled = true;
    const originalTransform = scaler.style.transform;
    const originalMargin = scaler.style.marginBottom;
    scaler.style.transform = 'none';
    scaler.style.marginBottom = '0';
    html2canvas(cert, {
      scale: 2, useCORS: true, backgroundColor: '#fafafa',
      width: 1000, height: 707, windowWidth: 1000, windowHeight: 707,
      onclone: (clonedDoc) => {
        const desc = clonedDoc.querySelector('.cert-description');
        if (desc) { desc.style.wordSpacing = 'normal'; desc.style.letterSpacing = 'normal'; }
      }
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate_Construction_Safety.png';
      link.href = imgData;
      link.click();
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error('Error generating image:', err);
      alert('Failed to generate image. Please ensure you are connected to the internet so the external signature and QR code can load.');
      scaler.style.transform = originalTransform;
      scaler.style.marginBottom = originalMargin;
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }

  async function showDiscussion() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'discussion';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('discussion')}
        <main class="main-panel">
          <h1>Discussion Forum</h1>
          <p class="subtitle">Ask questions and share ideas.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  async function showAnnouncements() {
    const u = await currentUser();
    if (!u) { showLogin(); return; }
    state.user = u;
    state.screen = 'announcements';
    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('announcements')}
        <main class="main-panel">
          <h1>Announcements</h1>
          <p class="subtitle">Important updates from your instructor.</p>
        </main>
      </div>
    `;
    renderNav();
  }

  function goHome() {
    closeMobileMenu();
    if (currentSessionUser) showDashboard();
    else showLanding();
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (data?.session?.user) {
      syncLocalUser(data.session.user);
      await loadStudentData(currentSessionUser, true);
      await showDashboard();
    } else {
      showLanding();
    }
  }

  return {
    init, showLanding, showLogin, showRegister, doLogin, doRegister, logout,
    showDashboard, showCatalogue, showCertificate, showDiscussion, showAnnouncements,
    openCourse, prevLesson, nextLesson, markCurrentLesson, submitQuiz, selectOption,
    alertLocked, previousFromAssessment, continueAfterAssessment, goHome,
    toggleAccordion, openAssessment, toggleMobileMenu, closeMobileMenu,
    toggleModuleMenu, closeModuleMenu, navigate, downloadCertificateImage
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
</body>
</html>
