<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="https://i.imgur.com/kkE49KM.png">
  <title>LOGI LMS · Introduction to Agile Project Management</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --p: #ff4b93;
      --pd: #e93680;
      --ink: #34343b;
      --muted: #777780;
      --line: #e9e8ef;
      --soft: #f5f5f8;
      --bg: #ffffff;
      --success: #2e7d32;
      --error: #b33;
      --warn: #f0f7ff;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.65 Arial, sans-serif; color: var(--ink); background: #fbfafc; }
    a { text-decoration: none; color: inherit; }
    .inner { width: min(1160px, 92%); margin: auto; }

    .top { height: 66px; border-bottom: 1px solid var(--line); display: flex; align-items: center; position: sticky; top: 0; background: white; z-index: 50; box-shadow: 0 1px 6px rgba(0,0,0,0.02); }
    .nav { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; }
    .brand span { color: var(--p); }

    .mobile-nav-toggle { display: none; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 18px; color: var(--ink); align-items: center; justify-content: center; }
    .mobile-nav-toggle:hover { background: var(--soft); }

    .nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { background: var(--p); color: white; border: 0; border-radius: 24px; padding: 10px 18px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--pd); }
    .btn-outline { background: transparent; color: var(--pd); border: 1.5px solid var(--p); border-radius: 24px; padding: 9px 16px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.15s; }
    .btn-outline:hover { background: #fff0f6; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-secondary { background: #f0edf3; color: var(--ink); border: 0; border-radius: 24px; padding: 9px 15px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-secondary:hover { background: #e5e1ea; }

    .auth-wrap { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 66px); padding: 40px 16px; }
    .auth-card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 36px 32px; width: 100%; max-width: 440px; box-shadow: 0 8px 28px rgba(0,0,0,0.05); }
    .auth-card h2 { margin: 0 0 6px; font-size: 24px; }
    .auth-card p.muted { margin: 0 0 22px; font-size: 14px; color: var(--muted); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 14px; background: white; }
    .field input:focus { outline: 2px solid var(--p); outline-offset: 1px; border-color: transparent; }
    .auth-switch { text-align: center; margin-top: 16px; font-size: 14px; }
    .auth-switch a { color: var(--pd); font-weight: 600; cursor: pointer; }
    .error-msg { color: var(--error); font-size: 13px; margin-top: 8px; min-height: 18px; }

    .dash-layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 66px); position: relative; }
    .sidebar { background: white; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; z-index: 40; transition: transform 0.25s ease-in-out; }
    .sidebar .user-badge { background: var(--soft); border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
    .sidebar .user-badge strong { display: block; font-size: 14px; }
    .sidebar .user-badge span { color: var(--muted); font-size: 12px; word-break: break-all; }
    .sidebar a, .sidebar button.nav-link { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 6px; background: transparent; border: 0; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: background 0.1s; }
    .sidebar a:hover, .sidebar button.nav-link:hover { background: #fff3f8; color: var(--pd); }
    .sidebar .nav-link.active { background: #fff0f6; color: var(--pd); }
    .sidebar .spacer { flex: 1; }

    .main-panel { padding: 28px 32px 48px; overflow-y: auto; max-height: calc(100vh - 66px); background: #fbfafc; }
    .main-panel h1 { font-size: 26px; margin: 0 0 4px; }
    .main-panel .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    .card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .card h2 { font-size: 20px; margin: 0 0 10px; }
    .card h3 { font-size: 17px; margin: 18px 0 8px; }
    .card p, .card li { color: #555; line-height: 1.75; }
    
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat-box { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    .stat-box .num { font-size: 26px; font-weight: 800; color: var(--pd); }
    .stat-box .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .lesson-card { max-width: 900px; }
    .callout { background: var(--warn); border-left: 4px solid #438bd5; padding: 14px 17px; margin: 18px 0; border-radius: 0 6px 6px 0; }
    .compare { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .compare td, .compare th { border: 1px solid var(--line); padding: 10px; text-align: left; font-size: 14px; }
    .compare th { background: #fff3f8; }
    .diagram { margin: 20px 0; padding: 16px; background: #fafafd; border: 1px solid var(--line); border-radius: 8px; text-align: center; }
    .diagram svg { max-width: 100%; height: auto; }
    .diagram-cap { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

    .q { border-top: 1px solid var(--line); padding: 14px 0; }
    .q label { display: block; border: 1px solid var(--line); padding: 8px 12px; margin: 6px 0; border-radius: 5px; cursor: pointer; font-size: 14px; transition: background 0.1s; }
    .q label:hover { background: #fafafa; }
    .q label.selected { background: #fff0f6; border-color: var(--p); }
    .feedback { font-size: 13px; margin-top: 6px; }
    .actions { display: flex; justify-content: space-between; gap: 9px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 24px; }

    .course-layout { display: grid; grid-template-columns: 320px 1fr; gap: 22px; align-items: start; }
    .module-side { background: white; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: sticky; top: 80px; }
    .module-side .sidehead { padding: 16px; border-bottom: 1px solid var(--line); }
    .module-side .sidehead h2 { font-size: 16px; margin: 0; }
    .progress-bar { height: 7px; background: #f0edf3; border-radius: 9px; margin-top: 8px; overflow: hidden; }
    .progress-bar span { display: block; height: 100%; width: 0; background: var(--p); transition: width 0.3s; }
    .module-side .modules { padding: 8px; max-height: calc(100vh - 200px); overflow-y: auto; }

    .mod-section { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    .mod-section:last-child { border-bottom: none; }
    .mod-header { width: 100%; text-align: left; background: white; border: 0; padding: 12px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--ink); font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: background 0.1s; }
    .mod-header:hover { background: #fff3f8; color: var(--pd); }
    .mod-header.locked { color: #aaa; cursor: not-allowed; }

    .mod-lessons-list { padding: 4px 0 8px 10px; display: none; }
    .mod-section.open .mod-lessons-list { display: block; }

    .lesson-item-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: white; border: 0; border-radius: 6px; padding: 8px 10px; font-size: 12px; color: #555; cursor: pointer; transition: background 0.1s; }
    .lesson-item-btn:hover { background: #fafafa; color: var(--pd); }
    .lesson-item-btn.active { color: var(--pd); background: #fff0f6; font-weight: 700; }
    .lesson-item-btn.done { color: var(--success); }

    .drawer-overlay, .module-overlay { display: none; position: fixed; top: 66px; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); z-index: 35; }
    .drawer-overlay.open, .module-overlay.open { display: block; }
    .module-overlay { z-index: 45; }

    .mobile-module-toggle { display: none; align-items: center; gap: 6px; background: white; border: 1.5px solid var(--p); color: var(--pd); border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
    .mobile-module-toggle:hover { background: #fff0f6; }

    .cert-display-area { width: 100%; display: flex; justify-content: center; overflow: hidden; padding: 10px 0; }
    .cert-scaler { transform-origin: top center; width: 1000px; height: 707px; }
    .cert-wrapper { background: #fafafa; width: 1000px; height: 707px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: grid; grid-template-columns: 1fr 220px; position: relative; overflow: hidden; color: var(--ink); }
    .cert-watermark { position: absolute; top: 50%; left: 45%; transform: translate(-50%, -50%); width: 550px; opacity: 0.04; pointer-events: none; z-index: 0; }
    .cert-main { padding: 40px 60px 30px 60px; display: flex; flex-direction: column; position: relative; z-index: 2; }
    .cert-header { display: flex; align-items: center; gap: 15px; margin-bottom: 35px; }
    .cert-header-logo { height: 45px; width: auto; object-fit: contain; }
    .cert-logo-sub { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; line-height: 1.2; font-weight: 600; }
    .cert-date { font-size: 15px; color: var(--muted); margin-bottom: 25px; font-weight: 500; }
    .cert-name { font-size: 36px; font-weight: 700; color: #222; margin-bottom: 12px; }
    .cert-completion { font-size: 16px; color: #555; margin-bottom: 20px; }
    .cert-course-title { font-size: 32px; font-weight: 800; color: #333; margin-bottom: 25px; line-height: 1.2; }
    .cert-description { font-size: 14px; color: #666; line-height: 1.7; max-width: 560px; margin-bottom: 40px; letter-spacing: 0.2px; word-spacing: 1px; }
    .cert-signature-area { display: flex; flex-direction: column; max-width: 300px; margin-top: auto; }
    .cert-signature-img { height: 55px; width: auto; object-fit: contain; align-self: flex-start; margin-bottom: 15px; }
    .cert-signer-name { font-size: 16px; font-weight: 700; color: #333; text-decoration: underline; text-underline-offset: 3px; margin-bottom: 6px; }
    .cert-signer-title { font-size: 12px; color: var(--muted); }
    .cert-footer-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 15px; font-size: 10px; color: #777; line-height: 1.5; }
    .cert-footer-box { display: flex; align-items: center; gap: 10px; max-width: 48%; }
    .cert-footer-logo { font-weight: 800; font-size: 16px; color: var(--p); }
    .cert-sidebar { background-color: var(--pd); position: relative; display: flex; flex-direction: column; }
    .cert-partner-box { background: white; padding: 25px 15px; text-align: center; font-size: 42px; font-weight: 900; color: #000; letter-spacing: 3px; border-bottom: 1px solid #eee; }
    .cert-sidebar-pattern { flex: 1; position: relative; background-image: linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.05) 75%, transparent 75%, transparent), linear-gradient(45deg, rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 20px 20px, 100% 100%; background-position: 0 0, 10px 10px; }
    .cert-verify-area { padding: 25px 20px; text-align: center; background: white; }
    .cert-verify-text { font-size: 9px; color: #555; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.4; }
    .cert-qr { width: 100px; height: 100px; margin: 0 auto 15px; display: block; }
    .cert-blockchain { font-size: 9px; color: #888; font-family: monospace; word-break: break-all; line-height: 1.4; }
    .cert-bottom-block { height: 40px; background: #c2185b; }
    .cert-controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }

    @media (max-width: 900px) {
      .mobile-nav-toggle { display: inline-flex; }
      .dash-layout { grid-template-columns: 1fr; }
      .sidebar { position: fixed; top: 66px; left: 0; bottom: 0; width: 260px; background: white; box-shadow: 4px 0 16px rgba(0,0,0,0.1); transform: translateX(-100%); overflow-y: auto; }
      .sidebar.open { transform: translateX(0); }
      .main-panel { max-height: none; padding: 20px 16px 40px; }
      .course-layout { grid-template-columns: 1fr; gap: 16px; }
      .mobile-module-toggle { display: inline-flex; }
      .module-side { position: fixed; top: 66px; right: 0; bottom: 0; width: 300px; max-width: 85vw; background: white; border: 0; border-left: 1px solid var(--line); border-radius: 0; box-shadow: -4px 0 16px rgba(0,0,0,0.15); z-index: 50; transform: translateX(100%); transition: transform 0.25s ease-in-out; }
      .module-side.open { transform: translateX(0); }
      .module-side .modules { max-height: calc(100vh - 140px); }
    }

    @media print {
      @page { size: landscape; margin: 0; }
      body { background: white; padding: 0; margin: 0; display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .top, .sidebar, .mobile-nav-toggle, .drawer-overlay, .main-panel h1, .subtitle, .cert-controls, footer { display: none !important; }
      .dash-layout { display: block; }
      .main-panel { padding: 0; margin: 0; max-height: none; background: white; }
      .cert-display-area { padding: 0; overflow: visible; }
      .cert-scaler { transform: none !important; width: 1000px !important; height: 707px !important; margin-bottom: 0 !important; }
      .cert-wrapper { box-shadow: none; width: 1000px !important; height: 707px !important; border: none; margin: 0 auto; background: #fafafa !important; }
    }
  </style>
</head>
<body>

<header class="top">
  <div class="inner nav">
    <div class="brand-wrap">
      <button class="mobile-nav-toggle" id="menuToggleBtn" onclick="App.toggleMobileMenu()">☰</button>
      <a class="brand" href="#" onclick="App.goHome();return false;">LOGI<span>.</span></a>
    </div>
    <div class="nav-actions" id="navActions"></div>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay" onclick="App.closeMobileMenu()"></div>
<div class="module-overlay" id="moduleOverlay" onclick="App.closeModuleMenu()"></div>

<div id="app"></div>

<footer style="background: #292832; color: white; text-align: center; padding: 22px; font-size: 13px;">
  <strong style="color: #ff8cba;">Living Oracles Global Institute</strong><br>Faith. Excellence. Impact.
</footer>

<script>
/* ============================================================
   LOGI LMS — Cloudflare D1 Edition
   ============================================================ */

const API_BASE = 'https://logi-lms-api.livingoraclesglobalinstitute.workers.dev';

const COURSE = {
  id: 'agile-101',
  title: 'Introduction to Agile Project Management',
  desc: 'This course introduces Agile values and ways of organising work in short, feedback-driven cycles.',
  passMark: 50,
  modules: [
    {
      title: "Agile Mindset and Principles",
      lessons: [{
        title: "Understanding Agile Values and Principles",
        duration: "45 minutes",
        html: `<p>Agile is a mindset and a set of values, not a methodology. The <b>Agile Manifesto</b>, written in 2001 by seventeen practitioners, articulated a set of values that prioritised individuals, working software, customer collaboration and responsiveness to change over rigid processes, documentation, contracts and plans.</p>
<div class="callout"><b>Core principle:</b> Agile does not reject processes, documentation, contracts or plans. It re-balances their importance when they conflict with delivering value to the customer.</div>
<h3>Learning outcomes</h3><p>By the end of this lesson, you should be able to explain the four Agile values, describe the twelve principles, and recognise how Agile differs from traditional project management.</p>
<h3>1. The four Agile values</h3>
<table class="compare"><tr><th>We value more…</th><th>…than</th></tr><tr><td>Individuals and interactions</td><td>Processes and tools</td></tr><tr><td>Working software</td><td>Comprehensive documentation</td></tr><tr><td>Customer collaboration</td><td>Contract negotiation</td></tr><tr><td>Responding to change</td><td>Following a plan</td></tr></table>
<h3>2. The twelve principles</h3>
<div class="diagram">
  <svg viewBox="0 0 640 320" role="img">
    <g font-family="Arial" font-size="11">
      <text x="320" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">The twelve Agile principles</text>
      <rect x="20" y="50" width="190" height="240" rx="8" fill="#ffe0ee" stroke="#e93680"/>
      <text x="115" y="75" text-anchor="middle" font-weight="bold" fill="#e93680">Customer value</text>
      <text x="30" y="100" font-size="10" fill="#333">• Satisfy customer early</text>
      <text x="30" y="120" font-size="10" fill="#333">• Welcome changing needs</text>
      <text x="30" y="140" font-size="10" fill="#333">• Deliver frequently</text>
      <rect x="225" y="50" width="190" height="240" rx="8" fill="#fff2f7" stroke="#e93680"/>
      <text x="320" y="75" text-anchor="middle" font-weight="bold" fill="#e93680">Collaboration</text>
      <text x="235" y="100" font-size="10" fill="#333">• Business and developers daily</text>
      <text x="235" y="120" font-size="10" fill="#333">• Motivated individuals</text>
      <rect x="430" y="50" width="190" height="240" rx="8" fill="#dcecff" stroke="#438bd5"/>
      <text x="525" y="75" text-anchor="middle" font-weight="bold" fill="#2b6cb0">Excellence</text>
      <text x="440" y="100" font-size="10" fill="#333">• Continuous attention quality</text>
      <text x="440" y="120" font-size="10" fill="#333">• Simplicity</text>
    </g>
  </svg>
</div>
<h3>3. Agile vs. traditional</h3>
<table class="compare"><tr><th>Agile</th><th>Traditional (waterfall)</th></tr><tr><td>Iterative delivery in short cycles</td><td>Sequential phases</td></tr><tr><td>Change expected and welcomed</td><td>Change controlled</td></tr></table>`,
        quiz: [
          { q: "How many Agile values?", opts: ["Four core values", "Three basic values", "Five key values", "Six guiding values"], answer: 0 },
          { q: "What does Agile prioritise more?", opts: ["Individuals and interactions", "Processes and tools", "Contracts and plans", "Comprehensive documentation"], answer: 0 },
          { q: "How many Agile principles?", opts: ["Twelve guiding principles", "Ten core principles", "Eight key principles", "Seven basic principles"], answer: 0 },
          { q: "What does working software provide?", opts: ["Primary measure progress", "Only final delivery", "No value at all", "Documentation replacement"], answer: 0 },
          { q: "What does Agile do with change?", opts: ["Welcomes changing needs", "Resists all changes", "Ignores every change", "Delays change requests"], answer: 0 }
        ]
      }]
    },
    {
      title: "Iterative and Incremental Delivery",
      lessons: [{
        title: "Short Cycles, Feedback and Continuous Delivery",
        duration: "50 minutes",
        html: `<p>Agile teams deliver value through short, repeated cycles called <b>iterations</b> or <b>sprints</b>. Each cycle produces a potentially shippable increment that the customer can inspect.</p>
<div class="callout"><b>Core principle:</b> Deliver small increments frequently. The earlier feedback arrives, the cheaper it is to act on.</div>
<h3>1. Iterative vs. incremental</h3>
<table class="compare"><tr><th>Iterative</th><th>Incremental</th></tr><tr><td>Revisits and refines</td><td>Adds new parts each cycle</td></tr><tr><td>Improves quality</td><td>Adds functionality</td></tr></table>
<h3>2. Timeboxes</h3>
<p>A <b>timebox</b> is a fixed duration for a piece of work — typically 2 to 4 weeks for a sprint.</p>`,
        quiz: [
          { q: "What does iterative delivery add?", opts: ["Refinement through cycles", "One final delivery", "Unchanged requirements", "Slower feedback loops"], answer: 0 },
          { q: "What is a timebox?", opts: ["Fixed duration of work", "Open-ended project scope", "Team's largest task", "Contract's payment term"], answer: 0 },
          { q: "What does definition of done mean?", opts: ["Agreed completion criteria", "When budget is spent", "When code is written", "When team disbands"], answer: 0 }
        ]
      }]
    }
  ]
};

function esc(s) { return typeof s !== 'string' ? s : s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function getAuth() { const raw = localStorage.getItem('logi_user'); return raw ? JSON.parse(raw) : null; }

const App = (() => {
  let state = { user: null, mi: 0, li: 0, assessment: false, progress: [] };

  function toggleMobileMenu() { document.querySelector('.sidebar')?.classList.toggle('open'); document.getElementById('drawerOverlay')?.classList.toggle('open'); }
  function closeMobileMenu() { document.querySelector('.sidebar')?.classList.remove('open'); document.getElementById('drawerOverlay')?.classList.remove('open'); }
  function toggleModuleMenu() { document.querySelector('.module-side')?.classList.toggle('open'); document.getElementById('moduleOverlay')?.classList.toggle('open'); }
  function closeModuleMenu() { document.querySelector('.module-side')?.classList.remove('open'); document.getElementById('moduleOverlay')?.classList.remove('open'); }

  async function fetchProgress() {
    const user = getAuth();
    if (!user || !user.token) return [];
    try {
      const res = await fetch(`${API_BASE}/my-progress`, { headers: { 'Authorization': `Bearer ${user.token}` } });
      const data = await res.json();
      return data.progress || [];
    } catch { return []; }
  }

  function isLessonDone(mi, li) {
    // Simplified check based on our D1 structure
    return state.progress.some(p => p.module_id === `agile_module_${mi+1}` && p.lesson_id === `agile_lesson_${li+1}` && p.completed === 1);
  }
  
  function getQuizResult(mi) {
    return state.progress.find(p => p.module_id === `agile_module_${mi+1}` && p.lesson_id === `agile_lesson_1`);
  }

  function renderNav() {
    const el = document.getElementById('navActions');
    const toggleBtn = document.getElementById('menuToggleBtn');
    const u = getAuth();
    if (u) {
      if (toggleBtn) toggleBtn.style.display = 'inline-flex';
      el.innerHTML = `
        <span style="font-size:13px;color:var(--muted);margin-right:8px;">Signed in as <b style="color:var(--pd)">${esc(u.fullName || u.email)}</b></span>
        <button class="btn-outline btn-sm" onclick="App.showDashboard()">Dashboard</button>
        <button class="btn-secondary btn-sm" onclick="App.logout()">Log out</button>
      `;
    } else {
      if (toggleBtn) toggleBtn.style.display = 'none';
      el.innerHTML = `<button class="btn-outline btn-sm" onclick="App.showLogin()">Log in</button><button class="btn btn-sm" onclick="App.showRegister()">Register</button>`;
    }
  }

  function renderSidebar(active) {
    const u = getAuth() || {};
    return `
      <aside class="sidebar">
        <div class="user-badge"><strong>${esc(u.fullName || 'Learner')}</strong><span>${esc(u.email || '')}</span></div>
        <button class="nav-link ${active==='dashboard'?'active':''}" onclick="App.showDashboard()">📊 My dashboard</button>
        <button class="nav-link ${active==='course'?'active':''}" onclick="App.openCourse(0,0)">📘 Current course</button>
        <button class="nav-link ${active==='certificate'?'active':''}" onclick="App.showCertificate()">🏅 My certificate</button>
        <div class="spacer"></div>
        <button class="nav-link" onclick="App.logout()" style="color:var(--muted);">↪ Log out</button>
      </aside>
    `;
  }

  async function showLogin() {
    closeMobileMenu();
    document.getElementById('app').innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h2>Welcome back</h2>
          <p class="muted">Log in to continue Introduction to Agile Project Management.</p>
          <div class="field"><label>Email address</label><input id="loginUser" type="email"></div>
          <div class="field"><label>Password</label><input id="loginPass" type="password"></div>
          <div class="error-msg" id="loginError"></div>
          <button class="btn" style="width:100%;justify-content:center;margin-top:8px;" onclick="App.doLogin()">Log in</button>
          <div class="auth-switch">Don't have an account? <a onclick="App.showRegister()">Register free</a></div>
        </div>
      </div>
    `;
    renderNav();
  }

  async function doLogin() {
    const email = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    err.textContent = 'Signing in...';
    try {
      const res = await fetch(`${API_BASE}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('logi_user', JSON.stringify(data));
      await showDashboard();
    } catch (e) { err.textContent = e.message; }
  }

  async function showRegister() {
    closeMobileMenu();
    document.getElementById('app').innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h2>Create your free account</h2>
          <p class="muted">Register to enrol in Introduction to Agile Project Management.</p>
          <div class="field"><label>Full name</label><input id="regName"></div>
          <div class="field"><label>Email address</label><input id="regEmail" type="email"></div>
          <div class="field"><label>Password</label><input id="regPass" type="password"></div>
          <div class="error-msg" id="regError"></div>
          <button class="btn" style="width:100%;justify-content:center;margin-top:8px;" onclick="App.doRegister()">Create account</button>
          <div class="auth-switch">Already registered? <a onclick="App.showLogin()">Log in</a></div>
        </div>
      </div>
    `;
    renderNav();
  }

  async function doRegister() {
    const fullName = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value;
    const err = document.getElementById('regError');
    err.textContent = 'Creating account...';
    try {
      const res = await fetch(`${API_BASE}/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fullName, email, password }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('logi_user', JSON.stringify(data));
      await showDashboard();
    } catch (e) { err.textContent = e.message; }
  }

  async function showDashboard() {
    const u = getAuth();
    if (!u) return showLogin();
    state.user = u;
    state.progress = await fetchProgress();
    
    const completedCount = state.progress.filter(p => p.completed).length;
    const pct = Math.min(100, Math.round((completedCount / 2) * 100)); // Rough estimate

    document.getElementById('app').innerHTML = `
      <div class="dash-layout">
        ${renderSidebar('dashboard')}
        <main class="main-panel">
          <h1>Welcome back, ${esc((u.fullName || u.email).split(' ')[0])} 👋</h1>
          <p class="subtitle">Here is an overview of your learning progress.</p>
          <div class="stat-grid">
            <div class="stat-box"><div class="num">${pct}%</div><div class="lbl">Course progress</div></div>
            <div class="stat-box"><div class="num">${COURSE.modules.length}</div><div class="lbl">Modules</div></div>
          </div>
          <div class="card">
            <h2>${esc(COURSE.title)}</h2>
            <div class="progress-bar" style="margin:14px 0 8px;"><span style="width:${pct}%;"></span></div>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px;">
              <span style="font-size:13px;color:var(--muted);">${pct}% complete</span>
              <button class="btn" onclick="App.openCourse(0,0)">Start course</button>
            </div>
          </div>
        </main>
      </div>
    `;
    renderNav();
  }

  async function openCourse(mi, li) {
    const u = getAuth(); if (!u) return showLogin();
    state.user = u; state.mi = mi; state.li = li; state.assessment = false;
    closeModuleMenu();
    renderCourse();
  }

  function renderCourse() {
    const u = getAuth(); if (!u) return;
    const mi = state.mi; const li = state.li;
    const mod = COURSE.modules[mi]; if (!mod) return showDashboard();
    if (state.assessment) return renderAssessmentScreen();

    const lesson = mod.lessons[li];
    const pct = Math.min(100, Math.round(((mi+1)/COURSE.modules.length)*100));

    document.getElementById('app').innerHTML = `
      <div class="inner" style="padding:16px 0 48px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <button class="mobile-module-toggle" onclick="App.toggleModuleMenu()">📚 Course Content (${pct}%)</button>
        </div>
        <div class="course-layout">
          <aside class="module-side">
            <div class="sidehead"><h2>Course content</h2><div class="progress-bar"><span style="width:${pct}%;"></span></div></div>
            <div class="modules">
              ${COURSE.modules.map((m, i) => {
                const isOpen = (i === mi);
                const done = isLessonDone(i, 0);
                const quizPassed = getQuizResult(i)?.completed;
                return `
                  <div class="mod-section ${isOpen ? 'open' : ''}">
                    <button class="mod-header" onclick="App.openCourse(${i}, 0)"><span>Module ${i+1}: ${esc(m.title)}</span><span>${isOpen ? '▲' : '▼'}</span></button>
                    <div class="mod-lessons-list">
                      <button class="lesson-item-btn ${(i===mi && !state.assessment) ? 'active' : ''} ${done ? 'done' : ''}" onclick="App.openCourse(${i}, 0)">
                        <span>${done ? '✓' : '📖'}</span><span style="flex:1;">${esc(m.lessons[0].title)}</span>
                      </button>
                      <button class="lesson-item-btn ${(i===mi && state.assessment) ? 'active' : ''}" onclick="App.openAssessment(${i})">
                        <span>${quizPassed ? '✅' : '📝'}</span><span style="flex:1;">Module ${i+1} Assessment</span>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <div style="font-size:12px;color:var(--muted);text-transform:uppercase;">Module ${mi+1} · ${esc(lesson.duration)}</div>
              <h1 style="font-size:24px;line-height:1.2;margin:6px 0 18px;">${esc(lesson.title)}</h1>
              <div>${lesson.html}</div>
              <div class="actions">
                <button class="btn-secondary" onclick="App.prevLesson()">← Previous</button>
                <div style="display:flex;gap:8px;">
                  <button class="btn" onclick="App.markCurrentLesson()">${isLessonDone(mi, li) ? 'Completed ✓' : 'Mark complete'}</button>
                  <button class="btn-secondary" onclick="App.nextLesson()">Next →</button>
                </div>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  function openAssessment(mi) { state.mi = mi; state.assessment = true; closeModuleMenu(); renderAssessmentScreen(); }

  function renderAssessmentScreen() {
    const u = getAuth(); if (!u) return;
    const mi = state.mi;
    const quiz = COURSE.modules[mi].lessons[0].quiz || [];
    const passed = getQuizResult(mi)?.completed;

    document.getElementById('app').innerHTML = `
      <div class="inner" style="padding:16px 0 48px;">
        <div class="course-layout">
          <aside class="module-side">
            <div class="sidehead"><h2>Course content</h2></div>
          </aside>
          <section class="content">
            <article class="card lesson-card">
              <h2>Module ${mi+1} Assessment</h2>
              ${renderQuizUI(mi, quiz)}
              <div class="actions">
                <button class="btn-secondary" onclick="App.openCourse(${mi}, 0)">← Back to lesson</button>
                <button id="nextBtn_${mi}" class="btn ${passed ? '' : 'btn-secondary'}" ${passed ? '' : 'disabled'} onclick="App.continueAfterAssessment()">${mi+1 < COURSE.modules.length ? 'Next Module →' : 'Finish →'}</button>
              </div>
            </article>
          </section>
        </div>
      </div>
    `;
    renderNav();
  }

  function renderQuizUI(mi, quiz) {
    return `
      <div style="margin-top:16px;">
        ${quiz.map((q, qi) => `
          <div class="q" data-qindex="${qi}">
            <b>${qi+1}. ${esc(q.q)}</b>
            ${q.opts.map((opt, oi) => `<label data-opt="${oi}" onclick="App.selectOption(${qi},${oi})"><input type="radio" name="q${mi}_${qi}" value="${oi}"> ${esc(opt)}</label>`).join('')}
          </div>
        `).join('')}
        <button class="btn" style="margin-top:14px;" onclick="App.submitQuiz(${mi})">Submit Answers</button>
        <p id="quizResult_${mi}" style="font-weight:700;margin-top:8px;"></p>
      </div>
    `;
  }

  function selectOption(qi, oi) {
    const wrap = document.querySelector(`.q[data-qindex="${qi}"]`); if (!wrap) return;
    wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    const lbl = wrap.querySelector(`label[data-opt="${oi}"]`); if (lbl) { lbl.classList.add('selected'); const r = lbl.querySelector('input'); if (r) r.checked = true; }
  }

  async function submitQuiz(mi) {
    const u = getAuth(); if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    let score = 0;
    
    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      if (sel && parseInt(sel.value) === q.answer) score++;
    });

    const passed = (score / quiz.length * 100) >= COURSE.passMark;
    const resultEl = document.getElementById('quizResult_' + mi);
    
    if (passed) {
      resultEl.textContent = `Scored ${score}/${quiz.length}. Passed! ✅`;
      resultEl.style.color = 'var(--success)';
      
      // Save to Cloudflare D1
      await fetch(`${API_BASE}/progress`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${u.token}` },
        body: JSON.stringify({ moduleId: `agile_module_${mi+1}`, lessonId: `agile_lesson_1`, completed: 1, quizScore: score, quizTotal: quiz.length })
      });
      
      state.progress = await fetchProgress();
      const nextBtn = document.getElementById('nextBtn_' + mi);
      nextBtn.disabled = false; nextBtn.classList.remove('btn-secondary'); nextBtn.classList.add('btn');
    } else {
      resultEl.textContent = `Scored ${score}/${quiz.length}. Try again.`;
      resultEl.style.color = 'var(--error)';
    }
  }

  function continueAfterAssessment() {
    if (state.mi + 1 < COURSE.modules.length) openCourse(state.mi + 1, 0);
    else showCertificate();
  }

  function prevLesson() { if (state.li > 0) state.li--; else if (state.mi > 0) { state.mi--; state.li = 0; } renderCourse(); }
  function nextLesson() { if (state.li < COURSE.modules[state.mi].lessons.length - 1) state.li++; else state.assessment = true; renderCourse(); }
  
  async function markCurrentLesson() {
    const u = getAuth(); if (!u) return;
    await fetch(`${API_BASE}/progress`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${u.token}` },
      body: JSON.stringify({ moduleId: `agile_module_${state.mi+1}`, lessonId: `agile_lesson_${state.li+1}`, completed: 1, quizScore: 0, quizTotal: 0 })
    });
    state.progress = await fetchProgress();
    renderCourse();
  }

  async function showCertificate() {
    const u = getAuth(); if (!u) return showLogin();
    state.user = u;
    
    // Check if they passed all modules
    const allPassed = COURSE.modules.every((_, i) => getQuizResult(i)?.completed);
    if (!allPassed) {
      alert('You must pass all module assessments to unlock your certificate.');
      return openCourse(0, 0);
    }

    // Generate the certificate via Cloudflare
    const res = await fetch(`${API_BASE}/certificates`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${u.token}` },
      body: JSON.stringify({ courseId: COURSE.id, courseTitle: COURSE.title, studentName: u.fullName || u.email })
    });
    const data = await res.json();
    const cert = data.certificate;

    document.getElementById('app').innerHTML = `
      <div class="dash-layout">
        ${renderSidebar('certificate')}
        <main class="main-panel" style="background: #fbfafc;">
          <h1>My certificate</h1>
          <p class="subtitle">Congratulations! You have completed the course.</p>
          <div class="cert-controls">
            <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
            <button class="btn" onclick="App.downloadCert()">📥 Download as PNG</button>
          </div>
          <div class="cert-display-area">
            <div class="cert-scaler" id="certScaler">
              <div class="cert-wrapper" id="printableCert">
                <img class="cert-watermark" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png">
                <div class="cert-main">
                  <div class="cert-header">
                    <img class="cert-header-logo" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png">
                    <div class="cert-logo-sub">Living Oracles<br>Global Institute</div>
                  </div>
                  <div class="cert-date">${new Date(cert.date).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                  <div class="cert-name">${esc(cert.studentName)}</div>
                  <div class="cert-completion">has successfully completed</div>
                  <div class="cert-course-title">${esc(cert.courseTitle)}</div>
                  <div class="cert-description">This course has been developed and delivered by Living Oracles Global Institute, covering Agile values, iterative delivery, Scrum roles, backlogs, sprint events and continuous improvement.</div>
                  <div class="cert-signature-area">
                    <img class="cert-signature-img" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/president-signature.svg">
                    <div class="cert-signer-name">Prophet Ing Stephen Adusei</div>
                    <div class="cert-signer-title">Program Director | Living Oracles Global Institute</div>
                  </div>
                </div>
                <div class="cert-sidebar">
                  <div class="cert-partner-box">LOGI</div>
                  <div class="cert-sidebar-pattern"></div>
                  <div class="cert-verify-area">
                    <div class="cert-verify-text">Scan to verify<br>this certificate</div>
                    <img class="cert-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(cert.id)}">
                    <div class="cert-blockchain">Blockchain ID:<br>${esc(cert.hash)}</div>
                  </div>
                  <div class="cert-bottom-block"></div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    `;
    renderNav();
    scaleCert();
    window.addEventListener('resize', scaleCert);
  }

  function scaleCert() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const scale = scaler.parentElement.clientWidth / 1000;
    scaler.style.transform = `scale(${scale})`;
    scaler.style.marginBottom = `-${707 * (1 - scale)}px`;
  }

  function downloadCert() {
    const cert = document.getElementById('printableCert');
    const scaler = document.getElementById('certScaler');
    const orig = scaler.style.transform;
    scaler.style.transform = 'none';
    html2canvas(cert, { scale: 2, useCORS: true, backgroundColor: '#fafafa', width: 1000, height: 707 }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      scaler.style.transform = orig;
    });
  }

  function logout() { localStorage.removeItem('logi_user'); showLogin(); }
  function goHome() { const u = getAuth(); u ? showDashboard() : showLogin(); }

  return { 
    toggleMobileMenu, closeMobileMenu, toggleModuleMenu, closeModuleMenu,
    showLogin, doLogin, showRegister, doRegister, showDashboard, 
    openCourse, openAssessment, selectOption, submitQuiz, continueAfterAssessment,
    prevLesson, nextLesson, markCurrentLesson, showCertificate, downloadCert,
    logout, goHome 
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  const u = getAuth();
  if (u) App.showDashboard();
  else App.showLogin();
});
</script>
</body>
</html>
