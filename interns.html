<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4b93">
  <title>Portal Login | Living Oracles Global Institute</title>
  
  <link rel="icon" type="image/png" href="https://i.imgur.com/kkE49KM.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --pink: #ff4b93;
      --pink-dark: #e93680;
      --lav: #f3f0fa;
      --ink: #34343b;
      --muted: #777780;
      --line: #e9e8ef;
      --white: #fff;
      --green: #207a4b;
      --blue: #4285F4;
      --shadow: 0 2px 9px rgba(0,0,0,.07);
      --shadow-hover: 0 7px 18px rgba(0,0,0,.09);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: #f5f5f8; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    /* Topbar */
    .topbar { height: 64px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 max(5%, calc((100% - 1180px)/2)); box-shadow: 0 2px 9px rgba(0,0,0,.07); position: sticky; top: 0; z-index: 5; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; letter-spacing: -1.5px; color: #555; }
    .brand span.brand-dot { color: var(--pink); }
    .brand .brand-sub { font-size: 13px; font-weight: 500; letter-spacing: 0; color: #8b7777; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 13px; color: var(--muted); max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Buttons */
    .btn { border: 0; border-radius: 4px; background: var(--pink); color: #fff; padding: 10px 20px; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: background .15s; }
    .btn:hover { background: var(--pink-dark); }
    .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn.secondary:hover { background: var(--lav); }

    /* Layout */
    .wrap { max-width: 1180px; margin: 0 auto; padding: 34px 5% 60px; }

    /* Login Screen */
    .login-shell { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 28px; background: linear-gradient(110deg, #f8f2fb 0%, #fff 56%, #ffe9f1 100%); }
    .login-card { width: min(100%, 430px); background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 30px; box-shadow: 0 12px 35px rgba(255,75,147,.08); }
    .login-card h1 { margin: 0 0 8px; font-size: 26px; }
    .login-card p { color: var(--muted); line-height: 1.55; font-size: 14px; }
    .field { margin: 18px 0; }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
    .field input { width: 100%; padding: 12px; border: 1px solid #e9e8ef; border-radius: 4px; outline: none; }
    .field input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,75,147,.15); }
    .login-card .btn { width: 100%; padding: 13px; }
    .error-msg { color: red; font-size: 13px; margin-bottom: 10px; display: none; background: #fff5f8; padding: 10px; border-radius: 4px; border: 1px solid #f6c7da;}

    /* Dashboard Styles */
    .dashboard-header { margin-bottom: 20px; }
    .dashboard-header h1 { margin: 0 0 5px 0; color: var(--ink); font-size: 28px; }
    .dashboard-header p { margin: 0; color: var(--muted); font-size: 15px; }

    /* Welcome Box */
    .welcome-box { background: linear-gradient(110deg,#f8f2fb 0%,#fff 56%,#ffe9f1 100%); border-radius: 8px; padding: 24px 30px; margin-bottom: 30px; border-left: 5px solid var(--pink); }
    .welcome-box h2 { margin: 0 0 10px 0; font-size: 20px; color: var(--ink); }
    .welcome-box p { margin: 0; color: var(--ink); font-size: 14.5px; line-height: 1.6; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 30px; }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    
    .staff-card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; }
    
    .staff-card.border-pink { border-top: 5px solid var(--pink); }
    .staff-card.border-dark { border-top: 5px solid #34343b; }
    .staff-card.border-green { border-top: 5px solid #28a745; }
    .staff-card.border-blue { border-top: 5px solid #4285F4; }
    .staff-card.border-purple { border-top: 5px solid #6f42c1; }

    .card-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 15px; font-weight: bold; }
    .bg-pink { background: #ffe9f1; color: var(--pink); }
    .bg-dark { background: #f0f0f0; color: #34343b; }
    .bg-green { background: #e8f5ed; color: #28a745; }
    .bg-blue { background: #e8f0fe; color: #4285F4; }
    .bg-purple { background: #f3e8ff; color: #6f42c1; }

    .staff-card h3 { margin: 0 0 10px 0; color: var(--ink); font-size: 17px; font-family: monospace; }
    .staff-card p { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 20px; flex-grow: 1;}

    .section-title { font-size: 18px; font-weight: 800; color: var(--ink); margin: 40px 0 20px 0; border-bottom: 2px solid var(--line); padding-bottom: 8px; }

    /* Duty List */
    .duty-list { list-style: none; padding: 0; margin: 0; }
    .duty-list li { position: relative; padding-left: 28px; margin-bottom: 16px; font-size: 14px; color: var(--ink); line-height: 1.5; }
    .duty-list li::before { content: "✓"; position: absolute; left: 0; top: 0; color: var(--pink); font-weight: bold; font-size: 16px; }

    /* Skill Guides */
    .skill-guide { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 15px; overflow: hidden; box-shadow: var(--shadow); }
    .skill-header { padding: 18px 20px; background: #fafafa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 15px; color: var(--ink); border-bottom: 1px solid transparent; transition: background 0.2s; }
    .skill-header:hover { background: #f0f0f5; }
    .skill-header.active { border-bottom-color: var(--line); background: #fff; }
    .skill-header span.icon { color: var(--pink); font-size: 18px; margin-right: 10px; }
    .skill-content { display: none; padding: 20px; font-size: 14px; line-height: 1.6; color: var(--ink); background: #fff; }
    .skill-content.show { display: block; }
    .skill-content ul { margin: 10px 0 0 0; padding-left: 20px; }
    .skill-content li { margin-bottom: 8px; }

    /* Deadline Highlight */
    .deadline-alert { display: inline-block; background: #ffe9f1; color: #e93680; font-weight: 800; font-size: 12.5px; padding: 6px 12px; border-radius: 4px; margin-bottom: 15px; border: 1px dashed #ff4b93; }
    
    .alert-box { background: #fff3cd; border: 1px solid #ffeeba; border-left: 5px solid #ffc107; padding: 20px; border-radius: 6px; margin-top: 30px; }
    .alert-box h4 { margin: 0 0 10px 0; color: #856404; font-size: 16px; }
    .alert-box p { margin: 0; color: #856404; font-size: 13.5px; }

    /* Footer */
    .footer { background: #292832; color: #eee; text-align: center; padding: 24px 5%; font-size: 12px; margin-top: auto; }
    .footer strong { color: var(--pink); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      LOGI<span class="brand-dot">.</span>
      <span class="brand-sub">| Interns & Volunteers</span>
    </div>
    <div class="top-actions">
      <span class="user-email" id="userEmail"></span>
      <button class="btn secondary" id="logoutBtn" style="display:none" onclick="logout()">Log out</button>
    </div>
  </header>

  <main id="app"></main>

  <div class="footer">Living Oracles Global Institute · <strong>Faith. Excellence. Impact.</strong></div>

<script>
  // --- CONFIGURATION ---
  const SUPABASE_URL = 'https://dnmkflwwanltkdnnycml.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cSrAH2lTK6jfP9BdHPNZng_AJqpsjvt';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // Links
  const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1w3oq8v7-xIRKeshgUCUQNhlbYdHut8VsZUb-wg40GMc/edit?usp=drivesdk";
  const REPORT_DOC_URL = "https://docs.google.com/document/d/1irAJXtdwdbLxbalV6gUfjiohJksgXsSjYC1ss17Wgws/edit?usp=drivesdk";

  const app = document.getElementById('app');

  // --- LOGIN SCREEN ---
  function showLogin(message = '') {
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('userEmail').textContent = '';
    
    app.innerHTML = `
      <div class="login-shell">
        <form class="login-card" id="loginForm">
          <div class="eyebrow" style="color:var(--pink); font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:1px;">Living Oracles Global Institute</div>
          <h1>Sign in to Portal</h1>
          <p>Enter your credentials to access your dashboard.</p>
          
          <div class="error-msg" id="errorMsg" style="${message ? 'display:block' : 'display:none'}">${message}</div>
          
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn" type="submit" id="loginBtn">Sign in</button>
        </form>
      </div>`;

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');
      
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
        return;
      }

      loadDatabaseStudio(email);
    });
  }

  // --- DATABASE STUDIO DASHBOARD ---
  function loadDatabaseStudio(email) {
    document.getElementById('logoutBtn').style.display = 'inline-flex';
    document.getElementById('userEmail').textContent = email;

    const firstName = email.toLowerCase() === 'michaelyawotchere@gmail.com' ? 'Michael' : email.split('@')[0];

    app.innerHTML = `
      <div class="wrap">
        
        <div class="dashboard-header">
          <div>
            <h1>Business & Administration Dashboard</h1>
            <p>Data Entry & Reporting Track</p>
          </div>
        </div>

        <!-- Welcome Box -->
        <div class="welcome-box">
          <h2>Welcome to LOGI, ${firstName}!</h2>
          <p>Your primary focus here is <strong>data entry, records management, and reporting</strong>. You will support LOGI in organizing reliable administrative information and turning records into useful reports, applying your analytics training in a real institutional setting.</p>
        </div>
        
        <!-- 4 Database Sheets -->
        <div class="grid grid-4">
          <div class="staff-card border-pink">
            <div class="card-icon bg-pink">👥</div>
            <h3>users</h3>
            <p>Enter and update approved student and applicant records using LOGI templates.</p>
            <a href="${GOOGLE_SHEET_URL}" target="_blank" class="btn">Open Sheet</a>
          </div>

          <div class="staff-card border-blue">
            <div class="card-icon bg-blue">📝</div>
            <h3>enrolments</h3>
            <p>Track which programme or department each student is officially enrolled in.</p>
            <a href="${GOOGLE_SHEET_URL}" target="_blank" class="btn" style="background:#4285F4;">Open Sheet</a>
          </div>

          <div class="staff-card border-dark">
            <div class="card-icon bg-dark">📈</div>
            <h3>progress</h3>
            <p>Review activity and maintain clear data dictionaries and simple SOPs.</p>
            <a href="${GOOGLE_SHEET_URL}" target="_blank" class="btn" style="background:#34343b;">Open Sheet</a>
          </div>

          <div class="staff-card border-green">
            <div class="card-icon bg-green">🏆</div>
            <h3>certificates</h3>
            <p>Verify completed requirements and prepare summaries for management review.</p>
            <a href="${GOOGLE_SHEET_URL}" target="_blank" class="btn" style="background:#28a745;">Open Sheet</a>
          </div>
        </div>

        <!-- Duties Section -->
        <h3 class="section-title">Your Core Duties</h3>
        <div class="grid">
          <div class="staff-card">
            <ul class="duty-list">
              <li><strong>Data Cleaning & Validation:</strong> Check records for missing fields, inconsistent formats, duplicates, and obvious errors. Flag issues for supervisor review.</li>
              <li><strong>Spreadsheet Organisation:</strong> Standardise headings, formats, and identify duplicate or incomplete entries.</li>
            </ul>
          </div>
          <div class="staff-card">
            <ul class="duty-list">
              <li><strong>Routine Reporting:</strong> Prepare weekly counts and summaries by application status, programme, and other approved categories.</li>
              <li><strong>Visual Reporting:</strong> Develop simple Power BI dashboards once the underlying data has been checked and approved.</li>
            </ul>
          </div>
        </div>

        <!-- Skill Application Guide -->
        <h3 class="section-title">Skill Application Guide</h3>
        <p style="color:var(--muted); font-size:14px; margin-top:-10px; margin-bottom:20px;">Click each skill below to see exactly how to apply your Blossom Academy training to your weekly tasks at LOGI.</p>
        
        <div class="skill-guide">
          <div class="skill-header" onclick="toggleSkill(this)">
            <div><span class="icon">📊</span> Excel: Data Cleaning & Organisation</div>
            <span>▼</span>
          </div>
          <div class="skill-content">
            <p>Since your role involves data entry and validation, use these Excel techniques from your training:</p>
            <ul>
              <li><strong>Data Validation:</strong> Set up dropdowns for "Programme" and "Status" columns in the master sheet to prevent spelling errors.</li>
              <li><strong>Remove Duplicates:</strong> Use <em>Data > Remove Duplicates</em> on the applicant list before every Friday report.</li>
              <li><strong>Text Cleaning:</strong> Use the <code>TRIM()</code> and <code>PROPER()</code> functions to fix messy names and extra spaces.</li>
              <li><strong>Lookups:</strong> Use <code>VLOOKUP</code> or <code>XLOOKUP</code> to pull student details from the `users` sheet into the `enrolments` sheet.</li>
            </ul>
          </div>
        </div>

        <div class="skill-guide">
          <div class="skill-header" onclick="toggleSkill(this)">
            <div><span class="icon">🔍</span> SQL: Querying & Managing Records</div>
            <span>▼</span>
          </div>
          <div class="skill-content">
            <p>If LOGI moves the database from Google Sheets to a SQL server, or if you need to extract data:</p>
            <ul>
              <li><strong>Joins:</strong> Use <code>INNER JOIN</code> to combine the `users` table and the `enrolments` table so you can see which students are active.</li>
              <li><strong>Filtering:</strong> Write <code>WHERE</code> clauses to find specific groups (e.g., all students enrolled in a specific programme).</li>
              <li><strong>Aggregation:</strong> Use <code>COUNT()</code> and <code>GROUP BY</code> to find the total number of applicants per department.</li>
            </ul>
          </div>
        </div>

        <div class="skill-guide">
          <div class="skill-header" onclick="toggleSkill(this)">
            <div><span class="icon">📈</span> Power BI: Visual Reporting & Dashboards</div>
            <span>▼</span>
          </div>
          <div class="skill-content">
            <p>You are expected to "Develop simple Power BI dashboards." Here is how:</p>
            <ul>
              <li><strong>Connect Data:</strong> Import the cleaned Google Sheet/Excel file into Power BI.</li>
              <li><strong>Visuals:</strong> Create a bar chart for "Students per Programme" and a pie chart for "Gender Distribution."</li>
              <li><strong>Slicers:</strong> Add a date slicer so Stephen can filter the dashboard to see applications from a specific month.</li>
              <li><strong>Refresh:</strong> Every Friday, click "Refresh" in Power BI, save the dashboard as a PDF, and attach it to your weekly report.</li>
            </ul>
          </div>
        </div>

        <div class="skill-guide">
          <div class="skill-header" onclick="toggleSkill(this)">
            <div><span class="icon">🐍</span> Python: Automation & Data Analysis</div>
            <span>▼</span>
          </div>
          <div class="skill-content">
            <p>Use Python to save hours of manual work if the data gets large:</p>
            <ul>
              <li><strong>Pandas:</strong> Write a script using <code>pandas.read_excel()</code> to automatically clean missing values (e.g., dropping rows with no email).</li>
              <li><strong>Automation:</strong> Write a script that takes the raw CSV data, cleans it, and outputs a ready-to-use Excel file for the Friday report.</li>
              <li><strong>Matplotlib:</strong> Generate quick trend charts (e.g., weekly application volume) directly from Python.</li>
            </ul>
          </div>
        </div>

        <!-- Submit Report & Supervisor -->
        <h3 class="section-title">Weekly Workflow</h3>
        <div class="grid">
          
          <div class="staff-card border-purple">
            <div class="card-icon bg-purple">📄</div>
            <h3 style="font-family: inherit;">Submit Weekly Report</h3>
            
            <!-- Highlighted Deadline -->
            <div class="deadline-alert">⚠️ DEADLINE: Every Friday at 12:00 PM</div>
            
            <p>Share a brief summary of what you learned, completed tasks, questions, and your next actions for supervisor review.</p>
            <a href="${REPORT_DOC_URL}" target="_blank" class="btn" style="background:#6f42c1; margin-top: auto;">Open Report Document</a>
          </div>

          <div class="staff-card" style="border-top: 5px solid var(--ink);">
            <div class="card-icon" style="background: #e0e0e0; color: var(--ink);">👤</div>
            <h3 style="font-family: inherit;">Your Supervisor</h3>
            <p style="margin-bottom: 5px;"><strong>Name:</strong> Stephen</p>
            <p style="margin-bottom: 20px;"><strong>Email:</strong> <a href="mailto:stephen.adusei@logi.education" style="color: var(--pink); text-decoration: underline;">stephen.adusei@logi.education</a></p>
            <div>
               <a href="mailto:stephen.adusei@logi.education" class="btn secondary" style="width: 100%; margin-top: auto;">Email Supervisor</a>
            </div>
          </div>

        </div>

        <!-- Confidentiality Alert -->
        <div class="alert-box">
          <h4>⚠️ Essential Standard: Confidentiality & Responsible Data Handling</h4>
          <p><strong>Access only what you need.</strong> Do not disclose, forward, or copy personal data outside approved LOGI channels. <strong>Do not make unapproved changes</strong>—flag uncertain records to Stephen. Save work only in LOGI-approved locations. Report any accidental sharing or data-quality concerns immediately.</p>
        </div>

      </div>
    `;
  }

  // --- HELPERS ---
  window.toggleSkill = function(element) {
    const content = element.nextElementSibling;
    const isShowing = content.classList.contains('show');
    
    // Close all other open guides
    document.querySelectorAll('.skill-content').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.skill-header').forEach(el => {
      el.classList.remove('active');
      const arrow = el.querySelector('span:last-child');
      if (arrow) arrow.textContent = '▼';
    });

    if (!isShowing) {
      content.classList.add('show');
      element.classList.add('active');
      const arrow = element.querySelector('span:last-child');
      if (arrow) arrow.textContent = '▲';
    }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    showLogin('You have been signed out.');
  }

  // --- INITIALIZATION ---
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') showLogin();
    if (event === 'SIGNED_IN' && session) loadDatabaseStudio(session.user.email);
  });

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      loadDatabaseStudio(session.user.email);
    } else {
      showLogin();
    }
  })();
</script>
</body>
</html>
