<script>
document.addEventListener('DOMContentLoaded', function () {

    // ============ DROPDOWNS ============
    document.querySelectorAll('.navigation-menu-bar .has-submenu').forEach(function (li) {
        const link = li.querySelector(':scope > a');
        if (!link) return;

        link.addEventListener('click', function (e) {
            e.preventDefault();
            const isMobile = window.innerWidth <= 768;

            // Close sibling dropdowns
            li.parentElement.querySelectorAll(':scope > .has-submenu').forEach(function (sib) {
                if (sib !== li) {
                    sib.classList.remove('desktop-dropdown-open');
                    sib.classList.remove('mobile-dropdown-open');
                }
            });

            li.classList.toggle(isMobile ? 'mobile-dropdown-open' : 'desktop-dropdown-open');
        });
    });

    // Close dropdowns when clicking outside
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.has-submenu')) {
            document.querySelectorAll('.desktop-dropdown-open, .mobile-dropdown-open').forEach(function (el) {
                el.classList.remove('desktop-dropdown-open');
                el.classList.remove('mobile-dropdown-open');
            });
        }
    });

    // ============ MOBILE MENU BUTTON ============
    const menuBtn = document.getElementById('mobileMenuBtn');
    const navBar = document.querySelector('.navigation-menu-bar');

    if (menuBtn && navBar) {
        menuBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            navBar.classList.toggle('mobile-open');
            document.body.style.overflow = navBar.classList.contains('mobile-open') ? 'hidden' : '';
        });
    }
});
</script>
