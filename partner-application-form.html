    <style>
        /* ========================================== */
        /*   TOP BAR - FIXED - KENTE COLOR ACCENTS   */
        /* ========================================== */
        .top-bar {
            background: #1a1a2e;
            color: #ffffff;
            padding: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .top-bar::before,
        .top-bar::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50px;
            background: linear-gradient(180deg, 
                #c9a86c 0%, #c9a86c 20%,
                #8B5353 20%, #8B5353 40%,
                #1a7a3a 40%, #1a7a3a 60%,
                #c9a86c 60%, #c9a86c 80%,
                #8B5353 80%, #8B5353 100%
            );
            opacity: 0.5;
        }

        .top-bar::before {
            left: 0;
            border-radius: 0 4px 4px 0;
        }

        .top-bar::after {
            right: 0;
            border-radius: 4px 0 0 4px;
        }

        .top-bar .contact-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            padding: 0 60px;
            position: relative;
            z-index: 1;
        }

        .top-bar .contact-info a,
        .top-bar .contact-info span {
            color: #d4d0c8;
            text-decoration: none;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .top-bar .contact-info a:hover {
            color: #c9a86c;
        }

        .top-bar .contact-info i {
            font-size: 0.65rem;
            color: #c9a86c;
        }

        .top-bar .social-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 60px;
            position: relative;
            z-index: 1;
        }

        .top-bar .social-icons a {
            color: #8a8680;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .top-bar .social-icons a:hover {
            color: #c9a86c;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 4px 0;
            }
            .top-bar::before,
            .top-bar::after {
                width: 25px;
            }
            .top-bar .contact-info {
                padding: 0 35px;
                gap: 8px;
            }
            .top-bar .social-icons {
                padding: 0 35px;
            }
            .top-bar .contact-info a,
            .top-bar .contact-info span {
                font-size: 0.6rem;
            }
        }

        @media (max-width: 480px) {
            .top-bar::before,
            .top-bar::after {
                width: 18px;
            }
            .top-bar .contact-info {
                padding: 0 25px;
                gap: 6px;
                font-size: 0.55rem;
            }
            .top-bar .social-icons {
                padding: 0 25px;
                gap: 8px;
            }
            .top-bar .social-icons a {
                font-size: 0.65rem;
            }
        }

        /* ========================================== */
        /*   HEADER - FIXED FULL WIDTH WHITE         */
        /* ========================================== */
        .main-header {
            background: #ffffff;
            padding: 8px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 38px;
            left: 0;
            width: 100%;
            z-index: 9998;
            border-bottom: 1px solid #e8e3dc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            width: 40px;
            height: auto;

        }

        .logo .logo-text {
            color: #1a1a2e;
            font-size: 0.8rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .logo .logo-text span {
            display: block;
            font-weight: 300;
            font-size: 0.45rem;
            opacity: 0.6;
            letter-spacing: 1.5px;
        }

        @media (max-width: 768px) {
            .main-header {
                top: 34px;
                padding: 6px 4%;
            }
            .logo img {
                width: 32px;
            }
            .logo .logo-text {
                font-size: 0.65rem;
            }
            .logo .logo-text span {
                font-size: 0.4rem;
            }
        }

            .main-header {
                top: 30px;
                padding: 4px 3%;
            }
            .logo img {
                width: 28px;
            }
            .logo .logo-text {
                font-size: 0.55rem;
            }
            .logo .logo-text span {
                font-size: 0.35rem;
            }
        }

        /* ========================================== */
        /*   MOBILE HAMBURGER MENU BUTTON             */
        /* ========================================== */
        .menu-btn {
            display: none;
            align-items: center;
            gap: 6px;

            border-radius: 30px;

            transition: all 0.3s ease;

        .menu-btn:hover {
            background: rgba(26, 26, 46, 0.12);
        }

        .menu-btn i {
            font-size: 16px;
        }

        /* ========================================== */
        /*   DESKTOP NAVIGATION - DARK TEXT          */
        /* ========================================== */
        .navigation-menu-bar {
            background: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            position: static !important;
            width: auto !important;
            height: auto !important;
            display: block !important;
            overflow: visible !important;
        }

        .navigation-menu-bar ul {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            list-style: none !important;
            gap: 0.2rem !important;
            margin: 0 !important;
            padding: 0 !important;
            flex-wrap: wrap !important;
            justify-content: flex-end !important;
        }

        .navigation-menu-bar ul li {
            position: relative;
        }

        .navigation-menu-bar ul li a {
            color: #1a1a2e !important;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .navigation-menu-bar ul li a:hover {
            color: #8B5353 !important;
            background: rgba(139, 83, 83, 0.06);
        }

        .navigation-menu-bar ul li .submenu {
            display: none !important;
            position: absolute;
            top: 100%;
            left: 0;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            padding: 0.4rem 0;
            margin-top: 6px;
            z-index: 1100;
            animation: fadeInDropdown 0.25s ease;
            flex-direction: column !important;
            align-items: stretch !important;
            gap: 0px !important;
            min-width: 200px;
            width: max-content !important;
        }

        .navigation-menu-bar ul li.desktop-dropdown-open .submenu {
            display: flex !important;
        }

        .navigation-menu-bar ul li .submenu li {
            width: 100%;
        }

        .navigation-menu-bar ul li .submenu li a {
            color: #1e3c4f !important;
            font-size: 0.78rem;
            padding: 8px 16px;
            width: 100%;
            border-radius: 0;
            font-weight: 500;
            display: block !important;
            white-space: nowrap !important;
            text-shadow: none !important;
        }

        .navigation-menu-bar ul li .submenu li a:hover {
            background: rgba(139, 83, 83, 0.08) !important;
            color: #8B5353 !important;
        }

        .navigation-menu-bar ul li.has-submenu>a .menu-chevron-icon {
            font-size: 0.5rem;
            transition: transform 0.25s ease;
        }

        .navigation-menu-bar ul li.desktop-dropdown-open>a .menu-chevron-icon {
            transform: rotate(180deg);
        }

        @keyframes fadeInDropdown {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================== */
        /*   MOBILE MENU - FULL SCREEN SLIDE IN      */
        /* ========================================== */
        @media (max-width: 768px) {
            .menu-btn {
                display: flex !important;
            }

            .navigation-menu-bar {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                height: 100vh !important;
                max-height: 100vh !important;
                min-height: 100vh !important;
                overflow-y: auto !important;
                background: #ffffff !important;
                display: block !important;
                flex-direction: column !important;
                justify-content: flex-start !important;
                align-items: stretch !important;
                transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1) !important;
                z-index: 10000 !important;
                padding: 70px 1.2rem 1.5rem 1.2rem !important;
                box-shadow: none !important;
                transform: translateX(100%) !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }

            .navigation-menu-bar.mobile-open {
                transform: translateX(0) !important;

                pointer-events: auto !important;
            }

            .navigation-menu-bar ul {
                display: flex !important;
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0 !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                flex: 1 !important;
            }

            .navigation-menu-bar ul li {
                border-bottom: 1px solid #f0ede6 !important;
                list-style: none !important;
            }

            .navigation-menu-bar ul li a {
                color: #1a1a2e !important;
                font-weight: 500 !important;
                padding: 0.7rem 0.5rem !important;
                justify-content: flex-start !important;
                border-radius: 0 !important;
                white-space: normal !important;
                text-shadow: none !important;
                border-bottom: none !important;
                background: transparent !important;
                display: flex !important;

                gap: 10px !important;
                font-size: 0.95rem !important;
            }

            .navigation-menu-bar ul li a i {
                font-size: 1.1rem !important;
                color: #c9a86c !important;
                width: 24px !important;
                text-align: center !important;
            }

            .navigation-menu-bar ul li a:hover {
                background: rgba(139, 83, 83, 0.06) !important;
                color: #8B5353 !important;
            }

            .navigation-menu-bar ul li.has-submenu>a {
                justify-content: space-between !important;
            }

            .navigation-menu-bar ul li.has-submenu>a .menu-chevron-icon {
                color: #8B5353 !important;
                font-size: 0.65rem !important;
                margin-left: auto !important;
            }

            .navigation-menu-bar ul li .submenu {
                position: static !important;
                transform: none !important;
                background: #f8f6f2 !important;
                border-radius: 0 !important;
                display: none !important;
                flex-direction: column !important;
                gap: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                border-left: 3px solid #c9a86c !important;
                width: 100% !important;
                box-shadow: none !important;
                min-width: auto !important;
                animation: none !important;
            }

            .navigation-menu-bar ul li.mobile-dropdown-open .submenu {
                display: flex !important;
            }

            .navigation-menu-bar ul li .submenu li {
                border-bottom: none !important;
            }

            .navigation-menu-bar ul li .submenu li a {
                color: #1a1a2e !important;
                font-weight: 400 !important;
                padding: 0.5rem 0.8rem 0.5rem 2.2rem !important;
                border-bottom: none !important;
                background: transparent !important;
                justify-content: flex-start !important;
                gap: 10px !important;
                font-size: 0.85rem !important;
            }

            .navigation-menu-bar ul li .submenu li a i {
                font-size: 0.85rem !important;
                color: #c9a86c !important;
                width: 20px !important;
                text-align: center !important;
            }

            .navigation-menu-bar ul li .submenu li a:hover {
                background: rgba(139, 83, 83, 0.08) !important;
                color: #8B5353 !important;
            }

            .navigation-menu-bar ul li .submenu li.has-submenu .submenu {
                border-left: 3px solid #8B5353 !important;
                margin-left: 1rem !important;
            }

            .navigation-menu-bar ul li .submenu li.has-submenu .submenu li a {
                padding-left: 3rem !important;
            }

            .navigation-menu-bar .mobile-menu-footer {

            }

            .navigation-menu-bar .mobile-menu-footer a:hover {
                color: #c9a86c !important;
            }
        }

        @media (max-width: 480px) {
            .navigation-menu-bar {
                padding: 60px 1rem 1.5rem 1rem !important;
            }
            .navigation-menu-bar ul li a {
                font-size: 0.85rem !important;

            }
            .navigation-menu-bar ul li .submenu li a {
                font-size: 0.78rem !important;
                padding: 0.4rem 0.6rem 0.4rem 1.8rem !important;
            }
        }

        /* ========================================== */
        /*   FOOTER - MATCHING FOUNDER'S MESSAGE     */
        /* ========================================== */
        .institutional-footer {
            background: #1a1a2e;
            color: #d4d0c8;
            padding: 2.5rem 5% 1.2rem;
            margin-top: 0;
            border-top: none;
            font-size: 0.85rem;
            width: 100%;
        }

        .footer-grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 1.5rem;
        }

        .footer-column h2 {
            color: #ffffff !important;
            font-size: 0.8rem !important;
            margin-bottom: 0.6rem !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.08em !important;
        }

        .footer-column p,
        .footer-column address {
            color: #b0aca4;
            font-size: 0.82rem;
            line-height: 1.7;
            font-style: normal;
            margin-bottom: 4px;
        }

        .footer-column a {
            color: #b0aca4 !important;
            text-decoration: none !important;
            font-size: 0.82rem !important;
            transition: color 0.25s ease !important;
            display: inline-block;
        }

        .footer-column a:hover {
            color: #ffffff !important;
        }

        .footer-column ul {
            list-style: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .footer-column ul li {
            margin-bottom: 0.2rem !important;
            list-style: none !important;
        }

        .footer-column ul li a {
            color: #b0aca4 !important;
            text-decoration: none !important;
            font-size: 0.82rem !important;
            transition: color 0.25s ease !important;
        }

        .footer-column ul li a:hover {
            color: #ffffff !important;
        }

        .footer-column .footer-address-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 4px;
        }

        .footer-column .footer-address-line i {
            color: #c9a86c;
            font-size: 0.75rem;
            margin-top: 4px;
            width: 16px;
        }

        .footer-column .footer-address-line span {
            color: #b0aca4;
            font-size: 0.82rem;
            line-height: 1.6;
        }

        .footer-bottom-bar {
            max-width: 1200px;
            margin: 1.2rem auto 0;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .footer-copyright {
            font-size: 0.7rem;
            font-weight: 400;
            color: #8a8680;
        }

        .footer-subscription-container h3 {
            color: #ffffff;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.05em;
            margin-bottom: 0.2rem;
        }

        .footer-subscription-container p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.75rem;
            margin-bottom: 0.2rem;
        }

        .subscription-form {
            display: flex;
            gap: 4px;
            width: 100%;
            flex-wrap: wrap;
        }

        .subscription-form input[type="email"] {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 5px 8px;
            color: #ffffff;
            font-size: 0.75rem;
            flex-grow: 1;
            outline: none;
            transition: border-color 0.3s;
            min-width: 100px;
        }

        .subscription-form input[type="email"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .subscription-form input[type="email"]:focus {
            border-color: #ffffff;
        }

        .subscription-form button {
            background: #ffffff;
            color: #8B5353;
            border: none;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.05em;
        }

        .subscription-form button:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        @media (max-width: 900px) {
            .footer-grid-container {
                grid-template-columns: 1fr 1fr;
                gap: 1.2rem;
            }
            .institutional-footer { font-size: 0.75rem; }
            .footer-column h2 { font-size: 0.7rem !important; }
            .footer-column p, .footer-column address, .footer-column a,
            .footer-column ul li a, .footer-column .footer-address-line span {
                font-size: 0.72rem !important;
            }
        }

        @media (max-width: 600px) {
            .footer-grid-container {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .footer-bottom-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .institutional-footer { 
                font-size: 0.7rem;
                padding: 1.5rem 4% 1rem;
            }
            .footer-column h2 { font-size: 0.6rem !important; }
            .footer-column p, .footer-column address, .footer-column a,
            .footer-column ul li a, .footer-column .footer-address-line span {
                font-size: 0.65rem !important;
            }
        }

        /* ========================================== */
        /*   FLOATING CHAT                            */
        /* ========================================== */
        .floating-chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }

        .floating-chat-link {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #25d366;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .floating-chat-link:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);

            font-size: 1.1rem;

            .floating-chat-link {
                padding: 8px 12px;
                font-size: 0.7rem;
            }
            .floating-chat-link span {
                display: none;
            }
            .floating-chat-link i {
                font-size: 1.3rem;
            }
        }

        /* ========================================== */
        /*          GLOBAL THEME ROOT RESETS          */
        /* ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html,
        body {
            overflow-x: hidden !important;
            width: 100% !important;
        }

        body {
            background-color: #fcfdfe;
            color: #334155;
            line-height: 1.5;
            padding-top: 80px;
            -webkit-font-smoothing: antialiased;
        }

        .container-wrapper {
            max-width: 100% !important;
            margin: 0 auto;
            padding: 0 !important;
            width: 100% !important;
        }

        /* ========================================== */
        /*   PARTNER APPLICATION FORM STYLES          */
        /* ========================================== */
        :root {
            --primary: #8B5353;
            --primary-hover: #724141;
            --border-color: #dcdcdc;
            --text-dark: #222222;
            --text-muted: #555555;
        }

        .form-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: transparent;
            padding: 20px 0;
            border-radius: 0;
            box-shadow: none;
            border: none;
        }

        .form-header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            text-align: center;
        }

        .form-logo {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
        }

        .form-header h1 {
            font-size: 26px;
            color: var(--primary);
            font-weight: 700;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin: 30px 0 15px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .required {
            color: #d9534f;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="url"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: transparent;
            background-color: transparent;
            color: var(--text-dark);
            transition: border-color 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: transparent;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .address-stack input {
            margin-bottom: 10px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 0;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .file-upload-box {
            border: 2px dashed var(--border-color);
            background: transparent;
            padding: 25px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .file-upload-box:hover {
            border-color: var(--primary);
        }

        .file-upload-box input[type="file"] {
            display: none;
        }

        .upload-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        .upload-text span {
            color: var(--primary);
            font-weight: 700;
        }

        #file-name-display {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        .terms-box {
            background: transparent;
            border: none;
            padding: 10px 0;
            margin-top: 25px;
        }

        .terms-text {
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!--   HEADER PLACEHOLDER                       -->
    <!-- ========================================== -->
    <div id="header-placeholder"></div>

    <!-- ========================================== -->
    <!--     PAGE CONTENT - PARTNER APPLICATION     -->
    <!-- ========================================== -->
    <main class="container-wrapper">

        <div class="form-container">
            <div class="form-header">
                <img alt="LOGI Logo" class="form-logo" src="https://i.imgur.com/kkE49KM.png">
                <h1>Partner Application Form</h1>
            </div>

            <form id="partnerApplicationForm">

                <!-- PARTNERSHIP PLAN -->
                <div class="form-group">
                    <label>Partnership Plan <span class="required">*</span></label>
                    <div class="options-list">
                        <label class="option-item">
                            <input type="radio" name="partnership_plan" value="Bronze - $500" required>
                            Bronze - $500
                        </label>
                        <label class="option-item">
                            <input type="radio" name="partnership_plan" value="Silver - $800">
                            Silver - $800
                        </label>
                        <label class="option-item">
                            <input type="radio" name="partnership_plan" value="Gold - $1400">
                            Gold - $1400
                        </label>
                        <label class="option-item">
                            <input type="radio" name="partnership_plan" value="Custom">
                            Custom
                        </label>
                    </div>
                </div>

                <!-- SCHOOL DETAILS -->
                <div class="section-title">School Details</div>

                <div class="form-group">
                    <label>Institution Name <span class="required">*</span></label>
                    <input type="text" name="institution_name" required>
                </div>

                <div class="form-group address-stack">
                    <label>Address <span class="required">*</span></label>
                    <input type="text" name="address_line_1" required placeholder="Address Line 1">
                    <input type="text" name="address_line_2" placeholder="Address Line 2">

                    <div class="grid-2">
                        <input type="text" name="city" required placeholder="City">
                        <input type="text" name="state" required placeholder="State / Province / Region">
                    </div>

                    <div class="grid-2" style="margin-top: 10px;">
                        <input type="text" name="postal_code" placeholder="Postal Code">
                        <select name="country" required>
                            <option value="">--- Select country ---</option>
                            <option value="United States of America">United States of America</option>
                            <option value="Canada">Canada</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Australia">Australia</option>
                            <option value="Germany">Germany</option>
                            <option value="France">France</option>
                            <option value="Ghana">Ghana</option>
                            <option value="Nigeria">Nigeria</option>
                            <option value="South Africa">South Africa</option>
                            <option value="Kenya">Kenya</option>
                            <option value="India">India</option>
                            <option value="China">China</option>
                            <option value="Japan">Japan</option>
                            <option value="Brazil">Brazil</option>
                            <option value="Mexico">Mexico</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Date of formation of the Institution: <span class="required">*</span></label>
                        <input type="date" name="formation_date" required>
                    </div>
                    <div class="form-group">
                        <label>Website / URL</label>
                        <input type="url" name="website" placeholder="https://">
                    </div>
                </div>

                <!-- FILE UPLOAD -->
                <div class="form-group">
                    <label>Please upload a copy of your business registration or License <span class="required">*</span></label>
                    <div class="file-upload-box" onclick="document.getElementById('license_upload').click()">
                        <p class="upload-text">Drag & Drop Files, <span>Choose Files to Upload</span></p>
                        <span id="file-name-display"></span>
                        <input type="file" id="license_upload" name="license_file" required onchange="updateFileName(this)">
                    </div>
                </div>

                <div class="form-group">
                    <label>Indicate the annual numbers of students that you intent to enroll using Faith Leads University platform. <span class="required">*</span></label>
                    <input type="number" name="student_enrollment" required>
                </div>

                <div class="form-group">
                    <label>Please list all the courses you intend to teach online.</label>
                    <textarea name="courses_list" rows="3"></textarea>
                </div>

                <!-- PRIMARY CONTACT DETAILS -->
                <div class="section-title">Primary Contact Details</div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>First Name <span class="required">*</span></label>
                        <input type="text" name="first_name" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name <span class="required">*</span></label>
                        <input type="text" name="last_name" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Phone <span class="required">*</span></label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" name="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Qualification <span class="required">*</span></label>
                    <input type="text" name="qualification" required>
                </div>

                <!-- TERMS & AGREEMENT -->
                <div class="terms-box">
                    <p class="terms-text">
                        We are a faith based institution, consequently our courses must have some element of integrity, faith and leadership. Terms and conditions apply. <span class="required">*</span>
                    </p>
                    <label class="option-item">
                        <input type="checkbox" name="agree_terms" required>
                        <b>I agree</b>
                    </label>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label>Any other useful information:</label>
                    <textarea name="additional_info" rows="3"></textarea>
                </div>

                <button type="submit" class="btn-submit">SUBMIT</button>
            </form>
        </div>

    </main>

    <!-- ========================================== -->
    <!--   FOOTER PLACEHOLDER                       -->
    <!-- ========================================== -->
    <div id="footer-placeholder"></div>

    <!-- ========================================== -->
    <!--   JAVASCRIPT - LOAD HEADER & FOOTER       -->
    <!-- ========================================== -->
    <script src="load.js"></script>

    <!-- ========================================== -->
    <!--   FILE UPLOAD - UPDATE FILENAME            -->
    <!-- ========================================== -->
    <script>
        function updateFileName(input) {
            const display = document.getElementById('file-name-display');
            if (input.files && input.files[0]) {
                display.textContent = "Selected: " + input.files[0].name;
            } else {
                display.textContent = "";
            }
        }
    </script>

</body>
</html>
