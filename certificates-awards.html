      position: relative;
      z-index: 10;
    }
    .brand { font-size: 27px; font-weight: 800; letter-spacing: -1.5px; color: #55545c; }
    .brand span { color: var(--pink); }
    .header-actions { display: flex; align-items: center; gap: 22px; }
    .explore { display: inline-block; padding: 9px 22px; border-radius: 4px; background: var(--pink); color: #fff; font-size: 13px; }
    .header-link { font-size: 13px; color: #555; }

    /* Hero */
    .hero {

      padding: 50px max(6.5vw, 22px) 40px;
      text-align: center;
    }
    .hero h1 { margin: 0 0 12px; font-size: clamp(28px, 4vw, 42px); color: #222; }
    .hero p { color: #666; font-size: 16px; max-width: 600px; margin: 0 auto; }

    /* Gallery Grid */
    .gallery-container {
      width: min(1120px, 90%);
      margin: 40px auto 60px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }
    
    /* Individual Card */
    .cert-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .cert-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(30, 30, 50, 0.15);
    }
    .cert-thumbnail {
      width: 100%;
      height: 220px;
      background: #e8eaed;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .cert-thumbnail-inner {
      /* Scale down the 1000px certificate to fit the card */
      transform: scale(0.32);
      transform-origin: top center;
      width: 1000px;
      height: 707px;
      position: absolute;
      top: 10px;
    }
    .cert-card-info {
      padding: 20px;
      border-top: 1px solid var(--line);
      background: #fff;
      z-index: 2;
    }
    .cert-card-info h3 { margin: 0 0 5px; font-size: 16px; color: #222; }
    .cert-card-info p { margin: 0; font-size: 13px; color: var(--muted); }
    .cert-card-info .tags {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      background: #f0edf3;
      color: var(--pink);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.type {
      background: #e3f2fd;
      color: #1976d2;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 40px 20px;
    }
    .modal.active { display: flex; flex-direction: column; align-items: center; }
    .modal-content {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 1100px;
      position: relative;
      animation: zoomIn 0.3s ease;
      overflow: hidden;
    }
    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 24px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn:hover { background: rgba(0,0,0,0.8); }
    .modal-body {
      padding: 20px;
      display: flex;
      justify-content: center;
      background: #e8eaed;
    }

        desc: "This programme has been developed and delivered by Living Oracles Global Institute, covering the foundational principles of business process mapping, quality improvement, data-driven decision making, lean principles, and optimization."
      },
      {
        type: "Programme",
        title: "Certificate in Biblical Studies",
        name: "Naomi Asante",
        school: "School of Ministry & Theology",
        desc: "This programme has been developed and delivered by Living Oracles Global Institute, covering the foundational principles of Old and New Testament survey, biblical interpretation, core doctrines, and practical Scripture application for ministry and personal growth."
      },
      {
        type: "Programme",
        title: "Advanced Professional Diploma in Project, Quality & Process Management",
        name: "Joseph Mensah",
        school: "School of Engineering & Technology",
        desc: "This programme has been developed and delivered by Living Oracles Global Institute, covering the foundational principles of advanced project management, quality assurance, risk management, strategic planning, and capstone project."
      },
      {
        type: "Programme",
        title: "Advanced Professional Diploma in Ministry",
        name: "Mary Adjei",
        school: "School of Ministry & Theology",
        desc: "This programme has been developed and delivered by Living Oracles Global Institute, covering the foundational principles of advanced pastoral leadership, spiritual formation, discipleship strategies, and capstone project."
      },
      {
        type: "Programme",
        title: "Advanced Professional Diploma in Business Administration",
        name: "David Asare",
        school: "School of Business & Leadership",
        desc: "This programme has been developed and delivered by Living Oracles Global Institute, covering the foundational principles of advanced business strategy, financial management, entrepreneurship, and capstone project."
      }
    ];

    const galleryGrid = document.getElementById('galleryGrid');
    const modal = document.getElementById('certModal');
    const modalScaler = document.getElementById('modalScaler');
    const modalWrapper = document.getElementById('modalWrapper');

    // Function to generate the certificate HTML
    function generateCertHTML(title, name, school, desc) {
      return `
        <div class="cert-wrapper">
          <img class="cert-watermark" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png" alt="Watermark" crossorigin="anonymous">
          
          <!-- SAMPLE WATERMARK -->
          <div class="cert-sample-text">SAMPLE</div>
          
          <div class="cert-main">
            <div class="cert-header">
              <img class="cert-header-logo" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/logo.png" alt="LOGI Logo" crossorigin="anonymous" onerror="this.style.display='none'">
              <div class="cert-logo-sub">Living Oracles<br>Global Institute</div>
            </div>
            <div class="cert-date">30, October 2026</div>
            <div class="cert-name">${name}</div>
            <div class="cert-completion">has successfully completed</div>
            <div class="cert-course-title">${title}</div>
            <div class="cert-description">${desc}</div>
            <div class="cert-signature-area">
              <img class="cert-signature-img" src="https://raw.githubusercontent.com/livingoraclesglobalinstitute-cyber/logi-website/main/images/president-signature.svg" alt="Signature" crossorigin="anonymous">
              <div class="cert-signer-name">Prophet Ing Stephen Adusei</div>
              <div class="cert-signer-title">Program Director | Living Oracles Global Institute</div>
            </div>
            <div class="cert-footer-info">
              <div class="cert-footer-box">
                <div class="cert-footer-logo">LOGI</div>
                <div>Living Oracles Global Institute is committed to delivering excellence in education and professional development.</div>
              </div>
              <div class="cert-footer-box" style="border-left: 1px solid #ccc; padding-left: 15px;">
                <div>This is a digitally generated certificate. The authenticity of this document can be verified by scanning the QR code on the right.</div>
              </div>
            </div>
          </div>
          <div class="cert-sidebar">
            <div class="cert-partner-box">LOGI</div>
            <div class="cert-sidebar-pattern"></div>
            <div class="cert-verify-area">
              <div class="cert-verify-text">Scan to verify<br>this certificate</div>
              <img class="cert-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=LOGI-SAMPLE-PREVIEW" alt="QR Code" crossorigin="anonymous">
              <div class="cert-blockchain">Blockchain ID:<br>SAMPLE-PREVIEW-1234567890</div>
            </div>
            <div class="cert-bottom-block"></div>
          </div>

          <!-- PREVIEW BADGE -->
          <div class="cert-preview-badge">Learning Preview Only</div>
        </div>
      `;
    }

    // Build the gallery
    certs.forEach((cert, index) => {
      const card = document.createElement('div');
      card.className = 'cert-card';
      card.innerHTML = `
        <div class="cert-thumbnail">
          <div class="cert-thumbnail-inner">
            ${generateCertHTML(cert.title, cert.name, cert.school, cert.desc)}
          </div>
        </div>
        <div class="cert-card-info">
          <h3>${cert.title}</h3>
          <p>${cert.name} &middot; ${cert.school}</p>
          <div class="tags">
            <span class="badge type">${cert.type}</span>
            <span class="badge">View Certificate</span>
          </div>
        </div>
      `;
      card.onclick = () => openModal(cert.title, cert.name, cert.school, cert.desc);
      galleryGrid.appendChild(card);
    });

    // Open Modal
    function openModal(title, name, school, desc) {
      modalScaler.innerHTML = generateCertHTML(title, name, school, desc);
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
      scaleModalCert();
    }

    // Close Modal
    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
      modalScaler.innerHTML = ''; // Clean up
    }

    // Close on clicking outside content
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    // Scale modal certificate to fit screen width
    function scaleModalCert() {
      if (!modalScaler) return;
      const wrapperWidth = modalWrapper.clientWidth;
      const certWidth = 1000;
      
      if (wrapperWidth < certWidth) {
        const scale = wrapperWidth / certWidth;
        modalScaler.style.transform = `scale(${scale})`;
        modalWrapper.style.height = `${707 * scale}px`; // Adjust wrapper height to match scaled content
      } else {
        modalScaler.style.transform = 'none';
        modalWrapper.style.height = '707px';
      }
    }

    // Handle window resize for modal
    window.addEventListener('resize', () => {
      if (modal.classList.contains('active')) {
        scaleModalCert();
      }
    });
  </script>
</body>
</html>
