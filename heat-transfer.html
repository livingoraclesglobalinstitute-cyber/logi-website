<section class="tutorial-set">
<h2>Tutorial Set 4 — Part II: Tube Banks, Shell-and-Tube Design and LMTD</h2>
<p><b>Purpose:</b> Extend the heat-exchanger design work to cross-flow tube bundles, overall coefficients and mean temperature differences for different flow arrangements.</p>
<h3>Question 6 — Cross-flow tube bundle</h3><p>Calculate the heat-transfer coefficient for a fluid flowing across a tube bundle at a flow rate of 50,000 lb/h (22,679.5 kg/h). Calculate the coefficient for both clean and fouled conditions. Geometry: shell diameter Ds = 25 in (0.635 m); baffle spacing B = 9.5 in (0.241 m); outside tube diameter Do = 0.75 in (0.019 m); tube centre-to-centre spacing s = 0.9375 in (0.0238 m); triangular tube pitch. Use the physical properties listed in Question 4 of Tutorial Set 4. The source provides the tube-bank correlation constants and correction factors for bypassing and fouling.</p>
<div class="callout"><b>Required source table:</b> The constants a and m depend on the applicable tube-bank geometry and are presented in a table in the original PDF. Select the correct row from that table and show the correction ho = hF₁Fr. Do not assume a or m without checking the source table.</div>
<h3>Question 7 — Overall coefficient for a shell-and-tube exchanger</h3><p>A shell-and-tube exchanger has: shell diameter Ds = 25 in (0.635 m); 532 tubes; tube outside diameter Do = 0.75 in (0.019 m); tube inside diameter Di = 0.62 in (0.016 m); tube length L = 16 ft (4.88 m); triangular tube spacing s = 0.9375 in (0.024 m); baffle spacing B = 9.5 in (0.241 m); one tube-side pass and one shell-side pass. The stainless-steel tube thermal conductivity is 10 Btu/(h·ft·°F) [17 W/(m·K)].</p>
<p><b>Tube side:</b> liquid undergoing sensible-heat transfer; Wt = 500,000 lb/h (226,795 kg/h); Cp = 0.5 Btu/(lb·°F) [2.1 kJ/(kg·K)]; μ = 1.21 lb/(ft·h) (0.5 cP); specific gravity = 0.8; k = 0.075 Btu/(h·ft·°F) [0.13 W/(m·K)].</p>
<p><b>Shell side:</b> liquid undergoing sensible-heat transfer; Ws = 200,000 lb/h (90,718 kg/h); Cp = 1.0 Btu/(lb·°F) [4.19 kJ/(kg·K)]; μ = 2.0 lb/(ft·h) (0.83 cP); specific gravity = 1.0; k = 0.36 Btu/(h·ft·°F) [0.62 W/(m·K)]. Fouling heat-transfer coefficient = 1000 Btu/(h·ft²·°F) [5670 W/(m²·K)]. Assume μw/μb = 1.0. Calculate the overall heat-transfer coefficient. Follow the source hints to determine tube-side Reynolds number and hi, shell-side flow area ac = BDs(s − Do)/s and ho, tube-wall coefficient hw = 2k/(Do − Di), and the overall coefficient.</p>
<h3>Question 8 — Mean temperature difference for exchanger arrangements</h3><p>A warm stream enters a heat exchanger at 200°C and is cooled to 100°C. The cooling stream enters at 20°C and is heated to 95°C. Calculate the mean temperature difference for: (1) countercurrent flow; (2) cocurrent (parallel) flow; (3) 1–2 multipass (one shell-side pass, two tube-side passes); (4) 2–4 multipass (two shell-side passes, four tube-side passes); (5) 1–1 cross-flow (one cross-flow pass on the shell side, one tube-side pass); and (6) 1–2 cross-flow (one cross-flow pass on the shell side, two tube-side passes).</p>
<div class="callout"><b>Chart-based cases:</b> Countercurrent and cocurrent LMTD can be calculated directly. Multipass and cross-flow arrangements require the appropriate correction factor F from the source chart or an explicitly stated correlation. Record the chart reading and the resulting corrected mean temperature difference.</div>

<div class="tutorial-solution-card"><h3>FULLY WORKED SOLUTIONS — TUTORIAL SET 4 (PART II)</h3>
<h4>Question 6 — Cross-flow tube bundle, clean and fouled</h4><p><b>Given:</b> W=22,679.5 kg/h=6.300 kg/s; Ds=0.635 m; B=0.241 m; Do=0.019 m; s=0.0238 m; triangular staggered bank. Fluid properties from Part I Q4: cp=2720 J/kg·K; kf=0.147 W/m·K; μb=0.000806 Pa·s; μw/μb=1.</p><p>Flow area ac=BDs(s−Do)/s=0.241(0.635)(0.0238−0.019)/0.0238=0.03086 m². Mass velocity G=W/ac=6.300/0.03086=204.1 kg/m²·s. Re=DoG/μb=0.019(204.1)/0.000806=4812.</p><p>For a staggered pattern and 300&lt;Re&lt;200,000, the source table gives m=0.365 and a=0.273. Ideal-bank h=cpG·a/[(cpμ/kf)^(2/3)Re^m(μw/μb)^0.14]=1133 W/m²·K.</p><p>Bypass correction: Fr=1 because Re&gt;100. Fouled bundle: F1=0.8(B/Ds)^(1/6)=0.6807, so ho,fouled=1133(0.6807)=771 W/m²·K. Clean bundle: F1=0.8(B/Ds)^(1/4)=0.6279, so ho,clean=1133(0.6279)=711 W/m²·K.</p><div class="answer-result">Ideal bank h≈1133 W/m²·K; corrected fouled ho≈771 W/m²·K; corrected clean ho≈711 W/m²·K.</div><p>The handout’s naming convention makes the “typical fouling” exponent 1/6 and “no fouling” exponent 1/4; the corrected clean value is therefore slightly lower under the stated bypass formula.</p>
<h4>Question 7 — Overall heat-transfer coefficient for shell-and-tube exchanger</h4><p><b>Tube side:</b> n=532; Di=0.016 m; ṁt=226,795/3600=62.999 kg/s; At=nπDi²/4=0.10696 m²; Gt=588.97 kg/m²·s; μt=0.0005 Pa·s; Ret=DiGt/μt=18,847&gt;8000. With cp=2100 J/kg·K, kt=0.13 W/m·K and the supplied turbulent correlation hi=cpGt·0.023/[(cpμt/kt)^(2/3)Ret^0.2]=987 W/m²·K.</p><p><b>Shell side:</b> ac=BDs(s−Do)/s=0.241(0.635)(0.024−0.019)/0.024=0.03188 m². ṁs=90,718/3600=25.199 kg/s; Gs=790.39 kg/m²·s; μs=0.00083 Pa·s; Res=DoGs/μs=18,093. For 300&lt;Re&lt;200,000 and the staggered bundle, m=0.365, a=0.273. With cp=4190 J/kg·K and ks=0.62 W/m·K, ho=cpGs·0.273/[(cpμs/ks)^(2/3)Res^0.365]=7998 W/m²·K.</p><p><b>Wall:</b> hw=2kw/(Do−Di)=2(17)/(0.019−0.016)=11,333 W/m²·K. The fouling coefficient is hs=5670 W/m²·K. Use the exact overall-resistance expression provided in the handout: 1/U=1/ho+1/[hi(Di/Do)]+1/hw+1/hs.</p><p>Substitution: 1/U=1/7998+1/[987(0.016/0.019)]+1/11333+1/5670. Therefore U≈628 W/m²·K on the area basis implied by the supplied expression.</p><div class="answer-result">hi≈987 W/m²·K; ho≈8.00 kW/m²·K; hw≈11.33 kW/m²·K; overall U≈628 W/m²·K.</div><p><b>Note:</b> The supplied equation combines coefficients on a stated area basis; in a design calculation, confirm the exact reference-area convention and any omitted wall/fouling area conversion before using U for sizing.</p>
<h4>Question 8 — LMTD for six exchanger arrangements</h4><p>Terminal temperatures: hot 200→100°C; cold 20→95°C. Define R=(Th,in−Th,out)/(tc,out−tc,in)=100/75=1.3333 and P=(tc,out−tc,in)/(Th,in−tc,in)=75/180=0.4167.</p><p><b>1. Countercurrent:</b> ΔT₁=200−95=105 K; ΔT₂=100−20=80 K. LMTD=(105−80)/ln(105/80)=91.93 K.</p><p><b>2. Cocurrent:</b> ΔT₁=200−20=180 K; ΔT₂=100−95=5 K. LMTD=(180−5)/ln(180/5)=48.83 K.</p><p><b>3. 1–2 multipass:</b> For one shell pass and two or more tube passes, use the standard one-shell-pass correction-factor relation/chart. With R=1.3333 and P=0.4167, F≈0.828. Corrected mean difference F×LMTDcounter=0.828(91.93)=76.1 K.</p><p><b>4. 2–4 multipass; 5. 1–1 cross-flow; 6. 1–2 cross-flow:</b> The base countercurrent LMTD remains 91.93 K, but each arrangement requires its own correction factor F from the appropriate chart or arrangement-specific correlation. The supplied handout refers to flow diagrams but does not include a readable correction-factor chart or the cross-flow mixing definitions needed to select unique F values. Therefore the exact corrected values cannot responsibly be assigned from the available data alone: calculate ΔTmean,corr=F(91.93 K) once the matching chart is supplied.</p><div class="answer-result">Countercurrent LMTD=91.93 K; cocurrent LMTD=48.83 K; 1–2 multipass corrected mean difference≈76.1 K. Other multipass/cross-flow cases require their specific F charts.</div><p><b>Engineering interpretation:</b> Countercurrent operation gives a higher mean temperature driving force than parallel flow for the same terminal temperatures. Multipass and cross-flow arrangements generally require a correction factor because the actual temperature profile departs from ideal countercurrent flow.</p>
</div>

function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }); }
function esc(s) { return typeof s !== 'string' ? s : s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let currentSessionUser = null;

function getAuth() {
  const raw = localStorage.getItem('logi_user');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

async function currentUser() {
  if (currentSessionUser) return currentSessionUser;
  const user = getAuth();
  if (user) {
    currentSessionUser = {
      id: user.id,
      username: user.email,
      email: user.email,
      fullName: user.fullName || user.email,
      role: 'student'
    };
    return currentSessionUser;
  }
  return null;
}

const PROGRESS_KEY = 'logi_progress_cache';
function getProgressCache() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch { return {}; }
}
function setProgressCache(cache) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(cache)); }

function lessonKey(mi, li) {
  return `${COURSE.id}_heat_${mi + 1}_lesson_${li + 1}`;
}

async function loadStudentData(user, force = false) {
  if (!user?.id) return;
  try {
    const res = await fetch(`${API_BASE}/my-progress`, {
      headers: { 'Authorization': `Bearer ${getAuth().token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    const cache = getProgressCache();
    Object.keys(cache).forEach(k => { if (k.startsWith(COURSE.id)) delete cache[k]; });
    if (data.progress) {
      data.progress.forEach(row => {
        const key = `${COURSE.id}_heat_${row.module_id}_lesson_${row.lesson_id}`;
        cache[key] = { completed: row.completed, score: row.quiz_score, total: row.quiz_total };
      });
      setProgressCache(cache);
    }
  } catch (e) { console.error('Could not load progress', e); }
}

function isLessonDone(username, mi, li) {
  const cache = getProgressCache();
  return !!cache[lessonKey(mi, li)]?.completed;
}
function getQuizResult(username, mi) {
  const cache = getProgressCache();
  return cache[lessonKey(mi, 0)] || null;
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.completed;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.completed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}
function nextIncompleteLesson(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (isModuleLocked(username, mi)) break;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return { mi, li };
    }
    if (!getQuizResult(username, mi)?.completed) return { mi, li: 0 };
  }
  return { mi: 0, li: 0 };
}

async function markLessonComplete(mi, li, quizScore, quizTotal) {
  const cache = getProgressCache();
  const key = lessonKey(mi, li);
  cache[key] = { completed: true, score: quizScore ?? null, total: quizTotal ?? null };
  setProgressCache(cache);

  const auth = getAuth();
  if (auth?.token) {
    try {
      await fetch(`${API_BASE}/mark-complete`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${auth.token}`
        },
        body: JSON.stringify({
          course_id: COURSE.id,
          module_id: mi + 1,
          lesson_id: li + 1,
          completed: true,
          quiz_score: quizScore ?? null,
          quiz_total: quizTotal ?? null
        })
      });
    } catch (e) { }
  }
}

function decorateHeatTransferLesson(hostEl, moduleIndex) {
  if (!hostEl) return;
  if (!hostEl.querySelector('.diagram')) {
    const holder = document.createElement('div');
    holder.innerHTML = HEAT_TRANSFER_DIAGRAMS[moduleIndex] || '';
    if (holder.firstElementChild) hostEl.insertBefore(holder.firstElementChild, hostEl.firstChild);
  }
  const headings = Array.from(hostEl.querySelectorAll('h4'));
  headings.forEach(h => {
    if (!/^Q\s*\d+/i.test(h.textContent.trim())) return;
    if (h.closest('.tutorial-solution-card')) return;
    const box = document.createElement('section');
    box.className = 'tutorial-solution-card';
    h.parentNode.insertBefore(box, h);
    let node = h;
    while (node) {
      const next = node.nextSibling;
      if (node !== h && node.nodeType === 1 && /^H[34]$/.test(node.tagName)) break;
      box.appendChild(node);
      node = next;
    }
  });
  hostEl.querySelectorAll('.tutorial-solution-card p').forEach(p => {
    const t = p.textContent.trim();
    if (/^(Step\s*\d+|[1-9]\)|[a-d]\))/i.test(t) && !p.classList.contains('solution-step')) {
      p.classList.add('solution-step');
    }
  });
}

  async function openCourse(mi, li) {
    const u = await currentUser();
    state.user = u;
    if (!u) { showLogin(); return; }
    if (typeof mi !== 'number') mi = 0;
    if (typeof li !== 'number') li = 0;
    mi = Math.max(0, Math.min(mi, COURSE.modules.length - 1));
    const lessons = COURSE.modules[mi].lessons;
    li = Math.max(0, Math.min(li, lessons.length - 1));

    if (isModuleLocked(u.username, mi)) {
      const prev = mi - 1;
      const prevLessons = COURSE.modules[prev].lessons.length;
      return openCourse(prev, prevLessons - 1);
    }

    state.screen = 'course';
    state.activeCourseModule = mi;
    state.activeCourseLesson = li;
    closeMobileMenu();
    closeModuleMenu();
    renderNav();

    const module = COURSE.modules[mi];
    const lesson = module.lessons[li];
    const pct = courseProgressPct(u.username);

    const el = document.getElementById('app');
    el.innerHTML = `
      <div class="dash-layout">
        ${renderSidebarHTML('course')}
        <div class="main-panel">
          <button class="mobile-module-toggle" onclick="App.toggleModuleMenu()">☰ Modules</button>

  function selectOption(radio) {

  async function submitQuiz(evt, mi) {
    evt.preventDefault();
    const lesson = COURSE.modules[mi].lessons[0];
    const quiz = lesson.quiz || [];
    const form = evt.target;
    let correct = 0, answered = 0;
    quiz.forEach((q, qi) => {
      const sel = form.querySelector(`input[name="q${qi}"]:checked`);
      if (sel) {
        answered++;
        if (parseInt(sel.value, 10) === q.answer) correct++;
      }
    });
    const fb = document.getElementById('quiz-feedback-' + mi);
    if (answered < quiz.length) {
      fb.innerHTML = `<span style="color:var(--error);">Please answer all ${quiz.length} questions before submitting.</span>`;
      return;
    }
    const pct = Math.round((correct / quiz.length) * 100);
    const passed = pct >= COURSE.passMark;

    const u = state.user;
    if (u) {
      const cache = getProgressCache();
      const key = lessonKey(mi, 0);
      const prev = cache[key];
      const bestScore = Math.max(prev?.score || 0, correct);
      cache[key] = { completed: passed, score: bestScore, total: quiz.length };
      setProgressCache(cache);
      try {
        const auth = getAuth();
        if (auth?.token) {
          await fetch(`${API_BASE}/submit-quiz`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${auth.token}` },
            body: JSON.stringify({
              course_id: COURSE.id,
              module_id: mi + 1,
              lesson_id: 1,
              score: correct,
              total: quiz.length,
              passed
            })
          }).catch(() => {});
        }
      } catch (e) {}
    }

    fb.innerHTML = passed
      ? `<span style="color:var(--success);font-weight:700;">Passed: ${correct}/${quiz.length} (${pct}%). Module complete.</span>`
      : `<span style="color:var(--error);font-weight:700;">Score ${correct}/${quiz.length} (${pct}%). Below pass mark. Review and try again.</span>`;

    if (passed) {
      setTimeout(() => App.openCourse(mi, 1), 1500); // Send them to the Answer Key once passed
    }
  }

  function coursePrev(mi, li) {
    if (li > 0) return openCourse(mi, li - 1);
    if (mi > 0) {
      const prevLessons = COURSE.modules[mi - 1].lessons.length;
      return openCourse(mi - 1, prevLessons - 1);
    }
  }
  function courseNext(mi, li) {
    const module = COURSE.modules[mi];
    if (li < module.lessons.length - 1) return openCourse(mi, li + 1);
    if (mi < COURSE.modules.length - 1) return openCourse(mi + 1, 0);
  }

  async function downloadCertificate() {
    const node = document.getElementById('certificate-canvas');
    if (!node) return;
    if (typeof html2canvas === 'undefined') {
      alert('Certificate image library not loaded. Use Print instead.');
      return;
    }
    const scaler = node.parentElement;
    const oldTransform = scaler.style.transform;
    scaler.style.transform = 'none';
    try {
      const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const link = document.createElement('a');
      link.download = `${COURSE.id}-certificate.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) {
      console.error(e);
      alert('Could not generate the certificate image. Try Print instead.');
    } finally {
      scaler.style.transform = oldTransform;
    }
  }
