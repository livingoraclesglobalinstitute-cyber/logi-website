<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="https://i.imgur.com/kkE49KM.png">
  <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/kkE49KM.png">
  <meta name="description" content="LOGI LMS – Transport Phenomena II: Heat Transfer">
  <title>LOGI LMS · Transport Phenomena II: Heat Transfer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --p: #ff4b93;
      --pd: #e93680;
      --ink: #34343b;
      --muted: #777780;
      --line: #e9e8ef;
      --soft: #f5f5f8;
      --bg: #ffffff;
      --success: #2e7d32;
      --error: #b33;
      --warn: #f0f7ff;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.65 Arial, sans-serif; color: var(--ink); background: #fbfafc; }
    a { text-decoration: none; color: inherit; }
    .inner { width: min(1160px, 92%); margin: auto; }

    .top { height: 66px; border-bottom: 1px solid var(--line); display: flex; align-items: center; position: sticky; top: 0; background: white; z-index: 50; box-shadow: 0 1px 6px rgba(0,0,0,0.02); }
    .nav { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; }
    .brand span { color: var(--p); }

    .mobile-nav-toggle { display: none; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 18px; color: var(--ink); align-items: center; justify-content: center; }
    .mobile-nav-toggle:hover { background: var(--soft); }

    .nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { background: var(--p); color: white; border: 0; border-radius: 24px; padding: 10px 18px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--pd); }
    .btn-outline { background: transparent; color: var(--pd); border: 1.5px solid var(--p); border-radius: 24px; padding: 9px 16px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.15s; }
    .btn-outline:hover { background: #fff0f6; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-secondary { background: #f0edf3; color: var(--ink); border: 0; border-radius: 24px; padding: 9px 15px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-secondary:hover { background: #e5e1ea; }

    .auth-wrap { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 66px); padding: 40px 16px; }
    .auth-card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 36px 32px; width: 100%; max-width: 440px; box-shadow: 0 8px 28px rgba(0,0,0,0.05); }
    .auth-card h2 { margin: 0 0 6px; font-size: 24px; }
    .auth-card p.muted { margin: 0 0 22px; font-size: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 14px; background: white; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--p); outline-offset: 1px; border-color: transparent; }
    .auth-switch { text-align: center; margin-top: 16px; font-size: 14px; }
    .auth-switch a { color: var(--pd); font-weight: 600; cursor: pointer; }
    .error-msg { color: var(--error); font-size: 13px; margin-top: 8px; min-height: 18px; }

    .dash-layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 66px); position: relative; }
    .sidebar { background: white; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; z-index: 40; transition: transform 0.25s ease-in-out; }
    .sidebar .user-badge { background: var(--soft); border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
    .sidebar .user-badge strong { display: block; font-size: 14px; }
    .sidebar .user-badge span { color: var(--muted); font-size: 12px; word-break: break-all; }
    .sidebar a, .sidebar button.nav-link { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 6px; background: transparent; border: 0; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: background 0.1s; }
    .sidebar a:hover, .sidebar button.nav-link:hover { background: #fff3f8; color: var(--pd); }
    .sidebar .nav-link.active { background: #fff0f6; color: var(--pd); }
    .sidebar .spacer { flex: 1; }

    .main-panel { padding: 28px 32px 48px; overflow-y: auto; max-height: calc(100vh - 66px); background: #fbfafc; }
    .main-panel h1 { font-size: 26px; margin: 0 0 4px; }
    .main-panel .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    .card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .card h2 { font-size: 20px; margin: 0 0 10px; }
    .card h3 { font-size: 17px; margin: 18px 0 8px; }
    .card p, .card li { color: #555; line-height: 1.75; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat-box { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    .stat-box .num { font-size: 26px; font-weight: 800; color: var(--pd); }
    .stat-box .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .catalogue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .course-tile { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .course-tile h3 { margin: 0; font-size: 17px; }
    .course-tile .meta { font-size: 12px; color: var(--muted); }
    .course-tile .desc { font-size: 13px; color: #666; flex: 1; }

    .lesson-card { max-width: 900px; }
    .callout { background: var(--warn); border-left: 4px solid #438bd5; padding: 14px 17px; margin: 18px 0; border-radius: 0 6px 6px 0; }
    .compare { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .compare td, .compare th { border: 1px solid var(--line); padding: 10px; text-align: left; font-size: 14px; }
    .compare th { background: #fff3f8; }

    .diagram { margin: 20px 0; padding: 16px; background: #fafafd; border: 1px solid var(--line); border-radius: 8px; text-align: center; }
    .diagram svg { max-width: 100%; height: auto; }
    .diagram-cap { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

    .q { border-top: 1px solid var(--line); padding: 14px 0; }
    .q label { display: block; border: 1px solid var(--line); padding: 8px 12px; margin: 6px 0; border-radius: 5px; cursor: pointer; font-size: 14px; transition: background 0.1s; }
    .q label:hover { background: #fafafa; }
    .q label.selected { background: #fff0f6; border-color: var(--p); }
    .feedback { font-size: 13px; margin-top: 6px; }
    .actions { display: flex; justify-content: space-between; gap: 9px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 24px; }

    .course-layout { display: grid; grid-template-columns: 320px 1fr; gap: 22px; align-items: start; }
    .module-side { background: white; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: sticky; top: 80px; }
    .module-side .sidehead { padding: 16px; border-bottom: 1px solid var(--line); }
    .module-side .sidehead h2 { font-size: 16px; margin: 0; }
    .progress-bar { height: 7px; background: #f0edf3; border-radius: 9px; margin-top: 8px; overflow: hidden; }
    .progress-bar span { display: block; height: 100%; width: 0; background: var(--p); transition: width 0.3s; }
    .module-side .modules { padding: 8px; max-height: calc(100vh - 200px); overflow-y: auto; }

    .mod-section { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    .mod-section:last-child { border-bottom: none; }
    .mod-header { width: 100%; text-align: left; background: white; border: 0; padding: 12px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--ink); font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: background 0.1s; }
    .mod-header:hover { background: #fff3f8; color: var(--pd); }
    .mod-header.locked { color: #aaa; cursor: not-allowed; }

    .mod-lessons-list { padding: 4px 0 8px 10px; display: none; }
    .mod-section.open .mod-lessons-list { display: block; }

    .lesson-item-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: white; border: 0; border-radius: 6px; padding: 8px 10px; font-size: 12px; color: #555; cursor: pointer; transition: background 0.1s; }
    .lesson-item-btn:hover { background: #fafafa; color: var(--pd); }
    .lesson-item-btn.active { color: var(--pd); background: #fff0f6; font-weight: 700; }
    .lesson-item-btn.done { color: var(--success); }

    .drawer-overlay, .module-overlay { display: none; position: fixed; top: 66px; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); z-index: 35; }
    .drawer-overlay.open, .module-overlay.open { display: block; }
    .module-overlay { z-index: 45; }

    .mobile-module-toggle { display: none; align-items: center; gap: 6px; background: white; border: 1.5px solid var(--p); color: var(--pd); border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
    .mobile-module-toggle:hover { background: #fff0f6; }

    .cert-display-area { width: 100%; display: flex; justify-content: center; overflow: hidden; padding: 10px 0; }
    .cert-scaler { transform-origin: top center; width: 1000px; height: 707px; }
    .cert-wrapper { background: #fafafa; width: 1000px; height: 707px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: grid; grid-template-columns: 1fr 220px; position: relative; overflow: hidden; color: var(--ink); }
    .cert-watermark { position: absolute; top: 50%; left: 45%; transform: translate(-50%, -50%); width: 550px; opacity: 0.04; pointer-events: none; z-index: 0; }
    .cert-main { padding: 40px 60px 30px 60px; display: flex; flex-direction: column; position: relative; z-index: 2; }
    .cert-header { display: flex; align-items: center; gap: 15px; margin-bottom: 35px; }
    .cert-header-logo { height: 45px; width: auto; object-fit: contain; }
    .cert-logo-sub { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; line-height: 1.2; font-weight: 600; }
    .cert-date { font-size: 15px; color: var(--muted); margin-bottom: 25px; font-weight: 500; }
    .cert-name { font-size: 36px; font-weight: 700; color: #222; margin-bottom: 12px; }
    .cert-completion { font-size: 16px; color: #555; margin-bottom: 20px; }
    .cert-course-title { font-size: 32px; font-weight: 800; color: #333; margin-bottom: 25px; line-height: 1.2; }
    .cert-description { font-size: 14px; color: #666; line-height: 1.7; max-width: 560px; margin-bottom: 40px; letter-spacing: 0.2px; word-spacing: 1px; }
    .cert-signature-area { display: flex; flex-direction: column; max-width: 300px; margin-top: auto; }
    .cert-signature-img { height: 55px; width: auto; object-fit: contain; align-self: flex-start; margin-bottom: 15px; }
    .cert-signer-name { font-size: 16px; font-weight: 700; color: #333; text-decoration: underline; text-underline-offset: 3px; margin-bottom: 6px; }
    .cert-signer-title { font-size: 12px; color: var(--muted); }
    .cert-footer-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 15px; font-size: 10px; color: #777; line-height: 1.5; }
    .cert-footer-box { display: flex; align-items: center; gap: 10px; max-width: 48%; }
    .cert-footer-logo { font-weight: 800; font-size: 16px; color: var(--p); }
    .cert-sidebar { background-color: var(--pd); position: relative; display: flex; flex-direction: column; }
    .cert-partner-box { background: white; padding: 25px 15px; text-align: center; font-size: 42px; font-weight: 900; color: #000; letter-spacing: 3px; border-bottom: 1px solid #eee; }
    .cert-sidebar-pattern { flex: 1; position: relative; background-image: linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.05) 75%, transparent 75%, transparent), linear-gradient(45deg, rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 20px 20px, 100% 100%; background-position: 0 0, 10px 10px; }
    .cert-verify-area { padding: 25px 20px; text-align: center; background: white; }
    .cert-verify-text { font-size: 9px; color: #555; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.4; }
    .cert-qr { width: 100px; height: 100px; margin: 0 auto 15px; display: block; }
    .cert-blockchain { font-size: 9px; color: #888; font-family: monospace; word-break: break-all; line-height: 1.4; }
    .cert-bottom-block { height: 40px; background: #c2185b; }
    .cert-controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }

    @media (max-width: 900px) {
      .mobile-nav-toggle { display: inline-flex; }
      .dash-layout { grid-template-columns: 1fr; }
      .sidebar { position: fixed; top: 66px; left: 0; bottom: 0; width: 260px; background: white; box-shadow: 4px 0 16px rgba(0,0,0,0.1); transform: translateX(-100%); overflow-y: auto; }
      .sidebar.open { transform: translateX(0); }
      .sidebar .user-badge { display: block; }
      .main-panel { max-height: none; padding: 20px 16px 40px; }
      .course-layout { grid-template-columns: 1fr; gap: 16px; }
      .mobile-module-toggle { display: inline-flex; }
      .module-side { position: fixed; top: 66px; right: 0; bottom: 0; width: 300px; max-width: 85vw; background: white; border: 0; border-left: 1px solid var(--line); border-radius: 0; box-shadow: -4px 0 16px rgba(0,0,0,0.15); z-index: 50; transform: translateX(100%); transition: transform 0.25s ease-in-out; }
      .module-side.open { transform: translateX(0); }
      .module-side .modules { max-height: calc(100vh - 140px); }
    }

    @media (max-width: 500px) {
      .auth-card { padding: 24px 18px; }
      .main-panel h1 { font-size: 22px; }
      .brand { font-size: 18px; }
      .nav-actions { gap: 6px; }
      .btn, .btn-outline, .btn-secondary { font-size: 12px; padding: 7px 12px; }
    }

    @media print {
      @page { size: landscape; margin: 0; }
      body { background: white; padding: 0; margin: 0; display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .top, .sidebar, .mobile-nav-toggle, .drawer-overlay, .main-panel h1, .subtitle, .cert-controls, footer, .notice, .review-card-print-hide { display: none !important; }
      .dash-layout { display: block; }
      .main-panel { padding: 0; margin: 0; max-height: none; background: white; }
      .cert-display-area { padding: 0; overflow: visible; }
      .cert-scaler { transform: none !important; width: 1000px !important; height: 707px !important; margin-bottom: 0 !important; }
      .cert-wrapper { box-shadow: none; width: 1000px !important; height: 707px !important; border: none; margin: 0 auto; background: #fafafa !important; }
    }

    /* Heat-transfer learning-experience layer */
    :root{ --ht-rose:#ff4b93;--ht-deep:#c92d70;--ht-ink:#252535;--ht-lilac:#f7f2fa;--ht-blue:#edf6ff;--ht-line:#e8e2eb;--ht-shadow:0 14px 36px rgba(53,34,62,.075); }
    body{background:#f7f6fa;color:var(--ht-ink);font-family:Inter,Arial,sans-serif}
    .top{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(37,20,43,.05)}
    .brand{letter-spacing:-.7px}
    .main-panel{background:linear-gradient(180deg,#faf7fb 0%,#f7f6fa 100%)}
    .course-layout{grid-template-columns:300px minmax(0,1fr);gap:24px;max-width:1440px;margin:0 auto}
    .module-side{border:1px solid #eee5ed;border-radius:18px;box-shadow:var(--ht-shadow);overflow:hidden}
    .module-side .sidehead{padding:20px;background:linear-gradient(135deg,#fff5f9,#f6f0fa)}
    .module-side .sidehead h2{font-size:17px;font-weight:800;color:#302638}
    .module-side .modules{padding:10px}
    .mod-section{border:1px solid #f0eaf0;border-radius:12px;margin:7px 0;overflow:hidden}
    .mod-header{padding:13px 12px;font-size:13px;font-weight:750;line-height:1.4}
    .mod-section.open .mod-header{background:#fff1f7;color:#bd2869}
    .mod-lessons-list{padding:4px 7px 8px;background:#fff}
    .lesson-item-btn{border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.4}
    .lesson-item-btn.active{background:#fff0f6;border-left:3px solid var(--ht-rose);color:#b92a68}
    .lesson-item-btn.done{color:#23814d}
    .content{min-width:0}
    .lesson-card{max-width:none;border:1px solid #eee7ef;border-radius:20px;padding:clamp(20px,3vw,38px);box-shadow:var(--ht-shadow);overflow:hidden}
    .lesson-card>div:first-child{font-size:11px!important;letter-spacing:1.1px;font-weight:800;color:#b62d6c!important}
    .lesson-card>h1{font-size:clamp(25px,3vw,36px)!important;letter-spacing:-1px;color:#2d2331;margin:10px 0 22px!important;max-width:850px}
    .lesson-card h3{font-size:20px;color:#34263a;letter-spacing:-.3px;margin:30px 0 12px;padding-bottom:9px;border-bottom:1px solid #eee7ef}
    .lesson-card h4{font-size:16px;color:#a92562;margin:22px 0 9px}
    .lesson-card p{line-height:1.85;color:#4c4650}
    .lesson-card ul,.lesson-card ol{padding-left:23px}
    .lesson-card li{margin:6px 0;line-height:1.75;color:#4c4650}
    .lesson-card .callout{background:linear-gradient(120deg,#fff2f7,#f6f1fb);border:1px solid #f4dce8;border-left:5px solid var(--ht-rose);border-radius:12px;padding:17px 19px;color:#493343}
    .lesson-card .compare{border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(40,20,40,.04)}
    .lesson-card .compare th{background:#fff0f6;color:#9f2459;font-size:13px}
    .lesson-card .compare td,.lesson-card .compare th{padding:12px;border-color:#f0e7ef}
    .lesson-card .diagram{margin:24px 0;padding:18px;background:linear-gradient(135deg,#fff,#faf6fc);border:1px solid #eee4ef;border-radius:16px;box-shadow:0 6px 20px rgba(55,34,58,.045)}
    .lesson-card .diagram svg{display:block;width:100%;max-width:760px;margin:auto;max-height:310px}
    .diagram-cap{font-size:12px;line-height:1.5;color:#7a687a;margin-top:10px}
    .lesson-card .actions{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:16px 0 0;border-top:1px solid #eee7ef;z-index:4}
    .lesson-card .actions button{min-height:42px}
    .lesson-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;margin-bottom:20px;border-radius:18px;background:linear-gradient(120deg,#39263d 0%,#78375e 55%,#c83b7b 100%);color:#fff;box-shadow:0 12px 28px rgba(91,36,73,.16)}
    .lesson-hero .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#ffd7e8;font-weight:800}
    .lesson-hero h2{font-size:19px;margin:5px 0 4px;color:white}
    .lesson-hero p{margin:0;color:#f9e9f1;font-size:12px}
    .lesson-hero .hero-mark{width:66px;height:66px;flex:0 0 66px;border:1px solid rgba(255,255,255,.32);border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:30px}
    .tutorial-solution-card{margin:18px 0 24px;padding:20px 21px;border:1px solid #eadfe9;border-radius:15px;background:#fff;box-shadow:0 7px 20px rgba(51,28,51,.045);position:relative}
    .tutorial-solution-card:before{content:"WORKED TUTORIAL";display:inline-block;margin-bottom:9px;padding:4px 9px;border-radius:20px;background:#fff0f6;color:#b42b68;font-size:9px;font-weight:900;letter-spacing:1px}
    .tutorial-solution-card h4{margin:0 0 12px;color:#922657;font-size:16px}
    .tutorial-solution-card p{margin:9px 0;color:#4b4350}
    .tutorial-solution-card p strong,.tutorial-solution-card b{color:#292333}
    .tutorial-solution-card p:last-child{margin-bottom:0}
    .solution-step{display:flex;gap:11px;align-items:flex-start;margin:12px 0;padding:12px 14px;border-radius:10px;background:#f9f6fa}
    .solution-step .step-no{width:25px;height:25px;flex:0 0 25px;border-radius:50%;display:grid;place-items:center;background:#ffe4ef;color:#a82460;font-weight:900;font-size:12px}
    .solution-step .step-body{flex:1;font-size:14px;line-height:1.75}
    .answer-result{padding:13px 16px;margin:12px 0;background:#effaf3;border:1px solid #ccebd7;border-radius:10px;color:#176b3c;font-weight:800}
    .equation-box{padding:14px 16px;margin:14px 0;text-align:center;background:#f4f0f8;border:1px solid #e9dfef;border-radius:11px;font-family:Georgia,serif;font-size:17px;color:#392944;overflow-x:auto}

<h3>Heat, Energy Balance and the Three Modes of Heat Transfer</h3>
<p>Heat transfer is the movement of thermal energy caused by a temperature difference. This module introduces temperature, heat, heat-transfer rate, heat flux, thermal conductivity, specific heat and thermal diffusivity.</p>
<div class="callout"><b>Core idea:</b> Heat is energy in transit because of a temperature difference. Energy moves spontaneously from a higher-temperature region to a lower-temperature region.</div>
<h3>Learning outcomes</h3>
<ul><li>Distinguish heat from temperature, work and internal energy.</li><li>Explain conduction, convection and radiation.</li><li>Distinguish heat-transfer rate from heat flux.</li><li>Apply a simple energy balance to heating and cooling.</li></ul>
<h3>1. Heat and temperature</h3>
<p>Temperature indicates the thermal state of a body. Heat, Q, is energy transferred across a system boundary because of a temperature difference. Heat is not a property stored in a body; internal energy is a property. The SI unit of heat is the joule (J), while heat-transfer rate, Q̇, is measured in watts (W).</p>
<h3>2. The three modes</h3>
<table class="compare"><tr><th>Mode</th><th>Mechanism</th><th>Example</th></tr>
<tr><td><b>Conduction</b></td><td>Energy transfer through molecular interaction/electron motion in a material.</td><td>Heat through a brick wall or metal pan.</td></tr>
<tr><td><b>Convection</b></td><td>Energy transfer between a surface and a moving or stationary fluid.</td><td>Air cooling a hot cup; water flowing through a heater.</td></tr>
<tr><td><b>Radiation</b></td><td>Electromagnetic emission and absorption; does not require a material medium.</td><td>Solar energy reaching Earth.</td></tr></table>
<h3>3. Heat rate and heat flux</h3>
<p>Heat-transfer rate Q̇ is the energy transferred per unit time. Heat flux q″ is heat-transfer rate per unit area, measured in W/m².</p>
<p style="text-align:center;font-weight:bold">Q̇ = Q/t &nbsp;&nbsp;&nbsp; q″ = Q̇/A</p>
<h3>4. Energy balance and sensible heating</h3>
<p>For a body with approximately constant specific heat and negligible phase change: Q = mc<sub>p</sub>ΔT. If a heater supplies constant power P with no losses, t = Q/P.</p>
<h3>Worked example: heating water in a pot</h3>
<div class="tutorial-solution-card"><h4>Heating water in a pot</h4>
<p><b>Given:</b> 1.2 kg water and a 1.0 kg pot are heated from 15°C to 95°C. Use c<sub>p,w</sub>=4.18 kJ/kg·K, c<sub>p,pot</sub>=0.7 kJ/kg·K and P=1200 W.</p>
<p><b>Step 1 — Temperature rise.</b> ΔT = 95 − 15 = 80 K.</p>
<p><b>Step 2 — Water energy.</b> Q_w = 1.2 × 4.18 × 80 = 401.28 kJ.</p>
<p><b>Step 3 — Pot energy.</b> Q_pot = 1.0 × 0.7 × 80 = 56.0 kJ.</p>
<p><b>Step 4 — Total energy.</b> Q_total = 457.28 kJ.</p>
<p><b>Step 5 — Time.</b> t = 457,280 / 1200 = 381.1 s = 6.35 min.</p>
<div class="answer-result">Final answer: t ≈ 6.35 min, assuming no heat loss.</div></div>
<h3>Summary</h3>
<ul><li>Heat transfer is driven by temperature difference.</li><li>Conduction, convection and radiation are the three modes.</li><li>Q̇ is in W; q″ is in W/m².</li><li>For sensible heating, Q = mc<sub>p</sub>ΔT.</li></ul>`,

<section class="tutorial-set">
<h2>Tutorial Set 1 — Fundamentals, Energy Balance and Basic Conduction</h2>
<p><b>Purpose:</b> Apply the introductory heat-transfer principles, sensible-energy calculations and steady plane-wall conduction.</p>
<div class="callout"><b>Instructions:</b> Attempt each question independently. Show units, assumptions and working for numerical questions. These are tutorial questions transcribed from the supplied Transport Phenomena II: Heat Transfer handout.</div>
<h3>Question 1 — Heating a copper ball</h3>
<p>A 10-cm diameter copper ball is to be heated from 90 °C to an average temperature of 180 °C in 45 minutes. Taking the average density and specific heat of copper in this temperature range to be 8950 kg/m³ and 0.395 kJ/(kg·°C), respectively, determine:</p><ol type="a"><li>the total amount of heat transfer to the copper ball;</li><li>the average rate of heat transfer to the ball; and</li><li>the average heat flux.</li></ol>
<h3>Question 2 — Heating water in an electric pot</h3>
<p>1.2 kg of liquid water initially at 15 °C is to be heated to 95 °C in a pot equipped with a 1200-W electric heating element inside. The pot is 1.0 kg and has an average specific heat of 0.7 kJ/(kg·°C). Taking the specific heat of water to be 4.18 kJ/(kg·°C) and disregarding any heat loss from the teapot, determine how long it will take for the water to be heated.</p>
<h3>Question 3 — Heat transfer and other energy transfers</h3><p>How is heat transfer distinguished from the other forms of energy transfer?</p>
<h3>Question 4 — Heating an ideal gas</h3><p>An ideal gas is heated from 50°C to 80°C: (a) at constant volume and (b) at constant pressure. For which case do you think the energy required will be greater? Why?</p>
<h3>Question 5 — Change in human-body thermal energy</h3><p>The average specific heat of the human body is 3.6 kJ/(kg·°C). If the body temperature of a 70-kg man rises from 37°C to 39°C during strenuous exercise, determine the increase in the thermal energy content of the body as a result of this rise in body temperature.</p>
<h3>Question 6 — Solar energy reaching Earth</h3><p>Does any of the energy of the sun reach the earth by conduction or convection? Explain.</p>
<h3>Question 7 — Heat transfer through a brick wall</h3><p>The inner and outer surfaces of a 5-m × 6-m brick wall of thickness 30 cm and thermal conductivity 0.69 W/(m·°C) are maintained at temperatures of 20 °C and 5 °C, respectively. Determine the rate of heat transfer through the wall, in W.</p>
<h3>Question 8 — Cooling of hot coffee</h3><p>A closed container filled with hot coffee is in a room whose air and walls are at a fixed temperature. Determine all heat-transfer processes that contribute to cooling of the coffee.</p>

<div class="tutorial-solution-card"><h3>FULLY WORKED SOLUTIONS — TUTORIAL SET 1</h3>
<h4>Question 1 — Heating the copper ball</h4><p><b>Given:</b> D=0.10 m; r=0.05 m; ρ=8950 kg/m³; cp=395 J/kg·K; ΔT=180−90=90 K; t=45×60=2700 s.</p><p><b>Step 1 — Find the sphere volume.</b> V=(4/3)πr³=(4/3)π(0.05)³=5.236×10⁻⁴ m³.</p><p><b>Step 2 — Find its mass.</b> m=ρV=8950(5.236×10⁻⁴)=4.686 kg.</p><p><b>Step 3 — Heat required.</b> Q=mcpΔT=4.686(395)(90)=166,600 J≈166.6 kJ.</p><p><b>Step 4 — Average heat-transfer rate.</b> Q̇=Q/t=166,600/2700=61.7 W.</p><p><b>Step 5 — Average surface heat flux.</b> A=4πr²=0.031416 m²; q″=Q̇/A=61.7/0.031416=1964 W/m².</p><div class="answer-result">Answers: Q≈166.6 kJ; Q̇≈61.7 W; q″≈1.96 kW/m².</div><p><b>Engineering meaning:</b> The heat quantity is the total energy stored, the rate is energy per second, and heat flux is the rate per unit surface area.</p>
<h4>Question 2 — Heating water and the pot</h4><p><b>Given:</b> mw=1.2 kg, cw=4.18 kJ/kg·K; mp=1.0 kg, cp=0.7 kJ/kg·K; ΔT=80 K; P=1.2 kW.</p><p><b>Step 1:</b> Both the water and pot are heated from 15°C to 95°C. Qtotal=(mwcw+mpcp)ΔT=[1.2(4.18)+1(0.7)](80)=457.28 kJ.</p><p><b>Step 2:</b> With no heat loss, electrical energy supplied is Pt. Therefore t=Q/P=457.28 kJ/(1.2 kJ/s)=381.1 s.</p><div class="answer-result">Heating time ≈381 s = 6.35 min.</div><p><b>Check:</b> Heating only the water would underestimate the time because the pot also stores sensible heat.</p>
<h4>Question 3 — How heat transfer differs from other energy transfers</h4><p>Heat is energy crossing a system boundary solely because of a temperature difference. Work is energy transfer associated with a force acting through a displacement, shaft rotation, electrical work, etc. Energy carried by mass crossing a boundary is mass-flow energy. Heat is not a substance stored inside a body; a body stores internal energy, while heat describes energy in transit due to temperature difference.</p>
<h4>Question 4 — Ideal gas at constant volume versus constant pressure</h4><p>For the same mass and temperature rise, at constant volume Q=mcvΔT; at constant pressure Q=mcpΔT. Since cp=cv+R for an ideal gas, cp&gt;cv. At constant pressure, the gas expands and performs boundary work, so more energy must be supplied than at constant volume.</p><div class="answer-result">Greater energy is required at constant pressure. Ratio Qp/Qv=cp/cv=γ for the same mass and ΔT.</div>
<h4>Question 5 — Increase in body thermal energy</h4><p>Q=mcΔT=70(3.6)(39−37)=504 kJ.</p><div class="answer-result">Increase in thermal energy ≈504 kJ.</div><p>This is a sensible-energy estimate using the stated average specific heat; it does not imply that all metabolic energy becomes stored body heat.</p>
<h4>Question 6 — Solar energy reaching Earth</h4><p>No. The space between the Sun and Earth is essentially a vacuum, so ordinary conduction and convection cannot transport energy across it because both require matter. Solar energy arrives by thermal radiation, which propagates through a vacuum as electromagnetic waves.</p>
<h4>Question 7 — Conduction through the brick wall</h4><p><b>Given:</b> A=5×6=30 m²; L=0.30 m; k=0.69 W/m·K; ΔT=20−5=15 K.</p><p>For steady one-dimensional conduction through a plane wall, Q̇=kAΔT/L=0.69(30)(15)/0.30=1035 W.</p><div class="answer-result">Heat-transfer rate = 1.035 kW, from the 20°C side toward the 5°C side.</div>
<h4>Question 8 — Cooling of hot coffee in a closed container</h4><p>“Closed” prevents mass exchange but does not necessarily mean thermally insulated. Heat can move from the coffee to the inner container wall by natural convection in the liquid and conduction across any stagnant liquid layer; through the container wall by conduction; and from the outer wall to room air by natural convection and to surrounding room surfaces by thermal radiation. If the lid is not perfectly insulated, conduction through it and convection/radiation from its exterior also contribute. If the container is vacuum-insulated, the paths are reduced, not automatically eliminated.</p>
</div>

<h3>Fourier's Law, Heat Generation and Governing Equations</h3>
<p>Conduction is energy transfer within a stationary medium or between bodies in direct contact.</p>
<div class="callout"><b>Fourier's law:</b> q″<sub>x</sub> = −k(dT/dx). The negative sign means heat flows down the temperature gradient.</div>
<h3>Learning outcomes</h3><ul><li>Apply Fourier's law and interpret the negative sign.</li><li>Distinguish steady from transient conduction.</li><li>Define volumetric heat generation.</li><li>Write the appropriate heat diffusion equation and boundary conditions.</li></ul>
<h3>1. Thermal conductivity and diffusivity</h3>
<p>Thermal conductivity k (W/m·K) measures a material's ability to conduct heat. Thermal diffusivity α = k/(ρc<sub>p</sub>) (m²/s) measures how quickly a temperature disturbance spreads.</p>
<h3>2. Steady and transient conduction</h3>
<p>Steady conduction means temperature at a location does not change with time. Transient conduction means temperature changes with time.</p>
<h3>3. Heat generation</h3>
<p>Volumetric heat generation q̇‴ is thermal energy generated per unit volume per unit time (W/m³).</p>
<h3>4. Heat diffusion equations</h3>
<p>For constant properties and isotropic material, the general Cartesian equation is:</p>
<div class="equation-box">∂²T/∂x² + ∂²T/∂y² + ∂²T/∂z² + q̇‴/k = (1/α)(∂T/∂t)</div>
<p>For one-dimensional radial conduction in a cylinder: (1/r)∂/∂r(r∂T/∂r) + q̇‴/k = (1/α)∂T/∂t. Remove the time term for steady state; remove q̇‴/k when there is no internal generation.</p>
<h3>Worked example: plane wall</h3>
<div class="tutorial-solution-card"><h4>Plane-wall temperature distribution and heat flow</h4>
<p><b>Given:</b> L=0.20 m; k=1.2 W/m·K; A=15 m²; T₁=120°C at x=0; T₂=50°C at x=L.</p>
<p><b>Step 1 — Governing equation.</b> Steady 1-D conduction with no generation: d²T/dx² = 0.</p>
<p><b>Step 2 — Integrate.</b> T = C₁x + C₂.</p>
<p><b>Step 3 — Apply boundary conditions.</b> At x=0: T=120 → C₂=120. At x=0.20: 50 = 0.20C₁ + 120 → C₁ = −350.</p>
<p><b>Step 4 — Temperature distribution.</b> T(x) = 120 − 350x. At x=0.10 m, T = 85°C.</p>
<p><b>Step 5 — Heat rate.</b> Q̇ = kA(T₁−T₂)/L = 1.2 × 15 × 70/0.20 = 6300 W.</p>
<div class="answer-result">Final answers: T(x)=120−350x °C; T(0.10 m)=85°C; Q̇=6.30 kW.</div></div>
<h3>Summary</h3><ul><li>Fourier's law relates heat flux to temperature gradient.</li><li>Generation adds q̇‴/k to the diffusion equation.</li><li>Transient models require an initial condition and surface boundary conditions.</li></ul>`,

<h3>Plane Walls, Composite Walls, Cylinders, Spheres and Insulation</h3>
<p>This module applies steady one-dimensional conduction to common engineering geometries. The central tool is thermal resistance, analogous to electrical resistance.</p>
<div class="callout"><b>Thermal-resistance method:</b> Q̇ = ΔT/R<sub>total</sub>. Plane wall R = L/(kA); cylinder R = ln(r₂/r₁)/(2πkL); sphere R = (1/4πk)(1/r₁ − 1/r₂).</div>
<h3>Learning outcomes</h3><ul><li>Solve steady conduction through plane and composite walls.</li><li>Calculate radial conduction through cylinders and spheres.</li><li>Combine resistances in series.</li><li>Explain insulation and critical radius qualitatively.</li></ul>
<h3>1. Plane wall</h3>
<p>For constant k, no generation and steady 1-D conduction, the temperature profile is linear: Q̇ = kA(T₁−T₂)/L; R = L/(kA).</p>
<h3>2. Composite wall</h3>
<p>For layers in series, R<sub>total</sub> = ΣLᵢ/(kᵢA), and Q̇ = (T<sub>hot</sub>−T<sub>cold</sub>)/R<sub>total</sub>.</p>
<h3>3. Cylindrical and spherical systems</h3>
<p>For a hollow cylinder, R = ln(r₂/r₁)/(2πkL). For a spherical shell, R = (1/4πk)(1/r₁−1/r₂). Radial area changes with radius, so the temperature profile is logarithmic for a cylinder and reciprocal-radius for a sphere.</p>
<h3>Worked example: composite wall</h3>
<div class="tutorial-solution-card"><h4>Composite wall (two layers in series)</h4>
<p><b>Given:</b> Layer 1: L₁=0.10 m, k₁=0.7 W/m·K. Layer 2: L₂=0.05 m, k₂=1.5 W/m·K. Area A=4 m². Hot face T₁=200°C, cold face T₃=40°C.</p>
<p><b>Step 1 — Thermal resistance of layer 1.</b> R₁ = 0.10/(0.7×4) = 0.0357 K/W.</p>
<p><b>Step 2 — Thermal resistance of layer 2.</b> R₂ = 0.05/(1.5×4) = 0.00833 K/W.</p>
<p><b>Step 3 — Total resistance.</b> R_total = 0.0440 K/W.</p>
<p><b>Step 4 — Heat rate.</b> Q̇ = (200−40)/0.0440 = 3636 W.</p>
<p><b>Step 5 — Interface temperature.</b> T₂ = 200 − Q̇·R₁ = 200 − 3636×0.0357 = 70.2°C.</p>
<div class="answer-result">Final answers: Q̇ ≈ 3.64 kW; interface T₂ ≈ 70.2°C.</div></div>
<h3>Critical radius and fins</h3>
<p>For a cylinder, the critical insulation radius is r<sub>c</sub> = k<sub>ins</sub>/h. Adding insulation to a small cylinder can initially increase heat loss. Fins increase surface area to enhance convection.</p>
<h3>Summary</h3><ul><li>Plane-wall resistance is L/kA.</li><li>Cylindrical resistance is logarithmic in radius.</li><li>Series resistances add.</li><li>Always state the reference area when using an overall coefficient.</li></ul>`,

<section class="tutorial-set">
<h2>Tutorial Set 2 — Heat Diffusion, Generation and Boundary Conditions</h2>
<p><b>Purpose:</b> Classify heat-transfer problems, formulate governing equations, specify boundary conditions and solve steady one-dimensional conduction problems.</p>
<div class="callout"><b>Instructions:</b> State the coordinate system, assumptions, governing equation, initial condition (where applicable) and boundary conditions. For derivations, explain the physical meaning of each term.</div>
<h3>Question 1 — Scalar or vector quantity</h3><p>Is heat transfer a scalar or vector quantity? Explain.</p>
<h3>Question 2 — Cooking a roast guinea fowl</h3><p>Consider the cooking process of a roast guinea fowl in an oven. Would you consider this to be a steady or transient heat-transfer problem? Also, would you consider this to be one-, two-, or three-dimensional? Explain.</p>
<h3>Question 3 — Hair-dryer resistance wire</h3><p>The resistance wire of a 1200-W hair dryer is 80 cm long and has a diameter of D = 0.3 cm. Determine the rate of heat generation in the wire per unit volume, in W/cm³, and the heat flux on the outer surface of the wire as a result of this heat generation.</p>
<h3>Question 4 — Steel pan on an electric range</h3><p>Consider a steel pan placed on top of an electric range to cook cassava. The bottom section of the pan is L = 0.4 cm thick and has a diameter of D = 18 cm. The electric heating unit on the range top consumes 800 W of power during cooking, and 80 percent of the heat generated in the heating element is transferred uniformly to the pan. Assuming constant thermal conductivity, obtain the differential equation that describes the variation of the temperature in the bottom section of the pan during steady operation.</p>
<h3>Question 5 — Resistance heater wire</h3><p>A 2-kW resistance heater wire with thermal conductivity k = 15 W/(m·°C), diameter D = 0.4 cm, and length L = 50 cm is used to boil water by immersing it in water. Assuming the variation of the thermal conductivity of the wire with temperature to be negligible, obtain the differential equation that describes the variation of the temperature in the wire during steady operation.</p>
<h3>Question 6 — Spherical metal ball cooling</h3><p>A spherical metal ball of radius R is heated in an oven to a temperature of 600 °F throughout and is then taken out of the oven and allowed to cool in ambient air at T = 75 °F by convection and radiation. The thermal conductivity of the ball material is known to vary linearly with temperature. Assuming the ball is cooled uniformly from the entire outer surface, obtain the differential equation that describes the variation of the temperature in the ball during cooling.</p>
<h3>Question 7 — Boundary conditions for an aluminum pan</h3><p>Consider an aluminum pan used to cook beef stew on top of an electric range. The bottom section of the pan is L = 0.3 cm thick and has a diameter of D = 20 cm. The electric heating unit on the range top consumes 800 W of power during cooking, and 90 percent of the heat generated in the heating element is transferred to the pan. During steady operation, the temperature of the inner surface of the pan is measured to be 110 °C. Express the boundary conditions for the bottom section of the pan during this cooking process.</p>
<h3>Question 8 — Transient boundary conditions for an insulated steam pipe</h3><p>Steam flows through a pipe at an average temperature of T = 200°C. The inner and outer radii of the pipe are r₁ = 8 cm and r₂ = 8.5 cm, respectively, and the outer surface of the pipe is heavily insulated. If the convection heat-transfer coefficient on the inner surface of the pipe is h = 65 W/(m²·°C), express the boundary conditions on the inner and outer surfaces of the pipe during transient periods.</p>
<h3>Question 9 — Steady conduction through a plane wall</h3><p>Consider a large plane wall of thickness L = 0.2 m, thermal conductivity k = 1.2 W/(m·°C), and surface area A = 15 m². The two sides of the wall are maintained at constant temperatures of T₁ = 120 °C and T₂ = 50 °C, respectively. Determine (a) the variation of temperature within the wall and the value of temperature at x = 0.1 m and (b) the rate of heat conduction through the wall under steady conditions.</p>
<h3>Question 10 — General plane-wall solutions</h3><p>Consider steady one-dimensional heat conduction in a large plane wall of thickness L and constant thermal conductivity k with no heat generation. Obtain expressions for the variation of temperature within the wall for the pairs of boundary conditions illustrated in the original handout.</p>
<div class="callout"><b>Source figure required:</b> The original PDF presents the boundary-condition pairs as a figure. The figure must be consulted before assigning the individual boundary conditions; they are not reconstructed or guessed here.</div>
<h3>Question 11 — Heat loss through a steam pipe</h3><p>Consider a steam pipe of length L = 20 m, inner radius r₁ = 6 cm, outer radius r₂ = 8 cm, and thermal conductivity k = 20 W/(m·°C). The inner and outer surfaces of the pipe are maintained at average temperatures of T₁ = 150 °C and T₂ = 60 °C, respectively. Obtain a general relation for the temperature distribution inside the pipe under steady conditions, and determine the rate of heat loss from the steam through the pipe.</p>

<div class="tutorial-solution-card"><h3>FULLY WORKED SOLUTIONS — TUTORIAL SET 2</h3>
<h4>Question 1 — Is heat transfer scalar or vector?</h4><p>Heat energy Q (J) and heat-transfer rate Q̇ (W) are scalars: they have magnitude but no intrinsic direction. Heat flux q″ (W/m²), however, is a vector because it has both magnitude and direction. Fourier’s law in vector form is q″=−k∇T. Thus the wording matters: heat itself is scalar, while heat-flux density is vectorial.</p>
<h4>Question 2 — Cooking a roast guinea fowl</h4><p>It is transient because the bird’s temperature changes with time as it heats. It is generally three-dimensional: heat enters through the irregular surface and temperature varies with depth, position around the body, and position along its length. A simplified engineering model may use one-dimensional conduction only if geometry and heating are sufficiently symmetric and the approximation is stated.</p>
<h4>Question 3 — Hair-dryer resistance wire</h4><p><b>Given:</b> P=1200 W; L=0.80 m; D=0.003 m.</p><p>Wire volume V=πD²L/4=π(0.003)²(0.80)/4=5.655×10⁻⁶ m³=5.655×10⁻⁴ cm³.</p><p>Uniform volumetric generation q̇‴=P/V=2.122×10⁸ W/m³=212.2 W/cm³.</p><p>At steady state, all generated heat leaves through the cylindrical surface (neglecting end losses). Aₛ=πDL=π(0.003)(0.80)=0.007540 m². q″=P/Aₛ=1.592×10⁵ W/m²=15.92 W/cm².</p><div class="answer-result">q̇‴≈212.2 W/cm³; q″≈15.92 W/cm².</div>
<h4>Question 4 — Steel pan bottom: governing equation and boundary flux</h4><p>The range transfers 0.80(800)=640 W to the pan. The pan-bottom area is A=πD²/4=π(0.18)²/4=0.025447 m², so the applied uniform heat flux is q″=640/A=25,150 W/m². For a steady, one-dimensional slab with constant k and no heat generated within the steel, the governing equation is d²T/dx²=0. With x measured from the heated underside toward the food, the underside condition is −k(dT/dx)|₀=q″=25.15 kW/m²; the upper boundary requires a specified surface temperature or a convection condition to the food. The statement supplies no upper-surface temperature or food-side h, so a unique temperature profile cannot be calculated.</p><div class="equation-box">d²T/dx²=0; &nbsp; −kT′(0)=25,150 W/m²</div>
<h4>Question 5 — Resistance heater wire: internal generation</h4><p><b>Given:</b> P=2000 W; k=15 W/m·K; D=0.004 m; L=0.50 m. The wire volume is V=πD²L/4=6.283×10⁻⁶ m³, so q̇‴=P/V=3.183×10⁸ W/m³.</p><p>For a long cylindrical wire with uniform generation, constant k and steady radial conduction, the governing equation is (1/r)d/dr(r dT/dr)+q̇‴/k=0, or d²T/dr²+(1/r)dT/dr+q̇‴/k=0.</p><p>At the centre r=0, symmetry requires dT/dr=0. At r=R, the generated heat leaves to the water: −k(dT/dr)|R=h[T(R)−T∞]. The problem does not give h or T∞, so the governing equation and boundary conditions can be stated, but a numerical temperature profile cannot be found.</p><div class="equation-box">(1/r)d/dr(r dT/dr)+q̇‴/k=0; &nbsp; T′(0)=0</div>
<h4>Question 6 — Sphere cooling with variable conductivity</h4><p>Let k(T)=k₀[1+b(T−Tref)] represent the stated linear dependence. Spherical transient energy conservation is:</p><div class="equation-box">ρcp ∂T/∂t = (1/r²) ∂/∂r [r² k(T) ∂T/∂r]</div><p>Initial condition: T(r,0)=600°F throughout. Centre symmetry: ∂T/∂r=0 at r=0. At r=R, convection and radiation act together:</p><div class="equation-box">−k(Ts) ∂T/∂r = h(Ts−T∞)+εσ(Ts,K⁴−T∞,K⁴)</div><p>Here T∞=75°F, and absolute temperatures in the radiation term must be converted to kelvin (or Rankine with consistent constants). The emissivity ε, h value, and coefficients describing k(T) are not supplied, so the differential model can be derived but not numerically solved uniquely.</p>
<h4>Question 7 — Aluminum pan: boundary conditions</h4><p>Heat transferred to the pan is 0.90(800)=720 W. Area A=π(0.20)²/4=0.031416 m². The applied underside flux is q″=720/A=22,918 W/m². With x=0 at the underside and x=L=0.003 m at the food-contact surface, steady 1-D conduction with no internal generation gives d²T/dx²=0. Boundary conditions: −kT′(0)=22,918 W/m² and T(L)=110°C. The latter is the measured inner-surface temperature.</p>
<h4>Question 8 — Steam pipe during transient periods</h4><p>Use the transient cylindrical diffusion equation in the pipe wall: ∂T/∂t=α(1/r)∂/∂r(r∂T/∂r), assuming constant properties and no generation. At the inner radius r₁=0.08 m, steam convection gives −k(∂T/∂r)|r₁=h[Tsteam−T(r₁,t)] with Tsteam=200°C and h=65 W/m²·K. At the insulated outer radius r₂=0.085 m, (∂T/∂r)|r₂=0. An initial temperature distribution T(r,0) is also required to complete the transient problem.</p>
<h4>Question 9 — Plane-wall temperature and heat rate</h4><p><b>Given:</b> L=0.20 m; k=1.2 W/m·K; A=15 m²; T(0)=120°C; T(L)=50°C. Steady 1-D conduction without generation gives d²T/dx²=0, so T=C₁x+C₂. Applying the two temperatures gives C₂=120 and C₁=(50−120)/0.20=−350°C/m.</p><div class="answer-result">T(x)=120−350x (°C, x in metres); T(0.10)=85°C.</div><p>Q̇=kA(120−50)/L=1.2(15)(70)/0.20=6300 W=6.30 kW.</p>
<h4>Question 10 — Plane wall with specified flux/temperature boundaries</h4><p>For all three cases, steady 1-D conduction without generation gives d²T/dx²=0 and therefore T=C₁x+C₂, with constant heat flux q″=−kC₁.</p><p><b>(a)</b> At x=0, −kT′(0)=q₀=40 W/cm² and T(0)=T₀=15°C. Thus C₂=15 and C₁=−q₀/k; T(x)=15−(40/k)x, using consistent units for k and x.</p><p><b>(b)</b> The two specified fluxes are q″(0)=+40 W/cm² and q″(L)=−25 W/cm² under the same +x Fourier-flux convention. They are unequal, so no steady solution exists without internal generation or energy storage: a steady 1-D wall with no generation must carry the same signed heat flux at every x.</p><p><b>(c)</b> Both faces specify q″=+40 W/cm². The solution is T(x)=C−(40/k)x. The gradient is determined, but the additive constant C is not: no absolute temperature is specified. A reference temperature is needed to determine the full temperature distribution.</p>
<h4>Question 11 — Steam pipe: radial conduction</h4><p><b>Given:</b> L=20 m; r₁=0.06 m; r₂=0.08 m; k=20 W/m·K; T₁=150°C; T₂=60°C. For steady radial conduction in a cylinder, T(r)=T₁+(T₂−T₁)ln(r/r₁)/ln(r₂/r₁).</p><div class="answer-result">T(r)=150−90 ln(r/0.06)/ln(0.08/0.06) °C.</div><p>Q̇=2πkL(T₁−T₂)/ln(r₂/r₁)=2π(20)(20)(90)/ln(4/3)=786,266 W≈786.3 kW.</p><p><b>Engineering interpretation:</b> The logarithmic profile occurs because the radial area 2πrL increases with radius. The large heat loss is driven by the 90°C temperature difference and 20-m pipe length.</p>
</div>

<h3>Lumped-Capacitance Analysis and Transient Conduction</h3>
<p>Transient conduction occurs when temperature changes with time. This module introduces lumped-system analysis and transient conduction in large bodies.</p>
<div class="callout"><b>Lumped-capacitance criterion:</b> Bi = hL<sub>c</sub>/k. The lumped model is generally appropriate when Bi &lt; 0.1.</div>
<h3>Learning outcomes</h3><ul><li>Calculate Biot and Fourier numbers.</li><li>Determine whether lumped analysis is suitable.</li><li>Use the lumped cooling/heating relation.</li><li>Recognise when spatial temperature gradients require transient conduction solutions.</li></ul>
<h3>1. Lumped-system model</h3>
<p>The model assumes the solid temperature is spatially uniform at each instant. For convection to a fluid at T∞:</p>
<div class="equation-box">(T(t) − T∞)/(Tᵢ − T∞) = exp[−hAₛt/(ρVc<sub>p</sub>)]</div>
<p>The time constant is τ = ρVc<sub>p</sub>/(hAₛ) = ρc<sub>p</sub>L<sub>c</sub>/h, where L<sub>c</sub> = V/Aₛ.</p>
<h3>2. Biot and Fourier numbers</h3>
<p>Bi = hL<sub>c</sub>/k compares internal conduction resistance with surface convection resistance. Fo = αt/L<sub>c</sub>² is the dimensionless time.</p>
<h3>Worked example: thermocouple response</h3>
<div class="tutorial-solution-card"><h4>Thermocouple response time to 99%</h4>
<p><b>Given:</b> spherical junction D = 1 mm = 0.001 m; k = 35 W/m·K; ρ = 8500 kg/m³; cₚ = 320 J/kg·K; h = 210 W/m²·K.</p>
<p><b>Step 1 — Characteristic length.</b> For a sphere, Lc = V/A = r/3 = D/6 = 1.667×10⁻⁴ m.</p>
<p><b>Step 2 — Biot number.</b> Bi = hLc/k = 210(1.667×10⁻⁴)/35 = 0.001. Since Bi &lt; 0.1, lumped analysis is appropriate.</p>
<p><b>Step 3 — Lumped relation.</b> θ/θᵢ = exp(−t/τ), where τ = ρcₚLc/h. At 99% response, θ/θᵢ = 0.01.</p>
<p><b>Step 4 — Solve for time.</b> 0.01 = exp(−t/τ), so t = τ·ln(100). Substituting, t = [8500×320×1.667×10⁻⁴/210]×4.605 = 9.94 s.</p>
<div class="answer-result">Final answer: ≈ 9.94 seconds to reach 99% of the initial temperature change.</div></div>
<h3>Summary</h3><ul><li>Check Bi before using lumped analysis.</li><li>For 99% response, t = τ·ln(100).</li><li>Do not present a lumped estimate as exact when Bi is not small.</li></ul>`,

<section class="tutorial-set">
<h2>Tutorial Set 3 — Transient Conduction and Lumped-System Analysis</h2>
<p><b>Purpose:</b> Apply transient conduction concepts, the Biot number, lumped-capacitance analysis and transient solutions for extended cylindrical bodies.</p>
<div class="callout"><b>Instructions:</b> For every transient problem, identify the initial temperature, surrounding-fluid temperature, convection coefficient, characteristic length and relevant thermal properties. Check the Biot-number criterion before using lumped analysis.</div>
<h3>Question 1 — Buried hot-water pipe</h3><p>A 30-m-long, 10-cm-diameter hot-water pipe of a district heating system is buried in the soil 50 cm below the ground surface. The outer surface temperature of the pipe is 80°C. Taking the surface temperature of the earth to be 10°C and the thermal conductivity of the soil at that location to be 0.9 W/(m·°C), determine the rate of heat loss from the pipe. <b>Hint:</b> use the appropriate shape factor.</p>
<h3>Question 2 — Thermocouple response time</h3><p>The temperature of a gas stream is to be measured by a thermocouple whose junction can be approximated as a 1-mm-diameter sphere. The properties of the junction are k = 35 W/(m·°C), ρ = 8500 kg/m³, and Cₚ = 320 J/(kg·°C), and the convection heat-transfer coefficient between the junction and the gas is h = 210 W/(m²·°C). Determine how long it will take for the thermocouple to read 99 percent of the initial temperature difference.</p>
<h3>Question 3 — Estimating time of death using body cooling</h3><p>A person is found dead at 5 PM in a room whose temperature is 20°C. The temperature of the body is measured to be 25°C when found, and the heat-transfer coefficient is estimated to be h = 8 W/(m²·°C). Modeling the body as a 30-cm-diameter, 1.70-m-long cylinder, estimate the time of death. Assume that the thermal properties of the person and the heat-transfer coefficient are constant. Further assume that the person was healthy when he died and had a body temperature of 37°C. Use the properties of water at the average temperature of (37 + 25)/2 = 31°C: k = 0.617 W/(m·°C), ρ = 996 kg/m³, and Cₚ = 4178 J/(kg·°C). The source instructs the learner to use lumped-system analysis for a rough estimate.</p>
<div class="callout"><b>Engineering caution:</b> This is an educational heat-transfer exercise, not a reliable forensic method. Check the Biot number and explicitly discuss the limitation of the lumped-capacitance assumption.</div>
<h3>Question 4 — Cooling of a stainless-steel shaft</h3><p>A long 20-cm-diameter cylindrical shaft made of stainless steel 304 comes out of an oven at a uniform temperature of 600°C. The shaft is then allowed to cool slowly in an environment chamber at 200°C with an average heat-transfer coefficient of h = 80 W/(m²·°C). Determine the temperature at the center of the shaft 45 min after the start of the cooling process. Also, determine the heat transfer per unit length of the shaft during this time period.</p>
<div class="callout"><b>Source data note:</b> The original tutorial refers to material-property data and a figure. Use the specified stainless-steel 304 property source adopted by the course and state the property values used in the calculation.</div>

<div class="tutorial-solution-card"><h3>FULLY WORKED SOLUTIONS — TUTORIAL SET 3</h3>
<h4>Question 1 — Buried hot-water pipe (shape-factor method)</h4><p><b>Given:</b> L=30 m; pipe diameter D=0.10 m, radius r=0.05 m; centre depth z=0.50 m (as shown in the handout); ksoil=0.9 W/m·K; ΔT=80−10=70 K.</p><p>For a long cylinder buried below an approximately isothermal plane surface, S=2πL/acosh(2z/r). Thus acosh(2z/r)=acosh(20)=3.6883 and S=2π(30)/3.6883=51.11 m.</p><p>Q̇=kSΔT=0.9(51.11)(70)=3219.7 W.</p><div class="answer-result">Estimated heat loss ≈3.22 kW.</div><p>The depth in the diagram is measured to the pipe centreline. If 0.50 m were instead interpreted as cover above the pipe crown, the centre depth would be 0.55 m and the result would be slightly lower.</p>
<h4>Question 2 — Thermocouple response to 99%</h4><p><b>Given:</b> D=0.001 m; r=0.0005 m; k=35 W/m·K; ρ=8500 kg/m³; cp=320 J/kg·K; h=210 W/m²·K.</p><p>Check lumped validity: Lc=V/A=r/3=1.667×10⁻⁴ m. Bi=hLc/k=210(1.667×10⁻⁴)/35=0.001, much less than 0.1, so lumped capacitance is valid.</p><p>For a first-order lumped response, θ/θi=exp[−t/τ], where τ=ρcpLc/h. To reach 99% of the total temperature change, only 1% of the initial difference remains: θ/θi=0.01. Therefore t=τ ln(100)=ρcpLc ln(100)/h.</p><p>t=[8500(320)(1.667×10⁻⁴)/210](4.605)=9.94 s.</p><div class="answer-result">Thermocouple response time ≈9.94 s.</div>
<h4>Question 3 — Body cooling: rough time estimate and limitation</h4><p><b>Given:</b> Tᵢ=37°C; T∞=20°C; T=25°C at discovery; h=8 W/m²·K; cylinder D=0.30 m, L=1.70 m; ρ=996 kg/m³; cp=4178 J/kg·K; k=0.617 W/m·K.</p><p>For the finite cylinder, V=πr²L=0.1202 m³ and exposed area including ends A=2πrL+2πr²=1.744 m². Thus Lc=V/A=0.06892 m. The lumped time constant is τ=ρcpLc/h=35,900 s. Newton cooling gives (T−T∞)/(Tᵢ−T∞)=exp(−t/τ). Hence t=τ ln[(37−20)/(25−20)]=τ ln(3.4)=43,871 s=12.19 h.</p><div class="answer-result">Rough lumped estimate: about 12.2 hours before discovery; 5:00 PM minus 12.2 h ≈4:49 AM.</div><p><b>Critical limitation:</b> Bi=hLc/k=8(0.06892)/0.617=0.894, which is far greater than 0.1. Therefore the lumped-temperature assumption is not valid; significant internal temperature gradients are expected. The 12.2-hour result is only the rough estimate requested by the handout, not a reliable forensic determination. Real post-mortem temperature is affected by clothing, body composition, airflow, contact surfaces, illness, and changing room conditions.</p>
<h4>Question 4 — Cooling of a stainless-steel 304 shaft</h4><p><b>Given:</b> R=0.10 m; Tᵢ=600°C; T∞=200°C; h=80 W/m²·K; t=2700 s. The question does not provide the required stainless-steel property table. For an illustrative calculation, take representative approximate properties k=16.2 W/m·K, ρ=7900 kg/m³ and cp=500 J/kg·K; these must be replaced by the specified course/textbook values if supplied.</p><p>Thermal diffusivity α=k/(ρcp)=16.2/[7900(500)]=4.10×10⁻⁶ m²/s. Bi=hR/k=80(0.10)/16.2=0.494, so lumped capacitance is not valid. The cylinder is long, so use the one-dimensional radial transient conduction model with a convective boundary at r=R. A radial finite-volume solution with these representative properties gives the centre temperature after 2700 s as approximately 369°C.</p><p>The heat removed per unit length is obtained from the decrease in internal energy: Q′=ρcp∫₀ᴿ[Ti−T(r,t)]2πr dr. Numerical radial integration gives approximately 3.09×10⁷ J/m.</p><div class="answer-result">Illustrative result: centre temperature ≈369°C; heat removed ≈30.9 MJ per metre of shaft.</div><p><b>Important:</b> This is a property-dependent numerical estimate, not a unique exact answer from the supplied question. The stainless-steel 304 property values at an appropriate mean temperature and the textbook chart/solution method should be confirmed before grading.</p>
</div>

<h3>Fluid Flow, Boundary Layers and Convection Correlations</h3>
<p>Convection heat transfer occurs between a surface and a fluid. It depends on the fluid motion, properties, geometry and temperature difference.</p>
<h3>Learning outcomes</h3><ul><li>Distinguish natural and forced convection.</li><li>Classify laminar, transitional and turbulent flow.</li><li>Define Re, Pr, Nu and Gr.</li><li>Use a supplied correlation only within its stated range and unit system.</li></ul>
<h3>1. Newton's law of cooling</h3>
<p>Q̇ = hA(T<sub>s</sub> − T∞). h is the convection heat-transfer coefficient (W/m²·K). It is not a material property; it depends on the flow and geometry.</p>
<h3>2. Boundary layers</h3>
<p>The velocity boundary layer is the region near a surface where fluid velocity changes from the wall value to the free-stream value. The thermal boundary layer is the region where fluid temperature changes from surface temperature toward bulk/free-stream temperature.</p>
<h3>3. Flow classification</h3>
<p>Laminar flow has orderly layers; turbulent flow contains fluctuations and eddies that enhance mixing and usually increase heat transfer. Reynolds number Re = ρVD/μ = VD/ν compares inertial and viscous effects. For internal flow in a circular tube, the common approximate ranges are laminar Re &lt; 2300, transitional about 2300–4000, and turbulent above about 4000.</p>
<h3>4. Dimensionless groups</h3>
<ul><li>Nu = hL/k: convection relative to conduction across the fluid layer.</li>
<li>Re = ρVL/μ: inertial relative to viscous effects.</li>
<li>Pr = μc<sub>p</sub>/k = ν/α: momentum diffusivity relative to thermal diffusivity.</li>
<li>Gr = gβΔTL³/ν²: buoyancy relative to viscous effects.</li>
<li>Ra = Gr·Pr: natural-convection measure.</li></ul>
<h3>Worked example: tube flow regime</h3>
<div class="tutorial-solution-card"><h4>Forced flow inside a tube — regime classification</h4>
<p><b>Given:</b> Tube L = 6.1 m; Dᵢ = 0.016 m; c<sub>p</sub> = 2720 J/kg·K; k = 0.147 W/m·K; μ<sub>b</sub> = 0.000806 Pa·s. Flow 907.2 kg/h = 0.252 kg/s.</p>
<p><b>Step 1 — Cross-section.</b> A = πDᵢ²/4 = 2.011×10⁻⁴ m².</p>
<p><b>Step 2 — Mass velocity.</b> G = ṁ/A = 0.252/2.011×10⁻⁴ = 1253 kg/m²·s.</p>
<p><b>Step 3 — Reynolds number.</b> Re = DᵢG/μ = 0.016×1253/0.000806 ≈ 24,880.</p>
<div class="answer-result">Conclusion: Re ≈ 24,880 → turbulent flow. Apply a turbulent tube-flow correlation with its stated validity range.</div></div>
<h3>Summary</h3><ul><li>Natural convection is buoyancy-driven; forced convection uses an external driving force.</li><li>Re classifies flow regime; Nu connects h to fluid conductivity.</li><li>Use the original correlation and unit convention.</li></ul>`,

<h3>Boiling Modes and Condensation Heat Transfer</h3>
<p>Boiling and condensation are phase-change heat-transfer processes. They are important in boilers, evaporators, condensers, reboilers and thermal process equipment.</p>
<h3>Learning outcomes</h3><ul><li>Explain the difference between boiling and evaporation.</li><li>Identify common boiling regimes.</li><li>Explain filmwise and dropwise condensation.</li><li>Recognise why phase change can produce high heat-transfer rates.</li></ul>
<h3>1. Boiling</h3>
<p>Boiling occurs when a liquid at a heated surface forms vapour bubbles. In pool boiling, the liquid is relatively stationary except for buoyancy-driven motion; in flow boiling, the liquid is forced through a heated passage. As surface superheat increases, boiling regimes progress from natural convection to nucleate boiling, transition boiling and film boiling.</p>
<h3>2. Nucleate and film boiling</h3>
<p>Nucleate boiling involves bubble formation at active sites and is associated with vigorous mixing and high heat-transfer coefficients. In film boiling, a vapour layer separates the liquid from the hot surface; this layer can act as insulation.</p>
<h3>3. Condensation</h3>
<p>Condensation occurs when vapour contacts a surface below its saturation temperature and changes to liquid. Filmwise condensation forms a continuous liquid film; dropwise condensation forms droplets and can provide lower resistance when the surface remains suitably non-wetting.</p>
<h3>Worked concept example: condenser duty</h3>
<div class="tutorial-solution-card"><h4>Steam condenser heat duty</h4>
<p><b>Given:</b> Steam condenses at 100°C. Condensation rate ṁ = 0.5 kg/s. Latent heat h<sub>fg</sub> = 2257 kJ/kg.</p>
<p><b>Step 1 — Latent heat duty.</b> Q̇ = ṁ·h<sub>fg</sub> = 0.5 × 2257 = 1128.5 kW.</p>
<p><b>Step 2 — Interpret.</b> Because condensation happens at nearly constant saturation temperature, the duty is set by the latent heat rather than sensible cooling.</p>
<div class="answer-result">Final answer: Q̇ ≈ 1.13 MW of latent heat removed.</div></div>
<h3>Summary</h3><ul><li>Boiling adds energy to a liquid to form vapour.</li><li>Condensation removes latent heat from vapour.</li><li>Surface condition and phase-change regime strongly affect h.</li></ul>`,

<h3>Radiation Properties, Blackbodies and Surface Exchange</h3>
<p>Thermal radiation is energy emitted by matter because of its temperature. Unlike conduction and convection, radiation does not require a material medium.</p>
<h3>Learning outcomes</h3><ul><li>Explain emission, absorption, reflection and transmission.</li><li>Define blackbody and emissivity.</li><li>Apply the Stefan–Boltzmann relation in simple cases.</li><li>Explain why absolute temperature is required.</li></ul>
<h3>1. Radiation and surface properties</h3>
<p>Radiation incident on a surface may be absorbed, reflected or transmitted. For an opaque surface, transmissivity is zero and absorptivity plus reflectivity equals one. Emissivity ε compares actual emission with blackbody emission at the same temperature.</p>
<h3>2. Blackbody and Stefan–Boltzmann law</h3>
<p>A blackbody is an ideal surface that absorbs all incident radiation and emits the maximum possible radiation at a given temperature. Its emissive power is E<sub>b</sub> = σT⁴, where σ = 5.670×10⁻⁸ W/m²·K⁴ and T is absolute temperature in kelvin.</p>
<h3>3. Net radiation exchange</h3>
<p>For a small surface exchanging with large surroundings: Q̇ = εσA(T<sub>s</sub>⁴ − T<sub>sur</sub>⁴).</p>
<h3>Worked example: radiation heat loss</h3>
<div class="tutorial-solution-card"><h4>Radiative heat loss from a hot surface</h4>
<p><b>Given:</b> Surface area A = 0.5 m²; T<sub>s</sub> = 500 K; T<sub>sur</sub> = 300 K; ε = 0.8.</p>
<p><b>Step 1 — Convert to absolute temperature.</b> Temperatures already in kelvin.</p>
<p><b>Step 2 — Apply the Stefan–Boltzmann relation.</b> Q̇ = εσA(T<sub>s</sub>⁴ − T<sub>sur</sub>⁴).</p>
<p><b>Step 3 — Compute the fourth-power difference.</b> 500⁴ − 300⁴ = 6.25×10¹⁰ − 8.1×10⁹ = 5.44×10¹⁰ K⁴.</p>
<p><b>Step 4 — Substitute.</b> Q̇ = 0.8 × 5.670×10⁻⁸ × 0.5 × 5.44×10¹⁰ = 1234 W.</p>
<div class="answer-result">Final answer: Q̇ ≈ 1.23 kW net radiative loss.</div></div>
<h3>Summary</h3><ul><li>Radiation travels through a vacuum.</li><li>Emissivity is a surface property.</li><li>Use kelvin in Stefan–Boltzmann equations.</li></ul>`,

<h3>Heat-Exchanger Types, Overall Coefficient, Fouling and LMTD</h3>
<p>Heat exchangers transfer energy between fluids at different temperatures. This module covers common arrangements, overall heat-transfer resistance, fouling and log-mean temperature difference.</p>
<h3>Learning outcomes</h3><ul><li>Identify common heat-exchanger configurations.</li><li>Build an overall thermal-resistance network.</li><li>Explain fouling resistance.</li><li>Calculate LMTD for parallel and countercurrent flow.</li></ul>
<h3>1. Heat-exchanger types</h3>
<p>Common types include double-pipe, shell-and-tube, plate, compact, crossflow and regenerative exchangers.</p>
<h3>2. Overall heat-transfer coefficient</h3>
<p>For a cylindrical tube, resistances include inner convection, inner fouling, tube wall conduction, outer fouling and outer convection. The overall coefficient depends on the reference area: Q̇ = UAΔT<sub>lm</sub>.</p>
<h3>3. Fouling</h3>
<p>Fouling is the accumulation of unwanted deposits on heat-transfer surfaces. It adds thermal resistance, lowers U and can increase pressure drop.</p>
<h3>4. LMTD</h3>
<p>ΔT<sub>lm</sub> = (ΔT₁ − ΔT₂)/ln(ΔT₁/ΔT₂).</p>
<h3>Worked example: LMTD</h3>
<div class="tutorial-solution-card"><h4>LMTD for countercurrent and cocurrent flow</h4>
<p><b>Given:</b> Hot stream 200 → 100°C; cold stream 20 → 95°C.</p>
<p><b>Step 1 — Countercurrent end differences.</b> ΔT₁ = 200 − 95 = 105 K; ΔT₂ = 100 − 20 = 80 K.</p>
<p><b>Step 2 — Countercurrent LMTD.</b> ΔT<sub>lm</sub> = (105 − 80)/ln(105/80) = 91.9 K.</p>
<p><b>Step 3 — Cocurrent end differences.</b> ΔT₁ = 200 − 20 = 180 K; ΔT₂ = 100 − 95 = 5 K.</p>
<p><b>Step 4 — Cocurrent LMTD.</b> ΔT<sub>lm</sub> = (180 − 5)/ln(180/5) = 48.8 K.</p>
<div class="answer-result">Final answers: countercurrent ΔT<sub>lm</sub> ≈ 91.9 K; cocurrent ΔT<sub>lm</sub> ≈ 48.8 K.</div></div>
<h3>Summary</h3><ul><li>Q̇ = UAΔT<sub>lm</sub> for LMTD analysis.</li><li>Fouling adds resistance.</li><li>Countercurrent flow gives a higher LMTD than cocurrent flow for the same terminal temperatures in this example.</li></ul>`,

      { title: "Tutorial Set 4 — Convection and Heat-Exchanger Calculations", duration: "60–120 minutes", html: `

<section class="tutorial-set">
<h2>Tutorial Set 4 — Transient Heating, Thermal Resistance and Convection</h2>
<p><b>Purpose:</b> Work with transient heating of plates, overall heat-transfer coefficients, natural convection, internal tube flow and helical-coil convection.</p>
<div class="callout"><b>Instructions:</b> Show the correlation selected, define all dimensionless groups, verify the applicable flow regime and retain consistent SI units. Where the handout supplies a correlation table or chart, consult that original table rather than substituting an unrelated correlation.</div>
<h3>Question 1 — Heating brass plates in an oven</h3><p>In a production facility, large brass plates of 4 cm thickness that are initially at a uniform temperature of 20°C are heated by passing them through an oven maintained at 500°C. The plates remain in the oven for 7 min. Taking the combined convection and radiation heat-transfer coefficient to be h = 120 W/(m²·°C), determine the surface temperature of the plates when they come out of the oven. The properties of brass at room temperature are k = 110 W/(m·°C), ρ = 8530 kg/m³, Cₚ = 380 J/(kg·°C), and α = 33.9 × 10⁻⁶ m²/s.</p>
<h3>Question 2 — Double-pipe heat-exchanger resistance</h3><p>A double-pipe (shell-and-tube) heat exchanger is constructed of a stainless-steel (k = 15.1 W/(m·°C)) inner tube of inner diameter Dᵢ = 1.5 cm and outer diameter Dₒ = 1.9 cm, and an outer shell of inner diameter 3.2 cm. The convection heat-transfer coefficient is hᵢ = 800 W/(m²·°C) on the inner surface of the tube and hₒ = 1200 W/(m²·°C) on the outer surface. For fouling factors Rf,i = 0.0004 m²·°C/W on the tube side and Rf,o = 0.0001 m²·°C/W on the shell side, determine (a) the thermal resistance of the heat exchanger per unit length and (b) the overall heat-transfer coefficients Uᵢ and Uₒ based on the inner and outer surface areas of the tube, respectively.</p>
<h3>Question 3 — Natural convection from a coil immersed in water</h3><p>Calculate the heat-transfer coefficient from a coil immersed in water. The coil has a diameter of 1 in (0.025 m), and the temperature difference between the surface of the coil and the fluid is 10°F (5.56 K). Water properties: Cₚ = 1.0 Btu/(lb·°F) [4.19 kJ/(kg·K)]; ρ = 60 lb/ft³ (961.1 kg/m³); k = 0.395 Btu/(h·ft·°F) [0.683 W/(m·K)]; μ = 0.72 lb/(ft·h) (0.298 cP); β = 0.0004°F⁻¹ (0.00022 K⁻¹). The handout supplies natural-convection equations for vertical surfaces and horizontal cylinders and notes an orientation correction factor of 0.5 for specified unfavourable orientations.</p>
<div class="callout"><b>Correlation reference:</b> Use the natural-convection equations printed in the supplied handout and identify the characteristic length and orientation. The equation artwork/table is not fully represented in the extracted text, so no correlation has been invented in this course page.</div>
<h3>Question 4 — Convection inside a straight tube at two flow rates</h3><p>Calculate the heat-transfer coefficient for a fluid flowing through a tube 20 ft (6.1 m) long and of 0.62-in (0.016-m) inside diameter. The bulk-fluid temperature is 212°F (373 K), and the tube-surface temperature is 122°F (323 K). Calculate the heat-transfer coefficient if the fluid flows at 2000 lb/h (907.2 kg/h), and also if the flow rate is reduced to 100 lb/h (45.36 kg/h). Fluid properties: Cₚ = 0.65 Btu/(lb·°F) [2.72 kJ/(kg·K)]; k = 0.085 Btu/(h·ft·°F) [0.147 W/(m·K)]; μw = 4.0 lb/(ft·h) (1.65 cP); μb = 1.95 lb/(ft·h) (0.806 cP).</p>
<h3>Question 5 — Convection inside a helical coil</h3><p>Calculate the heat-transfer coefficient for a fluid flowing at 100 lb/h (45.36 kg/h) using the physical properties in Question 4. The inside diameter of the tube is 0.62 in (0.016 m), and the tube is fabricated into a helical coil with a helix diameter of 24 in (0.61 m). The handout specifies a helical-coil correction factor and a modified laminar-flow length term; apply the stated modifications and check the Reynolds-number criterion given in the source.</p>

<div class="tutorial-solution-card"><h3>FULLY WORKED SOLUTIONS — TUTORIAL SET 4 (PART I)</h3>
<h4>Question 1 — Brass plate surface temperature after oven heating</h4><p><b>Given:</b> Plate thickness=0.04 m, so half-thickness L=0.02 m; Ti=20°C; T∞=500°C; h=120 W/m²·K; k=110 W/m·K; ρ=8530 kg/m³; cp=380 J/kg·K; α=33.9×10⁻⁶ m²/s; t=420 s.</p><p>Bi=hL/k=120(0.02)/110=0.0218&lt;0.1, so the plate is nearly uniform in temperature and lumped analysis is appropriate. The lumped time constant is τ=ρcpL/h=8530(380)(0.02)/120=540.6 s.</p><p>θ/θi=exp(−t/τ). Therefore Ts≈T(t)=T∞+(Ti−T∞)exp[−ht/(ρcpL)]=500−480exp[−120(420)/(8530·380·0.02)]=279.4°C.</p><div class="answer-result">Surface temperature at oven exit ≈279°C.</div><p>A one-term plane-wall transient solution gives approximately 279.6°C, confirming the lumped estimate.</p>
<h4>Question 2 — Double-pipe exchanger thermal resistance and overall U</h4><p><b>Given:</b> ri=0.0075 m; ro=0.0095 m; k=15.1 W/m·K; hi=800; ho=1200 W/m²·K; Rf,i=0.0004; Rf,o=0.0001 m²·K/W.</p><p>For one metre of tube, the resistances are: inner convection R′i=1/(hi2πri)=0.02653 K·m/W; inner fouling R′f,i=Rf,i/(2πri)=0.00849; tube wall R′w=ln(ro/ri)/(2πk)=0.00249; outer fouling R′f,o=Rf,o/(2πro)=0.00168; outer convection R′o=1/(ho2πro)=0.01396.</p><p>R′total=sum=0.05314 K·m/W. Based on inner area, Ui=1/[R′total(2πri)]=399.3 W/m²·K. Based on outer area, Uo=1/[R′total(2πro)]=315.3 W/m²·K.</p><div class="answer-result">R′total=0.05314 K·m/W; Ui≈399 W/m²·K; Uo≈315 W/m²·K.</div><p>Ui and Uo differ because they use different reference areas; the total thermal resistance per unit length is the same.</p>
<h4>Question 3 — Natural convection from a horizontal coil</h4><p><b>Given:</b> D=0.025 m; ΔT=5.56 K; ρ=961.1 kg/m³; cp=4190 J/kg·K; kf=0.683 W/m·K; μ=0.000298 Pa·s; β=0.00022 K⁻¹.</p><p>The handout defines the mass-velocity parameter for a horizontal cylinder as G=(gβΔTρ²D)½. Substitution gives G=[9.81(0.00022)(5.56)(961.1²)(0.025)]½=16.65 kg/(m²·s). Reynolds number Re=DG/μ=0.025(16.65)/0.000298=1.40×10³, in the 100–10,000 range.</p><p>For this range, the source correlation is h/(cpG)=0.53/(DG/μ)½=0.53/Re½. Therefore h=cpG(0.53/Re½)=4190(16.65)(0.53/√1397)=989 W/m²·K.</p><div class="answer-result">Natural-convection coefficient h≈0.99 kW/m²·K.</div><p>Use the 0.5 orientation multiplier only for the unfavourable plate orientations specified in the handout; this is a horizontal cylindrical coil, so that plate correction is not applied.</p>
<h4>Question 4 — Forced convection inside a straight tube</h4><p><b>Given:</b> Di=0.016 m; L=6.1 m; cp=2720 J/kg·K; kf=0.147 W/m·K; μb=0.000806 Pa·s; μw=0.00165 Pa·s. Tube area A=πDi²/4=2.011×10⁻⁴ m².</p><p><b>At 2000 lb/h:</b> ṁ=907.2/3600=0.252 kg/s; G=ṁ/A=1253 kg/m²·s; Re=DiG/μb=24,880&gt;8000, turbulent. Apply the source correlation h/(cpG)=0.023/[(cpμb/kf)^(2/3)Re^0.2(μw/μb)^0.14]. Substitution gives h≈1546 W/m²·K.</p><p><b>At 100 lb/h:</b> ṁ=45.36/3600=0.0126 kg/s; G=62.67 kg/m²·s; Re=1244&lt;2100, laminar. Apply h/(cpG)=1.86/[(cpμb/kf)^(2/3)Re^(2/3)(L/Di)^(1/3)(μw/μb)^0.14]. This gives h≈56.4 W/m²·K.</p><div class="answer-result">2000 lb/h: h≈1.55 kW/m²·K (turbulent). 100 lb/h: h≈56.4 W/m²·K (laminar).</div>

<h3>Tube-Side and Shell-Side Design Calculations</h3>
<p>Shell-and-tube exchangers are widely used in chemical and process industries. This chapter applies tube-side and shell-side flow calculations, heat-transfer correlations, bypass corrections, wall resistance and overall coefficient.</p>
<h3>Learning outcomes</h3><ul><li>Identify shell, tubes, tube passes and baffles.</li><li>Calculate tube-side and shell-side mass velocity and Reynolds number.</li><li>Understand how correlations estimate h<sub>i</sub> and h<sub>o</sub>.</li><li>Assemble the overall resistance equation.</li></ul>
<h3>1. Main components</h3>
<p>A shell-and-tube exchanger contains a bundle of tubes inside a cylindrical shell. One fluid flows inside the tubes; the other flows across the tube bundle on the shell side. Baffles guide shell-side flow and support the tubes.</p>
<h3>2. Tube-side calculations</h3>
<p>For n tubes in parallel in one tube pass, total flow area is nπDᵢ²/4. Mass velocity G<sub>t</sub> = W<sub>t</sub>/a<sub>t</sub> and Re = DᵢG<sub>t</sub>/μ<sub>t</sub>.</p>
<h3>3. Shell-side calculations</h3>
<p>The shell-side cross-flow area is a<sub>c</sub> = BD<sub>s</sub>(s − D<sub>o</sub>)/s and G<sub>s</sub> = W<sub>s</sub>/a<sub>c</sub>. Reynolds number uses the outside tube diameter: Re<sub>o</sub> = D<sub>o</sub>G<sub>s</sub>/μ<sub>s</sub>.</p>
<h3>4. Tube wall and overall coefficient</h3>
<p>Tube-wall heat-transfer coefficient approximation: h<sub>w</sub> = 2k/(D<sub>o</sub> − Dᵢ). Fouling resistance uses 1/h<sub>s</sub>, not h<sub>s</sub> itself.</p>
<h3>Worked example: tube-side and shell-side checks</h3>
<div class="tutorial-solution-card"><h4>Shell-and-tube exchanger — mass velocities and Reynolds numbers</h4>
<p><b>Given:</b> D<sub>s</sub>=0.635 m; n=532; D<sub>o</sub>=0.019 m; Dᵢ=0.016 m; L=4.88 m; pitch s≈0.024 m; B=0.241 m. Tube side: W<sub>t</sub>=226,795 kg/h; μ<sub>t</sub>=0.5 cP. Shell side: W<sub>s</sub>=90,718 kg/h; μ<sub>s</sub>=0.83 cP.</p>
<p><b>Step 1 — Convert mass rates.</b> W<sub>t</sub> = 62.9986 kg/s; W<sub>s</sub> = 25.1994 kg/s.</p>
<p><b>Step 2 — Tube flow area.</b> a<sub>t</sub> = 532π(0.016)²/4 = 0.10696 m².</p>
<p><b>Step 3 — Tube-side mass velocity.</b> G<sub>t</sub> = 62.9986/0.10696 ≈ 589 kg/m²·s.</p>
<p><b>Step 4 — Tube-side Reynolds number.</b> Re<sub>t</sub> = DᵢG<sub>t</sub>/μ<sub>t</sub> = 0.016×589/0.0005 ≈ 18,850 → turbulent.</p>
<p><b>Step 5 — Shell-side area.</b> a<sub>c</sub> = 0.241×0.635×(0.024−0.019)/0.024 ≈ 0.0318 m².</p>
<p><b>Step 6 — Shell-side mass velocity.</b> G<sub>s</sub> = 25.1994/0.0318 ≈ 793 kg/m²·s.</p>
<p><b>Step 7 — Shell-side Reynolds number.</b> Re<sub>s</sub> = 0.019×793/0.00083 ≈ 18,150 → turbulent.</p>
<p><b>Step 8 — Wall coefficient.</b> h<sub>w</sub> = 2(17)/(0.019−0.016) = 11,333 W/m²·K.</p>
<div class="answer-result">Final answers: G<sub>t</sub> ≈ 589 kg/m²·s (Re<sub>t</sub> ≈ 18,850); G<sub>s</sub> ≈ 793 kg/m²·s (Re<sub>s</sub> ≈ 18,150); h<sub>w</sub> ≈ 11,333 W/m²·K.</div></div>
<h3>Summary</h3><ul><li>Calculate flow areas and mass velocities carefully.</li><li>Use the correct characteristic diameter and viscosity.</li><li>Apply bypass and fouling corrections only as specified by the source correlation.</li></ul>`,
