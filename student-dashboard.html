<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOGI LMS · Student Dashboard</title>
  <style>
    :root {
      --p: #ff4b93;
      --pd: #e93680;
      --ink: #34343b;
      --muted: #777780;
      --line: #e9e8ef;
      --bg: #f5f5f8;
      --success: #2e7d32;
      --error: #b33;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.65 Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .inner { width: min(1100px, 92%); margin: auto; }

    /* Header */
    .top {
      height: 64px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
      z-index: 50;
      box-shadow: 0 2px 9px rgba(0,0,0,.05);
    }
    .nav { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .brand { font-size: 24px; font-weight: 800; text-decoration: none; color: var(--ink); }
    .brand span { color: var(--p); }

    /* Buttons */
    .btn {
      background: var(--p);
      color: white;
      border: 0;
      border-radius: 24px;
      padding: 9px 18px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      transition: 0.2s;
      text-align: center;
    }
    .btn:hover { background: var(--pd); }
    .btn-outline {
      background: transparent;
      color: var(--pd);
      border: 1.5px solid var(--p);
      border-radius: 24px;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }

    /* Auth screen */
    .auth-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 40px 16px;
      background: linear-gradient(120deg,#fff2f7,#f3f0fa);
    }
    .auth-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.05);
    }
    .auth-card h2 { margin: 0 0 20px; font-size: 22px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }
    .field input:focus { border-color: var(--p); }

    /* Dashboard */
    .dashboard { padding: 40px 0; flex: 1; }
    .welcome { margin-bottom: 30px; }
    .welcome h1 { margin: 0 0 5px; font-size: 28px; }
    .welcome p { margin: 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .course-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .course-img {
      height: 140px;
      background: #e9e8ee center/cover no-repeat;
      position: relative;
    }
    .course-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--success);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      display: none;
    }
    .course-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .course-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--p);
      font-weight: bold;
      margin-bottom: 8px;
    }
    .course-card h3 { margin: 0 0 10px; font-size: 18px; }
    .course-card p { margin: 0 0 20px; color: var(--muted); font-size: 13px; flex: 1; }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer {
      background: #292832;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header class="top">
  <div class="inner nav">
    <a class="brand" href="student-dashboard.html">LOGI<span>.</span></a>
    <div id="topActions"></div>
  </div>
</header>

<main id="app"></main>

<footer class="footer">
  <strong>Living Oracles Global Institute</strong><br>Faith. Excellence. Impact.
</footer>

<script>
/* =========================================================
   COURSE CONFIG
   ========================================================= */
const COURSES = [
  {
    key: 'transport',
    title: 'Advanced Transport Phenomena',
    tag: 'Engineering & Technology',
    description: "Master the fundamentals of momentum, heat, and mass transfer. Learn to apply Newton's law of viscosity, Fourier's law, and Fick's law.",
    image: 'https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=600&q=80',
    url: 'transport-phenomena.html',
    moduleId: 'module_1',
    lessonId: 'lesson_1'
  },
  {
    key: 'agile',
    title: 'Introduction to Agile Project Management',
    tag: 'Project Management',
    description: 'Learn Agile values, iterative delivery, Scrum roles, backlogs, sprints, reviews and continuous improvement.',
    image: 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=600&q=80',
    url: 'agile-project-management.html',
    moduleId: 'agile_module_1',
    lessonId: 'agile_lesson_1'
  }
];

/* =========================================================
   AUTH HELPERS
   ========================================================= */
function getAuth() {
  const raw = localStorage.getItem('logi_user');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

/* =========================================================
   RENDER
   ========================================================= */
function renderApp() {
  const user = getAuth();
  const topActions = document.getElementById('topActions');
  const app = document.getElementById('app');

  if (user) {
    topActions.innerHTML = `
      <span style="font-size:13px; color:var(--muted); margin-right:15px;">${user.email}</span>
      <button class="btn-outline" onclick="logout()">Log out</button>
    `;

    const cardsHtml = COURSES.map(c => `
      <div class="course-card">
        <div class="course-img" style="background-image: url('${c.image}');">
          <div class="course-badge" id="badge-${c.key}">Completed ✅</div>
        </div>
        <div class="course-body">
          <div class="course-tag">${c.tag}</div>
          <h3>${c.title}</h3>
          <p>${c.description}</p>
          
          <div class="card-actions">
            <a href="${c.url}" class="btn" id="btn-${c.key}">Start Course</a>
            <!-- Hidden by default, shown if completed -->
            <a href="${c.url}" class="btn-outline" id="cert-${c.key}" style="display:none; border-color: var(--success); color: var(--success);">View Certificate 🏅</a>
          </div>
        </div>
      </div>
    `).join('');

    app.innerHTML = `
      <div class="inner dashboard">
        <div class="welcome">
          <h1>Welcome, ${user.fullName || user.email}!</h1>
          <p>Select a course below to continue your learning journey.</p>
        </div>
        <div class="grid">${cardsHtml}</div>
      </div>
    `;

    fetchProgress(user.token);

  } else {
    topActions.innerHTML = '';
    app.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h2 id="authTitle">Welcome back</h2>
          <div id="authError" style="color:var(--error); font-size:13px; margin-bottom:15px; display:none;"></div>
          <form id="authForm" onsubmit="handleLogin(event)">
            <div class="field" id="nameField" style="display:none;">
              <label>Full Name</label>
              <input type="text" id="authName" placeholder="Jane Smith">
            </div>
            <div class="field">
              <label>Email address</label>
              <input type="email" id="authEmail" placeholder="you@example.com" required>
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="authPassword" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn" style="width:100%; justify-content:center; margin-top:10px;" id="submitBtn">Log in</button>
          </form>
          <div style="text-align:center; margin-top:20px; font-size:13px; color:var(--muted);">
            <span id="switchText">Don't have an account?</span>
            <a href="#" onclick="toggleMode(event)" style="color:var(--pd); font-weight:bold; text-decoration:none;">Register</a>
          </div>
        </div>
      </div>
    `;
  }
}

/* =========================================================
   PROGRESS
   ========================================================= */
async function fetchProgress(token) {
  try {
    const res = await fetch('https://logi-lms-api.livingoraclesglobalinstitute.workers.dev/my-progress', {
      method: 'GET',
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.status === 401) {
      localStorage.removeItem('logi_user');
      renderApp();
      return;
    }

    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || 'Unable to retrieve progress.');
    }

    if (!Array.isArray(data.progress)) return;

    for (const course of COURSES) {
      // We check if ANY module for this course is marked as completed=1
      // For single-module courses like Agile, this checks the specific module.
      const row = data.progress.find(
        p => p.module_id.startsWith(course.moduleId.replace('_1', '')) && p.completed === 1
      );

      if (!row) continue;

      // Show Completed Badge
      const badge = document.getElementById(`badge-${course.key}`);
      if (badge) badge.style.display = 'block';

      // Change main button to Retake
      const btn = document.getElementById(`btn-${course.key}`);
      if (btn) {
        btn.textContent = 'Retake Course';
        btn.style.background = 'var(--success)';
      }

      // Show Certificate Button
      const certBtn = document.getElementById(`cert-${course.key}`);
      if (certBtn) {
        certBtn.style.display = 'block';
      }
    }

  } catch (err) {
    console.error('Progress error:', err);
  }
}

/* =========================================================
   LOGIN / REGISTER
   ========================================================= */
let isRegistering = false;

function toggleMode(e) {
  e.preventDefault();
  isRegistering = !isRegistering;
  document.getElementById('authTitle').textContent = isRegistering ? 'Create an account' : 'Welcome back';
  document.getElementById('nameField').style.display = isRegistering ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = isRegistering ? 'Register' : 'Log in';
  document.getElementById('switchText').textContent = isRegistering ? 'Already have an account?' : "Don't have an account?";
  e.target.textContent = isRegistering ? 'Log in here' : 'Register';
  document.getElementById('authError').style.display = 'none';
}

async function handleLogin(e) {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('authError');

  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name = document.getElementById('authName')
    ? document.getElementById('authName').value.trim()
    : '';

  const endpoint = isRegistering 
    ? 'https://logi-lms-api.livingoraclesglobalinstitute.workers.dev/register' 
    : 'https://logi-lms-api.livingoraclesglobalinstitute.workers.dev/login';

  btn.textContent = 'Processing...';
  btn.disabled = true;
  errEl.style.display = 'none';

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, fullName: name })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    if (!data.token) throw new Error('Authentication token was not returned.');

    localStorage.setItem('logi_user', JSON.stringify({
      token: data.token,
      email: data.email,
      fullName: data.fullName || name
    }));

    isRegistering = false;
    renderApp();

  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.textContent = isRegistering ? 'Register' : 'Log in';
    btn.disabled = false;
  }
}

function logout() {
  localStorage.removeItem('logi_user');
  renderApp();
}

document.addEventListener('DOMContentLoaded', renderApp);
</script>
</body>
</html>
