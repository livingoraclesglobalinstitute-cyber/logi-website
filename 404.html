<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Living Oracles Global Institute</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1b2a;
      color: #f4f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 560px; }
    h1 {
      font-size: 5rem;
      font-weight: 800;
      color: #c9a227;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem;
      color: #b8c2cc;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    a.button {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: #c9a227;
      color: #0d1b2a;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      transition: background 0.2s ease;
    }
    a.button:hover { background: #dbb63a; }
    .links {
      margin-top: 2rem;
      font-size: 0.9rem;
    }
    .links a {
      color: #c9a227;
      text-decoration: none;
      margin: 0 0.75rem;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
      The page you are looking for does not exist, has been moved,
      or is temporarily unavailable.
    </p>
    <a href="/" class="button">Return to Homepage</a>
    <div class="links">
      <a href="/about">About</a>
      <a href="/our-programs">Programs</a>
      <a href="/main-registration-form">Apply</a>
      <a href="/contact-us">Contact</a>
    </div>
  </div>
</body>
</html>
