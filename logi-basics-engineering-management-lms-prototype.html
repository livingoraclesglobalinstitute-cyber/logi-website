    .course-layout { display: grid; grid-template-columns: 260px 1fr; gap: 22px; align-items: start; }

    .mod-btn {

      text-align: left;
      background: white;
      border: 0;
      padding: 11px 9px;
      border-radius: 5px;

      color: var(--ink);
      font-size: 13px;

    .lesson-link {

    .cert-sidebar-pattern {

    .cert-sidebar-pattern::before {

    .cert-verify-area {

    .cert-verify-text {

    .cert-qr {

    .cert-blockchain {

    .cert-bottom-block {

    @media (max-width: 900px) {

/* ============================================================

   Storage: localStorage (demo only)

const STORE = {
  users: 'logi_users',
  session: 'logi_session',
  progress: 'logi_progress',       
  certificates: 'logi_certificates', 
  posts: 'logi_posts',

function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function save(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

/* ---------- Course data ---------- */
const COURSE = {
  id: 'eng-mgmt-101',
  title: 'Basics of Engineering Management',
  desc: 'Understand how engineering work is planned, coordinated and improved through structured lessons, practical examples and knowledge checks.',
  passMark: 80,
  modules: [
    {
      title: 'Introduction to Engineering Management',
      lessons: [
        {
          title: 'Understanding Engineering Management',
          duration: '35 minutes',
          html: `
            <h2>Understanding Engineering Management</h2>
            <p>Engineering management is the application of management principles, technical knowledge and problem-solving methods to plan, organise, coordinate and control engineering activities. It connects engineering expertise with the people, resources, time, cost and quality requirements needed to complete work successfully.</p>
            <div class="callout"><b>Key idea:</b> Engineering focuses on designing and solving technical problems. Engineering management organises the people, processes and resources required to deliver engineering work effectively.</div>
            <h3>1. What does an engineering manager do?</h3>
            <ul>
              <li>Plans engineering activities and sets priorities.</li>
              <li>Coordinates engineers, technicians, contractors and stakeholders.</li>
              <li>Manages equipment, materials, time and budgets.</li>
              <li>Monitors quality, safety, cost and project performance.</li>
              <li>Identifies problems and supports practical solutions.</li>
            </ul>
            <h3>2. Engineering and engineering management</h3>
            <table class="compare">
              <tr><th>Engineering</th><th>Engineering management</th></tr>
              <tr><td>Focuses on technical design, analysis and solutions.</td><td>Coordinates technical work, people and resources.</td></tr>
              <tr><td>May involve calculations, testing and system development.</td><td>May involve planning, budgeting, scheduling and team coordination.</td></tr>
              <tr><td>Asks: How can this technical problem be solved?</td><td>Asks: How can the work be delivered safely, on time and within budget?</td></tr>
            </table>
            <h3>3. Where is it applied?</h3>
            <p>Engineering management is used in construction, manufacturing, energy, mining, oil and gas, infrastructure, maintenance and technology projects. A construction project, for example, needs technical design as well as labour planning, material procurement, equipment scheduling, cost control and safety coordination.</p>
            <div class="case">
              <h3>Practical case: A delayed construction project</h3>
              <p>A contractor is constructing a community health facility. Work has slowed because cement deliveries are late, equipment is unavailable when needed and the site team has not received an updated work schedule.</p>
              <p><b>Management response:</b> Review the work plan, confirm material delivery dates, coordinate equipment use, assign responsibilities and monitor progress against revised milestones—without compromising safety or quality.</p>
            </div>
            <h3>Lesson summary</h3>
            <ul>
              <li>Engineering management combines technical understanding with management practices.</li>
              <li>It coordinates people, materials, equipment, time, cost, quality and risk.</li>
              <li>It is important across many engineering industries.</li>
            </ul>
          `,
          quiz: [
            { q: 'Which statement best describes engineering management?', opts: ['Designing technical systems only', 'Coordinating technical work, people and resources to achieve objectives', 'Replacing engineering with administration'], answer: 1, explanation: 'It coordinates technical work, people and resources to achieve objectives.' },
            { q: 'Which is an engineering management activity?', opts: ['Ignoring delivery schedules', 'Working without defined responsibilities', 'Coordinating equipment, materials and labour'], answer: 2, explanation: 'Coordinating equipment, materials and labour is a management responsibility.' },
            { q: 'Materials arrive late on a project. What is a sensible response?', opts: ['Review the plan and coordinate suppliers and work activities', 'Stop monitoring the project', 'Ignore the delay'], answer: 0, explanation: 'Reviewing the plan and coordinating suppliers helps address the delay.' },
            { q: 'Which question is most closely associated with engineering management?', opts: ['How can planning be avoided?', 'How can work be delivered safely, on time and within budget?', 'How can standards be ignored?'], answer: 1, explanation: 'Engineering management considers safe delivery, time, cost and quality.' },
            { q: 'Where can engineering management be applied?', opts: ['Construction only', 'Manufacturing only', 'Across many engineering sectors'], answer: 2, explanation: 'It is applied across construction, manufacturing, energy and other sectors.' }
          ]
        }
      ]
    },
    {
      title: 'Engineering Planning and Project Management',
      lessons: [
        {
          title: 'Module 2 overview',
          duration: '50 minutes',
          html: `
            <h2>Engineering Planning and Project Management</h2>
            <p>This module explores how engineering activities are translated into practical work plans.</p>
            <div class="callout"><b>Topics:</b> defining scope and deliverables; breaking work into activities; sequencing tasks; scheduling and milestones; coordinating contractors and stakeholders; monitoring project progress.</div>
          `,

/* ---------- Helpers ---------- */
function uid() {
  return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
}
function nowISO() { return new Date().toISOString(); }
function esc(s) {
  if (typeof s !== 'string') return s;
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- Session / user ---------- */
function getUsers() { return load(STORE.users, {}); }
function getSession() { return load(STORE.session, null); }
function setSession(u) { save(STORE.session, u); }
function clearSession() { localStorage.removeItem(STORE.session); }
function currentUser() {
  const s = getSession();
  if (!s) return null;
  return getUsers()[s.username] || null;
}
function getProgress(username) {
  const p = load(STORE.progress, {});
  if (!p[username]) p[username] = { lessons: {}, quizzes: {} };
  return p[username];
}
function saveProgress(username, p) {
  const all = load(STORE.progress, {});
  all[username] = p;
  save(STORE.progress, all);
}
function getEnrolments(username) {
  const e = load(STORE.enrolments, {});
  return e[username] || [];
}
function enrol(username, courseId) {
  const e = load(STORE.enrolments, {});
  if (!e[username]) e[username] = [];
  if (!e[username].includes(courseId)) e[username].push(courseId);
  save(STORE.enrolments, e);
}
function getCerts(username) {
  const c = load(STORE.certificates, {});
  return c[username] || [];
}
function addCert(username, cert) {
  const c = load(STORE.certificates, {});
  if (!c[username]) c[username] = [];
  c[username].push(cert);
  save(STORE.certificates, c);
}

/* ---------- Progress calculations ---------- */
function isLessonDone(username, mi, li) {
  const p = getProgress(username);
  return !!p.lessons[mi + '-' + li];
}
function markLessonDone(username, mi, li) {
  const p = getProgress(username);
  p.lessons[mi + '-' + li] = true;
  saveProgress(username, p);
}
function getQuizResult(username, mi) {
  const p = getProgress(username);
  return p.quizzes[mi] || null;
}
function saveQuizResult(username, mi, score, total) {
  const p = getProgress(username);
  p.quizzes[mi] = { score, total, passed: score / total * 100 >= COURSE.passMark };
  saveProgress(username, p);
}
function isModuleLocked(username, mi) {
  if (mi === 0) return false;
  const prev = getQuizResult(username, mi - 1);
  return !prev || !prev.passed;
}
function moduleLessonsDone(username, mi) {
  const mod = COURSE.modules[mi];
  if (!mod) return 0;
  let n = 0;
  mod.lessons.forEach((_, li) => { if (isLessonDone(username, mi, li)) n++; });
  return n;
}
function courseProgressPct(username) {
  let total = 0, done = 0;
  COURSE.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => {
      total++;
      if (isLessonDone(username, mi, li)) done++;
    });
  });
  return total ? Math.round(done / total * 100) : 0;
}
function courseCompleted(username) {
  for (let mi = 0; mi < COURSE.modules.length; mi++) {
    if (!getQuizResult(username, mi)?.passed) return false;
    for (let li = 0; li < COURSE.modules[mi].lessons.length; li++) {
      if (!isLessonDone(username, mi, li)) return false;
    }
  }
  return true;
}

/* ---------- Certificate generation ---------- */
function generateCertificate(username) {
  const user = getUsers()[username];
  if (!user) return null;
  const certs = getCerts(username);
  let cert = certs.find(c => c.courseId === COURSE.id);
  if (cert) return cert;
  
  const hash = Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('');
  
  cert = {
    id: 'LOGI-' + COURSE.id.toUpperCase() + '-' + Date.now().toString(36).toUpperCase(),
    hash: hash,
    courseId: COURSE.id,
    courseTitle: COURSE.title,
    studentName: user.fullName || user.username,
    date: nowISO(),
    issuedBy: 'Living Oracles Global Institute'
  };
  addCert(username, cert);
  return cert;
}

  function submitQuiz(mi) {
    const u = currentUser();
    if (!u) return;
    const quiz = COURSE.modules[mi].lessons[0].quiz;
    if (!quiz) return;
    let score = 0;
    let answeredAll = true;
    quiz.forEach((q, qi) => {
      const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
      const fb = document.getElementById(`fb_${mi}_${qi}`);
      if (!sel) {
        answeredAll = false;
        if (fb) { fb.textContent = 'Please select an answer.'; fb.style.color = 'var(--error)'; }
        return;
      }
      const val = parseInt(sel.value, 10);
      const ok = val === q.answer;
      if (ok) score++;
      if (fb) {
        fb.textContent = (ok ? '✅ Correct. ' : '❌ Review: ') + q.explanation;
        fb.style.color = ok ? 'var(--success)' : 'var(--error)';
      }
    });
    if (!answeredAll) {
      document.getElementById('quizResult_' + mi).textContent = 'Please answer all questions before submitting.';
      return;
    }
    saveQuizResult(u.username, mi, score, quiz.length);
    const pct = Math.round(score / quiz.length * 100);
    const passed = pct >= COURSE.passMark;
    const resEl = document.getElementById('quizResult_' + mi);
    if (resEl) {
      resEl.textContent = `You scored ${score} / ${quiz.length} (${pct}%). ${passed ? 'Passed ✅ — next module unlocked.' : 'Not passed. Review the explanations and retake when ready.'}`;
      resEl.style.color = passed ? 'var(--success)' : 'var(--error)';
    }
    
    if (passed) {
      markLessonDone(u.username, mi, 0);
      if (courseCompleted(u.username)) {
        generateCertificate(u.username);
      }
      setTimeout(() => {
        renderCourse();
      }, 1200);
    }
  }

  // Function to scale certificate down on smaller screens while keeping it full-size for printing
  function scaleCertificate() {
    const scaler = document.getElementById('certScaler');
    if (!scaler) return;
    const container = scaler.parentElement;
    const containerWidth = container.clientWidth;
    const certWidth = 1000; // Original certificate width

    if (containerWidth < certWidth) {
      const scale = containerWidth / certWidth;
      scaler.style.transform = `scale(${scale})`;
      scaler.style.marginBottom = `-${(707 * (1 - scale))}px`; // Prevents large blank space below
    } else {
      scaler.style.transform = 'none';
      scaler.style.marginBottom = '0';
    }
  }

  function downloadCertificateImage() {
    const cert = document.getElementById('printableCert');
    if (!cert) return;
    
    const btn = document.querySelector('button[onclick="App.downloadCertificateImage()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ Generating...';
    btn.disabled = true;

    html2canvas(cert, {
      scale: 2, 
      useCORS: true, 
      backgroundColor: '#fafafa',
      // Ensure we capture the full 1000x707 size even if visually scaled down
      width: 1000,
      height: 707,
      windowWidth: 1000,
      windowHeight: 707,
      onclone: (clonedDoc) => {
        const desc = clonedDoc.querySelector('.cert-description');
        if (desc) {
          desc.style.wordSpacing = 'normal';
          desc.style.letterSpacing = 'normal';
        }
        const watermark = clonedDoc.querySelector('.cert-watermark');
        if (watermark) {
          watermark.style.display = 'block';
        }
      }
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'LOGI_Certificate.png';
      link.href = imgData;
      link.click();
      
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error('Error generating image:', err);
      alert('Failed to generate image. Please ensure you are connected to the internet so the external signature and QR code can load.');
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }

          <button class="nav-link" onclick="App.showCertificate()">🏅 My certificate</button>
          <button class="nav-link" onclick="App.showDiscussion()">💬 Discussion</button>
          <button class="nav-link" onclick="App.showAnnouncements()">📢 Announcements</button>
          <button class="nav-link active" onclick="App.showAdmin()">⚙️ Admin dashboard</button>
          <div class="spacer"></div>
          <button class="nav-link" onclick="App.logout()" style="color:var(--muted);">↪ Log out</button>
        </aside>
        <main class="main-panel">
          <h1>Admin dashboard</h1>
          <p class="subtitle">Demo overview — all data is local to this browser.</p>
          <div class="stat-grid">
            <div class="stat-box"><div class="num">${Object.keys(users).length}</div><div class="lbl">Registered students</div></div>
            <div class="stat-box"><div class="num">${Object.keys(allCerts).reduce((n,k)=>n+(allCerts[k]||[]).length,0)}</div><div class="lbl">Certificates issued</div></div>
          </div>
          <div class="card">
            <h2>Student performance</h2>
            <table class="admin-table" style="width: 100%; border-collapse: collapse; font-size: 14px;">
              <thead><tr style="background: var(--soft); text-align: left;"><th style="padding:10px;">Student</th><th style="padding:10px;">Course progress</th><th style="padding:10px;">Modules passed</th><th style="padding:10px;">Certificate</th></tr></thead>
              <tbody>
                ${Object.keys(users).map(un => {
                  const p = allProgress[un] || { lessons:{}, quizzes:{} };
                  const doneLessons = Object.keys(p.lessons||{}).length;
                  const totalLessons = COURSE.modules.reduce((n,m)=>n+m.lessons.length,0);
                  const pct = totalLessons ? Math.round(doneLessons/totalLessons*100) : 0;
                  const passedMods = Object.values(p.quizzes||{}).filter(q=>q.passed).length;
                  const hasCert = (allCerts[un]||[]).some(c=>c.courseId===COURSE.id);
                  return `<tr style="border-bottom: 1px solid var(--line);">
                    <td style="padding:10px;"><b>${esc(users[un].fullName||un)}</b><br><span style="font-size:12px;color:var(--muted);">@${esc(un)}</span></td>
                    <td style="padding:10px;">${pct}%</td>
                    <td style="padding:10px;">${passedMods} / ${COURSE.modules.length}</td>
                    <td style="padding:10px;">${hasCert ? '<span style="background:#e8f5e9;color:#2e7d32;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;">Issued</span>' : '<span style="background:#fff8e1;color:#b28704;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;">Not yet</span>'}</td>
                  </tr>`;
                }).join('') || '<tr><td colspan="4" style="color:var(--muted);">No students yet.</td></tr>'}
              </tbody>
            </table>
          </div>
        </main>
      </div>
    `;
    renderNav();
  }

  function goHome() {
    if (currentUser()) showDashboard();
    else showLanding();
  }

  function init() {
    renderNav();
    if (currentUser()) showDashboard();
    else showLanding();
  }

  return {
    init, showLanding, showLogin, showRegister, doLogin, doRegister, logout,
    showDashboard, showCatalogue, showCertificate, showDiscussion, showAnnouncements, showAdmin,
    openCourse, prevLesson, nextLesson, markCurrentLesson, enrolAndOpen,
    submitQuiz, selectOption, alertLocked, submitPost, downloadCertificateImage,
    goHome
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
</body>
</html>
