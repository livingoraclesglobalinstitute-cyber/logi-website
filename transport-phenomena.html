<script>
/* ============================================================
   COURSE DATA (6 MODULES)
   ============================================================ */
const COURSE = {
  id: 'transport-phenomena-101',
  title: 'Advanced Transport Phenomena',
  passMark: 50,
  modules: [
    {
      title: "Introduction to Transport Phenomena",
      lessons: [{
        title: "Fundamentals of Momentum, Heat, and Mass",
        duration: "45 minutes",
        html: `<p>Transport phenomena is the study of how momentum, energy, and mass move from one location to another. It is the foundational science for chemical engineering.</p>
        <div class="callout"><b>Core principle:</b> Transport phenomena provides the scientific foundation for designing reactors, separators, and heat exchangers.</div>
        <h3>Learning Outcomes</h3>
        <ul><li>Define the three fundamental transport processes.</li><li>Identify the driving force for each process.</li><li>Recognize the core governing law for each process.</li></ul>
        <h3>1. The Three Pillars</h3>
        <table class="compare"><tr><th>Process</th><th>Driving Force</th><th>Governing Law</th></tr><tr><td>Momentum</td><td>Velocity gradient</td><td>Newton's Law: τ = μ(du/dy)</td></tr><tr><td>Heat</td><td>Temperature gradient</td><td>Fourier's Law: q = -kA(dT/dx)</td></tr><tr><td>Mass</td><td>Concentration gradient</td><td>Fick's Law: J = -D(dC/dx)</td></tr></table>
        <h3>2. Industrial Importance</h3>
        <p>Designing a chemical reactor requires understanding how reactants flow (momentum), how heat is removed (energy), and how products are separated (mass).</p>`,
        quiz: [
          { q: "Which process is driven by a velocity gradient?", opts: ["Mass transfer", "Heat transfer", "Momentum transfer", "Chemical reaction"], answer: 2, explanation: "Momentum transfer is driven by differences in velocity." },
          { q: "The driving force for heat conduction is:", opts: ["Pressure difference", "Concentration difference", "Temperature gradient", "Velocity gradient"], answer: 2, explanation: "Fourier's law states heat flows due to a temperature gradient." },
          { q: "Which law describes molecular diffusion?", opts: ["Newton's Law", "Fourier's Law", "Fick's Law", "Stefan-Boltzmann Law"], answer: 2, explanation: "Fick's law governs mass transfer due to concentration gradients." },
          { q: "In a chemical reactor, what primarily governs the flow of reactants?", opts: ["Fick's Law", "Momentum transfer (fluid dynamics)", "Radiation", "Thermodynamics"], answer: 1, explanation: "Fluid flow is governed by momentum transfer." },
          { q: "Transport phenomena is fundamental to which field?", opts: ["Civil engineering only", "Chemical engineering", "Electrical engineering", "Software engineering"], answer: 1, explanation: "Chemical engineering relies heavily on transport phenomena for process design." }
        ]
      }]
    },
    {
      title: "Momentum Transfer & Fluid Mechanics",
      lessons: [{
        title: "Newton's Law of Viscosity and Fluid Flow",
        duration: "45 minutes",
        html: `<p>Momentum transfer deals with the movement of momentum within fluids. When a fluid flows through a pipe, different layers move at different velocities, producing internal friction known as viscosity.</p>
        <div class="callout"><b>Newton's Law of Viscosity:</b> τ = μ (du/dy)</div>
        <h3>Learning Outcomes</h3>
        <ul><li>Calculate shear stress in a fluid.</li><li>Understand Newtonian vs. non-Newtonian fluids.</li><li>Apply the concept of viscosity.</li></ul>
        <h3>1. Understanding Viscosity</h3>
        <p>Viscosity (μ) is a measure of a fluid's resistance to flow. Honey has high viscosity; water has low viscosity.</p>
        <h3>2. Worked Example</h3>
        <p>Water flows between two parallel plates. Dynamic viscosity = 0.001 Pa·s, velocity difference = 2 m/s, distance between plates = 0.01 m.</p>
        <p><b>Step 1:</b> τ = μ (Δu/Δy)</p>
        <p><b>Step 2:</b> τ = 0.001 × (2/0.01) = 0.2 Pa</p>`,
        quiz: [
          { q: "What does viscosity measure?", opts: ["A fluid's resistance to flow", "A fluid's temperature", "A fluid's density", "A fluid's pressure"], answer: 0, explanation: "Viscosity is internal friction resisting flow." },
          { q: "In Newton's law of viscosity, what does 'du/dy' represent?", opts: ["Pressure gradient", "Velocity gradient", "Temperature gradient", "Concentration gradient"], answer: 1, explanation: "du/dy is the rate of change of velocity with distance." },
          { q: "If a fluid has viscosity of 0.01 Pa·s and velocity gradient of 50 s⁻¹, what is the shear stress?", opts: ["0.5 Pa", "5 Pa", "0.05 Pa", "50 Pa"], answer: 0, explanation: "τ = 0.01 × 50 = 0.5 Pa." },
          { q: "Which of the following fluids has the highest viscosity at room temperature?", opts: ["Water", "Air", "Honey", "Alcohol"], answer: 2, explanation: "Honey is highly viscous compared to water and air." },
          { q: "A fluid that does not follow Newton's law of viscosity is called:", opts: ["Ideal fluid", "Newtonian fluid", "Non-Newtonian fluid", "Perfect gas"], answer: 2, explanation: "Non-Newtonian fluids have a varying viscosity depending on shear rate." }
        ]
      }]
    },
    {
      title: "Heat Transfer Fundamentals",
      lessons: [{
        title: "Conduction, Convection, and Radiation",
        duration: "50 minutes",
        html: `<p>Heat transfer is the movement of thermal energy from a region of higher temperature to a region of lower temperature.</p>
        <div class="callout"><b>Fourier's Law (Conduction):</b> q = -kA(dT/dx)</div>
        <h3>Learning Outcomes</h3>
        <ul><li>Differentiate between conduction, convection, and radiation.</li><li>Apply Fourier's Law to calculate heat transfer rates.</li><li>Understand thermal conductivity.</li></ul>
        <h3>1. Conduction</h3>
        <p>Occurs through molecular interactions within a material. Governed by Fourier's Law, where <b>k</b> is thermal conductivity.</p>
        <h3>2. Convection</h3>
        <p>Heat transfer between a surface and a moving fluid. Governed by Newton's Law of Cooling: q = hA(Ts - T∞).</p>
        <h3>3. Radiation</h3>
        <p>Transfer of energy through electromagnetic waves. Governed by the Stefan-Boltzmann Law: q = εσA(Ts⁴ - Tsur⁴).</p>`,
        quiz: [
          { q: "Which mode of heat transfer requires a medium (matter) to occur?", opts: ["Radiation", "Conduction and Convection", "Radiation and Convection", "None of the above"], answer: 1, explanation: "Radiation can travel through a vacuum, but conduction and convection require matter." },
          { q: "In Fourier's law (q = -kA dT/dx), what does 'k' represent?", opts: ["Heat transfer rate", "Thermal conductivity", "Specific heat", "Viscosity"], answer: 1, explanation: "k is the material's thermal conductivity." },
          { q: "Heat transfer between a solid surface and a moving fluid is called:", opts: ["Conduction", "Radiation", "Convection", "Evaporation"], answer: 2, explanation: "Convection involves fluid motion." },
          { q: "The negative sign in Fourier's Law indicates:", opts: ["Heat flows from cold to hot", "Heat flows in the direction of decreasing temperature", "The material is a conductor", "The temperature is absolute"], answer: 1, explanation: "Heat naturally flows from higher to lower temperatures." },
          { q: "Which law governs thermal radiation?", opts: ["Newton's Law of Cooling", "Fourier's Law", "Fick's Law", "Stefan-Boltzmann Law"], answer: 3, explanation: "The Stefan-Boltzmann law relates radiation to absolute temperature." }
        ]
      }]
    },
    {
      title: "Mass Transfer & Diffusion",
      lessons: [{
        title: "Fick's Law and Molecular Diffusion",
        duration: "45 minutes",
        html: `<p>Mass transfer involves the movement of chemical species from one location to another, commonly due to concentration differences.</p>
        <div class="callout"><b>Fick's First Law:</b> J = -D(dC/dx)</div>
        <h3>Learning Outcomes</h3>
        <ul><li>Apply Fick's Law to calculate diffusion flux.</li><li>Understand the diffusion coefficient (D).</li><li>Identify industrial applications of mass transfer.</li></ul>
        <h3>1. Molecular Diffusion</h3>
        <p>Diffusion occurs due to random molecular motion, moving species from high concentration to low concentration.</p>
        <h3>2. Worked Example</h3>
        <p>Diffusion coefficient = 2×10⁻⁹ m²/s, concentration difference = 10 mol/m³, distance = 0.01 m.</p>
        <p><b>Step 1:</b> J = -D (ΔC/Δx)</p>
        <p><b>Step 2:</b> J = -2×10⁻⁹ × (10/0.01) = -2×10⁻⁶ mol/m²·s</p>
        <h3>3. Industrial Applications</h3>
        <ul><li>Distillation</li><li>Gas absorption</li><li>Liquid-liquid extraction</li></ul>`,
        quiz: [
          { q: "Fick's Law describes mass transfer driven by:", opts: ["Temperature gradient", "Velocity gradient", "Concentration gradient", "Pressure gradient"], answer: 2, explanation: "Species diffuse from high to low concentration." },
          { q: "In Fick's law (J = -D dC/dx), what does 'D' represent?", opts: ["Diffusion coefficient", "Density", "Diameter", "Drag force"], answer: 0, explanation: "D is the diffusion coefficient (diffusivity)." },
          { q: "Which process is an application of mass transfer?", opts: ["Distillation", "Heat exchange", "Fluid pumping", "Combustion"], answer: 0, explanation: "Distillation separates components based on mass transfer." },
          { q: "Diffusion moves chemical species from:", opts: ["Low to high concentration", "High to low concentration", "Hot to cold", "Low to high pressure"], answer: 1, explanation: "Molecular diffusion moves species down a concentration gradient." },
          { q: "Which of the following has the highest diffusion coefficient typically?", opts: ["Solids", "Liquids", "Gases", "Crystals"], answer: 2, explanation: "Diffusion is fastest in gases because molecules move more freely." }
        ]
      }]
    },
    {
      title: "Transport in Chemical Reactors",
      lessons: [{
        title: "Combining Momentum, Heat, and Mass Transfer",
        duration: "50 minutes",
        html: `<p>In industrial chemical reactors, momentum, heat, and mass transfer occur simultaneously. Engineers must design systems that balance all three.</p>
        <div class="callout"><b>Design Principle:</b> Reactor performance depends on how well reactants mix, how effectively heat is removed, and how quickly products are separated.</div>
        <h3>Learning Outcomes</h3>
        <ul><li>Understand how the three transport processes interact in reactors.</li><li>Identify design challenges.</li><li>Analyze reactor conditions.</li></ul>
        <h3>1. Simultaneous Transport</h3>
        <p>Fluid enters the reactor (momentum), heat is supplied or removed (energy), and reactants diffuse to the catalyst (mass).</p>
        <h3>2. Design Challenges</h3>
        <ul><li>Hot spots due to poor heat transfer.</li><li>Mass transfer limitations in catalytic reactions.</li><li>Pressure drop due to momentum loss.</li></ul>`,
        quiz: [
          { q: "Why must chemical engineers understand transport phenomena before designing a reactor?", opts: ["To make the reactor look good", "Because all three processes occur simultaneously and affect performance", "Only to calculate costs", "Because it is required by law"], answer: 1, explanation: "Reactor performance depends on combined momentum, heat, and mass transfer." },
          { q: "What happens if heat transfer is poor in an exothermic reactor?", opts: ["The reaction stops instantly", "Hot spots and potential runaway reactions occur", "Pressure drops", "Mass transfer increases"], answer: 1, explanation: "Poor heat removal leads to dangerous temperature spikes." },
          { q: "In a catalytic reactor, reactants must diffuse to the catalyst surface. This is governed by:", opts: ["Momentum transfer", "Mass transfer", "Radiation", "Thermodynamics"], answer: 1, explanation: "Diffusion to the catalyst surface is a mass transfer process." },
          { q: "What causes a pressure drop in a reactor?", opts: ["Mass transfer", "Momentum loss due to fluid friction", "Heat transfer", "Chemical equilibrium"], answer: 1, explanation: "Friction as fluid flows causes a loss of momentum, seen as pressure drop." },
          { q: "Which transport process governs the mixing of reactants?", opts: ["Mass transfer", "Heat transfer", "Momentum transfer (fluid dynamics)", "Nuclear transfer"], answer: 2, explanation: "Mixing is a fluid dynamics (momentum) process." }
        ]
      }]
    },
    {
      title: "Performance and Optimization",
      lessons: [{
        title: "Improving Transport Efficiency",
        duration: "45 minutes",
        html: `<p>Optimization in transport phenomena involves minimizing energy losses, maximizing heat transfer rates, and improving mass separation efficiency.</p>
        <div class="callout"><b>Optimization Goal:</b> Achieve the desired transport rate with the minimum energy and equipment cost.</div>
        <h3>Learning Outcomes</h3>
        <ul><li>Identify ways to improve heat transfer efficiency.</li><li>Understand the trade-off between pressure drop and flow rate.</li><li>Analyze mass transfer enhancements.</li></ul>
        <h3>1. Heat Transfer Optimization</h3>
        <p>Using fins, increasing surface area, or improving convection coefficients.</p>
        <h3>2. Momentum Optimization</h3>
        <p>Balancing pressure drop against pumping costs and flow rate.</p>
        <h3>3. Mass Transfer Optimization</h3>
        <p>Increasing interfacial area in distillation columns or using catalysts with higher surface area.</p>`,
        quiz: [
          { q: "What is a common way to increase heat transfer rate?", opts: ["Decrease surface area", "Use insulation", "Increase surface area (e.g., with fins)", "Reduce temperature difference"], answer: 2, explanation: "Fins increase surface area and thus heat transfer." },
          { q: "In fluid flow, a higher flow rate generally results in:", opts: ["Lower pressure drop", "Higher pressure drop", "No change in pressure", "Lower pumping cost"], answer: 1, explanation: "Higher flow increases friction, leading to greater pressure drop." },
          { q: "In distillation, improving mass transfer efficiency is often achieved by:", opts: ["Increasing the column diameter", "Increasing interfacial area between liquid and vapor", "Reducing the number of trays", "Lowering the temperature"], answer: 1, explanation: "More interfacial area allows better contact and mass transfer." },
          { q: "Optimizing a transport process usually involves:", opts: ["Ignoring cost", "Maximizing rate at any cost", "Balancing transport rate with energy and capital costs", "Only focusing on one process"], answer: 2, explanation: "Optimization balances performance with economic constraints." },
          { q: "Which of the following reduces the energy cost of pumping a fluid?", opts: ["Increasing pipe roughness", "Decreasing pipe diameter", "Smoothing the internal pipe surface", "Increasing flow rate"], answer: 2, explanation: "Smooth pipes reduce friction and pressure drop." }
        ]
      }]
    }
  ]
};

/* ============================================================
   APP LOGIC (CLOUDFLARE INTEGRATION)
   ============================================================ */
let state = { mi: 0, li: 0, assessment: false };
let localProgress = {}; 

function getToken() {
  const userStr = localStorage.getItem('logi_user');
  if (!userStr) {
    alert('Please log in from the Dashboard.');
    window.location.href = 'dashboard.html';
    return null;
  }
  return JSON.parse(userStr).token;
}

function esc(s) { return typeof s !== 'string' ? s : s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function toggleModuleMenu() {
  document.querySelector('.module-side').classList.toggle('open');
  document.getElementById('moduleOverlay').classList.toggle('open');
}
function closeModuleMenu() {
  document.querySelector('.module-side').classList.remove('open');
  document.getElementById('moduleOverlay').classList.remove('open');
}

function toggleAccordion(i) {
  const sections = document.querySelectorAll('.mod-section');
  if (state.mi === i && !state.assessment) {
    sections[i].classList.toggle('open');
    return;
  }
  state.mi = i;
  state.li = 0;
  state.assessment = false;
  renderCourse();
}

function openAssessment(i) {
  state.mi = i;
  state.assessment = true;
  closeModuleMenu();
  renderAssessmentScreen();
}

function markDone(mi, li) {
  localProgress[`${mi}-${li}`] = true;
  renderCourse();
}

function renderCourse() {
  const mi = state.mi, li = state.li;
  const mod = COURSE.modules[mi];
  if (!mod) return;
  if (state.assessment) { renderAssessmentScreen(); return; }

  const lesson = mod.lessons[li];
  const pct = Object.keys(localProgress).length > 0 ? 50 : 0; 

  document.getElementById('app').innerHTML = `
    <div class="inner" style="padding:16px 0 48px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <button class="mobile-module-toggle" onclick="toggleModuleMenu()">📚 Course Content</button>
      </div>
      <div class="course-layout">
        <aside class="module-side">
          <div class="sidehead">
            <h2>Course content</h2>
            <div class="progress-bar"><span style="width:${pct}%;"></span></div>
          </div>
          <div class="modules">
            ${COURSE.modules.map((m, i) => `
              <div class="mod-section ${i === mi ? 'open' : ''}">
                <button class="mod-header" onclick="toggleAccordion(${i})">
                  <span>Module ${i+1}: ${esc(m.title)}</span>
                  <span>${i === mi ? '▲' : '▼'}</span>
                </button>
                <div class="mod-lessons-list">
                  ${m.lessons.map((l, j) => {
                    const done = localProgress[`${i}-${j}`];
                    return `
                      <button class="lesson-item-btn ${i === mi && j === li && !state.assessment ? 'active' : ''} ${done ? 'done' : ''}" onclick="state.mi=${i};state.li=${j};state.assessment=false;renderCourse()">
                        <span>${done ? '✓' : '📖'}</span><span style="flex:1;">${esc(l.title)}</span>
                      </button>
                    `;
                  }).join('')}
                  <button class="lesson-item-btn ${i === mi && state.assessment ? 'active' : ''}" onclick="openAssessment(${i})">
                    <span>📝</span><span style="flex:1;">Module ${i+1} Assessment</span>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </aside>

        <section class="content">
          <article class="card lesson-card">
            <div style="font-size:12px;color:var(--muted);text-transform:uppercase;">Module ${mi+1} · ${esc(lesson.duration)}</div>
            <h1 style="font-size:24px;line-height:1.2;margin:6px 0 18px;">${esc(lesson.title)}</h1>
            <div>${lesson.html}</div>
            <div class="actions">
              <button class="btn-secondary" onclick="if(state.li>0){state.li--;renderCourse()}">← Previous</button>
              <div style="display:flex;gap:8px;">
                <button class="btn" onclick="markDone(${mi},${li})">${localProgress[`${mi}-${li}`] ? 'Completed ✓' : 'Mark complete'}</button>
                <button class="btn-secondary" onclick="state.assessment=true;renderCourse()">Next →</button>
              </div>
            </div>
          </article>
        </section>
      </div>
    </div>
  `;
}

function selectOption(qi, oi) {
  const wrap = document.querySelector(`.q[data-qindex="${qi}"]`);
  wrap.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
  wrap.querySelector(`label[data-opt="${oi}"]`).classList.add('selected');
  wrap.querySelector(`input[value="${oi}"]`).checked = true;
}

async function submitQuiz(mi) {
  const token = getToken();
  if (!token) return;

  const quiz = COURSE.modules[mi].lessons[0].quiz;
  let score = 0;
  let answeredAll = true;

  quiz.forEach((q, qi) => {
    const sel = document.querySelector(`input[name="q${mi}_${qi}"]:checked`);
    const fb = document.getElementById(`fb_${mi}_${qi}`);
    if (!sel) { answeredAll = false; if (fb) { fb.textContent = 'Select an answer.'; fb.style.color = 'var(--error)'; } return; }
    
    if (parseInt(sel.value) === q.answer) {
      score++;
      if (fb) { fb.textContent = 'Correct!'; fb.style.color = 'var(--success)'; }
    } else {
      if (fb) { fb.textContent = 'Incorrect.'; fb.style.color = 'var(--error)'; }
    }
  });

  const resultEl = document.getElementById('quizResult_' + mi);
  if (!answeredAll) {
    resultEl.textContent = 'Please answer all questions.';
    resultEl.style.color = 'var(--error)';
    return;
  }

  resultEl.textContent = 'Saving to database...';
  resultEl.style.color = 'var(--muted)';

  try {
    const res = await fetch('/api/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        moduleId: 'module_' + (mi + 1),
        lessonId: 'lesson_1',
        completed: true,
        quizScore: score,
        quizTotal: quiz.length
      })
    });
    
    if (!res.ok) throw new Error('Failed to save to D1');

    localProgress[`${mi}-0`] = true;
    resultEl.textContent = `Scored ${score}/${quiz.length}. Saved! ✅`;
    resultEl.style.color = 'var(--success)';
    
    const nextBtn = document.getElementById('nextBtn_' + mi);
    if (nextBtn) {
      nextBtn.disabled = false;
      nextBtn.classList.remove('btn-secondary');
      nextBtn.classList.add('btn');
      nextBtn.style.opacity = '1';
    }
  } catch (e) {
    resultEl.textContent = `Error: ` + e.message;
    resultEl.style.color = 'var(--error)';
  }
}

function renderAssessmentScreen() {
  const mi = state.mi;
  const quiz = COURSE.modules[mi].lessons[0].quiz;

  document.getElementById('app').innerHTML = `
    <div class="inner" style="padding:16px 0 48px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <button class="mobile-module-toggle" onclick="toggleModuleMenu()">📚 Course Content</button>
      </div>
      <div class="course-layout">
        <aside class="module-side">
          <div class="sidehead"><h2>Course content</h2></div>
          <div class="modules">
            ${COURSE.modules.map((m, i) => `
              <div class="mod-section ${i === mi ? 'open' : ''}">
                <button class="mod-header" onclick="toggleAccordion(${i})">
                  <span>Module ${i+1}</span><span>${i === mi ? '▲' : '▼'}</span>
                </button>
                <div class="mod-lessons-list">
                  <button class="lesson-item-btn" onclick="state.mi=${i};state.assessment=false;renderCourse()">
                    <span>📖</span><span style="flex:1;">${esc(m.lessons[0].title)}</span>
                  </button>
                  <button class="lesson-item-btn active" onclick="openAssessment(${i})">
                    <span>📝</span><span style="flex:1;">Assessment</span>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </aside>

        <section class="content">
          <article class="card lesson-card">
            <h2>Module ${mi+1} Assessment</h2>
            <div style="margin-top:16px;">
              ${quiz.map((q, qi) => `
                <div class="q" data-qindex="${qi}">
                  <b>${qi+1}. ${esc(q.q)}</b>
                  ${q.opts.map((opt, oi) => `
                    <label data-opt="${oi}" onclick="selectOption(${qi},${oi})">
                      <input type="radio" name="q${mi}_${qi}" value="${oi}"> ${esc(opt)}
                    </label>
                  `).join('')}
                  <div class="feedback" id="fb_${mi}_${qi}"></div>
                </div>
              `).join('')}
              <button class="btn" style="margin-top:14px;" onclick="submitQuiz(${mi})">Submit Answers</button>
              <p id="quizResult_${mi}" style="font-weight:700;margin-top:8px;"></p>
            </div>
            <div class="actions">
              <button class="btn-secondary" onclick="state.assessment=false;renderCourse()">← Back to lesson</button>
              <button id="nextBtn_${mi}" class="btn btn-secondary" disabled style="opacity:0.5;" onclick="window.location.href='dashboard.html'">Finish →</button>
            </div>
          </article>
        </section>
      </div>
    </div>
  `;
}

// Start
document.addEventListener('DOMContentLoaded', () => {
  getToken(); 
  renderCourse();
});
</script>
</body>
</html>
