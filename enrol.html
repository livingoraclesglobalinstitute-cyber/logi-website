<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="0; url=https://www.logi.education/main-registration-form">
  <title>Redirecting to Enrollment Form...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #fcfdfe;
      color: #334155;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #8B5353;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>Redirecting to Enrollment Form...</h2>
  <div class="loader"></div>
  <p>If you are not redirected automatically, <a href="https://www.logi.education/main-registration-form">click here</a>.</p>
  <script>
    window.location.href = "https://www.logi.education/main-registration-form";
  </script>
</body>
</html>
