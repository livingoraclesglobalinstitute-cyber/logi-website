<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B5353">
  <title>Student Dashboard | Living Oracles Global Institute</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--brand:#8B5353;--brand-dark:#653b3b;--soft:#f7eeee;--ink:#292323;--muted:#766b6b;--line:#eadede;--white:#fff;--green:#207a4b;--amber:#986900;--shadow:0 12px 35px rgba(75,35,35,.08)}
    *{box-sizing:border-box}body{margin:0;background:#faf8f8;color:var(--ink);font-family:Inter,Arial,sans-serif}
    button,input{font:inherit}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1180px)/2));position:sticky;top:0;z-index:5}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--brand-dark);letter-spacing:.2px}.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}
    .top-actions{display:flex;align-items:center;gap:12px}.user-email{font-size:13px;color:var(--muted);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .wrap{max-width:1180px;margin:0 auto;padding:34px 22px 60px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--brand);font-weight:800}.welcome h1{font-size:clamp(26px,4vw,36px);margin:8px 0}.welcome p{margin:0;color:var(--muted);line-height:1.6}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0 30px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.stat .num{font-size:30px;font-weight:850;color:var(--brand-dark)}.stat .label{font-size:13px;color:var(--muted);margin-top:4px}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 14px}.section-head h2{font-size:21px;margin:0}.section-head span{font-size:13px;color:var(--muted)}
    .course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.course{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:220px}
    .course-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.course h3{font-size:18px;line-height:1.35;margin:0 0 8px}.course-id{font-size:11px;color:var(--muted);letter-spacing:.4px}.badge{font-size:11px;font-weight:800;padding:6px 10px;border-radius:30px;white-space:nowrap;background:#f3eeee;color:var(--muted)}.badge.started{background:#fff4d8;color:var(--amber)}.badge.done{background:#e8f5ed;color:var(--green)}
    .progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:20px 0 8px}.bar{height:9px;background:#f0e8e8;border-radius:20px;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,var(--brand),#bd8585);border-radius:20px}
    .course-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:20px}.course-foot small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:0;border-radius:10px;background:var(--brand);color:#fff;padding:11px 16px;font-weight:750;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn:hover{background:var(--brand-dark)}.btn.secondary{background:#f4eded;color:var(--brand-dark)}.btn.secondary:hover{background:#eadbdb}.btn:disabled{opacity:.5;cursor:not-allowed}
    .empty,.notice{background:#fff;border:1px dashed #d9c3c3;border-radius:16px;padding:28px;text-align:center;color:var(--muted);line-height:1.6}.notice{border-style:solid;text-align:left;margin:18px 0;padding:13px 16px;font-size:13px}.notice.error{color:#9d2929;background:#fff7f7;border-color:#edcccc}.notice.info{background:#fffaf2;border-color:#f0dfb8;color:#765300}
    .login-shell{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:28px}.login-card{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}.login-card h1{margin:0 0 8px;font-size:26px}.login-card p{color:var(--muted);line-height:1.55;font-size:14px}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #ddcece;border-radius:10px;outline:none}.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #8b53551c}.login-card .btn{width:100%;padding:13px}.footer{text-align:center;color:#988d8d;font-size:12px;padding:25px}
    @media(max-width:720px){.topbar{height:64px;padding:0 16px}.user-email{display:none}.wrap{padding:25px 15px 45px}.welcome{display:block}.stats{grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:14px}.stat .num{font-size:24px}.stat .label{font-size:11px}.course-grid{grid-template-columns:1fr}.course{padding:18px}.course-foot{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
    @media(max-width:390px){.stats{grid-template-columns:1fr}.stat{display:flex;justify-content:space-between;align-items:center}.stat .label{margin:0}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">L</div><span>LOGI <span style="font-weight:500;color:#8b7777">| Student Portal</span></span></div>
    <div class="top-actions"><span class="user-email" id="userEmail"></span><button class="btn secondary" id="logoutBtn" style="display:none" onclick="logout()">Log out</button></div>
  </header>
  <main id="app"><div class="login-shell"><div class="login-card"><h1>Loading your dashboard…</h1><p>Please wait while we securely connect to LOGI.</p></div></div></main>
  <div class="footer">Living Oracles Global Institute · Faith. Leadership. Competence.</div>

<script>
const SUPABASE_URL = 'https://dnmkflwwanltkdnnycml.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cSrAH2lTK6jfP9BdHPNZng_AJqpsjvt';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

// Add each course's exact deployed LMS URL here as it is confirmed.
// Do not use the public course-description URL unless it is also the actual LMS page.
const COURSE_DIRECTORY = {
  'ind-auto-101': {
    title: 'Introduction to Industrial Automation',
    totalLessons: 6,
    url: 'https://www.logi.education/short-course/lms/introduction-to-industrial-automation'
  },
  'eng-mgmt-101': {
    title: 'Basics of Engineering Management',
    totalLessons: 6,
    url: 'https://www.logi.education/short-course/lms/basics-engineering-management'
  },
};

const app = document.getElementById('app');
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titleFromId = id => String(id || 'Unknown course').split(/[-_]/).filter(Boolean).map(x => x.charAt(0).toUpperCase()+x.slice(1)).join(' ');
function readLocalStore(key, fallback={}) {
  try { return JSON.parse(localStorage.getItem(key) || 'null') || fallback; }
  catch { return fallback; }
}


function showMessage(message, type='info') {
  const el = document.getElementById('messageBox');
  if (el) { el.className = 'notice ' + type; el.textContent = message; el.style.display = 'block'; }
}
function showLogin(message='') {
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('userEmail').textContent='';
  app.innerHTML = `<div class="login-shell"><form class="login-card" id="loginForm">
    <div class="eyebrow">Living Oracles Global Institute</div><h1>Student sign in</h1>
    <p>Sign in with the same account you use to access your LOGI courses. Your enrolled courses and progress will appear here.</p>
    <div id="messageBox" class="notice error" style="${message?'':'display:none'}">${escapeHTML(message)}</div>
    <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in to my dashboard</button>
  </form></div>`;
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const button=e.currentTarget.querySelector('button'); button.disabled=true; button.textContent='Signing in…';
    const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
    if(error){showMessage(error.message,'error');button.disabled=false;button.textContent='Sign in to my dashboard';return;}
    await loadDashboard();
  });
}
function progressForCourse(rows, courseId, localProgress={}) {
  const courseRows=rows.filter(r=>r.course_id===courseId);
  const completedKeys=new Set(
    courseRows.filter(r=>r.completed===true).map(r=>`${r.module_index}-${r.lesson_index}`)
  );
  const localLessons=localProgress?.lessons || {};
  Object.entries(localLessons).forEach(([key,done])=>{ if(done) completedKeys.add(key); });
  const localQuizzes=localProgress?.quizzes || {};
  const hasLocalActivity=Object.keys(localLessons).length>0 || Object.keys(localQuizzes).length>0;
  const meta=COURSE_DIRECTORY[courseId];
  const total=meta?.totalLessons ?? null;
  const completed=completedKeys.size;
  const percent=total ? Math.min(100,Math.round(completed/total*100)) : null;
  return {completed,total,percent,hasActivity:courseRows.length>0 || hasLocalActivity};
}

function courseStatus(progress, certificate) {
  if(certificate) return ['Completed','done'];
  if(progress.percent===100) return ['Completed','done'];
  if(progress.hasActivity || progress.completed>0) return ['In Progress','started'];
  return ['Not Started',''];
}
function renderCourse(courseId, progress, certificate) {
  const meta=COURSE_DIRECTORY[courseId] || {};
  const title=meta.title || titleFromId(courseId);
  const [status,badge]=courseStatus(progress,certificate);
  const percent=progress.percent;
  const progressText=percent===null
    ? `${progress.completed} lesson${progress.completed===1?'':'s'} completed`
    : `${percent}% complete`;
  const barWidth=percent===null ? 0 : percent;
  const courseUrl=meta.url || '';
  const certText=certificate ? `Certificate issued${certificate.issue_date?' · '+new Date(certificate.issue_date).toLocaleDateString():''}` : 'Certificate not yet issued';
  return `<article class="course">
    <div class="course-top"><div><div class="course-id">${escapeHTML(courseId)}</div><h3>${escapeHTML(title)}</h3></div><span class="badge ${badge}">${status}</span></div>
    <div class="progress-meta"><span>${progressText}</span><span>${percent===null?'Progress details':percent+'%'}</span></div>
    <div class="bar" aria-label="${percent===null?'Progress percentage unavailable':percent+' percent complete'}"><span style="width:${barWidth}%"></span></div>
    <div class="course-foot"><small>${escapeHTML(certText)}</small><div class="actions">
      ${courseUrl?`<a class="btn" href="${escapeHTML(courseUrl)}">Continue learning</a>`:`<button class="btn" disabled title="The course URL has not yet been added">Course link pending</button>`}
      ${certificate?.certificate_id?`<button class="btn secondary" onclick="showCertificateDetails('${escapeHTML(certificate.certificate_id)}')">Certificate ID</button>`:''}
    </div></div>
  </article>`;
}
async function loadDashboard() {
  const {data:{user},error:authError}=await supabaseClient.auth.getUser();
  if(authError || !user){showLogin();return;}
  document.getElementById('logoutBtn').style.display='inline-flex';
  document.getElementById('userEmail').textContent=user.email || '';
  app.innerHTML='<div class="wrap"><div class="empty">Loading your enrolled courses…</div></div>';

  const email=(user.email || '').trim().toLowerCase();
  const localEnrolmentStore=readLocalStore('logi_enrolments',{});
  const localProgressStore=readLocalStore('logi_progress',{});
  const localEnrolments=Array.isArray(localEnrolmentStore[email]) ? localEnrolmentStore[email] : [];
  const localCourseProgress=localProgressStore[email] && typeof localProgressStore[email]==='object'
    ? localProgressStore[email] : {};

  const [enrolmentsResult,progressResult,certificatesResult]=await Promise.all([
    supabaseClient.from('enrolments').select('course_id,created_at').eq('user_id',user.id).order('created_at',{ascending:true}),
    supabaseClient.from('progress').select('course_id,module_index,lesson_index,completed,passed,quiz_score,quiz_total,updated_at').eq('user_id',user.id),
    supabaseClient.from('certificates').select('course_id,certificate_id,student_name,issue_date').eq('user_id',user.id)
  ]);

  const errors=[enrolmentsResult.error,progressResult.error,certificatesResult.error].filter(Boolean);
  const enrolments=enrolmentsResult.data||[];
  let progressRows=progressResult.data||[];
  const certificates=certificatesResult.data||[];

  // Recover this student's same-browser enrolments and register them to the
  // authenticated Supabase UUID. Duplicate records are ignored safely.
  const localIds=[...new Set(localEnrolments.filter(Boolean))];
  if(!enrolmentsResult.error && localIds.length){
    const missingIds=localIds.filter(id=>!enrolments.some(row=>row.course_id===id));
    if(missingIds.length){
      const payload=missingIds.map(course_id=>({user_id:user.id,course_id}));
      const {error}=await supabaseClient.from('enrolments')
        .upsert(payload,{onConflict:'user_id,course_id',ignoreDuplicates:true});
      if(error) console.warn('LOGI local enrolment recovery:',error.message);
    }
  }

  // The Industrial Automation course stores its browser progress under
  // logi_progress -> email -> course ID. Migrate it only when cloud progress
  // for this course is empty; existing cloud progress is never overwritten.
  const automationLocal=localCourseProgress['ind-auto-101'];
  if(automationLocal && typeof automationLocal==='object' &&
     !progressRows.some(row=>row.course_id==='ind-auto-101')){
    const rowsByKey=new Map();
    Object.entries(automationLocal.lessons||{}).forEach(([key,completed])=>{
      if(!completed) return;
      const [mi,li]=key.split('-').map(Number);
      if(!Number.isInteger(mi)||!Number.isInteger(li)) return;
      rowsByKey.set(`${mi}-${li}`,{
        user_id:user.id,course_id:'ind-auto-101',
        module_index:mi,lesson_index:li,completed:true,passed:false
      });
    });
    Object.entries(automationLocal.quizzes||{}).forEach(([moduleKey,quiz])=>{
      const mi=Number(moduleKey);
      if(!Number.isInteger(mi)||!quiz) return;
      const key=`${mi}-0`;
      const row=rowsByKey.get(key)||{
        user_id:user.id,course_id:'ind-auto-101',
        module_index:mi,lesson_index:0,
        completed:!!automationLocal.lessons?.[key],passed:false
      };
      row.quiz_score=Number(quiz.score);
      row.quiz_total=Number(quiz.total);
      row.passed=!!quiz.passed;
      rowsByKey.set(key,row);
    });
    const migrationRows=[...rowsByKey.values()];
    if(migrationRows.length){
      const {error}=await supabaseClient.from('progress')
        .upsert(migrationRows,{onConflict:'user_id,course_id,module_index,lesson_index'});
      if(error) console.warn('LOGI local progress recovery:',error.message);
      else progressRows=progressRows.concat(migrationRows);
    }
  }

  const cloudIds=enrolments.map(row=>row.course_id).filter(Boolean);
  const progressIds=Object.entries(localCourseProgress)
    .filter(([,p])=>p && (Object.keys(p.lessons||{}).length || Object.keys(p.quizzes||{}).length))
    .map(([id])=>id);
  const uniqueIds=[...new Set([...cloudIds,...localIds,...progressIds])];
  const courses=uniqueIds.map(id=>({
    id,
    progress:progressForCourse(progressRows,id,localCourseProgress[id]||{}),
    certificate:certificates.find(c=>c.course_id===id)
  }));
  const completedCount=courses.filter(c=>c.certificate || c.progress.percent===100).length;
  const activeCount=courses.filter(c=>!c.certificate && c.progress.hasActivity && c.progress.percent!==100).length;

  app.innerHTML=`<div class="wrap">
    ${errors.length?`<div class="notice info">Some cloud records could not be refreshed. Any locally saved enrolments and progress available on this device are still being displayed.</div>`:''}
    <section class="welcome"><div><div class="eyebrow">Your learning space</div><h1>Welcome back${user.user_metadata?.full_name?' '+escapeHTML(user.user_metadata.full_name.split(' ')[0]):''}.</h1><p>All your LOGI course enrolments, learning progress and certificates in one place.</p></div></section>
    <section class="stats">
      <div class="stat"><div class="num">${courses.length}</div><div class="label">Enrolled courses</div></div>
      <div class="stat"><div class="num">${activeCount}</div><div class="label">Courses in progress</div></div>
      <div class="stat"><div class="num">${completedCount}</div><div class="label">Courses completed</div></div>
    </section>
    <div class="section-head"><h2>My courses</h2><span>${courses.length} course${courses.length===1?'':'s'} found</span></div>
    ${courses.length?`<div class="course-grid">${courses.map(c=>renderCourse(c.id,c.progress,c.certificate)).join('')}</div>`:`<div class="empty"><h3>No enrolled courses found</h3><p>No cloud or same-device enrolment records were found for this account. Open a course using this same browser and sign in to synchronise its enrolment.</p></div>`}
    ${courses.some(c=>c.progress.percent===null)?'<div class="notice info">For some courses, the course lesson total has not yet been added to the dashboard directory. Their completed lesson counts are shown, but a percentage is withheld to avoid displaying an inaccurate progress figure.</div>':''}
  </div>`;
}
function showCertificateDetails(id){alert('Certificate ID: '+id+'\\nUse the LOGI certificate verification page to verify this award.');}
async function logout(){await supabaseClient.auth.signOut();showLogin('You have been signed out.');}
(async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(session)await loadDashboard();else showLogin();})();
</script>
</body>
</html>
