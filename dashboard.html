<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4b93">
  <meta name="description" content="Your Living Oracles Global Institute student learning dashboard.">
  <title>Student Dashboard | Living Oracles Global Institute</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --pink:#ff4b93;
      --pink-dark:#e93680;
      --lav:#f3f0fa;
      --ink:#34343b;
      --muted:#777780;
      --line:#e9e8ef;
      --white:#fff;
      --green:#207a4b;
      --amber:#c68a12;
      --shadow:0 2px 9px rgba(0,0,0,.07);
      --shadow-hover:0 7px 18px rgba(0,0,0,.09);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      background:#f5f5f8;
      line-height:1.5;
    }
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}

    /* ---------- Top bar (mirrors short-courses topbar) ---------- */
    .topbar{
      height:64px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 max(5%,calc((100% - 1180px)/2));
      box-shadow:0 2px 9px rgba(0,0,0,.07);
      position:sticky;
      top:0;
      z-index:5;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:28px;
      font-weight:800;
      letter-spacing:-1.5px;
      color:#555;
    }
    .brand span.brand-dot{color:var(--pink)}
    .brand .brand-sub{
      font-size:13px;
      font-weight:500;
      letter-spacing:0;
      color:#8b7777;
    }
    .top-actions{display:flex;align-items:center;gap:12px}
    .user-email{
      font-size:13px;
      color:var(--muted);
      max-width:230px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* ---------- Buttons ---------- */
    .btn{
      border:0;
      border-radius:4px;
      background:var(--pink);
      color:#fff;
      padding:10px 20px;
      font-weight:700;
      font-size:13px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:background .15s;
    }
    .btn:hover{background:var(--pink-dark)}
    .btn.secondary{
      background:#fff;
      color:var(--pink);
      border:1px solid #ffd1e3;
    }
    .btn.secondary:hover{background:var(--pink);color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    /* ---------- Layout ---------- */
    .wrap{
      max-width:1180px;
      margin:0 auto;
      padding:34px 5% 60px;
    }

    /* ---------- Welcome / hero-style header ---------- */
    .welcome{
      background:linear-gradient(110deg,#f8f2fb 0%,#fff 56%,#ffe9f1 100%);
      border-radius:6px;
      padding:28px 30px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:20px;
      margin-bottom:26px;
      position:relative;
      overflow:hidden;
    }
    .welcome:after{
      content:"LOGI";
      position:absolute;
      right:24px;
      top:50%;
      transform:translateY(-50%);
      font-size:90px;
      font-weight:900;
      letter-spacing:-6px;
      color:#f7d9e7;
      text-shadow:3px 3px 0 #fff;
      pointer-events:none;
      line-height:1;
    }
    .eyebrow{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:1.6px;
      color:var(--pink);
      font-weight:800;
    }
    .welcome h1{
      font-size:clamp(26px,4vw,36px);
      margin:8px 0;
      line-height:1.15;
    }
    .welcome p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
      position:relative;
      z-index:1;
      max-width:620px;
    }

    /* ---------- Stats ---------- */
    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
      margin:24px 0 30px;
    }
    .stat{
      background:#fff;
      border:1px solid var(--line);
      border-radius:5px;
      padding:20px;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .stat:before{
      content:"";
      position:absolute;
      top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,#f4c52d,var(--pink));
    }
    .stat .num{
      font-size:30px;
      font-weight:850;
      color:var(--ink);
    }
    .stat .label{
      font-size:13px;
      color:var(--muted);
      margin-top:4px;
    }

    /* ---------- Section head (gradient underline) ---------- */
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:15px;
      border-bottom:1px solid #dedee5;
      padding-bottom:11px;
      margin:28px 0 14px;
      position:relative;
    }
    .section-head:after{
      content:"";
      position:absolute;
      bottom:-1px;left:0;
      width:190px;height:2px;
      background:linear-gradient(90deg,#f4c52d,var(--pink));
    }
    .section-head h2{
      font-size:22px;
      font-weight:600;
      margin:0;
    }
    .section-head span{font-size:13px;color:var(--muted)}
    .highlight{background:var(--pink);color:#fff;padding:1px 5px}

    /* ---------- Course grid / cards ---------- */
    .course-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
    }
    .course{
      background:#fff;
      border:1px solid var(--line);
      border-radius:5px;
      padding:22px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      min-height:220px;
      transition:transform .2s,box-shadow .2s;
    }
    .course:hover{
      transform:translateY(-3px);
      box-shadow:var(--shadow-hover);
    }
    .course-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .course h3{
      font-size:18px;
      line-height:1.35;
      margin:0 0 8px;
      font-weight:600;
    }
    .course-id{
      font-size:11px;
      color:var(--muted);
      letter-spacing:.4px;
      text-transform:uppercase;
    }
    .course-description{
      font-size:13px;
      line-height:1.55;
      color:var(--muted);
      margin:5px 0 0;
    }
    .badge{
      font-size:10px;
      font-weight:800;
      padding:5px 10px;
      border-radius:20px;
      white-space:nowrap;
      background:#f3eeee;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.5px;
    }
    .badge.started{background:#fff4d8;color:var(--amber)}
    .badge.done{background:#e8f5ed;color:var(--green)}

    .progress-meta{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      color:var(--muted);
      margin:20px 0 8px;
    }
    .bar{
      height:8px;
      background:#f0eaee;
      border-radius:20px;
      overflow:hidden;
    }
    .bar span{
      height:100%;
      display:block;
      background:linear-gradient(90deg,var(--pink),#ff9cc1);
      border-radius:20px;
    }
    .course-foot{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:auto;
      padding-top:20px;
    }
    .course-foot small{font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}

    /* ---------- Empty / notices ---------- */
    .empty,.notice{
      background:#fff;
      border:1px dashed #f2d3e1;
      border-radius:5px;
      padding:28px;
      text-align:center;
      color:var(--muted);
      line-height:1.6;
    }
    .notice{
      border-style:solid;
      text-align:left;
      margin:18px 0;
      padding:13px 16px;
      font-size:13px;
    }
    .notice.error{color:#9d2929;background:#fff5f8;border-color:#f6c7da}
    .notice.info{background:#fff6fa;border-color:#ffd1e3;color:#a83c69}

    /* ---------- Login ---------- */
    .login-shell{
      min-height:calc(100vh - 64px);
      display:grid;
      place-items:center;
      padding:28px;
      background:linear-gradient(110deg,#f8f2fb 0%,#fff 56%,#ffe9f1 100%);
    }
    .login-card{
      width:min(100%,430px);
      background:#fff;
      border:1px solid var(--line);
      border-radius:5px;
      padding:30px;
      box-shadow:0 12px 35px rgba(255,75,147,.08);
    }
    .login-card h1{margin:0 0 8px;font-size:26px}
    .login-card p{color:var(--muted);line-height:1.55;font-size:14px}
    .field{margin:18px 0}
    .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    .field input{
      width:100%;
      padding:12px;
      border:1px solid #e9e8ef;
      border-radius:4px;
      outline:none;
    }
    .field input:focus{
      border-color:var(--pink);
      box-shadow:0 0 0 3px rgba(255,75,147,.15);
    }
    .login-card .btn{width:100%;padding:13px}

    /* ---------- Footer ---------- */
    .footer{
      background:#292832;
      color:#eee;
      text-align:center;
      padding:24px 5%;
      font-size:12px;
    }
    .footer strong{color:var(--pink)}

    /* ---------- Catalogue card (matches course-tile styling) ---------- */
    .catalogue-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:5px;
      padding:19px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      gap:10px;
      transition:transform .2s,box-shadow .2s;
    }
    .catalogue-card:hover{
      transform:translateY(-3px);
      box-shadow:var(--shadow-hover);
    }
    .catalogue-card h3{font-size:16px;margin:0;font-weight:600}
    .catalogue-card p{font-size:13px;line-height:1.55;color:var(--muted);margin:0}
    .catalogue-meta{
      font-size:11px;
      color:var(--pink);
      text-transform:uppercase;
      letter-spacing:.6px;
      font-weight:700;
    }
    .catalogue-card .btn{align-self:flex-start;margin-top:auto}

    /* ---------- Responsive ---------- */
    @media(max-width:900px){
      .welcome:after{font-size:70px;letter-spacing:-4px}
    }
    @media(max-width:720px){
      .topbar{height:54px;padding:0 5%}
      .brand{font-size:24px}
      .user-email{display:none}
      .wrap{padding:25px 5% 45px}
      .welcome{display:block;padding:22px 20px}
      .welcome:after{font-size:48px;letter-spacing:-4px;right:16px}
      .stats{grid-template-columns:repeat(3,1fr);gap:9px}
      .stat{padding:14px}
      .stat .num{font-size:24px}
      .stat .label{font-size:11px}
      .course-grid{grid-template-columns:1fr}
      .course{padding:18px}
      .course-foot{align-items:flex-start;flex-direction:column}
      .actions{width:100%}
      .actions .btn{flex:1}
    }
    @media(max-width:390px){
      .stats{grid-template-columns:1fr}
      .stat{display:flex;justify-content:space-between;align-items:center}
      .stat .label{margin:0}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      LOGI<span class="brand-dot">.</span>
      <span class="brand-sub">| Student Portal</span>
    </div>
    <div class="top-actions">
      <span class="user-email" id="userEmail"></span>
      <button class="btn secondary" id="logoutBtn" style="display:none" onclick="logout()">Log out</button>
    </div>
  </header>
  <main id="app"><div class="login-shell"><div class="login-card"><h1>Loading your dashboard…</h1><p>Please wait while we securely connect to LOGI.</p></div></div></main>
  <div class="footer">Living Oracles Global Institute · <strong>Faith. Excellence. Impact.</strong></div>

<script>
const SUPABASE_URL = 'https://dnmkflwwanltkdnnycml.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cSrAH2lTK6jfP9BdHPNZng_AJqpsjvt';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const app = document.getElementById('app');
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titleFromId = id => String(id || 'Unknown course').split(/[-_]/).filter(Boolean).map(x => x.charAt(0).toUpperCase()+x.slice(1)).join(' ');
function readLocalStore(key, fallback={}) {
  try { return JSON.parse(localStorage.getItem(key) || 'null') || fallback; }
  catch { return fallback; }
}
function showMessage(message, type='info') {
  const el = document.getElementById('messageBox');
  if (el) { el.className = 'notice ' + type; el.textContent = message; el.style.display = 'block'; }
}
function showLogin(message='') {
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('userEmail').textContent='';
  app.innerHTML = `<div class="login-shell"><form class="login-card" id="loginForm">
    <div class="eyebrow">Living Oracles Global Institute</div><h1>Student sign in</h1>
    <p>Sign in with the same account you use to access your LOGI courses. Your enrolled courses and progress will appear here.</p>
    <div id="messageBox" class="notice error" style="${message?'':'display:none'}">${escapeHTML(message)}</div>
    <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in to my dashboard</button>
  </form></div>`;
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const button=e.currentTarget.querySelector('button'); button.disabled=true; button.textContent='Signing in…';
    const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
    if(error){showMessage(error.message,'error');button.disabled=false;button.textContent='Sign in to my dashboard';return;}
    await loadDashboard();
  });
}
function progressForCourse(rows, courseId, totalLessons, localProgress={}) {
  const courseRows=rows.filter(r=>r.course_id===courseId);
  const completedKeys=new Set(courseRows.filter(r=>r.completed===true).map(r=>`${r.module_index}-${r.lesson_index}`));
  const localLessons=localProgress?.lessons || {};
  Object.entries(localLessons).forEach(([key,done])=>{ if(done) completedKeys.add(key); });
  const localQuizzes=localProgress?.quizzes || {};
  const hasLocalActivity=Object.keys(localLessons).length>0 || Object.keys(localQuizzes).length>0;
  const total=Number.isInteger(Number(totalLessons)) && Number(totalLessons)>0 ? Number(totalLessons) : null;
  const completed=completedKeys.size;
  const percent=total ? Math.min(100,Math.round(completed/total*100)) : null;
  return {completed,total,percent,hasActivity:courseRows.length>0 || hasLocalActivity};
}
function courseStatus(progress, certificate) {
  if(certificate || progress.percent===100) return ['Completed','done'];
  if(progress.hasActivity || progress.completed>0) return ['In Progress','started'];
  return ['Not Started',''];
}
function renderCourse(course, progress, certificate) {
  const courseId=course.id;
  const [status,badge]=courseStatus(progress,certificate);
  const percent=progress.percent;
  const progressText=percent===null ? `${progress.completed} lesson${progress.completed===1?'':'s'} completed` : `${percent}% complete`;
  const certText=certificate ? `Certificate issued${certificate.issue_date?' · '+new Date(certificate.issue_date).toLocaleDateString():''}` : 'Certificate not yet issued';
  const courseUrl=course.course_url || '';
  return `<article class="course">
    <div class="course-top"><div><div class="course-id">${escapeHTML(courseId)}</div><h3>${escapeHTML(course.title || titleFromId(courseId))}</h3>
    ${course.description?`<p class="course-description">${escapeHTML(course.description)}</p>`:''}</div><span class="badge ${badge}">${status}</span></div>
    <div class="progress-meta"><span>${progressText}</span><span>${percent===null?'Progress details':percent+'%'}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent===null?0:percent}" aria-label="Course progress"><span style="width:${percent===null?0:percent}%"></span></div>
    <div class="course-foot"><small>${escapeHTML(certText)}</small><div class="actions">
      ${courseUrl?`<a class="btn" href="${escapeHTML(courseUrl)}">Continue learning</a>`:`<button class="btn" disabled title="The course LMS link has not been added">Course link pending</button>`}
      ${certificate?.certificate_id?`<button class="btn secondary" onclick="showCertificateDetails('${escapeHTML(certificate.certificate_id)}')">Certificate ID</button>`:''}
    </div></div>
  </article>`;
}
function renderCatalogueCourse(course) {
  return `<article class="catalogue-card">
    <div class="catalogue-meta">${escapeHTML(course.category || 'LOGI Programme')}</div>
    <h3>${escapeHTML(course.title || titleFromId(course.id))}</h3>
    <p>${escapeHTML(course.description || 'Explore this learning opportunity from Living Oracles Global Institute.')}</p>
    ${course.course_url?`<a class="btn secondary" href="${escapeHTML(course.course_url)}">View course</a>`:'<span class="catalogue-meta">Course link coming soon</span>'}
  </article>`;
}
async function loadDashboard() {
  const {data:{user},error:authError}=await supabaseClient.auth.getUser();
  if(authError || !user){showLogin();return;}
  document.getElementById('logoutBtn').style.display='inline-flex';
  document.getElementById('userEmail').textContent=user.email || '';
  app.innerHTML='<div class="wrap"><div class="empty">Loading your LOGI learning records…</div></div>';

  const email=(user.email || '').trim().toLowerCase();
  const localProgressStore=readLocalStore('logi_progress',{});
  const localCourseProgress=localProgressStore[email] && typeof localProgressStore[email]==='object' ? localProgressStore[email] : {};

  const [enrolmentsResult,progressResult,certificatesResult,coursesResult]=await Promise.all([
    supabaseClient.from('enrolments').select('course_id,created_at').eq('user_id',user.id).order('created_at',{ascending:true}),
    supabaseClient.from('progress').select('course_id,module_index,lesson_index,completed,passed,quiz_score,quiz_total,updated_at').eq('user_id',user.id),
    supabaseClient.from('certificates').select('course_id,certificate_id,student_name,issue_date').eq('user_id',user.id),
    supabaseClient.from('courses').select('id,title,description,category,course_url,total_lessons,sort_order').eq('published',true).order('sort_order',{ascending:true}).order('title',{ascending:true})
  ]);

  const errors=[enrolmentsResult.error,progressResult.error,certificatesResult.error,coursesResult.error].filter(Boolean);
  const enrolments=enrolmentsResult.data||[];
  let progressRows=progressResult.data||[];
  const certificates=certificatesResult.data||[];
  const catalogue=coursesResult.data||[];

  // One-time compatibility recovery for this student's existing browser-saved progress.
  // Cloud records remain the primary source once present.
  const automationLocal=localCourseProgress['ind-auto-101'];
  if(!progressResult.error && automationLocal && typeof automationLocal==='object' && !progressRows.some(row=>row.course_id==='ind-auto-101')){
    const rowsByKey=new Map();
    Object.entries(automationLocal.lessons||{}).forEach(([key,completed])=>{
      if(!completed) return;
      const [mi,li]=key.split('-').map(Number);
      if(!Number.isInteger(mi)||!Number.isInteger(li)) return;
      rowsByKey.set(`${mi}-${li}`,{user_id:user.id,course_id:'ind-auto-101',module_index:mi,lesson_index:li,completed:true,passed:false});
    });
    Object.entries(automationLocal.quizzes||{}).forEach(([moduleKey,quiz])=>{
      const mi=Number(moduleKey);
      if(!Number.isInteger(mi)||!quiz) return;
      const key=`${mi}-0`;
      const row=rowsByKey.get(key)||{user_id:user.id,course_id:'ind-auto-101',module_index:mi,lesson_index:0,completed:!!automationLocal.lessons?.[key],passed:false};
      row.quiz_score=Number(quiz.score);row.quiz_total=Number(quiz.total);row.passed=!!quiz.passed;
      rowsByKey.set(key,row);
    });
    const migrationRows=[...rowsByKey.values()];
    if(migrationRows.length){
      const {error}=await supabaseClient.from('progress').upsert(migrationRows,{onConflict:'user_id,course_id,module_index,lesson_index'});
      if(!error) progressRows=progressRows.concat(migrationRows);
      else console.warn('LOGI progress recovery:',error.message);
    }
  }

  const enrolledIds=[...new Set(enrolments.map(row=>row.course_id).filter(Boolean))];
  const localProgressIds=Object.entries(localCourseProgress)
    .filter(([,p])=>p && (Object.keys(p.lessons||{}).length || Object.keys(p.quizzes||{}).length))
    .map(([id])=>id);
  const relevantIds=[...new Set([...enrolledIds,...localProgressIds,...progressRows.map(r=>r.course_id),...certificates.map(c=>c.course_id)])];
  const courseById=new Map(catalogue.map(course=>[course.id,course]));
  const enrolledCourses=relevantIds.map(id=>courseById.get(id) || {id,title:titleFromId(id),description:'Course details are not yet available in the LOGI catalogue.',course_url:'',total_lessons:null});
  const courseRecords=enrolledCourses.map(course=>({
    ...course,
    progress:progressForCourse(progressRows,course.id,course.total_lessons,localCourseProgress[course.id]||{}),
    certificate:certificates.find(c=>c.course_id===course.id)
  }));
  const completedCount=courseRecords.filter(c=>c.certificate || c.progress.percent===100).length;
  const activeCount=courseRecords.filter(c=>!c.certificate && c.progress.hasActivity && c.progress.percent!==100).length;
  const enrolledSet=new Set(enrolledIds);
  const availableCourses=catalogue.filter(course=>!enrolledSet.has(course.id));

  app.innerHTML=`<div class="wrap">
    ${errors.length?`<div class="notice info">Some information could not be refreshed from Supabase. The dashboard is showing the records that were successfully retrieved. If this continues, ask the LOGI administrator to check the course catalogue and table permissions.</div>`:''}
    <section class="welcome"><div><div class="eyebrow">Your learning space</div><h1>Welcome back${user.user_metadata?.full_name?' '+escapeHTML(user.user_metadata.full_name.split(' ')[0]):''}.</h1><p>Your LOGI course enrolments, learning progress and certificates in one place.</p></div></section>
    <section class="stats">
      <div class="stat"><div class="num">${courseRecords.length}</div><div class="label">My courses</div></div>
      <div class="stat"><div class="num">${activeCount}</div><div class="label">In progress</div></div>
      <div class="stat"><div class="num">${completedCount}</div><div class="label">Completed</div></div>
    </section>
    <div class="section-head"><h2>My <span class="highlight">courses</span></h2><span>${courseRecords.length} course${courseRecords.length===1?'':'s'} found</span></div>
    ${courseRecords.length?`<div class="course-grid">${courseRecords.map(c=>renderCourse(c,c.progress,c.certificate)).join('')}</div>`:`<div class="empty"><h3>No enrolled courses found</h3><p>Your enrolled courses will appear here after your LOGI enrolment has been recorded in your account.</p></div>`}
    ${courseRecords.some(c=>c.progress.percent===null)?'<div class="notice info">A percentage is shown only when the course catalogue contains a valid lesson total. For other courses, the dashboard displays the completed lesson count to avoid reporting inaccurate progress.</div>':''}
    <div class="section-head"><h2>Explore <span class="highlight">available courses</span></h2><span>${availableCourses.length} published course${availableCourses.length===1?'':'s'}</span></div>
    ${availableCourses.length?`<div class="course-grid">${availableCourses.map(renderCatalogueCourse).join('')}</div>`:`<div class="empty">You are viewing all currently published courses available in the LOGI catalogue.</div>`}
  </div>`;
}
function showCertificateDetails(id){alert('Certificate ID: '+id+'\\nUse the LOGI certificate verification page to verify this award.');}
async function logout(){await supabaseClient.auth.signOut();showLogin('You have been signed out.');}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showLogin('You have been signed out.');});
(async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(session)await loadDashboard();else showLogin();})();
</script>
</body>
